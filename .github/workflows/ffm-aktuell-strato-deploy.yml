# FFM Aktuell increment: consent-based Web Push, sourced discovery filters and service activation.
# Verified CI: https://github.com/hsdarestani/ffm-aktuell/actions/runs/39559110124
# Regression tests and PostgreSQL CI are required to pass first.
# Source commit f4e8b4bb8dbee5e26d664959e95894dd4ddeae73; PR is intentionally unmerged.
name: FFM Aktuell — isolated STRATO deploy
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ffm-aktuell-strato-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ffm-aktuell-isolated-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hsdarestani/ffm-aktuell
          ref: f4e8b4bb8dbee5e26d664959e95894dd4ddeae73
          path: ffm-src
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify FFM and package
        run: |
          set -euo pipefail
          cd ffm-src
          test "$(git rev-parse HEAD)" = 'f4e8b4bb8dbee5e26d664959e95894dd4ddeae73'
          npm ci --no-audit --no-fund
          npm test
          npm run typecheck
          npm run build
          cd ..
          tar --exclude=.git --exclude=node_modules --exclude=.next --exclude=.env -czf "$RUNNER_TEMP/ffm-src.tar.gz" ffm-src
      - name: Isolated server deployment
        env:
          HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
          FFM_SERVICES_JSON: ${{ secrets.FFM_SERVICES_JSON }}
        run: |
          set -euo pipefail
          test "$HOST" = '82.165.187.14' || { echo "::error::Unexpected production host; no changes."; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "::error::Missing Publisher SSH key."; exit 1; }
          PORT="${SSH_PORT:-22}"
          umask 077
          KEY="$RUNNER_TEMP/ffm-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$KEY"
          chmod 600 "$KEY"
          if [ -n "$SSH_KEY_PASSPHRASE" ]; then
            eval "$(ssh-agent -s)" >/dev/null
            ASKPASS="$RUNNER_TEMP/ffm-askpass"
            printf '%s\n' '#!/bin/sh' 'printf "%s" "$SSH_KEY_PASSPHRASE"' > "$ASKPASS"
            chmod 700 "$ASKPASS"
            DISPLAY=:0 SSH_ASKPASS="$ASKPASS" SSH_ASKPASS_REQUIRE=force setsid ssh-add "$KEY" </dev/null
          fi
          mkdir -p "$HOME/.ssh"
          ssh-keyscan -T 10 -p "$PORT" -H "$HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          test -s "$HOME/.ssh/known_hosts"
          if [ -n "$SSH_HOST_FINGERPRINT" ]; then
            ssh-keygen -lf "$HOME/.ssh/known_hosts" | grep -F -- "$SSH_HOST_FINGERPRINT" >/dev/null
          fi
          ssh -i "$KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$PORT" root@"$HOST" 'bash -se' <<'PREFLIGHT'
          set -euo pipefail
          test -f /opt/aplus-publisher/Caddyfile
          cd /opt/aplus-publisher
          ID="$(docker compose ps -q caddy)"
          test -n "$ID"
          docker compose exec -T web curl -fsS --max-time 8 http://127.0.0.1:8000/healthz/ >/dev/null </dev/null
          docker compose exec -T caddy caddy validate --config /etc/caddy/Caddyfile </dev/null
          df -Pk /opt | awk 'NR==2 { if ($4<1200000) exit 1; print "Disk preflight passed" }'
          PREFLIGHT
          # Secret JSON travels as private bytes, never shell source or log output.
          python3 - <<'CONFIG'
          import json, os, pathlib
          data=json.loads(os.environ.get('FFM_SERVICES_JSON') or '{}')
          if not isinstance(data,dict): raise SystemExit('FFM_SERVICES_JSON must be an object')
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'ffm-service-config.json'
          target.write_text(json.dumps(data));target.chmod(0o600)
          CONFIG
          scp -i "$KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -P "$PORT" "$RUNNER_TEMP/ffm-service-config.json" root@"$HOST":/tmp/ffm-service-config.json
          scp -i "$KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -P "$PORT" "$RUNNER_TEMP/ffm-src.tar.gz" root@"$HOST":/tmp/ffm-src.tar.gz
          ssh -i "$KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$PORT" root@"$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          trap 'rm -f /tmp/ffm-src.tar.gz /tmp/ffm-service-config.json /tmp/ffm-push-bootstrap.json' EXIT
          cd /opt/aplus-publisher
          CADDY_ID="$(docker compose ps -q caddy)"
          NETWORK="$(docker inspect "$CADDY_ID" --format '{{range $name, $network := .NetworkSettings.Networks}}{{println $name}}{{end}}' | head -n1)"
          docker network inspect "$NETWORK" >/dev/null
          mkdir -p /opt/ffm-aktuell/backups
          umask 077
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          BACKUP="/opt/ffm-aktuell/backups/pre-pr48-${STAMP}"
          OLD_IMAGE="$(docker inspect ffm-aktuell-web --format '{{.Image}}' 2>/dev/null || true)"
          if [ -n "$OLD_IMAGE" ]; then docker image tag "$OLD_IMAGE" "ffm-aktuell-web:rollback-${STAMP}"; fi
          restore_web() {
            rc=$?
            trap - ERR
            echo "::error::FFM deploy failed; restoring prior isolated source and web image where available."
            if [ -f "${BACKUP}.tar.gz" ]; then tar -xzf "${BACKUP}.tar.gz" -C /opt/ffm-aktuell || true; fi
            cd /opt/ffm-aktuell
            if [ -f "${BACKUP}-env" ]; then cp "${BACKUP}-env" .env; chmod 600 .env; fi
            if [ -n "$OLD_IMAGE" ]; then
              docker image tag "$OLD_IMAGE" ffm-aktuell-web:latest || true
              docker compose up -d --no-deps --no-build --force-recreate web || true
            fi
            exit "$rc"
          }
          trap restore_web ERR
          if [ -f /opt/ffm-aktuell/package.json ]; then
            tar --exclude=backups --exclude=.env -czf "${BACKUP}.tar.gz" -C /opt/ffm-aktuell .
            test -s "${BACKUP}.tar.gz"
          fi
          if [ -f /opt/ffm-aktuell/.env ]; then cp /opt/ffm-aktuell/.env "${BACKUP}-env"; chmod 600 "${BACKUP}-env"; fi
          tar -xzf /tmp/ffm-src.tar.gz -C /opt/ffm-aktuell --strip-components=1
          cd /opt/ffm-aktuell
          if [ ! -f .env ]; then
            umask 077
            printf 'POSTGRES_PASSWORD=%s\nSESSION_SECRET=%s\nPUBLISHER_NETWORK=%s\n' "$(openssl rand -hex 24)" "$(openssl rand -hex 48)" "$NETWORK" > .env
          else
            grep -q '^PUBLISHER_NETWORK=' .env || printf 'PUBLISHER_NETWORK=%s\n' "$NETWORK" >> .env
          fi
          chmod 600 .env
          python3 scripts/apply-service-config.py .env /tmp/ffm-service-config.json
          docker compose config --quiet
          docker compose up -d db
          for i in $(seq 1 35); do
            if docker compose exec -T db pg_isready -U ffm -d ffm </dev/null >/dev/null 2>&1; then break; fi
            if [ "$i" -eq 35 ]; then docker compose ps -a; docker compose logs --tail=90 db; exit 1; fi
            sleep 2
          done
          # Repair only the independent FFM database role; changing a container
          # POSTGRES_PASSWORD env does not automatically rotate an initialized PG role.
          # Password remains in the remote isolated database container, never in logs.
          docker compose exec -T db sh -eu -c '
            test "$POSTGRES_USER" = "ffm"
            test "$POSTGRES_DB" = "ffm"
            printf "ALTER ROLE ffm PASSWORD '\''%s'\'';\n" "$POSTGRES_PASSWORD" | psql -X -v ON_ERROR_STOP=1 -U ffm -d ffm >/dev/null
          ' </dev/null
          echo "Independent FFM PostgreSQL role credentials synchronized."
          # Essential restore points are captured before any schema mutation.
          docker compose exec -T db pg_dump -Fc -U ffm -d ffm </dev/null > "${BACKUP}-database.dump"
          test -s "${BACKUP}-database.dump"
          chmod 600 "${BACKUP}-database.dump"
          # Independent private volume backup; never touch Publisher or other tenants.
          if docker compose exec -T web test -d /app/uploads </dev/null >/dev/null 2>&1; then
            docker compose exec -T web tar -czf - -C /app uploads </dev/null > "${BACKUP}-media.tar.gz"
            test -s "${BACKUP}-media.tar.gz"
            chmod 600 "${BACKUP}-media.tar.gz"
          else
            echo "Legacy web has no uploads directory; no in-container user media to back up."
          fi
          echo "FFM source, DB and media backups secured before migration."
          docker compose exec -T db psql -v ON_ERROR_STOP=1 -U ffm -d ffm < db/schema.sql
          docker compose exec -T db psql -v ON_ERROR_STOP=1 -U ffm -d ffm < db/seed.sql
          # Preserve real OSM source metadata and review flags. The SQL is idempotent
          # and never promotes candidates into published or verified places.
          if [ -s data/osm-discovery.sql ]; then
            docker compose exec -T db psql -q -v ON_ERROR_STOP=1 -U ffm -d ffm < data/osm-discovery.sql
            echo 'Frankfurt OSM discovery candidates imported for review.'
          fi
          if [ -s data/apotheken-import.sql ]; then
            docker compose exec -T db psql -q -v ON_ERROR_STOP=1 -U ffm -d ffm < data/apotheken-import.sql
            echo 'Frankfurt OSM pharmacies imported without duty/openNow assertions.'
          fi
          docker compose build web
          # Initial keys are generated privately once. Explicit empty key settings
          # remain disabled; later deploys never silently rotate existing keys.
          if ! grep -q '^WEB_PUSH_PUBLIC_KEY=' .env && ! grep -q '^WEB_PUSH_PRIVATE_KEY=' .env; then
            docker compose run --rm -T --interactive=false --no-deps --entrypoint node web bootstrap-web-push.mjs </dev/null > /tmp/ffm-push-bootstrap.json
            chmod 600 /tmp/ffm-push-bootstrap.json
            python3 scripts/apply-service-config.py .env /tmp/ffm-push-bootstrap.json
          fi
          docker compose up -d --no-build --no-deps web
          APP_ID="$(docker compose ps -q web)"
          DB_HOST="$(docker exec "$APP_ID" node -e 'process.stdout.write(new URL(process.env.DATABASE_URL).hostname)')"
          test "$DB_HOST" = "ffm-aktuell-db" || { echo "::error::FFM database host must not be the shared 'db' alias"; exit 1; }
          unset DB_HOST
          echo "FFM PostgreSQL hostname is isolated from Publisher."

          # Ensure the web connection string and DB container have identical credentials,
          # without revealing secrets in CI logs.
          DB_PASS="$(docker compose exec -T db printenv POSTGRES_PASSWORD </dev/null | tr -d '\r\n')"
          APP_PASS="$(docker exec "$APP_ID" node -e 'process.stdout.write(new URL(process.env.DATABASE_URL).password)')"
          test -n "$DB_PASS" && test "$DB_PASS" = "$APP_PASS" || { echo "::error::FFM web/database password mismatch"; exit 1; }
          unset DB_PASS APP_PASS
          echo "FFM container credential parity verified."

          test -n "$APP_ID"
          for i in $(seq 1 45); do
            if docker exec "$APP_ID" node -e 'fetch("http://127.0.0.1:3000/api/health").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))' >/dev/null 2>&1; then break; fi
            if [ "$i" -eq 45 ]; then docker compose ps -a; docker compose logs --tail=90 web db; exit 1; fi
            sleep 3
          done
          cd /opt/aplus-publisher
          if ! grep -qF 'ffm-aktuell.smarbiz.sbs {' Caddyfile; then
            cp Caddyfile /opt/ffm-aktuell/backups/Caddyfile-before-ffm
            cat >> Caddyfile <<'CADDY'

          # FFM Aktuell: separate city platform, shared edge proxy only.
          ffm-aktuell.smarbiz.sbs {
            encode zstd gzip
            reverse_proxy ffm-aktuell-web:3000
            header X-Content-Type-Options nosniff
          }
          CADDY
          fi
          docker cp /opt/aplus-publisher/Caddyfile "$CADDY_ID":/tmp/Caddyfile-ffm
          docker exec "$CADDY_ID" caddy validate --config /tmp/Caddyfile-ffm
          docker exec "$CADDY_ID" caddy reload --config /tmp/Caddyfile-ffm
          docker exec "$CADDY_ID" rm -f /tmp/Caddyfile-ffm
          docker exec "$CADDY_ID" wget -qO- http://ffm-aktuell-web:3000/api/health | grep -q '"status":"ok"'
          docker compose exec -T web curl -fsS --max-time 8 http://127.0.0.1:8000/healthz/ >/dev/null </dev/null
          echo "FFM and Publisher internal health OK."
          trap - ERR
          echo "Deployed PR #48 source commit f4e8b4bb8dbee5e26d664959e95894dd4ddeae73; FFM backups retained."
          REMOTE
          ORIGIN=000
          for i in $(seq 1 14); do
            ORIGIN="$(curl -k -sS --connect-timeout 8 --max-time 20 --resolve "ffm-aktuell.smarbiz.sbs:443:$HOST" -o /dev/null -w '%{http_code}' https://ffm-aktuell.smarbiz.sbs/api/health 2>/dev/null || true)"
            [ "$ORIGIN" = 200 ] && break
            sleep 5
          done
          echo "FFM origin HTTPS status: $ORIGIN"
          test "$ORIGIN" = 200 || { echo "::error::FFM origin TLS not healthy."; exit 1; }
          PUBLIC="$(curl -sS --connect-timeout 8 --max-time 20 -o /dev/null -w '%{http_code}' https://ffm-aktuell.smarbiz.sbs/api/health || true)"
          echo "FFM public HTTPS status: $PUBLIC"
          test "$PUBLIC" = 200 || { echo "::error::FFM public DNS/Cloudflare route not healthy."; exit 1; }
          echo "FFM Aktuell live without restarting Publisher or other apps."

