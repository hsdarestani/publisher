name: A+ Solution build 73 Apple read-only diagnosis
on:
  push:
    branches: [main]
    paths: ['.github/workflows/aplus-solution-apple-73-diagnose-20261122.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          command_timeout: 5m
          script: |
            set -eu
            cd /opt/aplus-publisher
            docker compose exec -T web python manage.py shell <<'PY'
            from apps.publisher.models import Release,Job
            from apps.integrations.apple_store import AppleStoreClient
            r=Release.objects.get(app__slug="a-plus-solution",source_commit="8d9dc615353e300833561d1010c56cfdd45f978b")
            b=r.builds.get(platform="ios")
            c=AppleStoreClient(r.app.apple_account)
            aid=c.find_app(r.app.bundle_id)["id"]
            vers=c.find_editable_version(aid,r.version_name)
            print("RELEASE",r.id,r.version_name,r.build_number,r.source_commit,flush=True)
            print("IOS_BUILD",b.status,b.external_build_id,flush=True)
            print("VERSION",vers["id"],vers.get("attributes"),flush=True)
            try: print("ATTACHED",c.request("GET",f"/appStoreVersions/{vers['id']}/relationships/build").get("data"),flush=True)
            except Exception as exc: print("ATTACHED_ERROR",str(exc)[:700],flush=True)
            try: print("PRE_RELEASE",c.request("GET",f"/builds/{b.external_build_id}").get("data",{}).get("attributes"),flush=True)
            except Exception as exc: print("BUILD_ERROR",str(exc)[:700],flush=True)
            for state in ["WAITING_FOR_REVIEW","IN_REVIEW","CANCELED","READY_FOR_REVIEW","UNRESOLVED_ISSUES"]:
                try:
                    for s in c.list_review_submissions(aid,state):
                        item,_=c._review_submission_matches(s,vers["id"])
                        if item: print("REVIEW",state,s["id"],item["id"],item.get("attributes"),flush=True)
                except Exception as exc: print("REVIEW_QUERY_ERROR",state,str(exc)[:500],flush=True)
            for j in Job.objects.filter(release=r,type="submit_apple").order_by("-created_at")[:3]:
                print("APPLE_SUBMIT_JOB",j.status,str(j.error or "")[:5000],flush=True)
            PY
