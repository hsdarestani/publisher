name: Diagnose A+ Esthetic Build 42 Apple submission
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-aesthetic-submit-apple-build42.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read publisher release and Apple job history
        env:
          HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$SSH_PRIVATE_KEY"
          PORT="${SSH_PORT:-22}"
          umask 077
          KEY="$RUNNER_TEMP/esthetic-apple-diagnostic-key"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$KEY"
          chmod 600 "$KEY"
          if [ -n "$SSH_KEY_PASSPHRASE" ]; then
            eval "$(ssh-agent -s)" >/dev/null
            ASKPASS="$RUNNER_TEMP/apple-askpass"
            printf '%s\n' '#!/bin/sh' 'printf "%s" "$SSH_KEY_PASSPHRASE"' > "$ASKPASS"
            chmod 700 "$ASKPASS"
            DISPLAY=:0 SSH_ASKPASS="$ASKPASS" SSH_ASKPASS_REQUIRE=force setsid ssh-add "$KEY" </dev/null
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          fi
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -T 10 -p "$PORT" -H "$HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          test -s "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          if [ -n "$SSH_HOST_FINGERPRINT" ]; then
            ssh-keygen -lf "$HOME/.ssh/known_hosts" | grep -F -- "$SSH_HOST_FINGERPRINT" >/dev/null
          fi
          PY_CODE=$(cat <<'PY'
          import re
          from apps.publisher.models import MobileApp, Release, Submission
          app=MobileApp.objects.get(slug='a-esthetic')
          rel=Release.objects.get(app=app,version_name='1.0.36',build_number=42)
          print('RELEASE',rel.pk,rel.status,rel.source_commit)
          for b in rel.builds.all():
              print('BUILD',b.platform,b.status,'external',bool(b.external_build_id))
          for sub in Submission.objects.filter(release=rel).order_by('-pk')[:6]:
              print('SUBMISSION',sub.platform,sub.state)
          print('APPLE_JOBS_START')
          jobs=rel.jobs.filter(type__in=['submit_apple','upload_apple','upload_google']).order_by('-pk')[:24]
          for job in jobs:
              error=(job.error or '').strip().replace('\r',' ').replace('\n',' ')
              error=re.sub(r'(?i)(bearer\s+|token[=:]\s*|password[=:]\s*)[^\s,;]+',r'\1[REDACTED]',error)
              error=re.sub(r'AKIA[A-Z0-9]{16}|sk-[A-Za-z0-9_-]{20,}','[REDACTED]',error)
              print('JOB',job.pk,job.type,job.status,'error',error[:850])
          print('APPLE_JOBS_END')
          from apps.integrations.apple_store import AppleStoreClient
          client=AppleStoreClient(app.apple_account)
          asc=client.find_app(app.bundle_id)
          print('ASC_VERSIONS_START')
          for item in client.list_versions(asc['id']):
              attrs=item.get('attributes',{})
              print('ASC_VERSION',attrs.get('versionString'),attrs.get('appStoreState'),attrs.get('appVersionState'),attrs.get('platform'))
          print('ASC_VERSIONS_END')
          print('ASC_REVIEW_START')
          for state in ('WAITING_FOR_REVIEW','IN_REVIEW','READY_FOR_REVIEW','UNRESOLVED_ISSUES'):
              try:
                  rows=client.list_review_submissions(asc['id'],state)
                  for row in rows[:6]:
                      print('ASC_REVIEW',state,row.get('id'))
              except Exception as exc:
                  print('ASC_REVIEW_ERROR',state,type(exc).__name__,str(exc)[:150])
          print('ASC_REVIEW_END')
          print('AFTER_REVIEW_WITHDRAWAL_CHECK')
          PY
          )
          ENCODED=$(printf '%s' "$PY_CODE" | base64 -w0)
          ssh -i "$KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$PORT" root@"$HOST" \
            "cd /opt/aplus-publisher && printf '%s' '$ENCODED' | base64 -d | docker compose exec -T web python manage.py shell"
