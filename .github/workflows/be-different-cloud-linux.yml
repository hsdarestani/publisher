name: BE DIFFERENT Cloud Linux

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: be-different-cloud-linux
  cancel-in-progress: false

jobs:
  be-different-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Publisher agent
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Prepare Android SDK and pinned NDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          ndk_version="27.1.12297006"
          ndk_dir="$sdk/ndk/$ndk_version"
          if [ -f "$ndk_dir/source.properties" ] && grep -q "Pkg.Revision = $ndk_version" "$ndk_dir/source.properties"; then
            echo "Pinned Android NDK already installed"
            exit 0
          fi
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$manager" ]; then
            manager="$(command -v sdkmanager || true)"
          fi
          if [ -z "$manager" ]; then
            echo "::error::Android sdkmanager is missing"
            exit 1
          fi
          for attempt in 1 2 3 4; do
            echo "Installing pinned NDK attempt $attempt/4"
            rm -rf "$ndk_dir" "$sdk/.temp"/*ndk* 2>/dev/null || true
            if "$manager" --sdk_root="$sdk" --install "ndk;$ndk_version" </dev/null >/tmp/bd-ndk-install.log 2>&1; then
              if [ -f "$ndk_dir/source.properties" ] && grep -q "Pkg.Revision = $ndk_version" "$ndk_dir/source.properties"; then
                echo "Validated pinned Android NDK $ndk_version"
                exit 0
              fi
            fi
            tail -n 20 /tmp/bd-ndk-install.log || true
            sleep $((attempt * 5))
          done
          echo "::error::Pinned Android NDK installation failed; stopping before compiling the app"
          exit 1

      - name: Install agent dependencies
        run: pip install 'requests>=2.32,<3' 'PyJWT[crypto]>=2.10,<3'

      - name: Wait for Publisher
        run: |
          curl --fail --silent --show-error \
            --retry 18 --retry-all-errors --retry-delay 10 \
            --connect-timeout 10 --max-time 20 \
            https://publisher.smarbiz.sbs/healthz/

      - name: Prepare verified Gradle 8.13 for the Android wrapper
        shell: bash
        run: |
          set -euo pipefail
          # The cache key is the wrapper hash of the Expo Gradle distribution URL.
          gradle_cache="${GRADLE_USER_HOME:-$HOME/.gradle}/wrapper/dists/gradle-8.13-bin/5xuhj0ry160q40clulazy9h7d"
          mkdir -p "$gradle_cache"
          archive="$(mktemp "$gradle_cache/.gradle-8.13.XXXXXX")"
          trap 'rm -f "$archive"' EXIT
          download_args=(--fail --silent --show-error --location --proto '=https' --proto-redir '=https'
            --connect-timeout 20 --max-time 120 --retry 3 --retry-all-errors --retry-max-time 240)
          fetch_gradle() {
            curl "${download_args[@]}" "$@" -o "$archive" &&
              printf '%s  %s\n' 20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78 "$archive" | sha256sum -c -
          }
          if ! fetch_gradle -H 'Accept: application/octet-stream' \
            https://api.github.com/repos/gradle/gradle-distributions/releases/assets/232373824; then
            fetch_gradle https://services.gradle.org/distributions/gradle-8.13-bin.zip
          fi
          mv "$archive" "$gradle_cache/gradle-8.13-bin.zip"

      - name: Build and deliver BE DIFFERENT Android
        env:
          PYTHONUNBUFFERED: '1'
          PUBLISHER_URL: https://publisher.smarbiz.sbs
          PUBLISHER_MAX_JOBS: '2'
          PUBLISHER_WATCH_SECONDS: '300'
          PUBLISHER_POLL_INTERVAL: '10'
          PUBLISHER_AGENT_PLATFORM: linux_bedifferent
          PUBLISHER_AGENT_APP_SLUG: be-different
        run: python agents/custom_cloud_linux.py
