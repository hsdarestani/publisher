name: Final stage A+Bau 2.2.1 for Google Play review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Install Python dependencies
        run: python -m pip install -q 'paramiko>=3.5,<4' 'google-auth>=2.40,<3' 'requests>=2.32,<3'

      - name: Retrieve signed AAB and Google credential without apt
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, paramiko

          host = os.environ['HOST']
          password = os.environ['PASS']
          port = int(os.environ.get('SSH_PORT') or 22)
          client = paramiko.SSHClient()
          client.set_missing_host_key_policy(paramiko.AutoAddPolicy())
          client.connect(hostname=host, port=port, username='root', password=password, timeout=30)

          def run(cmd):
              _stdin, stdout, stderr = client.exec_command(cmd, timeout=120)
              data = stdout.read()
              err = stderr.read().decode('utf-8', 'replace')
              code = stdout.channel.recv_exit_status()
              if code != 0:
                  raise RuntimeError(f'remote command failed ({code}): {err[-1200:]}')
              return data

          cred_cmd = r'''cd /opt/aplus-publisher && docker compose exec -T web python -c "import json,os,django; os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings'); django.setup(); from apps.publisher.models import MobileApp; a=MobileApp.objects.select_related('google_account').get(slug='a-bau'); print(json.dumps(a.google_account.get_credentials()))"'''
          aab_cmd = r'''cd /opt/aplus-publisher && docker compose exec -T web python -c "import os,sys,django; from pathlib import Path; os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings'); django.setup(); from apps.publisher.models import MobileApp,Release; a=MobileApp.objects.get(slug='a-bau'); r=Release.objects.get(app=a,version_name='2.2.1',build_number=22002); b=r.builds.get(platform='android'); assert b.status=='succeeded' and b.artifact; sys.stdout.buffer.write(Path(b.artifact.path).read_bytes())"'''

          pathlib.Path('/tmp/google.json').write_bytes(run(cred_cmd))
          pathlib.Path('/tmp/a-bau-22002.aab').write_bytes(run(aab_cmd))
          client.close()
          print('publisher_payload_retrieved=true')
          PY

      - name: Verify exact signed AAB startup payload
        run: |
          python - <<'PY'
          import json, re, zipfile
          with zipfile.ZipFile('/tmp/a-bau-22002.aab') as z:
              names = set(z.namelist())
              index = next(n for n in names if n.endswith('/assets/public/index.html'))
              bundle = next(n for n in names if n.endswith('/assets/public/app.bundle.js'))
              config = next(n for n in names if n.endswith('/assets/capacitor.config.json'))
              assert not [n for n in names if n.endswith('/assets/public/app.js')]
              html = z.read(index).decode('utf-8', 'replace')
              js = z.read(bundle).decode('utf-8', 'replace')
              cfg = json.loads(z.read(config))
              assert cfg.get('appName') == 'A+Bau'
              assert '<title>A+Bau</title>' in html and 'src="app.bundle.js"' in html
              assert 'KAYI Haustechnik' not in html
              assert not re.search(r"from\s+['\"]@capacitor/core['\"]", js)
              assert 'Anmelden' in js and 'A+Bau' in js
              print('SIGNED_AAB_STARTUP_VERIFY=SUCCESS')
          PY

      - name: Stage 22002 for manual Google review
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import quote
          from google.auth.transport.requests import AuthorizedSession, Request
          from google.oauth2 import service_account

          info = json.loads(Path('/tmp/google.json').read_text())
          pkg = 'de.kayihaustechnik.app'
          qpkg = quote(pkg, safe='._-')
          code = '22002'
          creds = service_account.Credentials.from_service_account_info(info, scopes=['https://www.googleapis.com/auth/androidpublisher'])
          creds.refresh(Request())
          s = AuthorizedSession(creds)
          api = 'https://androidpublisher.googleapis.com/androidpublisher/v3'
          upload = 'https://androidpublisher.googleapis.com/upload/androidpublisher/v3'

          def safe_body(r):
              try:
                  return json.dumps(r.json(), ensure_ascii=False)[:2400]
              except Exception:
                  return ' '.join(r.text.split())[:2400]

          er = s.post(f'{api}/applications/{qpkg}/edits', json={}, timeout=60)
          print(f'edit_open=HTTP_{er.status_code}')
          if not er.ok:
              raise RuntimeError(safe_body(er))
          eid = er.json()['id']
          try:
              lr = s.get(f'{api}/applications/{qpkg}/edits/{eid}/bundles', timeout=60)
              if not lr.ok:
                  raise RuntimeError('list bundles ' + safe_body(lr))
              existing = next((b for b in lr.json().get('bundles', []) if str(b.get('versionCode')) == code), None)
              if existing:
                  print('bundle_22002=reused')
              else:
                  ur = s.post(
                      f'{upload}/applications/{qpkg}/edits/{eid}/bundles',
                      params={'uploadType': 'media'},
                      data=Path('/tmp/a-bau-22002.aab').read_bytes(),
                      headers={'Content-Type': 'application/octet-stream'},
                      timeout=600,
                  )
                  print(f'bundle_upload=HTTP_{ur.status_code}')
                  if not ur.ok:
                      raise RuntimeError('upload ' + safe_body(ur))

              notes = [{'language': 'de-DE', 'text': 'Startproblem beim Öffnen der App behoben. Der A+Bau Login und die native App-Oberfläche laden jetzt zuverlässig.'}]
              tr = s.put(
                  f'{api}/applications/{qpkg}/edits/{eid}/tracks/production',
                  json={'track': 'production', 'releases': [{'name': '2.2.1 (22002)', 'versionCodes': [code], 'status': 'completed', 'releaseNotes': notes}]},
                  timeout=120,
              )
              print(f'track_update=HTTP_{tr.status_code}')
              if not tr.ok:
                  raise RuntimeError('track ' + safe_body(tr))

              cr = s.post(
                  f'{api}/applications/{qpkg}/edits/{eid}:commit',
                  params={'changesNotSentForReview': 'true'},
                  json={},
                  timeout=120,
              )
              print(f'commit=HTTP_{cr.status_code}')
              if not cr.ok:
                  raise RuntimeError('commit ' + safe_body(cr))
              print('GOOGLE_PLAY_22002_STAGED_FOR_MANUAL_REVIEW=SUCCESS')
          except Exception:
              try:
                  s.delete(f'{api}/applications/{qpkg}/edits/{eid}', timeout=60)
              except Exception:
                  pass
              raise

          # Fresh-read verification.
          ve = s.post(f'{api}/applications/{qpkg}/edits', json={}, timeout=60)
          if not ve.ok:
              raise RuntimeError('verify edit ' + safe_body(ve))
          vid = ve.json()['id']
          try:
              rr = s.get(f'{api}/applications/{qpkg}/edits/{vid}/tracks/production', timeout=60)
              if not rr.ok:
                  raise RuntimeError('verify track ' + safe_body(rr))
              releases = rr.json().get('releases') or []
              safe = [{'name': r.get('name'), 'status': r.get('status'), 'versionCodes': [str(x) for x in (r.get('versionCodes') or [])]} for r in releases]
              print('POST_COMMIT_PRODUCTION=' + json.dumps(safe, sort_keys=True))
              assert any(code in r['versionCodes'] for r in safe), safe
          finally:
              s.delete(f'{api}/applications/{qpkg}/edits/{vid}', timeout=60)
          PY

      - name: Cleanup
        if: always()
        run: rm -f /tmp/google.json /tmp/a-bau-22002.aab
