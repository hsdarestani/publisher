name: Resume A+ Solution 1.0.3 build 9 store submission

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resume-aplus-solution-1-0-3-build9.yml'

permissions:
  contents: read
  actions: write
  issues: write

env:
  RELEASE_ID: '28'
  APLUS_COMMIT: '0500ae6623e423cda171010c31caa69be438aa71'
  STATUS_ISSUE: '74'

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    steps:
      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass jq >/dev/null

      - name: Wait for Publisher deployment from this commit
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            JSON="$(curl -fsSL "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=20")"
            ROW="$(printf '%s' "$JSON" | jq -c '.workflow_runs[] | select(.name=="Validate and deploy A+ Publisher")' | head -n1)"
            if [ -n "$ROW" ]; then
              STATUS="$(printf '%s' "$ROW" | jq -r '.status')"
              CONCLUSION="$(printf '%s' "$ROW" | jq -r '.conclusion // ""')"
              echo "Publisher deploy: $STATUS $CONCLUSION"
              if [ "$STATUS" = 'completed' ]; then
                test "$CONCLUSION" = 'success'
                exit 0
              fi
            fi
            sleep 10
          done
          exit 1

      - name: Verify release 1.0.3 build 9 and wake builders
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T -e RELEASE_ID='$RELEASE_ID' -e APLUS_COMMIT='$APLUS_COMMIT' web python manage.py shell" <<'PY'
          import os
          from apps.publisher.models import Release
          r=Release.objects.get(id=os.environ['RELEASE_ID'])
          assert r.version_name == '1.0.3', r.version_name
          assert int(r.build_number) == 9, r.build_number
          assert r.source_commit == os.environ['APLUS_COMMIT'], r.source_commit
          print('release_verified=yes')
          PY

      - name: Wake Android and iOS builders
        uses: actions/github-script@v7
        with:
          script: |
            for (const workflow_id of ['cloud-linux.yml','cloud-macos.yml']) {
              await github.rest.actions.createWorkflowDispatch({owner: context.repo.owner, repo: context.repo.repo, workflow_id, ref: 'main'});
            }

      - name: Wait for signed Android AAB and iOS IPA
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          for i in $(seq 1 240); do
            STATE="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
              "cd /opt/aplus-publisher && docker compose exec -T -e RELEASE_ID='$RELEASE_ID' web python manage.py shell" <<'PY'
          import os
          from apps.publisher.models import Build, Job, Release
          r=Release.objects.get(id=os.environ['RELEASE_ID'])
          vals=[]
          for platform, job_type in [('android','build_android'),('ios','build_ios')]:
              b=Build.objects.get(release=r,platform=platform)
              f=Job.objects.filter(build=b,type=job_type,status='failed').order_by('-created_at').first()
              vals.append(':'.join([platform,b.status,'artifact' if b.artifact else '',(f.error or '')[:180].replace('|','/') if f else '']))
          print('|'.join(vals))
          PY
          )"
            STATE="$(printf '%s\n' "$STATE" | tail -n1 | tr -d '\r')"
            echo "Build state: $STATE"
            if [[ "$STATE" == *"failed"* ]]; then echo "$STATE" >&2; exit 1; fi
            if [[ "$STATE" == android:succeeded:artifact:*"|"ios:succeeded:artifact:* ]]; then exit 0; fi
            sleep 20
          done
          echo 'Timed out waiting for native builds.' >&2
          exit 1

      - name: Queue Google Play submit and Apple upload
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T -e RELEASE_ID='$RELEASE_ID' web python manage.py shell" <<'PY'
          import os
          from apps.publisher.models import Job, Release
          from apps.publisher.tasks import enqueue_job
          r=Release.objects.get(id=os.environ['RELEASE_ID']); app=r.app
          android=r.builds.get(platform='android'); ios=r.builds.get(platform='ios')
          assert android.status=='succeeded' and android.artifact
          assert ios.status=='succeeded' and ios.artifact
          if not Job.objects.filter(release=r,type='submit_google',status__in=['queued','running','succeeded']).exists():
              print('google_job='+str(enqueue_job('submit_google',app=app,release=r,build=android).id))
          if not ios.external_build_id and not Job.objects.filter(build=ios,type='upload_apple',status__in=['queued','running','succeeded']).exists():
              print('apple_upload_job='+str(enqueue_job('upload_apple',app=app,release=r,build=ios,agent=True,platform='macos').id))
          PY

      - name: Wake Mac uploader
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({owner: context.repo.owner, repo: context.repo.repo, workflow_id: 'cloud-macos.yml', ref: 'main'});

      - name: Wait for Google submission and processed Apple build
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          for i in $(seq 1 180); do
            STATE="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
              "cd /opt/aplus-publisher && docker compose exec -T -e RELEASE_ID='$RELEASE_ID' web python manage.py shell" <<'PY'
          import os
          from apps.publisher.models import Job, Release
          r=Release.objects.get(id=os.environ['RELEASE_ID']); ios=r.builds.get(platform='ios')
          g=Job.objects.filter(release=r,type='submit_google').order_by('-created_at').first()
          u=Job.objects.filter(release=r,type='upload_apple').order_by('-created_at').first()
          print('|'.join([g.status if g else 'missing',(g.error or '')[:180].replace('|','/') if g else '',u.status if u else ('succeeded' if ios.external_build_id else 'missing'),(u.error or '')[:180].replace('|','/') if u else '',ios.external_build_id or '']))
          PY
          )"
            STATE="$(printf '%s\n' "$STATE" | tail -n1 | tr -d '\r')"
            echo "Store delivery: $STATE"
            IFS='|' read -r GST GERR UST UERR APPLE_ID <<< "$STATE"
            if [ "$GST" = 'failed' ]; then echo "Google: $GERR" >&2; exit 1; fi
            if [ "$UST" = 'failed' ]; then echo "Apple upload: $UERR" >&2; exit 1; fi
            if [ "$GST" = 'succeeded' ] && [ -n "$APPLE_ID" ]; then exit 0; fi
            sleep 20
          done
          echo 'Timed out waiting for store delivery.' >&2
          exit 1

      - name: Submit current build to Apple review
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T -e RELEASE_ID='$RELEASE_ID' web python manage.py shell" <<'PY'
          import os,time
          from apps.integrations.apple_store import AppleStoreClient
          from apps.publisher.models import Job, Release
          from apps.publisher.tasks import enqueue_job
          r=Release.objects.get(id=os.environ['RELEASE_ID']); app=r.app; build=r.builds.get(platform='ios')
          assert build.status=='succeeded' and build.external_build_id
          client=AppleStoreClient(app.apple_account); apple_app=client.find_app(app.bundle_id); version=client.ensure_version(apple_app['id'],r.version_name); version_id=str(version['id'])
          canceled=[]
          for state in ('WAITING_FOR_REVIEW','IN_REVIEW'):
              for submission in client.list_review_submissions(apple_app['id'],state):
                  item,_=client._review_submission_matches(submission,version_id)
                  if item:
                      client.cancel_review_submission(submission['id']); canceled.append(submission['id'])
          if canceled:
              for _ in range(30):
                  active=False
                  for state in ('WAITING_FOR_REVIEW','IN_REVIEW'):
                      for submission in client.list_review_submissions(apple_app['id'],state):
                          item,_=client._review_submission_matches(submission,version_id)
                          if item: active=True; break
                      if active: break
                  if not active: break
                  time.sleep(2)
              if active: raise SystemExit('Prior Apple review is still active.')
          if not Job.objects.filter(release=r,type='submit_apple',status__in=['queued','running','succeeded']).exists():
              print('apple_submit_job='+str(enqueue_job('submit_apple',app=app,release=r,build=build).id))
          print('canceled='+','.join(canceled))
          PY

      - name: Wait until both stores are submitted
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          for i in $(seq 1 120); do
            STATE="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
              "cd /opt/aplus-publisher && docker compose exec -T -e RELEASE_ID='$RELEASE_ID' web python manage.py shell" <<'PY'
          import os
          from apps.publisher.models import Job, Release, Submission
          r=Release.objects.get(id=os.environ['RELEASE_ID'])
          g=Job.objects.filter(release=r,type='submit_google').order_by('-created_at').first()
          a=Job.objects.filter(release=r,type='submit_apple').order_by('-created_at').first()
          gs=Submission.objects.filter(release=r,platform='android').first()
          aps=Submission.objects.filter(release=r,platform='ios').first()
          print('|'.join([g.status if g else 'missing',(g.error or '')[:220].replace('|','/') if g else '',a.status if a else 'missing',(a.error or '')[:220].replace('|','/') if a else '',gs.state if gs else '',aps.state if aps else '',aps.external_id if aps else '']))
          PY
          )"
            STATE="$(printf '%s\n' "$STATE" | tail -n1 | tr -d '\r')"
            echo "Review state: $STATE"
            IFS='|' read -r GST GERR AST AERR GS AS AID <<< "$STATE"
            if [ "$GST" = 'failed' ]; then echo "Google: $GERR" >&2; exit 1; fi
            if [ "$AST" = 'failed' ]; then echo "Apple: $AERR" >&2; exit 1; fi
            if [ "$GST" = 'succeeded' ] && [ "$AST" = 'succeeded' ] && [ -n "$GS" ] && [ -n "$AS" ]; then exit 0; fi
            sleep 15
          done
          exit 1

      - name: Publish final status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(printf '✅ A+ Solution 1.0.3 (Build 9) was built from the latest live production code and submitted to both stores.\n\n- Source commit: `%s`\n- Google Play production: **submitted**\n- App Store Connect: **submitted for review**\n- Workflow: %s/%s/actions/runs/%s\n' "$APLUS_COMMIT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$STATUS_ISSUE" -f body="$body" -f state=closed >/dev/null

      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(printf '❌ A+ Solution 1.0.3 (Build 9) store submission needs attention.\n\n- Source commit: `%s`\n- Workflow: %s/%s/actions/runs/%s\n' "$APLUS_COMMIT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$STATUS_ISSUE" -f body="$body" -f state=open >/dev/null
