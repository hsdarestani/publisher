name: Release current A+Bau 2.2.2 build 22008

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/a-bau-2-2-2-build-22008-current-release.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: a-bau-22008-current-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 55
    env:
      APP_VERSION: '2.2.2'
      BUILD_NUMBER: '22008'
    steps:
      - name: Install SSH client helper
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq sshpass >/dev/null

      - name: Reconcile Publisher reviewer credential with production demo account
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          export SSHPASS="$PASS"
          sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          REVIEW_JSON="$(
            cd /opt/aplus-publisher
            docker compose exec -T web python - <<'PY'
          import json
          import os
          import django
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          django.setup()
          from apps.publisher.models import MobileApp
          app = MobileApp.objects.get(slug="a-bau")
          password = app.get_review_password()
          assert app.review_username == "demo", f"Unexpected review username: {app.review_username!r}"
          assert password, "Publisher review password is missing"
          print(json.dumps({"username": app.review_username, "password": password}))
          PY
          )"
          REVIEW_USER="$(REVIEW_JSON="$REVIEW_JSON" python3 - <<'PY'
          import json, os
          print(json.loads(os.environ["REVIEW_JSON"])["username"])
          PY
          )"
          REVIEW_PASS="$(REVIEW_JSON="$REVIEW_JSON" python3 - <<'PY'
          import json, os
          print(json.loads(os.environ["REVIEW_JSON"])["password"])
          PY
          )"
          unset REVIEW_JSON
          export REVIEW_USER REVIEW_PASS
          cd /opt/kayi
          docker compose exec -T -e REVIEW_USER -e REVIEW_PASS web python manage.py shell <<'PY'
          import os
          from django.contrib.auth import authenticate, get_user_model
          username = os.environ["REVIEW_USER"]
          password = os.environ["REVIEW_PASS"]
          User = get_user_model()
          user, _ = User.objects.get_or_create(username=username)
          user.is_active = True
          user.set_password(password)
          user.save()
          assert authenticate(username=username, password=password) is not None
          print("A+Bau reviewer login demo is synchronized and verified.")
          PY
          unset REVIEW_USER REVIEW_PASS
          REMOTE

      - name: Queue current A+Bau source for both stores
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          export SSHPASS="$PASS"
          sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST"             "cd /opt/aplus-publisher && docker compose exec -T web python manage.py bootstrap_a_bau --app-version '$APP_VERSION' --build-number '$BUILD_NUMBER' --queue --publish"

      - name: Wake Android and iOS Publisher cloud agents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run cloud-linux.yml --repo "$GITHUB_REPOSITORY"
          gh workflow run cloud-macos.yml --repo "$GITHUB_REPOSITORY"

      - name: Advance publishing and require both store submissions
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          export SSHPASS="$PASS"
          for i in $(seq 1 80); do
            echo "=== A+Bau build $BUILD_NUMBER Publisher pass $i ==="
            OUTPUT="$(sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST"               "cd /opt/aplus-publisher && docker compose exec -T web python manage.py bootstrap_a_bau --app-version '$APP_VERSION' --build-number '$BUILD_NUMBER' --publish")"
            printf '%s\n' "$OUTPUT"
            if printf '%s\n' "$OUTPUT" | grep -q 'job=upload_google:succeeded' &&                printf '%s\n' "$OUTPUT" | grep -q 'job=submit_apple:succeeded'; then
              echo "A+Bau $APP_VERSION build $BUILD_NUMBER submitted to Google Play and Apple."
              exit 0
            fi
            if printf '%s\n' "$OUTPUT" | grep -Eq 'job=(build_android|build_ios|upload_google|submit_apple):failed'; then
              echo "Publisher reported a failed A+Bau release job." >&2
              exit 3
            fi
            sleep 30
          done
          echo "Timed out waiting for both store submissions." >&2
          exit 4

      - name: Final non-secret Publisher state
        if: always()
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          PORT="${SSH_PORT:-22}"
          export SSHPASS="$PASS"
          sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST"             "cd /opt/aplus-publisher && docker compose exec -T web python manage.py bootstrap_a_bau --app-version '$APP_VERSION' --build-number '$BUILD_NUMBER' --publish"
