name: Publish launcher fixes via cloud

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-launcher-fixes-via-cloud.yml'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime tools
        run: |
          python -m pip install --disable-pip-version-check 'requests>=2.32,<3' 'PyJWT[crypto]>=2.10,<3' google-auth
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Deploy latest Publisher source and cloud authorization
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          PUBLISHER_GITHUB_TOKEN: ${{ secrets.PUBLISHER_GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_COMPLIANCE_MODEL: ${{ vars.OPENAI_COMPLIANCE_MODEL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          tar --exclude=.git --exclude=.env -czf /tmp/aplus-publisher.tar.gz .
          : > /tmp/aplus-publisher-overrides.env
          [ -n "$ADMIN_EMAIL" ] && printf 'ADMIN_EMAIL=%s\n' "$ADMIN_EMAIL" >> /tmp/aplus-publisher-overrides.env || true
          [ -n "$ADMIN_PASSWORD" ] && printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" >> /tmp/aplus-publisher-overrides.env || true
          [ -n "$PUBLISHER_GITHUB_TOKEN" ] && printf 'PUBLISHER_GITHUB_TOKEN=%s\n' "$PUBLISHER_GITHUB_TOKEN" >> /tmp/aplus-publisher-overrides.env || true
          [ -n "$OPENAI_API_KEY" ] && printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY" >> /tmp/aplus-publisher-overrides.env || true
          [ -n "$OPENAI_COMPLIANCE_MODEL" ] && printf 'OPENAI_COMPLIANCE_MODEL=%s\n' "$OPENAI_COMPLIANCE_MODEL" >> /tmp/aplus-publisher-overrides.env || true
          [ -n "$SENTRY_DSN" ] && printf 'SENTRY_DSN=%s\n' "$SENTRY_DSN" >> /tmp/aplus-publisher-overrides.env || true
          sshpass -p "$PASS" scp -P "$PORT" -o StrictHostKeyChecking=no \
            /tmp/aplus-publisher.tar.gz /tmp/aplus-publisher-overrides.env scripts/deploy.sh \
            root@"$HOST":/tmp/
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            'chmod +x /tmp/deploy.sh && /tmp/deploy.sh /tmp/aplus-publisher.tar.gz /tmp/aplus-publisher-overrides.env'
          curl --fail --silent --show-error --retry 18 --retry-all-errors --retry-delay 5 \
            --connect-timeout 10 --max-time 20 https://publisher.smarbiz.sbs/healthz/

      - name: Recover only the Esthetic Android build
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py release_launcher_icon_updates --recover --queue --target esthetic"

      - name: Build Esthetic with the real Publisher upload key
        id: esthetic_build
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: '1'
          PUBLISHER_URL: https://publisher.smarbiz.sbs
          PUBLISHER_MAX_JOBS: '1'
          PUBLISHER_POLL_INTERVAL: '5'
          PUBLISHER_WATCH_SECONDS: '10'
          PUBLISHER_PRESERVE_ARTIFACT_DIR: /tmp/preserved-launcher-aabs
        run: python agents/custom_cloud_linux.py

      - name: Preserve signed Esthetic AAB from ephemeral runner
        run: |
          set -euo pipefail
          AAB="$(find /tmp/preserved-launcher-aabs -type f -name '*.aab' -print 2>/dev/null | tail -n 1)"
          if [ -z "$AAB" ]; then
            echo 'The Esthetic build did not preserve its signed AAB.' >&2
            find /tmp/preserved-launcher-aabs -maxdepth 2 -type f -print 2>/dev/null || true
            exit 2
          fi
          cp "$AAB" /tmp/esthetic.aab
          test -s /tmp/esthetic.aab
          jarsigner -verify /tmp/esthetic.aab >/dev/null
          echo "Preserved Esthetic AAB: $AAB"
          sha256sum /tmp/esthetic.aab

      - name: Export signed Solution AAB already stored by Publisher
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" <<'REMOTE'
          set -euo pipefail
          cd /opt/aplus-publisher
          docker compose exec -T web python manage.py shell -c "from apps.publisher.models import Release; import shutil; r=Release.objects.filter(source_commit='1d49500db4b8a02b2a0f1ac01ea314eb82984e00').order_by('-created_at').first(); b=r.builds.filter(platform='android').first(); assert b and b.status=='succeeded', f'Solution build status={getattr(b, \"status\", None)}'; shutil.copyfile(b.artifact.path, '/tmp/solution.aab'); print(f'solution release={r.pk} build={r.build_number} artifact={b.artifact.name}')"
          docker compose cp web:/tmp/solution.aab /tmp/solution.aab >/dev/null
          REMOTE
          sshpass -p "$PASS" scp -P "$PORT" -o StrictHostKeyChecking=no root@"$HOST":/tmp/solution.aab /tmp/solution.aab
          test -s /tmp/solution.aab
          jarsigner -verify /tmp/solution.aab >/dev/null
          sha256sum /tmp/solution.aab

      - name: Upload both AABs and commit Google Play Production from GitHub edge
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
          python - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.parse import quote
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession, Request

          SCOPE = 'https://www.googleapis.com/auth/androidpublisher'
          API = 'https://androidpublisher.googleapis.com/androidpublisher/v3'
          UPLOAD = 'https://androidpublisher.googleapis.com/upload/androidpublisher/v3'
          apps = [
              ('A+ Solution', 'de.aplussolution.workforce', '/tmp/solution.aab', '5', '1.0.0'),
              ('A+ Esthetic', 'de.aplusesthetic.app', '/tmp/esthetic.aab', '4', '1.0.0'),
          ]

          info = json.loads(os.environ['GOOGLE_PLAY_SERVICE_ACCOUNT_JSON'])
          creds = service_account.Credentials.from_service_account_info(info, scopes=[SCOPE])
          creds.refresh(Request())
          session = AuthorizedSession(creds)

          def require(resp, label):
              if resp.ok:
                  return resp.json() if resp.content else {}
              try:
                  detail = json.dumps(resp.json(), ensure_ascii=False)
              except Exception:
                  detail = ' '.join(resp.text.split())[:3000]
              raise RuntimeError(f'{label}: HTTP {resp.status_code}: {detail}')

          for name, package, aab, expected_vc, version_name in apps:
              pkg = quote(package, safe='._-')
              edit = require(session.post(f'{API}/applications/{pkg}/edits', json={}, timeout=60), f'{name} create edit')
              edit_id = edit['id']
              try:
                  bundle = require(
                      session.post(
                          f'{UPLOAD}/applications/{pkg}/edits/{edit_id}/bundles',
                          params={'uploadType': 'media'},
                          data=Path(aab).read_bytes(),
                          headers={'Content-Type': 'application/octet-stream'},
                          timeout=600,
                      ),
                      f'{name} upload bundle',
                  )
                  vc = str(bundle['versionCode'])
                  if vc != expected_vc:
                      raise RuntimeError(f'{name}: uploaded versionCode={vc}, expected={expected_vc}')
                  require(
                      session.put(
                          f'{API}/applications/{pkg}/edits/{edit_id}/tracks/production',
                          json={
                              'track': 'production',
                              'releases': [{
                                  'name': version_name,
                                  'versionCodes': [vc],
                                  'status': 'completed',
                              }],
                          },
                          timeout=60,
                      ),
                      f'{name} update production track',
                  )
                  require(
                      session.post(f'{API}/applications/{pkg}/edits/{edit_id}:validate', json={}, timeout=60),
                      f'{name} validate edit',
                  )
                  commit = require(
                      session.post(
                          f'{API}/applications/{pkg}/edits/{edit_id}:commit',
                          params={'changesInReviewBehavior': 'ERROR_IF_IN_REVIEW'},
                          json={}, timeout=60,
                      ),
                      f'{name} commit edit',
                  )
                  print(f'SUCCESS {name}: versionCode={vc} committed to Production; edit={commit.get("id", edit_id)}')
              except Exception:
                  try:
                      session.delete(f'{API}/applications/{pkg}/edits/{edit_id}', timeout=30)
                  except Exception:
                      pass
                  raise
          PY

      - name: Reconcile both successful uploads in Publisher
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" <<'REMOTE'
          set -euo pipefail
          cd /opt/aplus-publisher
          docker compose exec -T web python manage.py shell -c "from django.utils import timezone; from apps.publisher.models import Release,Job,Submission; targets=[('1d49500db4b8a02b2a0f1ac01ea314eb82984e00','5'),('c8fa10ccb1d44e4c6d747fcf8c3954c1933d9298','4')]; [(lambda r,b,vc: (setattr(b,'status','succeeded'), setattr(b,'finished_at',timezone.now()), b.save(update_fields=['status','finished_at','updated_at']), Job.objects.filter(release=r,type='build_android',status__in=['queued','running']).update(status='succeeded',progress=100,finished_at=timezone.now(),error=''), Job.objects.filter(release=r,type='upload_google',status='failed').update(status='cancelled',error='Superseded by successful Google Play cloud upload.'), Job.objects.create(app=r.app,release=r,build=b,type='upload_google',status='succeeded',progress=100,result={'executor':'github-actions','version_code':vc},logs='Google Play Production update committed successfully from GitHub cloud edge.',started_at=timezone.now(),finished_at=timezone.now()), Submission.objects.update_or_create(app=r.app,release=r,platform='android',defaults={'state':'in_review','submitted_at':timezone.now(),'raw':{'executor':'github-actions','version_code':vc}}), setattr(r,'status','in_review'), r.save(update_fields=['status','updated_at']), print(f'{r.app.slug}: release={r.pk} build={r.build_number} marked in_review')))(r,r.builds.filter(platform='android').first(),vc) for s,vc in targets for r in [Release.objects.filter(source_commit=s).order_by('-created_at').first()] if r]"
          REMOTE

      - name: Final Publisher diagnostics
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py release_launcher_icon_updates --diagnose"
