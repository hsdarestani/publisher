name: Build and submit A+ Esthetic iOS 1.0.29 (35)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/a-esthetic-ios-v129-build35-submit.yml'
permissions:
  contents: read
  actions: write
concurrency:
  group: a-esthetic-ios-1-0-29-build35-submission
  cancel-in-progress: false
jobs:
  submit-ios:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    env:
      SOURCE_COMMIT: a959f53778ffe2b1d58429de6669aa7c5e864d0d
      VERSION_NAME: 1.0.29
      BUILD_NUMBER: '35'
    steps:
      - name: Create new open Apple version build and queue signed IPA
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          PY_CODE=$(cat <<'PY'
          import os
          from apps.publisher.models import MobileApp, Release, Build
          from apps.publisher.tasks import enqueue_job
          app=MobileApp.objects.get(slug='a-esthetic')
          source=os.environ['SOURCE_COMMIT']
          version=os.environ['VERSION_NAME']
          number=int(os.environ['BUILD_NUMBER'])
          existing=Release.objects.filter(app=app, version_name=version, build_number=number).first()
          if existing and existing.source_commit != source:
              raise SystemExit('build35_source_mismatch')
          notes='Verbesserte Anmeldung und Passwort Wiederherstellung, korrigiertes Logo sowie stabilere Verbindung.'
          release,created=Release.objects.get_or_create(
              app=app,version_name=version,build_number=number,
              defaults={'status':'building','source_branch':'main','source_commit':source,
                        'android_track':'production','android_rollout':1,
                        'ios_release_type':'manual','auto_submit':True,'release_notes':notes},
          )
          ios,_=Build.objects.get_or_create(release=release,platform='ios',defaults={'status':'queued','commit_sha':source})
          if ios.status == 'succeeded' and ios.commit_sha != source:
              raise SystemExit('ios_built_from_different_source')
          pending=release.jobs.filter(type='build_ios',status__in=['queued','running','succeeded']).order_by('-pk').first()
          if ios.status not in ['succeeded','running'] and not pending:
              ios.status='queued'; ios.commit_sha=source; ios.save(update_fields=['status','commit_sha','updated_at'])
              job=enqueue_job('build_ios',app=app,release=release,build=ios,agent=True,platform='macos')
              print('IOS_BUILD_QUEUED',job.pk)
          else:
              print('IOS_EXISTING',ios.status,'job',pending.pk if pending else 'none')
          print('IOS_RELEASE',release.pk,version,number,'source',source,'created',created)
          PY
          )
          ENCODED=$(printf '%s' "$PY_CODE" | base64 -w0)
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && printf '%s' '$ENCODED' | base64 -d | docker compose exec -T -e SOURCE_COMMIT='$SOURCE_COMMIT' -e VERSION_NAME='$VERSION_NAME' -e BUILD_NUMBER='$BUILD_NUMBER' web python manage.py shell"
      - name: Wake Publisher macOS signing agent
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'cloud-macos.yml',
              ref: 'main'
            });
      - name: Wait for signing upload processing and Apple review submission
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          for attempt in $(seq 1 195); do
            PY_CODE=$(cat <<'PY'
          import os
          from apps.publisher.models import MobileApp, Release, Submission
          from apps.publisher.tasks import enqueue_job
          app=MobileApp.objects.get(slug='a-esthetic')
          release=Release.objects.get(app=app,version_name=os.environ['VERSION_NAME'],build_number=int(os.environ['BUILD_NUMBER']))
          ios=release.builds.get(platform='ios')
          def latest(kind): return release.jobs.filter(type=kind).order_by('-pk').first()
          b=latest('build_ios'); u=latest('upload_apple'); s=latest('submit_apple')
          sub=Submission.objects.filter(release=release,platform='ios').first()
          if ios.status=='succeeded' and (not u or u.status not in ['queued','running','succeeded']):
              if u and u.status=='failed':
                  print('HARD_FAIL upload_apple',str(u.error or '')[:800],str(u.logs or '')[-1600:])
              else:
                  j=enqueue_job('upload_apple',app=app,release=release,build=ios,agent=True,platform='macos')
                  print('UPLOAD_QUEUED',j.pk)
          u=latest('upload_apple')
          if ios.external_build_id and u and u.status=='succeeded' and not sub and not s:
              j=enqueue_job('submit_apple',app=app,release=release,build=ios)
              print('SUBMIT_QUEUED',j.pk)
          s=latest('submit_apple'); sub=Submission.objects.filter(release=release,platform='ios').first()
          print('STATE','release',release.pk,'ios',ios.status,'build',b.status if b else 'none',
                'upload',u.status if u else 'none','external',bool(ios.external_build_id),
                'submit',s.status if s else 'none','apple',sub.state if sub else 'pending')
          if sub and sub.state in ['in_review','approved','live']:
              print('DONE_APPLE_SUBMITTED',release.version_name,release.build_number,sub.state)
          elif b and b.status=='failed':
              print('HARD_FAIL build_ios',(b.error or '')[:1000])
          elif u and u.status=='failed':
              print('HARD_FAIL upload_apple',(u.error or '')[:1000])
          elif s and s.status=='failed':
              print('HARD_FAIL submit_apple',(s.error or '')[:1100])
          PY
            )
            ENCODED=$(printf '%s' "$PY_CODE" | base64 -w0)
            STATE=$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
              "cd /opt/aplus-publisher && printf '%s' '$ENCODED' | base64 -d | docker compose exec -T -e VERSION_NAME='$VERSION_NAME' -e BUILD_NUMBER='$BUILD_NUMBER' web python manage.py shell")
            echo "$STATE"
            if printf '%s' "$STATE" | grep -q 'DONE_APPLE_SUBMITTED'; then exit 0; fi
            if printf '%s' "$STATE" | grep -q 'HARD_FAIL'; then exit 1; fi
            if [ $((attempt % 8)) -eq 0 ]; then
              gh workflow run cloud-macos.yml --repo "$GITHUB_REPOSITORY" --ref main || true
            fi
            sleep 25
          done
          echo 'Apple submission wait exceeded safe poll window.'
          exit 1
