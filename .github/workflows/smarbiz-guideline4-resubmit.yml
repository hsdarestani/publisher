name: Resubmit Smarbiz After iPad Guideline 4 Fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smarbiz-guideline4-resubmit.yml'

permissions:
  contents: read
  statuses: write

jobs:
  resubmit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Wait until the iPad layout fix is live
        shell: bash
        run: |
          set -euo pipefail
          LIVE=0
          for attempt in $(seq 1 60); do
            echo "production_preflight_attempt=$attempt"
            HTML=$(curl --fail --silent --show-error --max-time 20 \
              --resolve smarbiz.sbs:443:91.107.157.75 \
              https://smarbiz.sbs/de/onboarding || true)
            if [ -n "$HTML" ]; then
              mapfile -t CSS_PATHS < <(printf '%s' "$HTML" | grep -oE '/_next/static/css/[^"? ]+\.css' | sort -u)
              COMPILED=''
              for path in "${CSS_PATHS[@]:-}"; do
                [ -n "$path" ] || continue
                COMPILED+="$(curl --fail --silent --show-error --max-time 20 \
                  --resolve smarbiz.sbs:443:91.107.157.75 \
                  "https://smarbiz.sbs$path" || true)"
              done
              MINIFIED=$(printf '%s' "$COMPILED" | tr -d '[:space:]')
              HAS_IPAD_BREAKPOINT=0
              HAS_16PX_FIELDS=0
              HAS_HORIZONTAL_GUARD=0
              printf '%s' "$MINIFIED" | grep -q '@media(max-width:1180px)' && HAS_IPAD_BREAKPOINT=1 || true
              printf '%s' "$MINIFIED" | grep -q 'font-size:16px' && HAS_16PX_FIELDS=1 || true
              printf '%s' "$MINIFIED" | grep -q 'overflow-x:hidden' && HAS_HORIZONTAL_GUARD=1 || true
              echo "ipad_breakpoint=$HAS_IPAD_BREAKPOINT fields_16px=$HAS_16PX_FIELDS horizontal_guard=$HAS_HORIZONTAL_GUARD css_files=${#CSS_PATHS[@]}"
              if [ "$HAS_IPAD_BREAKPOINT" = 1 ] && [ "$HAS_16PX_FIELDS" = 1 ] && [ "$HAS_HORIZONTAL_GUARD" = 1 ]; then
                LIVE=1
                break
              fi
            fi
            sleep 15
          done
          test "$LIVE" = 1 || {
            echo 'The new iPad responsive CSS is not live; refusing to resubmit.'
            exit 1
          }
          echo 'SMARBIZ_IPAD_UI_FIX=LIVE'

      - name: Install SSH client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null

      - name: Re-submit the original rejected App Store review
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell" <<'PY'
          import json
          import time
          from django.utils import timezone
          from apps.integrations.apple_store import AppleStoreClient
          from apps.publisher.models import Build, MobileApp, Release, Submission
          from apps.publisher.review_contacts import apple_review_contact

          ORIGINAL_SUBMISSION_ID = '082108bd-f8d0-400c-b126-d3b90d825dd9'

          app = MobileApp.objects.get(slug='smarbiz')
          release = Release.objects.get(app=app, version_name='1.0.0', build_number=2)
          build = Build.objects.get(release=release, platform='ios')
          if build.status != 'succeeded':
              raise SystemExit(f'iOS Build 2 is not succeeded in Publisher: {build.status!r}')
          if not build.external_build_id:
              raise SystemExit('iOS Build 2 has no App Store Connect build id.')

          client = AppleStoreClient(app.apple_account)
          apple_app = client.find_app(app.bundle_id)
          version = client.ensure_version(apple_app['id'], '1.0.0')
          version_id = str(version['id'])

          remote_build = client.request(
              'GET',
              f'/builds/{build.external_build_id}?fields[builds]=version,processingState,usesNonExemptEncryption',
          ).get('data') or {}
          processing_state = remote_build.get('attributes', {}).get('processingState')
          if processing_state != 'VALID':
              raise SystemExit(f'App Store build 2 is not VALID: {processing_state!r}')
          print('apple_build_id=' + str(build.external_build_id))
          print('processing_state=VALID')

          attached = client.request('GET', f'/appStoreVersions/{version_id}/build').get('data') or {}
          if str(attached.get('id')) != str(build.external_build_id):
              client.attach_build(version_id, build.external_build_id)
              print('build_reattached=true')
          else:
              print('build_already_attached=true')

          client.set_review_details(version_id, app, contact=apple_review_contact(app) or None)
          detail = client.request('GET', f'/appStoreVersions/{version_id}/appStoreReviewDetail').get('data') or {}
          if detail:
              current_notes = (detail.get('attributes', {}).get('notes') or '').strip()
              fix_notes = (
                  'Guideline 4 iPad resubmission (Aug 22): The layout issue reported on iPad Air 11-inch (M3) running iPadOS 26.6 has been fixed. '
                  'The previous iOS responsive hardening applied only to phone widths. It now covers common iPad widths through 1180 CSS px. '
                  'Form controls render at 16px on iPad to prevent WebKit focus auto-zoom; the onboarding shell, header, conversation area and footer are constrained to the viewport; '
                  'horizontal overflow is blocked; and the long German primary action can shrink/wrap without being clipped. '
                  'The corrected hosted Smarbiz UI is live at https://smarbiz.sbs and is the interface loaded by this submitted Build 2. '
                  'Please retest the onboarding flow on the same iPad Air 11-inch (M3) review device.'
              )
              notes = current_notes if fix_notes in current_notes else (current_notes + '\n\n' + fix_notes).strip()
              body = {
                  'data': {
                      'type': 'appStoreReviewDetails',
                      'id': detail['id'],
                      'attributes': {'notes': notes},
                  }
              }
              client.request('PATCH', f"/appStoreReviewDetails/{detail['id']}", data=json.dumps(body))
              print('review_notes_updated=true')

          original = client.request('GET', f'/reviewSubmissions/{ORIGINAL_SUBMISSION_ID}').get('data') or {}
          if str(original.get('id')) != ORIGINAL_SUBMISSION_ID:
              raise SystemExit('The original Smarbiz review submission could not be loaded.')
          original_state = original.get('attributes', {}).get('state')
          print('original_submission_state_before=' + str(original_state))

          items = client.list_review_submission_items(ORIGINAL_SUBMISSION_ID)
          item = next((i for i in items if client._item_targets_version(i, version_id)), None)
          if not item:
              raise SystemExit('The original review submission no longer contains Smarbiz version 1.0.0.')
          item_state = item.get('attributes', {}).get('state')
          print('original_item_id=' + str(item['id']))
          print('original_item_state_before=' + str(item_state))

          if original_state in {'WAITING_FOR_REVIEW', 'IN_REVIEW'}:
              final_state = original_state
              print('already_submitted=true')
          else:
              if item_state == 'REJECTED':
                  resolve_body = {
                      'data': {
                          'type': 'reviewSubmissionItems',
                          'id': item['id'],
                          'attributes': {'resolved': True},
                      }
                  }
                  client.request(
                      'PATCH',
                      f"/reviewSubmissionItems/{item['id']}",
                      data=json.dumps(resolve_body),
                  )
                  print('rejected_item_resolved=true')
                  time.sleep(2)

              submit_body = {
                  'data': {
                      'type': 'reviewSubmissions',
                      'id': ORIGINAL_SUBMISSION_ID,
                      'attributes': {'submitted': True},
                  }
              }
              client.request(
                  'PATCH',
                  f'/reviewSubmissions/{ORIGINAL_SUBMISSION_ID}',
                  data=json.dumps(submit_body),
              )
              print('original_submission_resubmitted=true')

              final_state = None
              for attempt in range(15):
                  current = client.request('GET', f'/reviewSubmissions/{ORIGINAL_SUBMISSION_ID}').get('data') or {}
                  final_state = current.get('attributes', {}).get('state')
                  print(f'poll_{attempt + 1}_state=' + str(final_state))
                  if final_state in {'WAITING_FOR_REVIEW', 'IN_REVIEW'}:
                      break
                  time.sleep(2)
              if final_state not in {'WAITING_FOR_REVIEW', 'IN_REVIEW'}:
                  raise SystemExit(f'Smarbiz did not re-enter the App Store review queue; state={final_state!r}')

          attached = client.request('GET', f'/appStoreVersions/{version_id}/build').get('data') or {}
          if str(attached.get('id')) != str(build.external_build_id):
              raise SystemExit(f"Wrong build attached after resubmission: {attached.get('id')} != {build.external_build_id}")

          Submission.objects.update_or_create(
              app=app,
              release=release,
              platform='ios',
              defaults={
                  'state': 'in_review',
                  'external_id': ORIGINAL_SUBMISSION_ID,
                  'submitted_at': timezone.now(),
                  'last_error': '',
                  'raw': {
                      'submission_id': ORIGINAL_SUBMISSION_ID,
                      'review_state': final_state,
                      'build_number': 2,
                      'apple_build_id': str(build.external_build_id),
                      'guideline_4_ipad_layout_fix': True,
                      'review_device': 'iPad Air 11-inch (M3)',
                      'review_os': 'iPadOS 26.6',
                      'same_binary_hosted_ui_fix': True,
                      'resubmitted_original_review': True,
                  },
              },
          )
          release.status = 'in_review'
          release.save(update_fields=['status', 'updated_at'])

          print('attached_build=' + str(attached.get('id')))
          print('review_submission_id=' + ORIGINAL_SUBMISSION_ID)
          print('review_state=' + str(final_state))
          print('SMARBIZ_IPAD_APPLE_RESUBMIT=VERIFIED')
          PY

      - name: Mark resubmission success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$SHA" \
            -d '{"state":"success","context":"smarbiz/ipad-app-review","description":"iPad fix live; original review resubmitted"}' >/dev/null

      - name: Mark resubmission failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          curl --silent --show-error -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$SHA" \
            -d '{"state":"failure","context":"smarbiz/ipad-app-review","description":"iPad fix/resubmission verification failed"}' >/dev/null || true
