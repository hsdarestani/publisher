name: A+ Studio Build 6 Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/a-studio-build6-release.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: a-studio-build6-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    env:
      APP_VERSION: 1.0.0
      BUILD_NUMBER: '6'
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null

      - name: Wait for Publisher health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 30 --retry-all-errors --retry-delay 5 \
            --connect-timeout 10 --max-time 20 \
            https://publisher.smarbiz.sbs/healthz/ >/dev/null

      - name: Queue signed Android and iOS Build 6
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$PASS"
          PORT="${SSH_PORT:-22}"
          SSH=(sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST")

          "${SSH[@]}" "cd /opt/aplus-publisher && docker compose exec -T web python manage.py recover_a_studio_jobs --app-version '$APP_VERSION' --build-number '$BUILD_NUMBER' --stale-after-minutes 10" || true
          "${SSH[@]}" "cd /opt/aplus-publisher && docker compose exec -T web python manage.py bootstrap_a_studio --app-version '$APP_VERSION' --build-number '$BUILD_NUMBER' --queue"
          "${SSH[@]}" "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell -c \"from apps.publisher.models import MobileApp,Release; a=MobileApp.objects.get(slug='a-studio'); r=Release.objects.get(app=a,version_name='$APP_VERSION',build_number=$BUILD_NUMBER); note='Code Agent V3, echter Code-Workspace, IDE-Vorschau, Versionsverlauf und Stabilitätsverbesserungen.'; r.release_notes=note; r.save(update_fields=['release_notes','updated_at']); [setattr(l,'release_notes',note) or l.save(update_fields=['release_notes','updated_at']) for l in a.localizations.all()]; print('release_notes_updated=true')\""

      - name: Wake Android and iOS build agents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run cloud-linux.yml --repo "$GITHUB_REPOSITORY"
          gh workflow run cloud-macos.yml --repo "$GITHUB_REPOSITORY"

      - name: Wait for both Build 6 artifacts
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$PASS"
          PORT="${SSH_PORT:-22}"
          SSH=(sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST")
          for i in $(seq 1 90); do
            OUT="$("${SSH[@]}" "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell -c \"from apps.publisher.models import MobileApp,Release; a=MobileApp.objects.get(slug='a-studio'); r=Release.objects.get(app=a,version_name='$APP_VERSION',build_number=$BUILD_NUMBER); print('STATE|'+'|'.join(f'{b.platform}:{b.status}:{bool(b.artifact)}' for b in r.builds.order_by('platform'))); [print('FAILED|'+j.type+'|'+(j.error or '')[-1500:]) for j in r.jobs.filter(status='failed').order_by('-created_at')[:5]]\"" | grep -E '^(STATE|FAILED)\|' || true)"
            printf '%s\n' "$OUT"
            if printf '%s\n' "$OUT" | grep -q '^FAILED|'; then
              echo '::error::A+ Studio Build 6 has a failed Publisher job.'
              exit 2
            fi
            STATE="$(printf '%s\n' "$OUT" | grep '^STATE|' | tail -1)"
            if printf '%s' "$STATE" | grep -q 'android:succeeded:True' && printf '%s' "$STATE" | grep -q 'ios:succeeded:True'; then
              echo 'Both Build 6 artifacts succeeded.'
              exit 0
            fi
            sleep 20
          done
          echo '::error::Timed out waiting for both Build 6 artifacts.'
          exit 2

      - name: Queue Google production upload and Apple binary upload
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$PASS"
          PORT="${SSH_PORT:-22}"
          sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py bootstrap_a_studio --app-version '$APP_VERSION' --build-number '$BUILD_NUMBER' --publish"

      - name: Wake macOS upload agent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run cloud-macos.yml --repo "$GITHUB_REPOSITORY"

      - name: Wait for Google publish and processed Apple Build 6
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$PASS"
          PORT="${SSH_PORT:-22}"
          SSH=(sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST")
          for i in $(seq 1 120); do
            OUT="$("${SSH[@]}" "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell -c \"from apps.publisher.models import MobileApp,Release; a=MobileApp.objects.get(slug='a-studio'); r=Release.objects.get(app=a,version_name='$APP_VERSION',build_number=$BUILD_NUMBER); ios=r.builds.get(platform='ios'); gj=r.jobs.filter(type='upload_google').order_by('-created_at').first(); aj=r.jobs.filter(type='upload_apple').order_by('-created_at').first(); print('STORE|google='+(gj.status if gj else 'missing')+'|apple_upload='+(aj.status if aj else 'missing')+'|apple_id='+(ios.external_build_id or '')); [print('FAILED|'+j.type+'|'+(j.error or '')[-1500:]) for j in r.jobs.filter(status='failed').order_by('-created_at')[:5]]\"" | grep -E '^(STORE|FAILED)\|' || true)"
            printf '%s\n' "$OUT"
            if printf '%s\n' "$OUT" | grep -q '^FAILED|'; then
              echo '::error::A store upload job failed.'
              exit 2
            fi
            STATE="$(printf '%s\n' "$OUT" | grep '^STORE|' | tail -1)"
            APPLE_ID="$(printf '%s' "$STATE" | sed -n 's/.*|apple_id=\([^|]*\).*/\1/p')"
            if printf '%s' "$STATE" | grep -q 'google=succeeded' && printf '%s' "$STATE" | grep -q 'apple_upload=succeeded' && [ -n "$APPLE_ID" ]; then
              echo "Google uploaded and Apple Build 6 processed: $APPLE_ID"
              exit 0
            fi
            sleep 20
          done
          echo '::error::Timed out waiting for store uploads.'
          exit 2

      - name: Verify Google Play production is Build 6
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$PASS"
          PORT="${SSH_PORT:-22}"
          sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell" <<'PY'
          from apps.integrations.google_play import GooglePlayClient
          from apps.publisher.models import MobileApp

          app = MobileApp.objects.get(slug='a-studio')
          client = GooglePlayClient(app.google_account)
          edit = client._open_edit(app.package_name)
          try:
              track = client._edit_request(
                  edit,
                  'GET',
                  f'/applications/{client._q(app.package_name)}/edits/{edit.edit_id}/tracks/production',
              )
              releases = track.get('releases') or []
              match = next((r for r in releases if '6' in [str(v) for v in r.get('versionCodes', [])]), None)
              if not match:
                  raise SystemExit('Google Production does not contain versionCode 6.')
              if match.get('status') != 'completed':
                  raise SystemExit(f"Google versionCode 6 is not completed: {match.get('status')}")
              print('GOOGLE_PRODUCTION|versionCode=6|status=completed')
          finally:
              client._safe_delete_edit(edit)
          PY

      - name: Replace Apple Build 5 review with processed Build 6 and resubmit
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$PASS"
          PORT="${SSH_PORT:-22}"
          sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell" <<'PY'
          import time
          from django.utils import timezone
          from apps.integrations.apple_store import AppleStoreClient
          from apps.publisher.models import MobileApp, Release, Submission
          from apps.publisher.review_contacts import apple_review_contact

          app = MobileApp.objects.get(slug='a-studio')
          release = Release.objects.get(app=app, version_name='1.0.0', build_number=6)
          build = release.builds.get(platform='ios')
          if build.status != 'succeeded' or not build.external_build_id:
              raise SystemExit(f'Build 6 iOS is not ready: {build.status} / {build.external_build_id!r}')

          client = AppleStoreClient(app.apple_account)
          record = client.find_app(app.bundle_id)
          version = next(
              (v for v in client.list_versions(record['id']) if v.get('attributes', {}).get('versionString') == '1.0.0'),
              None,
          )
          if not version:
              raise SystemExit('Apple version 1.0.0 not found.')
          version_id = str(version['id'])

          remote = client.request(
              'GET',
              f'/builds/{build.external_build_id}?fields[builds]=version,processingState,usesNonExemptEncryption',
          ).get('data') or {}
          attrs = remote.get('attributes', {})
          if attrs.get('processingState') != 'VALID':
              raise SystemExit(f"Apple Build 6 is not VALID: {attrs.get('processingState')}")
          if str(attrs.get('version')) != '6':
              raise SystemExit(f"Apple returned the wrong build number: {attrs.get('version')}")
          if attrs.get('usesNonExemptEncryption') is None:
              client.set_build_uses_non_exempt_encryption(build.external_build_id, False)
              remote = client.request(
                  'GET',
                  f'/builds/{build.external_build_id}?fields[builds]=version,processingState,usesNonExemptEncryption',
              ).get('data') or {}
              attrs = remote.get('attributes', {})
          if attrs.get('usesNonExemptEncryption') is not False:
              raise SystemExit(f"Unexpected export compliance value: {attrs.get('usesNonExemptEncryption')!r}")

          active = []
          for state in ('IN_REVIEW', 'WAITING_FOR_REVIEW'):
              for submission in client.list_review_submissions(record['id'], state):
                  item, _ = client._review_submission_matches(submission, version_id)
                  if item:
                      active.append((state, submission, item))

          for state, submission, _item in active:
              print(f'cancelling_review={submission["id"]}|state={state}')
              client.cancel_review_submission(submission['id'])

          if active:
              for _attempt in range(30):
                  still_active = False
                  for state in ('IN_REVIEW', 'WAITING_FOR_REVIEW'):
                      for submission in client.list_review_submissions(record['id'], state):
                          item, _ = client._review_submission_matches(submission, version_id)
                          if item:
                              still_active = True
                  if not still_active:
                      break
                  time.sleep(2)
              else:
                  raise SystemExit('Apple review did not leave the active state after cancellation.')

          client.attach_build(version_id, build.external_build_id)
          client.set_review_details(version_id, app, contact=apple_review_contact(app) or None)
          for loc in app.localizations.all():
              client.set_localization(version_id, loc)

          result = client.submit_version(record['id'], version_id)
          final = None
          for _attempt in range(30):
              for state in ('WAITING_FOR_REVIEW', 'IN_REVIEW'):
                  for submission in client.list_review_submissions(record['id'], state):
                      item, _ = client._review_submission_matches(submission, version_id)
                      if item:
                          final = (state, submission, item)
                          break
                  if final:
                      break
              if final:
                  break
              time.sleep(2)
          if not final:
              raise SystemExit('Apple did not expose Build 6 as WAITING_FOR_REVIEW or IN_REVIEW.')

          attached = client.request('GET', f'/appStoreVersions/{version_id}/build').get('data') or {}
          if str(attached.get('id')) != str(build.external_build_id):
              raise SystemExit(f"Wrong Apple build attached after resubmission: {attached.get('id')}")

          state, submission, item = final
          Submission.objects.update_or_create(
              app=app,
              release=release,
              platform='ios',
              defaults={
                  'state': 'in_review',
                  'external_id': submission['id'],
                  'submitted_at': timezone.now(),
                  'last_error': '',
                  'raw': {
                      'submission': submission,
                      'item': item,
                      'replaced_build5_review': bool(active),
                      'build_number': 6,
                      'usesNonExemptEncryption': False,
                  },
              },
          )
          for old in Submission.objects.filter(app=app, platform='ios', release__build_number__lt=6, state='in_review'):
              old.state = 'replaced_by_build_6'
              old.save(update_fields=['state','updated_at'])
          for old_release in Release.objects.filter(app=app, version_name='1.0.0', build_number__lt=6, status='in_review'):
              old_release.status = 'uploaded'
              old_release.save(update_fields=['status','updated_at'])
          release.status = 'in_review'
          release.save(update_fields=['status','updated_at'])

          print('APPLE_REVIEW|build=6|state=' + state + '|submission=' + str(submission['id']))
          print('APPLE_ATTACHED_BUILD=' + str(attached.get('id')))
          PY

      - name: Final Publisher and store verification
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$PASS"
          PORT="${SSH_PORT:-22}"
          sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell -c \"from apps.publisher.models import MobileApp,Release; a=MobileApp.objects.get(slug='a-studio'); r=Release.objects.get(app=a,version_name='1.0.0',build_number=6); print('FINAL|release='+r.status); [print('BUILD|'+b.platform+'|'+b.status+'|artifact='+str(bool(b.artifact))+'|external='+str(b.external_build_id or '')) for b in r.builds.order_by('platform')]; [print('SUBMISSION|'+s.platform+'|'+s.state+'|'+str(s.external_id or '')) for s in r.submissions.order_by('platform')]\""

      - name: Verify public A+ Studio health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 https://studio.aplus-solution.de/health/ >/dev/null
          curl --fail --silent --show-error --location --max-time 30 https://studio.aplus-solution.de/api/mobile/config/ >/dev/null
          echo 'A+ Studio production health verified.'
