services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-publisher}
      POSTGRES_USER: ${POSTGRES_USER:-publisher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-publisher}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-publisher} -d ${POSTGRES_DB:-publisher}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-publisher}:${POSTGRES_PASSWORD:-publisher}@db:5432/${POSTGRES_DB:-publisher}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz/"]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    build: .
    restart: unless-stopped
    command: celery -A config worker -l info --concurrency=2
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-publisher}:${POSTGRES_PASSWORD:-publisher}@db:5432/${POSTGRES_DB:-publisher}
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "0"
    volumes:
      - media_data:/app/media
    depends_on: [web, redis]

  beat:
    build: .
    restart: unless-stopped
    command: celery -A config beat -l info
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-publisher}:${POSTGRES_PASSWORD:-publisher}@db:5432/${POSTGRES_DB:-publisher}
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "0"
    depends_on: [web, redis]

  android-agent:
    build:
      context: .
      dockerfile: Dockerfile.android-agent
    restart: unless-stopped
    env_file: .env
    environment:
      PUBLISHER_URL: http://web:8000
      PUBLISHER_AGENT_TOKEN: ${ANDROID_AGENT_TOKEN}
      PUBLISHER_CONTINUOUS: "1"
      PUBLISHER_POLL_INTERVAL: "5"
      PUBLISHER_MAX_JOBS: "1000000"
      PUBLISHER_WORK_ROOT: /work
      PUB_CACHE: /cache/pub
      GRADLE_USER_HOME: /cache/gradle
    volumes:
      - android_agent_work:/work
      - android_agent_pub_cache:/cache/pub
      - android_agent_gradle_cache:/cache/gradle
    depends_on:
      web:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:-publisher.smarbiz.sbs}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - media_data:/srv/media:ro
    depends_on: [web]

volumes:
  postgres_data:
  redis_data:
  media_data:
  android_agent_work:
  android_agent_pub_cache:
  android_agent_gradle_cache:
  caddy_data:
  caddy_config:
