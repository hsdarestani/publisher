name: TaskService cgroup safety readiness (read-only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/taskservice-cgroup-capacity-20261121.yml']
permissions: { contents: read }
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - name: Read cgroup safety metadata without host changes
        shell: bash
        env:
          HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$KEY"
          port="$SSH_PORT"; if [ -z "$port" ]; then port=22; fi
          address="$(getent ahostsv4 "$HOST" | awk '{print $1}' | sort -u)"
          expected="$(getent ahostsv4 reimflow.smarbiz.sbs | awk '{print $1}' | sort -u)"
          test -n "$address" && test "$address" = "$expected"
          curl --silent --show-error --fail --noproxy '*' --proto '=https' --connect-timeout 5 --max-time 12 --resolve "reimflow.smarbiz.sbs:443:$address" -o /dev/null https://reimflow.smarbiz.sbs/
          umask 077
          tmp="$(mktemp -d "$RUNNER_TEMP/publisher-cgroup.XXXXXXXX")"
          trap 'if [ -n "$SSH_AGENT_PID" ]; then ssh-agent -k >/dev/null 2>&1 || true; fi; rm -rf "$tmp"' EXIT
          printf '%s\n' "$KEY" | tr -d '\r' > "$tmp/key"
          chmod 600 "$tmp/key"; unset KEY
          if [ -n "$PASSPHRASE" ]; then
            eval "$(ssh-agent -s)" >/dev/null
            printf '%s\n' '#!/bin/sh' 'printf "%s\n" "$PASSPHRASE"' > "$tmp/askpass"
            chmod 700 "$tmp/askpass"
            SSH_ASKPASS="$tmp/askpass" SSH_ASKPASS_REQUIRE=force setsid ssh-add "$tmp/key" </dev/null
          fi
          unset PASSPHRASE
          ssh-keyscan -T 8 -t ed25519 -p "$port" "$address" > "$tmp/scanned" 2>/dev/null
          while read -r _ keytype keydata; do
            [ "$keytype" = ssh-ed25519 ] || continue
            printf 'publisher-strato %s %s\n' "$keytype" "$keydata" > "$tmp/candidate"
            actual="$(ssh-keygen -E sha256 -lf "$tmp/candidate" | awk '{print $2}')"
            if [ "$actual" = 'SHA256:G5zZTiYxEm6Hm2v/CYFe/4e7K3YwRCbOkABFBBy93vg' ]; then mv "$tmp/candidate" "$tmp/known_hosts"; break; fi
          done < "$tmp/scanned"
          test -s "$tmp/known_hosts"
          ssh -i "$tmp/key" -o IdentitiesOnly=yes -o BatchMode=yes -o ForwardAgent=no -o StrictHostKeyChecking=yes -o HostKeyAlias=publisher-strato -o HostKeyAlgorithms=ssh-ed25519 -o UserKnownHostsFile="$tmp/known_hosts" -o GlobalKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=10 -p "$port" root@"$address" 'bash -se' <<'REMOTE'
          set -euo pipefail
          printf 'UTC='; date -u '+%Y-%m-%dT%H:%M:%SZ'
          printf 'CGROUP_DRIVER='; docker info --format '{{.CgroupDriver}}'
          printf 'CGROUP_VERSION='; docker info --format '{{.CgroupVersion}}'
          printf 'CGROUP_FSTYPE='; stat -fc '%T' /sys/fs/cgroup
          printf 'DOCKER_SYSTEMD_DELEGATE='; systemctl show docker.service -p Delegate --value
          printf 'DOCKER_SYSTEMD_CGROUP='; systemctl show docker.service -p ControlGroup --value
          printf 'SYSTEMD_VERSION='; systemctl --version | head -1
          printf 'TASKSERVICE_DIR_EXISTS='; if test -d /opt/taskservice; then echo yes; else echo no; fi
          printf 'MEM_AVAILABLE_KIB='; awk '/^MemAvailable:/ {print $2}' /proc/meminfo
          printf 'SWAP_TOTAL_KIB='; awk '/^SwapTotal:/ {print $2}' /proc/meminfo
          printf 'DISK_AVAIL_KIB='; df -Pk /opt | awk 'NR==2 {print $4}'
          printf 'PUBLISHER_RUNNING='; cd /opt/aplus-publisher && docker compose ps -q web | xargs -r docker inspect -f '{{.State.Running}}'
          printf '\n=== TASKSERVICE PILOT STATE ===\n'
          if [ -f /opt/taskservice/compose.yaml ]; then
            cd /opt/taskservice
            docker compose -f compose.yaml -f compose-lowmem.experimental.yaml -p taskservice ps -a
            printf 'TASKSERVICE_SECRETS_PRESENT='
            if [ -f secrets/db.env ] && [ -f secrets/migrate.env ] && [ -f secrets/api.env ] && [ -f secrets/worker.env ]; then echo yes; else echo no; fi
            printf 'TASKSERVICE_SLICE_MEMORY_MAX='; systemctl show taskservice.slice -p MemoryMax --value
            printf 'TASKSERVICE_SCHEMA_EXISTS='
            docker compose -f compose.yaml -f compose-lowmem.experimental.yaml -p taskservice exec -T db psql -X -U postgres -d taskservice -At -c "SELECT to_regclass('ts.tenants') IS NOT NULL" </dev/null || echo unavailable
            printf 'TASKSERVICE_MIGRATION_TABLE_EXISTS='
            docker compose -f compose.yaml -f compose-lowmem.experimental.yaml -p taskservice exec -T db psql -X -U postgres -d taskservice -At -c "SELECT to_regclass('public.__EFMigrationsHistory') IS NOT NULL" </dev/null || echo unavailable
            printf 'TASKSERVICE_OOM='
            docker inspect taskservice-db-1 -f '{{.State.OOMKilled}}' || true
          fi
            printf "\n=== TaskService live runtime (read-only) ===\n"
            docker stats --no-stream --format "MEM {{.Name}} {{.MemUsage}} {{.CPUPerc}}" | grep -E "taskservice-|aplus-publisher-" || true
            for svc in taskservice-db-1 taskservice-api-1 taskservice-worker-1 taskservice-scanner-1; do
              printf "STATE_%s=" "$svc"
              docker inspect "$svc" --format '{{.State.Running}}|{{.State.Status}}|oom={{.State.OOMKilled}}|restarts={{.RestartCount}}' || true
            done
            printf "PILOT_API_HEALTH_HTTP="
            curl -sS --max-time 5 -o /dev/null -w "%{http_code}\n" -H "Host: localhost" http://127.0.0.1:18081/health/live || true
            printf "PILOT_READY_HTTP="
            curl -sS --max-time 5 -o /dev/null -w "%{http_code}\n" -H "Host: localhost" http://127.0.0.1:18081/health/ready || true
            printf "SCANNER_PING="
            docker exec taskservice-scanner-1 sh -c 'printf "PING\n" | nc -w 3 127.0.0.1 3310' </dev/null || true
            printf "TASKSERVICE_SLICE_CGROUP="
            systemctl show taskservice.slice -p ControlGroup --value
            printf "HOST_AVAILABLE_AT_END_KIB="
            awk '/^MemAvailable:/ {print $2}' /proc/meminfo
            cd /opt/aplus-publisher
            printf "PUBLISHER_HEALTH_HTTP="
            docker compose exec -T web curl -sS -o /dev/null -w "%{http_code}\n" --max-time 6 http://127.0.0.1:8000/healthz/ </dev/null
          REMOTE
