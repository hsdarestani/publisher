name: A+ Esthetic Apple review recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/a-esthetic-submit-status.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - name: Repair Apple review association and submit latest build
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          PY_CODE=$(cat <<'PY'
          import json
          import time
          from apps.integrations.apple_store import AppleStoreClient
          from apps.publisher.models import MobileApp, Release, Submission
          from apps.publisher.tasks import enqueue_job

          SOURCE_COMMIT = 'd5ef2cd6bdf40d85c47aba8e73a99fd6bc0b5c4c'
          ACTIVE_REVIEW_STATES = {'WAITING_FOR_REVIEW', 'IN_REVIEW'}

          app = MobileApp.objects.get(slug='a-esthetic')
          release = Release.objects.filter(app=app, source_commit=SOURCE_COMMIT).order_by('-created_at').first()
          if not release:
              raise SystemExit('latest_release_missing')
          ios = release.builds.get(platform='ios')
          if ios.status != 'succeeded' or not ios.external_build_id:
              raise SystemExit(f'ios_build_not_ready status={ios.status} external={bool(ios.external_build_id)}')
          if not app.apple_account or not app.apple_account.configured:
              raise SystemExit('apple_account_missing')

          client = AppleStoreClient(app.apple_account)
          record = client.find_app(app.bundle_id)
          app_id = record['id']
          target = client.find_editable_version(app_id, release.version_name)
          if not target:
              target = next(
                  (v for v in client.list_versions(app_id) if v.get('attributes',{}).get('versionString') == release.version_name),
                  None,
              )
          if not target:
              raise SystemExit(f'apple_target_version_missing version={release.version_name}')
          target_id = target['id']
          target_state = target.get('attributes',{}).get('appStoreState') or target.get('attributes',{}).get('appVersionState') or ''
          print(f'APPLE_TARGET id={target_id} version={release.version_name} state={target_state} build={ios.external_build_id}')

          def all_reviews():
              return client.request('GET', f'/apps/{app_id}/reviewSubmissions?limit=200').get('data', [])

          def review_state(review):
              attrs = review.get('attributes', {})
              return attrs.get('state') or attrs.get('reviewSubmissionState') or ''

          def review_canceled(review):
              attrs = review.get('attributes', {})
              return bool(attrs.get('canceled'))

          def review_items(review):
              return client.list_review_submission_items(review['id'])

          def target_items(review):
              return [item for item in review_items(review) if client._item_targets_version(item, target_id)]

          reviews = all_reviews()
          for review in reviews:
              items = review_items(review)
              targets = [item['id'] for item in items if client._item_targets_version(item, target_id)]
              print(
                  f'APPLE_REVIEW id={review["id"]} state={review_state(review) or "-"} '
                  f'canceled={review_canceled(review)} items={len(items)} target_items={",".join(targets) or "-"}'
              )

          # If the target is genuinely already active for review, just mirror that
          # state into Publisher and finish. This is safe/idempotent.
          for review in reviews:
              if review_state(review) in ACTIVE_REVIEW_STATES and not review_canceled(review) and target_items(review):
                  Submission.objects.update_or_create(
                      app=app,
                      release=release,
                      platform='ios',
                      defaults={'state': 'in_review', 'external_id': review['id']},
                  )
                  release.status = 'in_review'
                  release.save(update_fields=['status','updated_at'])
                  android = Submission.objects.filter(release=release, platform='android').first()
                  print(f'FINAL already_active android={android.state if android else "missing"} ios=in_review version={release.version_name} build={release.build_number}')
                  raise SystemExit(0)

          # Detach the target from any canceled/non-active submission. Apple can
          # leave the ReviewSubmissionItem linked after cancellation, which blocks
          # adding the same App Store version to the next draft.
          stale = []
          for review in reviews:
              state = review_state(review)
              canceled = review_canceled(review)
              for item in target_items(review):
                  if canceled or state not in {'READY_FOR_REVIEW'}:
                      stale.append((review, item))

          for review, item in stale:
              print(
                  f'APPLE_STALE_ITEM delete={item["id"]} parent={review["id"]} '
                  f'state={review_state(review) or "-"} canceled={review_canceled(review)}'
              )
              client.request('DELETE', f'/reviewSubmissionItems/{item["id"]}')

          if stale:
              deadline = time.time() + 120
              while time.time() < deadline:
                  lingering = []
                  for review in all_reviews():
                      state = review_state(review)
                      canceled = review_canceled(review)
                      for item in target_items(review):
                          if canceled or state not in {'READY_FOR_REVIEW'}:
                              lingering.append((review['id'], item['id'], state, canceled))
                  if not lingering:
                      print('APPLE_STALE_ASSOCIATION=cleared')
                      break
                  print(f'APPLE_STALE_ASSOCIATION=waiting count={len(lingering)}')
                  time.sleep(5)
              else:
                  raise SystemExit('apple_stale_review_item_did_not_detach')

          reviews = all_reviews()
          ready_with_target = None
          empty_ready = None
          for review in reviews:
              if review_state(review) != 'READY_FOR_REVIEW' or review_canceled(review):
                  continue
              items = review_items(review)
              if any(client._item_targets_version(item, target_id) for item in items):
                  ready_with_target = review
                  break
              version_items = [
                  item for item in items
                  if (item.get('relationships',{}).get('appStoreVersion',{}).get('data') or {}).get('id')
              ]
              if not version_items and empty_ready is None:
                  empty_ready = review

          if ready_with_target:
              print(f'APPLE_READY_DRAFT_MATCH id={ready_with_target["id"]}')
          else:
              if empty_ready is None:
                  body = {'data': {'type': 'reviewSubmissions', 'attributes': {}, 'relationships': {
                      'app': {'data': {'type': 'apps', 'id': app_id}}
                  }}}
                  empty_ready = client.request('POST', '/reviewSubmissions', data=json.dumps(body))['data']
                  print(f'APPLE_READY_DRAFT_CREATED id={empty_ready["id"]}')
              item_body = {'data': {'type': 'reviewSubmissionItems', 'relationships': {
                  'reviewSubmission': {'data': {'type': 'reviewSubmissions', 'id': empty_ready['id']}},
                  'appStoreVersion': {'data': {'type': 'appStoreVersions', 'id': target_id}},
              }}}
              new_item = client.request('POST', '/reviewSubmissionItems', data=json.dumps(item_body))['data']
              print(f'APPLE_READY_DRAFT_REUSED id={empty_ready["id"]} item={new_item["id"]}')

          # Failed historical jobs are kept for audit. Queue one clean submission
          # attempt; handle_submit_apple will update metadata, attach Build 6 and
          # reuse the READY_FOR_REVIEW draft that now owns this version.
          active = release.jobs.filter(type='submit_apple', status__in=['queued','running']).first()
          if active:
              job = active
              print(f'APPLE_SUBMIT_JOB_REUSED id={job.id} status={job.status}')
          else:
              job = enqueue_job('submit_apple', app=app, release=release, build=ios)
              print(f'APPLE_SUBMIT_JOB_QUEUED id={job.id}')

          deadline = time.time() + 900
          while time.time() < deadline:
              job.refresh_from_db()
              print(f'APPLE_SUBMIT_JOB_STATE id={job.id} status={job.status} progress={job.progress}')
              if job.status == 'succeeded':
                  break
              if job.status == 'failed':
                  raise SystemExit('apple_submit_failed: ' + (job.error or '')[:1800])
              time.sleep(10)
          if job.status != 'succeeded':
              raise SystemExit(f'apple_submit_timeout status={job.status}')

          sub = Submission.objects.filter(release=release, platform='ios').first()
          if not sub or sub.state != 'in_review':
              raise SystemExit(f'apple_submission_not_in_review state={sub.state if sub else "missing"}')
          android = Submission.objects.filter(release=release, platform='android').first()
          print(f'FINAL android={android.state if android else "missing"} ios={sub.state} version={release.version_name} build={release.build_number}')
          PY
          )
          ENCODED=$(printf '%s' "$PY_CODE" | base64 -w0)
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && printf '%s' '$ENCODED' | base64 -d | docker compose exec -T web python manage.py shell"
