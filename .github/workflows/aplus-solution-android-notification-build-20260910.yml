name: A+ Solution Android Notification Build 2026-09-10

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aplus-solution-android-notification-build-20260910.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  APLUS_COMMIT: '9726a924720901228fadb1103491d01c2753c4bb'

jobs:
  android-only:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    steps:
      - name: Install SSH tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass jq >/dev/null

      - name: Queue Android-only Publisher build
        id: queue
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PASS"
          PORT="${SSH_PORT:-22}"

          OUT=''
          for attempt in $(seq 1 30); do
            if OUT="$(sshpass -p "$PASS" ssh -p "$PORT" -o ConnectTimeout=10 -o StrictHostKeyChecking=no root@"$HOST" \
              "cd /opt/aplus-publisher && docker compose exec -T -e APLUS_COMMIT='$APLUS_COMMIT' web python manage.py shell" <<'PY'
          import json, os, re
          from apps.publisher.models import Build, Job, MobileApp, Release
          from apps.publisher.tasks import enqueue_job

          target_commit=os.environ['APLUS_COMMIT']
          app=MobileApp.objects.get(slug='a-plus-solution')
          assert app.repository_url
          assert app.package_name == 'de.aplussolution.workforce'
          assert hasattr(app, 'android_signing'), 'Android signing is not configured in Publisher.'

          cfg=dict(app.build_config or {})
          cfg['android_command']='bash frontend/scripts/build-publisher-android.sh'
          cfg['android_artifact']='frontend/android/app/build/outputs/bundle/release/*.aab'
          env=dict(cfg.get('env') or {})
          env['VITE_API_URL']='https://app.aplus-solution.de/api'
          cfg['env']=env
          app.build_config=cfg
          app.save(update_fields=['build_config','updated_at'])

          def semver(value):
              nums=[int(x) for x in re.findall(r'\d+', str(value or ''))[:3]]
              while len(nums)<3: nums.append(0)
              return tuple(nums)
          def bump(value):
              major,minor,patch=semver(value)
              return f'{major}.{minor}.{patch+1}'

          release=Release.objects.filter(app=app, source_commit=target_commit).order_by('-created_at').first()
          created=False
          if release is None:
              versions=list(Release.objects.filter(app=app).values_list('version_name', flat=True))
              highest=max(versions, key=semver, default='1.0.0')
              build_number=max(Release.objects.filter(app=app).values_list('build_number', flat=True), default=0)+1
              release=Release.objects.create(
                  app=app,
                  version_name=bump(highest),
                  build_number=build_number,
                  status='building',
                  source_branch='main',
                  source_commit=target_commit,
                  android_track='production',
                  android_rollout=1,
                  ios_release_type='automatic',
                  auto_submit=False,
                  release_notes='Android: eigenes A+ Benachrichtigungssymbol und Signature-Motif für Push-Benachrichtigungen.',
              )
              created=True
          else:
              release.status='building'
              release.source_branch='main'
              release.auto_submit=False
              release.save(update_fields=['status','source_branch','auto_submit','updated_at'])

          build,_=Build.objects.get_or_create(release=release,platform='android')
          active=Job.objects.filter(build=build,type='build_android',status__in=['queued','running']).exists()
          queued_job=None
          if not (build.status=='succeeded' and build.artifact) and not active:
              build.status='queued'
              build.logs=''
              build.finished_at=None
              build.external_build_id=''
              build.metadata={}
              if build.artifact:
                  build.artifact.delete(save=False)
              build.artifact=''
              build.artifact_size=0
              build.artifact_checksum=''
              build.save()
              queued_job=enqueue_job(
                  'build_android', app=app, release=release, build=build,
                  payload={'source':'android-notification-branding-20260910'},
                  agent=True, platform='linux'
              )

          forbidden=Job.objects.filter(release=release,type__in=['build_ios','upload_apple','submit_apple','upload_google','submit_google']).count()
          assert forbidden == 0, 'Android-only release unexpectedly has store/iOS jobs.'
          meta={
              'release_id':str(release.id),
              'version':release.version_name,
              'build_number':release.build_number,
              'source_commit':release.source_commit,
              'build_id':str(build.id),
              'build_status':build.status,
              'job_id':str(queued_job.id) if queued_job else '',
              'created_release':created,
          }
          print('ANDROID_BUILD_META='+json.dumps(meta,separators=(',',':')))
          PY
            )"; then
              break
            fi
            echo "Publisher SSH/API unavailable; retry $attempt/30"
            sleep 10
          done

          META="$(printf '%s\n' "$OUT" | sed -n 's/^ANDROID_BUILD_META=//p' | tail -n 1)"
          test -n "$META"
          printf '%s\n' "$META" | jq .
          echo "release_id=$(printf '%s' "$META" | jq -r '.release_id')" >> "$GITHUB_OUTPUT"
          echo "build_id=$(printf '%s' "$META" | jq -r '.build_id')" >> "$GITHUB_OUTPUT"
          echo "version=$(printf '%s' "$META" | jq -r '.version')" >> "$GITHUB_OUTPUT"
          echo "build_number=$(printf '%s' "$META" | jq -r '.build_number')" >> "$GITHUB_OUTPUT"

      - name: Wake Publisher Linux builder
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'cloud-linux.yml',
              ref: 'main',
            });
            core.info('Publisher Linux cloud builder dispatched.');

      - name: Wait for signed Android AAB
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          BUILD_ID: ${{ steps.queue.outputs.build_id }}
          RELEASE_ID: ${{ steps.queue.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          for i in $(seq 1 240); do
            STATE="$(sshpass -p "$PASS" ssh -p "$PORT" -o ConnectTimeout=10 -o StrictHostKeyChecking=no root@"$HOST" \
              "cd /opt/aplus-publisher && docker compose exec -T -e BUILD_ID='$BUILD_ID' -e RELEASE_ID='$RELEASE_ID' web python manage.py shell" <<'PY' 2>/dev/null || true
          import json, os, re
          from apps.publisher.models import Build, Job, Release
          b=Build.objects.get(id=os.environ['BUILD_ID'])
          r=Release.objects.get(id=os.environ['RELEASE_ID'])
          job=Job.objects.filter(build=b,type='build_android').order_by('-created_at').first()
          forbidden=Job.objects.filter(release=r,type__in=['build_ios','upload_apple','submit_apple','upload_google','submit_google']).count()
          error=re.sub(r'\s+',' ',str(job.error or ''))[:500] if job else ''
          data={
              'build_status':b.status,
              'job_status':job.status if job else '',
              'artifact':bool(b.artifact),
              'artifact_name':b.artifact.name if b.artifact else '',
              'artifact_size':b.artifact_size,
              'checksum':b.artifact_checksum,
              'forbidden_jobs':forbidden,
              'error':error,
          }
          print('ANDROID_BUILD_STATE='+json.dumps(data,separators=(',',':')))
          PY
            )"
            JSON="$(printf '%s\n' "$STATE" | sed -n 's/^ANDROID_BUILD_STATE=//p' | tail -n 1)"
            if [ -z "$JSON" ]; then
              echo "Publisher temporarily unavailable ($i/240)"
              sleep 15
              continue
            fi
            printf '%s\n' "$JSON" | jq .
            test "$(printf '%s' "$JSON" | jq -r '.forbidden_jobs')" = '0'
            STATUS="$(printf '%s' "$JSON" | jq -r '.build_status')"
            JOB_STATUS="$(printf '%s' "$JSON" | jq -r '.job_status')"
            if [ "$STATUS" = 'succeeded' ] && [ "$(printf '%s' "$JSON" | jq -r '.artifact')" = 'true' ]; then
              echo 'Signed Android AAB created successfully. No iOS/store-submit jobs were created.'
              exit 0
            fi
            if [ "$STATUS" = 'failed' ] || [ "$JOB_STATUS" = 'failed' ]; then
              echo "Android Publisher build failed: $(printf '%s' "$JSON" | jq -r '.error')" >&2
              exit 1
            fi
            sleep 15
          done
          echo 'Timed out waiting for Publisher Android build.' >&2
          exit 1

      - name: Summary
        run: |
          echo "### A+ Solution Android-only Publisher build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: \`$APLUS_COMMIT\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: **${{ steps.queue.outputs.version }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: **${{ steps.queue.outputs.build_number }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Android signed AAB: **succeeded**" >> "$GITHUB_STEP_SUMMARY"
          echo "- iOS build: **not queued**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Store submission: **not queued**" >> "$GITHUB_STEP_SUMMARY"
