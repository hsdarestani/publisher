name: Build A+ Esthetic 1.0.37 Build 43

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/a-esthetic-1-0-37-build43-hero-admin-20261017.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: a-esthetic-store-submit-build38
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    env:
      SOURCE_COMMIT: 29baafa43aa24117c039e0df519bb714ea0aa7c4
      VERSION_NAME: 1.0.37
      BUILD_NUMBER: '43'
    steps:
      - name: Prepare current Publisher SSH identity
        env:
          HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$SSH_PRIVATE_KEY"
          PORT="${SSH_PORT:-22}"
          umask 077
          KEY="$RUNNER_TEMP/a-esthetic-release-43-key"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$KEY"
          chmod 600 "$KEY"
          if [ -n "$SSH_KEY_PASSPHRASE" ]; then
            eval "$(ssh-agent -s)" >/dev/null
            ASKPASS="$RUNNER_TEMP/a-esthetic-release-43-askpass"
            printf '%s\n' '#!/bin/sh' 'printf "%s" "$SSH_KEY_PASSPHRASE"' > "$ASKPASS"
            chmod 700 "$ASKPASS"
            DISPLAY=:0 SSH_ASKPASS="$ASKPASS" SSH_ASKPASS_REQUIRE=force setsid ssh-add "$KEY" </dev/null
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          fi
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -T 10 -p "$PORT" -H "$HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          test -s "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          if [ -n "$SSH_HOST_FINGERPRINT" ]; then
            ssh-keygen -lf "$HOME/.ssh/known_hosts" | grep -F -- "$SSH_HOST_FINGERPRINT" >/dev/null
          fi
          echo "PUBLISHER_SSH_KEY_PATH=$KEY" >> "$GITHUB_ENV"
      - name: Queue Build 43 Android and iOS
        env:
          HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          # Wait for web to become healthy if the Publisher deploy restarts it.
          for attempt in $(seq 1 60); do
            if ssh -i "$PUBLISHER_SSH_KEY_PATH" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$PORT" root@"$HOST" \
                "cd /opt/aplus-publisher && docker compose exec -T web python -c 'print(\"PUBLISHER_READY\")'" 2>/dev/null | grep -q PUBLISHER_READY; then
              break
            fi
            echo "Waiting for Publisher to complete deployment ($attempt/60)"
            sleep 12
          done
          PY_CODE=$(cat <<'PY'
          import os
          from apps.publisher.models import MobileApp, Release, Build
          from apps.publisher.tasks import enqueue_job

          source=os.environ['SOURCE_COMMIT']
          version=os.environ['VERSION_NAME']
          build_number=int(os.environ['BUILD_NUMBER'])
          app=MobileApp.objects.get(slug='a-esthetic')
          notes='Optimierte Verwaltung der Startseitenbilder und aktualisierte Android und iOS Anwendung.'

          release,created=Release.objects.get_or_create(
              app=app,version_name=version,build_number=build_number,
              defaults={
                  'status':'building','source_branch':'main','source_commit':source,
                  'android_track':'production','android_rollout':1,
                  'ios_release_type':'manual','auto_submit':False,'release_notes':notes,
              },
          )
          if not created and release.source_commit!=source and release.builds.filter(status__in=['running','succeeded']).exists():
              raise SystemExit('build43_already_started_from_different_commit')
          changed=[]
          if release.source_commit != source:
              release.source_commit=source; changed.append('source_commit')
          if release.source_branch != 'main':
              release.source_branch='main'; changed.append('source_branch')
          if release.release_notes != notes:
              release.release_notes=notes; changed.append('release_notes')
          if release.status in {'draft','failed','rejected'}:
              release.status='building'; changed.append('status')
          if changed:
              release.save(update_fields=changed+['updated_at'])

          app.latest_commit_sha=source
          app.save(update_fields=['latest_commit_sha','updated_at'])
          for loc in app.localizations.all():
              loc.release_notes=notes
              loc.save(update_fields=['release_notes','updated_at'])

          android,_=Build.objects.get_or_create(
              release=release,platform='android',
              defaults={'status':'queued','commit_sha':source},
          )
          ios,_=Build.objects.get_or_create(
              release=release,platform='ios',
              defaults={'status':'queued','commit_sha':source},
          )

          def ensure_build(platform, build, kind):
              live=release.jobs.filter(type=kind,status__in=['queued','running','succeeded']).order_by('-pk').first()
              if build.status not in {'succeeded','running'} and not live:
                  build.status='queued'
                  build.commit_sha=source
                  build.save(update_fields=['status','commit_sha','updated_at'])
                  job=enqueue_job(kind,app=app,release=release,build=build,agent=True,platform=platform)
                  print('QUEUED',kind,job.pk)
              else:
                  print('BUILD_STATE',kind,build.status,'job',getattr(live,'pk',None),getattr(live,'status',None))

          ensure_build('linux',android,'build_android')
          ensure_build('macos',ios,'build_ios')
          print('RELEASE',release.pk,release.version_name,release.build_number,release.source_commit,'created',created)
          PY
          )
          ENCODED=$(printf '%s' "$PY_CODE" | base64 -w0)
          ssh -i "$PUBLISHER_SSH_KEY_PATH" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$PORT" root@"$HOST"             "cd /opt/aplus-publisher && printf '%s' '$ENCODED' | base64 -d | docker compose exec -T -e SOURCE_COMMIT='$SOURCE_COMMIT' -e VERSION_NAME='$VERSION_NAME' -e BUILD_NUMBER='$BUILD_NUMBER' web python manage.py shell"

      - name: Wake Android and iOS cloud builders
        uses: actions/github-script@v7
        with:
          script: |
            for (const workflow_id of ['cloud-linux.yml','cloud-macos.yml']) {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id,
                ref: 'main'
              });
            }

      - name: Confirm Android and iOS builds are queued
        run: |
          echo "A+ Esthetic 1.0.37 / Build 43 Android and iOS builder jobs were queued."
          echo "Store submission is intentionally deferred while 1.0.36 is in review on Apple and Google."
          echo "The server-hosted Startseitenbilder fix is already deployed independently."
