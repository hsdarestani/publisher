name: Prepare BE DIFFERENT 1.1 build 9 Google draft
on:
  push:
    branches: [main]
    paths: ['.github/workflows/be-different-1-1-submit.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: be-different-1-1-submit
  cancel-in-progress: false
jobs:
  submit:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    steps:
      - name: Advance and inspect exact release
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" 'cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell' <<'PY'
          import json
          from apps.publisher.models import Release,Submission
          from apps.integrations.google_play import GooglePlayClient
          r=Release.objects.get(pk=131,app__slug="be-different")
          assert r.build_number==9 and r.version_name=="1.1.0"
          a=r.app
          c=GooglePlayClient(a.google_account)
          from pathlib import Path
          b=r.builds.get(platform="android",status="succeeded")
          e=c._open_edit(a.package_name)
          try:
              bundle=c._upload_request(e,f"/applications/{c._q(a.package_name)}/edits/{e.edit_id}/bundles",Path(b.artifact.path).read_bytes(),"application/octet-stream")
              assert int(bundle["versionCode"])==9
              body={"track":"production","releases":[{"name":r.version_name,"versionCodes":["9"],"status":"draft","releaseNotes":[{"language":loc.locale,"text":(loc.release_notes or r.release_notes)[:500]} for loc in a.localizations.all() if (loc.release_notes or r.release_notes)]}]}
              c._edit_request(e,"PUT",f"/applications/{c._q(a.package_name)}/edits/{e.edit_id}/tracks/production",json_body=body)
              c._validate_edit(e)
              result=c._commit_edit(e)
              Submission.objects.update_or_create(app=a,release=r,platform="android",defaults={"state":"ready_for_review","last_error":""})
              print("GOOGLE_BUILD9_DRAFT_COMMITTED="+json.dumps(result))
          except Exception:
              c._safe_delete_edit(e)
              raise
          PY
