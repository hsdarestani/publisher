name: PWYW on STRATO — isolated pilot deploy
# Release premium PWYW experience; browser CI 40126452611 passed.
# Publish simplified everyday German merchant copy from pwyw commit 5a9be88, 24 Oct 2026.
# PWYW full portal-first product UX eeb6d27a77b9e4fbcb2ffe900aab4b068b2d50a6 branch QA 39946033784 PASS and previous main QA 39945524792 PASS
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pwyw-strato-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pwyw-isolated-strato
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - name: Checkout PWYW product only
        uses: actions/checkout@v4
        with:
          repository: hsdarestani/pwyw
          ref: a060dfc559f769142ef1affb780e168ee128d4a1
          path: pwyw-src

      - name: Validate code and test tenant isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/pwyw-test-venv
          /tmp/pwyw-test-venv/bin/pip install -q -r pwyw-src/requirements.txt httpx==0.28.1
          cd pwyw-src
          /tmp/pwyw-test-venv/bin/python -m py_compile app.py admin_api.py admin_bootstrap.py
          /tmp/pwyw-test-venv/bin/python -m unittest discover -s tests -v
          test -s static/admin.html
          test -s static/admin.js
          test -s static/index.html
          test -s static/play.js
          test -s static/dashboard.js
          tar --exclude='.git' --exclude='data' --exclude='__pycache__' -czf "$RUNNER_TEMP/pwyw-pilot.tar.gz" -C .. pwyw-src

      - name: SSH preflight and isolated deployment
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.HOST }}
          DEPLOY_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          EXPECTED_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
          AI_KEY: ${{ secrets.OPENAI_API_KEY }}
          CF_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
          CF_AI_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_EMAIL: ${{ secrets.PWYW_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.PWYW_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          test "$DEPLOY_HOST" = "82.165.187.14" || { echo "::error::Publisher production secrets do not point to the expected STRATO host. Nothing changed."; exit 1; }
          test -n "$DEPLOY_KEY" || { echo "::error::Publisher SSH key missing. Nothing changed."; exit 1; }
          PORT="${DEPLOY_PORT:-22}"
          umask 077
          KEY_FILE="$RUNNER_TEMP/pwyw-key"
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          if [ -n "$DEPLOY_KEY_PASSPHRASE" ]; then
            eval "$(ssh-agent -s)" >/dev/null
            ASKPASS="$RUNNER_TEMP/pwyw-askpass"
            printf '%s\n' '#!/bin/sh' 'printf "%s" "$DEPLOY_KEY_PASSPHRASE"' > "$ASKPASS"
            chmod 700 "$ASKPASS"
            DISPLAY=:0 SSH_ASKPASS="$ASKPASS" SSH_ASKPASS_REQUIRE=force setsid ssh-add "$KEY_FILE" </dev/null
          fi
          mkdir -p "$HOME/.ssh"
          ssh-keyscan -T 10 -p "$PORT" -H "$DEPLOY_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          test -s "$HOME/.ssh/known_hosts"
          if [ -n "$EXPECTED_FINGERPRINT" ]; then
            ssh-keygen -lf "$HOME/.ssh/known_hosts" | grep -F -- "$EXPECTED_FINGERPRINT" >/dev/null
          fi
          SSH=(ssh -i "$KEY_FILE" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$PORT")
          SCP=(scp -i "$KEY_FILE" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -P "$PORT")
          # Read-only check before any changes. Explicitly do NOT run Publisher compose up.
          "${SSH[@]}" root@"$DEPLOY_HOST" 'bash -se' <<'PRECHECK'
          set -euo pipefail
          test -f /opt/aplus-publisher/Caddyfile
          test -f /opt/aplus-publisher/docker-compose.yml
          command -v docker >/dev/null
          cd /opt/aplus-publisher
          CADDY_ID="$(docker compose ps -q caddy)"
          test -n "$CADDY_ID"
          test "$(docker inspect -f '{{.State.Running}}' "$CADDY_ID")" = true
          docker compose exec -T caddy caddy validate --config /etc/caddy/Caddyfile </dev/null
          docker compose exec -T web curl -fsS --max-time 7 http://127.0.0.1:8000/healthz/ >/dev/null </dev/null
          printf "Caddy and Publisher preflight passed.\n"
          df -Pk /opt | awk 'NR==2 {if ($4<500000) exit 1; print "Disk preflight passed"}'
          PRECHECK
          # AI remains off by default in production pilot; enable only after costs/legal review.
          # Stage optional Workers AI credentials over SSH stdin, never in URLs, git or logs.
          AI_ENV_FILE="$RUNNER_TEMP/pwyw-ai.env"
          : > "$AI_ENV_FILE"
          chmod 600 "$AI_ENV_FILE"
          if [[ "${CF_AI_ACCOUNT:-}" =~ ^[0-9a-fA-F]{32}$ ]] && [[ "${CF_AI_TOKEN:-}" =~ ^[A-Za-z0-9._-]{15,}$ ]]; then
            printf 'CLOUDFLARE_ACCOUNT_ID=%s\nCLOUDFLARE_AI_API_TOKEN=%s\n' "$CF_AI_ACCOUNT" "$CF_AI_TOKEN" > "$AI_ENV_FILE"
            echo "Workers AI credentials staged securely for PWYW only."
          else
            echo "Workers AI unavailable (requires both Publisher secrets). Safe campaign templates stay enabled."
          fi
          "${SSH[@]}" root@"$DEPLOY_HOST" 'umask 077; cat > /tmp/pwyw-ai.pending' < "$AI_ENV_FILE"
          rm -f "$AI_ENV_FILE"
          "${SCP[@]}" "$RUNNER_TEMP/pwyw-pilot.tar.gz" root@"$DEPLOY_HOST":/tmp/pwyw-pilot.tar.gz
          "${SSH[@]}" root@"$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          trap 'rm -f /tmp/pwyw-pilot.tar.gz /tmp/pwyw-ai.pending' EXIT
          cd /opt/aplus-publisher
          CADDY_ID="$(docker compose ps -q caddy)"
          test -n "$CADDY_ID"
          NETWORK="$(docker inspect "$CADDY_ID" --format '{{range $name, $network := .NetworkSettings.Networks}}{{println $name}}{{end}}' | head -n1)"
          test -n "$NETWORK" && docker network inspect "$NETWORK" >/dev/null
          mkdir -p /opt/pwyw/data /opt/pwyw/backups
          chown 10061:10061 /opt/pwyw/data
          chmod 750 /opt/pwyw/data
          if [ -f /opt/pwyw/app.py ]; then
            tar -czf "/opt/pwyw/backups/release-$(date -u +%Y%m%dT%H%M%SZ).tar.gz" -C /opt/pwyw app.py campaigns.py brandpack.py requirements.txt Dockerfile compose.yaml static || true
          fi
          tar -xzf /tmp/pwyw-pilot.tar.gz -C /opt/pwyw --strip-components=1
          cat > /opt/pwyw/.env <<EOF
          PUBLISHER_NETWORK=$NETWORK
          PUBLIC_BASE_URL=https://pwyw.smarbiz.sbs
          EOF
          if [ -s /tmp/pwyw-ai.pending ]; then
            cat /tmp/pwyw-ai.pending >> /opt/pwyw/.env
          fi
          rm -f /tmp/pwyw-ai.pending
          chmod 600 /opt/pwyw/.env
          cd /opt/pwyw
          docker compose config --quiet
          # Single independent Compose project; no host published ports or changes to neighbor stacks.
          docker compose up -d --build --no-deps web
          ID="$(docker compose ps -q web)"
          test -n "$ID"
          for i in $(seq 1 22); do
            if docker exec "$ID" python -c 'import urllib.request; assert urllib.request.urlopen("http://127.0.0.1:8080/api/health",timeout=3).status==200' >/dev/null 2>&1; then
              break
            fi
            if [ "$i" -eq 22 ]; then docker compose logs --tail=90 web; exit 1; fi
            sleep 2
          done
          # Isolated route, append IN PLACE to preserve Caddy's bind-mounted inode.
          cd /opt/aplus-publisher
          if ! grep -qF 'pwyw.smarbiz.sbs {' Caddyfile; then
            cp Caddyfile "/opt/pwyw/backups/Caddyfile-before-pwyw-$(date -u +%Y%m%dT%H%M%SZ)"
            cat >> Caddyfile <<'CADDY'

          # PWYW pilot: separate resource-limited container, shared Caddy route only.
          pwyw.smarbiz.sbs {
            encode zstd gzip
            reverse_proxy pwyw-web:8080
            header X-Content-Type-Options nosniff
          }
          CADDY
          fi
          if docker compose exec -T caddy grep -qF 'pwyw.smarbiz.sbs {' /etc/caddy/Caddyfile </dev/null; then
            docker compose exec -T caddy caddy validate --config /etc/caddy/Caddyfile </dev/null
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile </dev/null
          else
            # Existing shared Caddy mounts an old, unlinked inode. Stage an alternate
            # config INSIDE that running container and reload without restarting it.
            # Host Caddyfile remains updated, so a future clean restart can use it.
            echo "Shared Caddy bind mount is stale; staging and validating a safe reload (no restart)."
            docker cp /opt/aplus-publisher/Caddyfile "$CADDY_ID":/tmp/Caddyfile-pwyw
            docker exec "$CADDY_ID" caddy validate --config /tmp/Caddyfile-pwyw
            docker exec "$CADDY_ID" caddy reload --config /tmp/Caddyfile-pwyw
            docker exec "$CADDY_ID" rm -f /tmp/Caddyfile-pwyw
          fi
          # Direct internal route must be healthy before public checks.
          docker exec "$CADDY_ID" wget -qO- http://pwyw-web:8080/api/health | grep -q '"ok":true'
          docker compose exec -T web curl -fsS --max-time 7 http://127.0.0.1:8000/healthz/ >/dev/null </dev/null
          echo "PWYW isolated container and new Caddy route healthy; Publisher unchanged."
          # Proof-of-connection is optional; report only an outcome, never secret values.
          cd /opt/pwyw
          docker compose exec -T web python - <<'PY'
          import os
          from campaign_suggestions import cloudflare_candidate
          account=os.getenv("CLOUDFLARE_ACCOUNT_ID","")
          token=os.getenv("CLOUDFLARE_AI_API_TOKEN","")
          if account and token:
              result=cloudflare_candidate({"name":"Demo Café","industry":"cafe"},"return",0)
              print("PWYW Workers AI inference: "+("SUCCESS" if result else "UNAVAILABLE; safe local generator active"),flush=True)
          else:
              print("PWYW Workers AI credentials: INCOMPLETE IN PUBLISHER; safe local generator active",flush=True)
          PY
          REMOTE
          # Direct origin check does not depend on public DNS. Public HTTPS is required for done.
          echo "PWYW DNS IPv4 addresses (public):"
          getent ahostsv4 pwyw.smarbiz.sbs | awk '{print $1}' | sort -u || true
          ORIGIN="000"
          for attempt in $(seq 1 10); do
            ORIGIN="$(curl -k -sS --connect-timeout 8 --max-time 18 --resolve "pwyw.smarbiz.sbs:443:$DEPLOY_HOST" -o /dev/null -w '%{http_code}' https://pwyw.smarbiz.sbs/api/health 2>/dev/null || true)"
            [ "$ORIGIN" = 200 ] && break
            echo "TLS warm-up attempt $attempt: origin HTTP $ORIGIN"
            sleep 4
          done
          echo "STRATO origin PWYW /api/health HTTP $ORIGIN"
          if [ "$ORIGIN" != 200 ]; then
            echo "Recent Caddy certificate diagnostics (sanitized):"
            "${SSH[@]}" root@"$DEPLOY_HOST" 'cd /opt/aplus-publisher && docker logs --since 4m "$(docker compose ps -q caddy)" 2>&1 | grep -Ei "pwyw|certificate|acme|challenge|tls" | tail -28' || true
            echo "::error::PWYW direct HTTPS is not ready; leave adjacent services untouched."
            exit 1
          fi
          PUBLIC="$(curl -sS --retry 5 --retry-delay 3 --retry-connrefused --connect-timeout 8 --max-time 20 -o /dev/null -w '%{http_code}' https://pwyw.smarbiz.sbs/api/health || true)"
          echo "Public PWYW HTTPS /api/health HTTP $PUBLIC"
          test "$PUBLIC" = 200 || { echo "::error::Check PWYW DNS/Cloudflare TLS; origin route is healthy."; exit 1; }
          # Optional secure admin provisioning, never ship passwords in git or logs.
          # Supply PWYW_ADMIN_EMAIL and PWYW_ADMIN_PASSWORD as Actions secrets.
          if [ -n "${ADMIN_EMAIL:-}" ] && [ -n "${ADMIN_PASSWORD:-}" ]; then
            printf '%s\n%s\n' "$ADMIN_EMAIL" "$ADMIN_PASSWORD" |
              "${SSH[@]}" root@"$DEPLOY_HOST" 'cd /opt/pwyw && docker compose exec -T web python admin_bootstrap.py'
            echo "PWYW operator account provisioned from Actions secrets"
          else
            echo "PWYW operator not provisioned: Actions secret(s) missing"
          fi
          echo "PWYW deployed successfully without restarting any neighbor service."
