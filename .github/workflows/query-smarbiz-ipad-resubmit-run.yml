name: Query Smarbiz iPad Resubmit Run

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/query-smarbiz-ipad-resubmit-run.yml'

permissions:
  actions: read
  contents: write

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Query latest iPad resubmit run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p status
          curl --fail --silent --show-error -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/smarbiz-guideline4-resubmit.yml/runs?per_page=5" \
            > /tmp/runs.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/runs.json'))
          runs=data.get('workflow_runs', [])
          if not runs:
              raise SystemExit('No iPad resubmit runs found')
          r=runs[0]
          out={k:r.get(k) for k in ('id','run_number','event','status','conclusion','head_sha','html_url','created_at','updated_at')}
          json.dump(out, open('status/smarbiz-ipad-resubmit-latest.json','w'), indent=2)
          print(json.dumps(out, indent=2))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add status/smarbiz-ipad-resubmit-latest.json
          git diff --cached --quiet && exit 0
          git commit -m "record latest Smarbiz iPad resubmit run"
          git push
