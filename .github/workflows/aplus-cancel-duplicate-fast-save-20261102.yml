name: Cancel duplicate A+ fast-save publisher queue
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aplus-cancel-duplicate-fast-save-20261102.yml'
permissions:
  contents: read
  actions: write
jobs:
  cancel-duplicate:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel later duplicate store release run
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN: '41431487580'
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN/cancel" || {
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN" --jq '.status')"
            if [ "$status" != "completed" ]; then exit 1; fi
          }
          echo "Only release run 41431376325 remains authorized to continue."
