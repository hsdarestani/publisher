name: A+ Esthetic dedicated Mac recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/a-esthetic-dedicated-mac-recovery.yml'

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: a-esthetic-dedicated-mac-recovery
  cancel-in-progress: true

jobs:
  recover-esthetic:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Checkout A+ Publisher agent
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install agent dependencies
        run: pip install 'requests>=2.32,<3' 'PyJWT[crypto]>=2.10,<3'

      - name: Wait for Publisher health
        run: |
          curl --fail --silent --show-error \
            --retry 18 --retry-all-errors --retry-delay 10 \
            --connect-timeout 10 --max-time 20 \
            https://publisher.smarbiz.sbs/healthz/

      - name: Build and upload oldest queued macOS release
        env:
          PYTHONUNBUFFERED: '1'
          PUBLISHER_URL: https://publisher.smarbiz.sbs
          PUBLISHER_MAX_JOBS: '3'
        run: |
          python agents/custom_cloud_macos_altool.py
