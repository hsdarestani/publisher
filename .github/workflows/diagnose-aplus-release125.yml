name: Diagnose A+ Solution release 125

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-aplus-release125.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - name: Read release 125 status
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell -c \"from apps.publisher.models import Release,Job,Submission; r=Release.objects.get(pk=125); print('RELEASE',r.id,r.status,r.version_name,r.build_number,r.auto_submit); [print('BUILD',b.id,b.platform,b.status,b.external_build_id) for b in r.builds.all()]; [print('JOB',j.id,j.type,j.status,(j.error or '')[-500:]) for j in Job.objects.filter(release=r).order_by('created_at')]; [print('SUBMISSION',s.platform,s.state,s.external_id,s.last_error) for s in Submission.objects.filter(release=r)]\""
