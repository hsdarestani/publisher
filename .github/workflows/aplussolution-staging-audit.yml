name: Upload A+ Solution staging Android to Internal Testing

on:
  push:
    branches: [ops/aplussolution-staging]
    paths:
      - '.github/workflows/aplussolution-staging-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload-android:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: ${{ secrets.HOST }}
      PASS: ${{ secrets.PASS }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
    steps:
      - name: Install SSH client helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
      - name: Queue Google Internal Testing upload
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplus-publisher
          docker compose exec -T web python manage.py shell <<'PY'
          from apps.publisher.models import MobileApp, Release, Build, Job
          from apps.publisher.tasks import enqueue_job
          import json

          app = MobileApp.objects.get(slug='a-plus-solution-staging')
          release = Release.objects.get(app=app, version_name='1.0.0', build_number=1)
          build = Build.objects.get(release=release, platform='android')
          assert build.status == 'succeeded', f'Android build not ready: {build.status}'
          assert release.android_track == 'internal', f'Unsafe Android track: {release.android_track}'
          assert app.package_name == 'de.aplussolution.staging', f'Unsafe package: {app.package_name}'
          release.auto_submit = False
          release.save(update_fields=['auto_submit', 'updated_at'])

          active = Job.objects.filter(
              release=release,
              build=build,
              type='upload_google',
              status__in=['queued', 'running', 'succeeded'],
          ).order_by('-created_at').first()
          if active is None:
              active = enqueue_job('upload_google', app=app, release=release, build=build)
              created = True
          else:
              created = False

          print('ANDROID_INTERNAL=' + json.dumps({
              'package': app.package_name,
              'track': release.android_track,
              'build_id': build.id,
              'artifact_size': build.artifact_size,
              'job_id': active.id,
              'job_status': active.status,
              'created': created,
          }, sort_keys=True))
          PY
          REMOTE
