name: Verify BE DIFFERENT 1.3.3 store status
on:
  push:
    branches: [main]
    paths: [".github/workflows/bedifferent-1-3-3-store-status.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - name: Read the exact BE DIFFERENT release and store records
        env:
          HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$SSH_PRIVATE_KEY"
          port="${SSH_PORT:-22}"
          umask 077
          key="$RUNNER_TEMP/bedifferent-status-key"
          known="$RUNNER_TEMP/bedifferent-status-known-hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$key"
          ssh-keyscan -T 12 -p "$port" -H "$HOST" > "$known" 2>/dev/null
          test -s "$known"
          if [ -n "$SSH_HOST_FINGERPRINT" ]; then
            ssh-keygen -lf "$known" | grep -F -- "$SSH_HOST_FINGERPRINT" >/dev/null
          fi
          if [ -n "$SSH_KEY_PASSPHRASE" ]; then
            eval "$(ssh-agent -s)" >/dev/null
            askpass="$RUNNER_TEMP/bedifferent-status-askpass"
            printf '%s\n' '#!/bin/sh' 'printf "%s" "$SSH_KEY_PASSPHRASE"' > "$askpass"
            chmod 700 "$askpass"
            DISPLAY=:0 SSH_ASKPASS="$askpass" SSH_ASKPASS_REQUIRE=force setsid ssh-add "$key" </dev/null
          fi
          ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known" -o ConnectTimeout=15 -p "$port" root@"$HOST" \
            'cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell' <<'PY'
          import json
          import re
          from apps.integrations.apple_store import AppleStoreClient
          from apps.publisher.models import MobileApp

          def report(label, value):
              print(label + "=" + json.dumps(value, default=str, sort_keys=True), flush=True)

          bundle = "com.smarbiz.bedifferent"
          version, number, source = "1.3.3", 24, "4bf3cef63c65953c2e6cdc3b6367ae84668ca10d"
          app = MobileApp.objects.get(slug="be-different", bundle_id=bundle, package_name=bundle)
          releases = app.releases.order_by("-build_number", "-pk")
          report("BD_PRIOR_RELEASES", list(releases.values("id", "version_name", "build_number", "status")[:5]))
          report("BD_STORE_ACCOUNTS", {
              "apple": bool(app.apple_account and app.apple_account.configured),
              "google": bool(app.google_account and app.google_account.configured),
          })

          release = releases.filter(version_name=version, build_number=number).first()
          report("BD_TARGET_AVAILABLE", not releases.filter(build_number__gte=number).exists())
          if release:
              assert release.source_commit == source, "Build 24 belongs to a different source"
              report("BD_TARGET_RELEASE", {
                  "id": release.pk, "source": release.source_commit, "status": release.status,
                  "version": release.version_name, "build": release.build_number, "track": release.android_track,
              })
              report("BD_TARGET_BUILDS", [
                  {"platform": build.platform, "status": build.status, "signed_artifact": bool(build.artifact),
                   "size": build.artifact_size, "source": build.commit_sha, "store_build": build.external_build_id}
                  for build in release.builds.all()
              ])
              report("BD_TARGET_JOBS", [
                  {"id": job.pk, "type": job.type, "status": job.status,
                   "error_codes": re.findall(r"ITMS-[0-9]+|HTTP [45][0-9]{2}|[A-Z]{3,}_[A-Z_]{3,}", job.error or "")[:5]}
                  for job in release.jobs.order_by("id")
              ])
              report("BD_TARGET_SUBMISSIONS", list(release.submissions.values("platform", "state", "external_id", "submitted_at")))

          if app.apple_account and app.apple_account.configured:
              try:
                  apple = AppleStoreClient(app.apple_account)
                  app_id = str(apple.find_app(bundle)["id"])
                  candidates = apple.list_builds(app_id, build_number=str(number))
                  report("BD_APPLE_BUILD_MATCHES", [
                      {"number": item["attributes"].get("version"), "processing": item["attributes"].get("processingState")}
                      for item in candidates
                  ])
                  record = apple.find_editable_version(app_id, version)
                  if record:
                      linked = apple.request("GET", f"/appStoreVersions/{record['id']}/build").get("data") or {}
                      report("BD_APPLE_VERSION", {
                          "version": record["attributes"].get("versionString"),
                          "state": record["attributes"].get("appStoreState"),
                          "build": linked.get("attributes", {}).get("version"),
                      })
              except Exception as exc:
                  report("BD_APPLE_READ_ERROR", {"type": type(exc).__name__})
          PY
