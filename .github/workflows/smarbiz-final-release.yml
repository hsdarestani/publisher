name: Smarbiz Final Store Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smarbiz-final-release.yml'
      - 'apps/signing/management/commands/bootstrap_smarbiz_final.py'

permissions:
  contents: read
  actions: write

concurrency:
  group: smarbiz-final-store-build
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate final pinned Smarbiz builder
        env:
          DEBUG: '1'
          DJANGO_SECRET_KEY: ci-secret
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          python manage.py check
          python manage.py help bootstrap_smarbiz_final >/dev/null
          python -m py_compile apps/signing/management/commands/bootstrap_smarbiz_final.py
          grep -q '1177bbf9708501cd6df43f006c52f31dbe98d050' apps/signing/management/commands/bootstrap_smarbiz_final.py

  release:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Wait for final Smarbiz production source
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            READY=1
            for url in \
              https://smarbiz.sbs/api/health \
              https://smarbiz.sbs/de/privacy \
              https://smarbiz.sbs/de/support \
              https://smarbiz.sbs/de/account-deletion; do
              if ! curl --fail --silent --show-error --location --max-time 20 "$url" >/dev/null; then READY=0; break; fi
            done
            if [ "$READY" = 1 ]; then echo 'Smarbiz production/store endpoints are ready.'; break; fi
            if [ "$i" -eq 90 ]; then echo 'Smarbiz production did not become ready.' >&2; exit 2; fi
            sleep 10
          done

      - name: Queue pinned Smarbiz 1.0.0 build 2
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          for i in $(seq 1 90); do
            if sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
              "cd /opt/aplus-publisher && docker compose exec -T web python manage.py help bootstrap_smarbiz_final >/dev/null"; then break; fi
            if [ "$i" -eq 90 ]; then echo 'Final Smarbiz command never appeared in Publisher production.' >&2; exit 3; fi
            sleep 5
          done
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py bootstrap_smarbiz_final --app-version 1.0.0 --build-number 2 --queue --publish"

      - name: Wake Publisher Android and iOS agents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run cloud-linux.yml --repo "$GITHUB_REPOSITORY"
          gh workflow run cloud-macos.yml --repo "$GITHUB_REPOSITORY"

      - name: Wait for both pinned signed artifacts
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          READY=0
          for i in $(seq 1 50); do
            echo "=== pinned Smarbiz build pass $i ==="
            OUTPUT="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
              "cd /opt/aplus-publisher && docker compose exec -T web python manage.py bootstrap_smarbiz_final --app-version 1.0.0 --build-number 2 --publish")"
            printf '%s\n' "$OUTPUT"
            if printf '%s\n' "$OUTPUT" | grep -q 'build_android=succeeded' && printf '%s\n' "$OUTPUT" | grep -q 'build_ios=succeeded'; then
              READY=1
              break
            fi
            sleep 30
          done
          if [ "$READY" != 1 ]; then echo 'Pinned Android/iOS artifacts did not both finish in time.' >&2; exit 4; fi

      - name: Final pinned release state
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py bootstrap_smarbiz_final --app-version 1.0.0 --build-number 2 --publish"
