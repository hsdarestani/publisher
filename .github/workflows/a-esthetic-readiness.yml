name: Diagnose A+ Esthetic readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/a-esthetic-readiness.yml'

permissions:
  contents: read

environments: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Read non-secret Publisher readiness state
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PASS"
          PORT="${SSH_PORT:-22}"
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          CHECK=$(cat <<'PY' | base64 -w0
from apps.publisher.models import MobileApp, StoreAccount
app = MobileApp.objects.get(slug='a-esthetic')
release = app.releases.get(version_name='1.0.0', build_number=1)
builds = {b.platform: b.status for b in release.builds.all()}
google_candidates = StoreAccount.objects.filter(provider='google', enabled=True).exclude(credential_blob='').count()
apple_candidates = StoreAccount.objects.filter(provider='apple', enabled=True).exclude(credential_blob='').exclude(apple_issuer_id='').exclude(apple_key_id='').count()
print('A_ESTHETIC_READINESS')
print('google_linked=' + ('yes' if app.google_account_id else 'no'))
print('apple_linked=' + ('yes' if app.apple_account_id else 'no'))
print('google_configured_candidates=' + str(google_candidates))
print('apple_configured_candidates=' + str(apple_candidates))
print('review_username=' + ('yes' if app.review_username else 'no'))
print('review_password=' + ('yes' if app.review_password_blob else 'no'))
print('shared_icon=' + ('yes' if app.assets.filter(kind='icon', platform='shared').exists() else 'no'))
print('android_screenshots=' + str(app.assets.filter(kind='screenshot', platform='android').count()))
print('ios_screenshots=' + str(app.assets.filter(kind='screenshot', platform='ios').count()))
print('android_build=' + builds.get('android', 'missing'))
print('ios_build=' + builds.get('ios', 'missing'))
PY
          )
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && printf '%s' '$CHECK' | base64 -d | docker compose exec -T web python manage.py shell"
