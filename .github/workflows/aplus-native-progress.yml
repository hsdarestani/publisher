name: Inspect A+ Solution native build progress
on:
  push:
    branches: [ops/aplus-release-progress-20260902]
permissions:
  contents: read
jobs:
  progress:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read release progress without credentials or build log contents
        env:
          DEPLOY_PASSWORD: ${{ secrets.PASS }}
          DEPLOY_HOST: ${{ secrets.HOST }}
          DEPLOY_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          cat > /tmp/askpass <<'SH'
          #!/bin/sh
          printf '%s\n' "$DEPLOY_PASSWORD"
          SH
          chmod 700 /tmp/askpass
          export SSH_ASKPASS=/tmp/askpass SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          setsid -w ssh -T -p "${DEPLOY_PORT:-22}" -o StrictHostKeyChecking=no -o ConnectTimeout=20 root@"$DEPLOY_HOST" 'cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell' <<'PY'
          import json, re
          from apps.publisher.models import Release, Job
          r = Release.objects.filter(app__slug='a-plus-solution', source_commit='7c353069db8399f4af501928dcb43cc415605b50').latest('created_at')
          print('NATIVE_RELEASE=' + json.dumps({'version': r.version_name, 'build': r.build_number, 'source': r.source_commit}))
          rows = []
          for b in r.builds.all():
              phases = re.findall(r'ARCHIVE SUCCEEDED|EXPORT SUCCEEDED|SwiftCompile|CompileC|CodeSign|npm install|pod install|xcodebuild|BUILD SUCCESSFUL', b.logs or '')
              rows.append({'platform': b.platform, 'status': b.status, 'artifact': bool(b.artifact), 'log_bytes': len(b.logs or ''), 'last_phase': phases[-1] if phases else None, 'updated_at': str(b.updated_at), 'finished_at': str(b.finished_at)})
          print('NATIVE_BUILD_PROGRESS=' + json.dumps(rows))
          from apps.publisher.models import Submission
          print('STORE_PROGRESS=' + json.dumps(list(Job.objects.filter(release=r, type__in=['submit_google', 'upload_apple', 'submit_apple']).values('id', 'type', 'status', 'updated_at')), default=str))
          print('STORE_SUBMISSIONS=' + json.dumps(list(Submission.objects.filter(release=r).values('platform', 'state')), default=str))
          PY
