name: Recover A+ Solution Build 55 Apple delivery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aplus-solution-build55-apple-recovery.yml'

permissions:
  contents: read
  actions: write

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    steps:
      - name: Install SSH tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null

      - name: Clear stale Mac ownership and verify A+ upload queue
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell" <<'PY'
          from apps.publisher.models import BuildAgent, Job, MobileApp, Release
          app=MobileApp.objects.get(slug='a-plus-solution')
          r=Release.objects.get(app=app,version_name='1.0.20',build_number=55,source_commit='106fcd9e400f82fc800e698c1fea7c2034934c4f')
          ios=r.builds.get(platform='ios')
          assert ios.status=='succeeded' and ios.artifact
          agent=BuildAgent.objects.get(platform='macos')
          current=agent.current_job
          if current and current.status not in {'queued','running'}:
              print('clearing_stale_current_job',current.id,current.status)
              agent.current_job=None
              agent.save(update_fields=['current_job','updated_at'])
          upload=Job.objects.filter(release=r,build=ios,type='upload_apple').order_by('-created_at').first()
          assert upload and upload.status in {'queued','running','succeeded'}, (upload.id if upload else None, upload.status if upload else None)
          print('UPLOAD_JOB',upload.id,upload.status)
          PY

      - name: Cancel stale Cloud Mac runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api --method POST repos/${{ github.repository }}/actions/runs/36480816285/cancel >/dev/null 2>&1
          exit 0

      - name: Start fresh Cloud Mac runner
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'cloud-macos.yml',
              ref: 'main'
            });

      - name: Wait for Apple upload
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          for i in $(seq 1 180); do
            STATE="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
              "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell -c \"from apps.publisher.models import Job,MobileApp,Release; a=MobileApp.objects.get(slug='a-plus-solution'); r=Release.objects.get(app=a,version_name='1.0.20',build_number=55); j=Job.objects.filter(release=r,type='upload_apple').order_by('-created_at').first(); b=r.builds.get(platform='ios'); print('|'.join([j.status if j else 'missing',str(j.error or '').replace('|','/')[:300] if j else '',b.external_build_id or '']))\"" | tail -n 1 | tr -d '\r')"
            echo "Apple upload state: $STATE"
            IFS='|' read -r STATUS ERR BUILD_ID <<< "$STATE"
            if [ "$STATUS" = failed ]; then echo "$ERR" >&2; exit 1; fi
            if [ "$STATUS" = succeeded ] && [ -n "$BUILD_ID" ]; then exit 0; fi
            sleep 20
          done
          echo "Timed out waiting for Apple upload" >&2
          exit 1

      - name: Queue Apple review submission
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell" <<'PY'
          from apps.publisher.models import Job,MobileApp,Release
          from apps.publisher.tasks import enqueue_job
          app=MobileApp.objects.get(slug='a-plus-solution')
          r=Release.objects.get(app=app,version_name='1.0.20',build_number=55,source_commit='106fcd9e400f82fc800e698c1fea7c2034934c4f')
          ios=r.builds.get(platform='ios')
          assert ios.external_build_id
          existing=Job.objects.filter(release=r,type='submit_apple',status__in=['queued','running','succeeded']).order_by('-created_at').first()
          if existing:
              print('APPLE_SUBMIT',existing.id,existing.status)
          else:
              job=enqueue_job('submit_apple',app=app,release=r,build=ios)
              print('APPLE_SUBMIT',job.id,job.status)
          PY

      - name: Wait for Apple submission
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          for i in $(seq 1 120); do
            STATE="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
              "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell -c \"from apps.publisher.models import Job,MobileApp,Release,Submission; a=MobileApp.objects.get(slug='a-plus-solution'); r=Release.objects.get(app=a,version_name='1.0.20',build_number=55); j=Job.objects.filter(release=r,type='submit_apple').order_by('-created_at').first(); s=Submission.objects.filter(release=r,platform='ios').first(); print('|'.join([j.status if j else 'missing',str(j.error or '').replace('|','/')[:300] if j else '',s.state if s else '',s.external_id if s else '']))\"" | tail -n 1 | tr -d '\r')"
            echo "Apple submission state: $STATE"
            IFS='|' read -r STATUS ERR SUB_STATE SUB_ID <<< "$STATE"
            if [ "$STATUS" = failed ]; then echo "$ERR" >&2; exit 1; fi
            if [ "$STATUS" = succeeded ] && [ -n "$SUB_STATE" ]; then exit 0; fi
            sleep 15
          done
          echo "Timed out waiting for Apple submission" >&2
          exit 1
