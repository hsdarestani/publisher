name: Diagnose A+ Solution Build 56 delivery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aplus-solution-build56-delivery-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Inspect Publisher release state
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell" <<'PY'
          from apps.publisher.models import BuildAgent, Job, MobileApp, Release, Submission
          app=MobileApp.objects.get(slug='a-plus-solution')
          r=Release.objects.get(app=app,version_name='1.0.21',build_number=56,source_commit='e6305209f982d01513db738fd7e1c33034d53367')
          print('RELEASE', r.id, r.status, r.version_name, r.build_number)
          for b in r.builds.order_by('platform'):
              print('BUILD', b.platform, b.status, bool(b.artifact), b.external_build_id, b.started_at, b.finished_at, getattr(b,'agent_id',None))
          for j in Job.objects.filter(release=r).order_by('created_at'):
              print('JOB', j.id, j.type, j.status, 'progress', j.progress, 'created', j.created_at, 'started', j.started_at, 'finished', j.finished_at, 'updated', j.updated_at, 'error', str(j.error or '')[:1200])
              print('JOB_LOG_TAIL', j.id, repr(str(j.logs or '')[-5000:]))
          for a in BuildAgent.objects.all().order_by('name'):
              if a.current_job_id:
                  cj=Job.objects.filter(pk=a.current_job_id).select_related('app','release','build').first()
                  print('AGENT', a.id, a.name, a.platform, 'current_job', a.current_job_id, 'last_seen', getattr(a,'last_seen_at',''), 'job', cj.type if cj else '', cj.status if cj else '', cj.app.slug if cj and cj.app_id else '', f'{cj.release.version_name}/{cj.release.build_number}' if cj and cj.release_id else '')
          for j in Job.objects.filter(status__in=['queued','running'],available_to_agents=True,required_platform='macos').select_related('app','release').order_by('created_at','pk'):
              print('MAC_QUEUE',j.id,j.type,j.status,j.progress,j.app.slug if j.app_id else '',f'{j.release.version_name}/{j.release.build_number}' if j.release_id else '',j.created_at,j.started_at,j.updated_at)
          for s in Submission.objects.filter(release=r).order_by('platform'):
              print('SUBMISSION', s.platform, s.state, s.external_id)
          PY
