name: Diagnose Publisher production now

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-publisher-production-now.yml'

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - name: Read production container status and logs
        id: diag
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          PORT="${SSH_PORT:-22}"
          OUTPUT="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && echo '=== PS ===' && docker compose ps && echo '=== BE DIFFERENT ===' && docker compose exec -T web python manage.py shell -c 'import json; from apps.publisher.models import MobileApp,Release,Job,Submission; a=MobileApp.objects.get(slug=\"be-different\"); r=Release.objects.get(app=a,version_name=\"1.0.0\",build_number=2); print(json.dumps({\"release\":{\"id\":r.id,\"status\":r.status,\"source_commit\":r.source_commit,\"auto_submit\":r.auto_submit},\"builds\":[{\"id\":b.id,\"platform\":b.platform,\"status\":b.status,\"external_build_id\":b.external_build_id} for b in r.builds.all()],\"jobs\":[{\"id\":j.id,\"type\":j.type,\"status\":j.status,\"error\":j.error[-300:]} for j in Job.objects.filter(release=r).order_by(\"-created_at\")[:20]],\"submissions\":[{\"platform\":s.platform,\"state\":s.state,\"external_id\":s.external_id,\"last_error\":s.last_error} for s in Submission.objects.filter(release=r)]}, default=str))' && echo '=== APPLE IDS ===' && docker compose exec -T web python manage.py shell -c 'import json; from apps.publisher.models import MobileApp; from apps.integrations.apple_store import AppleStoreClient; a=MobileApp.objects.get(slug=\"be-different\"); client=AppleStoreClient(a.apple_account); ids=[]; 
for ident in [\"com.smarbiz.bedifferent\",\"com.smarbiz.bedifferent.widget\",\"com.smarbiz.bedifferent.watch\",\"com.smarbiz.bedifferent.watch-widget\"]:
 d=client.request(\"GET\", f\"/bundleIds?filter[identifier]={ident}&limit=10\").get(\"data\",[]); item=next((x for x in d if x.get(\"attributes\",{}).get(\"identifier\")==ident),None); caps=[]; profiles=[]; 
 if item:
  caps=client.request(\"GET\", f\"/bundleIds/{item[\\"id\\"]}/bundleIdCapabilities?limit=200\").get(\"data\",[]); profiles=client.request(\"GET\", f\"/bundleIds/{item[\\"id\\"]}/profiles?limit=200\").get(\"data\",[])
 ids.append({\"identifier\":ident,\"bundle_resource_id\":item.get(\"id\") if item else None,\"capabilities\":[x.get(\"attributes\",{}).get(\"capabilityType\") for x in caps],\"profiles\":[{\"id\":x.get(\"id\"),\"name\":x.get(\"attributes\",{}).get(\"name\"),\"profileType\":x.get(\"attributes\",{}).get(\"profileType\")} for x in profiles]})
print(json.dumps(ids))' && echo '=== WEB ===' && docker compose logs --tail=100 web && echo '=== WORKER ===' && docker compose logs --tail=100 worker" 2>&1 || true)"
          printf '%s\n' "$OUTPUT"
          {
            echo 'output<<EOF'
            printf '%s\n' "$OUTPUT"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Publish diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT: ${{ steps.diag.outputs.output }}
        run: |
          BODY_FILE="$(mktemp)"
          {
            echo '### Publisher production diagnostic'
            echo
            echo '```text'
            printf '%s\n' "$OUTPUT" | tail -n 260
            echo '```'
            echo
            echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$BODY_FILE"
          gh issue edit 2 --repo "$GITHUB_REPOSITORY" --body-file "$BODY_FILE"
