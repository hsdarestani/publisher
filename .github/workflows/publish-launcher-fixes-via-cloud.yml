name: Publish launcher fixes via cloud

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-launcher-fixes-via-cloud.yml'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime tools
        run: |
          python -m pip install --disable-pip-version-check 'requests>=2.32,<3' 'PyJWT[crypto]>=2.10,<3' google-auth
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Deploy latest Publisher command
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          PUBLISHER_GITHUB_TOKEN: ${{ secrets.PUBLISHER_GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_COMPLIANCE_MODEL: ${{ vars.OPENAI_COMPLIANCE_MODEL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          tar --exclude=.git --exclude=.env -czf /tmp/aplus-publisher.tar.gz .
          : > /tmp/aplus-publisher-overrides.env
          [ -n "$ADMIN_EMAIL" ] && printf 'ADMIN_EMAIL=%s\n' "$ADMIN_EMAIL" >> /tmp/aplus-publisher-overrides.env || true
          [ -n "$ADMIN_PASSWORD" ] && printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" >> /tmp/aplus-publisher-overrides.env || true
          [ -n "$PUBLISHER_GITHUB_TOKEN" ] && printf 'PUBLISHER_GITHUB_TOKEN=%s\n' "$PUBLISHER_GITHUB_TOKEN" >> /tmp/aplus-publisher-overrides.env || true
          [ -n "$OPENAI_API_KEY" ] && printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY" >> /tmp/aplus-publisher-overrides.env || true
          [ -n "$OPENAI_COMPLIANCE_MODEL" ] && printf 'OPENAI_COMPLIANCE_MODEL=%s\n' "$OPENAI_COMPLIANCE_MODEL" >> /tmp/aplus-publisher-overrides.env || true
          [ -n "$SENTRY_DSN" ] && printf 'SENTRY_DSN=%s\n' "$SENTRY_DSN" >> /tmp/aplus-publisher-overrides.env || true
          sshpass -p "$PASS" scp -P "$PORT" -o StrictHostKeyChecking=no \
            /tmp/aplus-publisher.tar.gz /tmp/aplus-publisher-overrides.env scripts/deploy.sh \
            root@"$HOST":/tmp/
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            'chmod +x /tmp/deploy.sh && /tmp/deploy.sh /tmp/aplus-publisher.tar.gz /tmp/aplus-publisher-overrides.env'
          curl --fail --silent --show-error --retry 18 --retry-all-errors --retry-delay 5 \
            --connect-timeout 10 --max-time 20 https://publisher.smarbiz.sbs/healthz/

      - name: Recover only the Esthetic Android build
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py release_launcher_icon_updates --recover --queue --target esthetic"

      - name: Build the queued Esthetic AAB with Publisher signing
        env:
          PYTHONUNBUFFERED: '1'
          PUBLISHER_URL: https://publisher.smarbiz.sbs
          PUBLISHER_MAX_JOBS: '6'
          PUBLISHER_POLL_INTERVAL: '5'
          PUBLISHER_WATCH_SECONDS: '20'
        run: python agents/custom_cloud_linux.py

      - name: Export both signed Publisher AABs
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" <<'REMOTE'
          set -euo pipefail
          cd /opt/aplus-publisher
          docker compose exec -T web python manage.py shell -c "from apps.publisher.models import Release; import shutil; targets=[('solution','1d49500db4b8a02b2a0f1ac01ea314eb82984e00'),('esthetic','c8fa10ccb1d44e4c6d747fcf8c3954c1933d9298')]; [(lambda r,b,n: (b.status == 'succeeded' or (_ for _ in ()).throw(RuntimeError(f'{n} build status={b.status}')), shutil.copyfile(b.artifact.path, f'/tmp/{n}.aab'), print(f'{n}: release={r.pk} build={r.build_number} artifact={b.artifact.name}')))(r, r.builds.filter(platform='android').first(), n) for n,s in targets for r in [Release.objects.filter(source_commit=s).order_by('-created_at').first()] if r]"
          docker compose cp web:/tmp/solution.aab /tmp/solution.aab >/dev/null
          docker compose cp web:/tmp/esthetic.aab /tmp/esthetic.aab >/dev/null
          REMOTE
          sshpass -p "$PASS" scp -P "$PORT" -o StrictHostKeyChecking=no root@"$HOST":/tmp/solution.aab /tmp/solution.aab
          sshpass -p "$PASS" scp -P "$PORT" -o StrictHostKeyChecking=no root@"$HOST":/tmp/esthetic.aab /tmp/esthetic.aab
          test -s /tmp/solution.aab
          test -s /tmp/esthetic.aab
          jarsigner -verify /tmp/solution.aab >/dev/null
          jarsigner -verify /tmp/esthetic.aab >/dev/null
          sha256sum /tmp/solution.aab /tmp/esthetic.aab

      - name: Upload both AABs and commit production tracks from GitHub edge
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
          python - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.parse import quote
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession, Request

          SCOPE = 'https://www.googleapis.com/auth/androidpublisher'
          API = 'https://androidpublisher.googleapis.com/androidpublisher/v3'
          UPLOAD = 'https://androidpublisher.googleapis.com/upload/androidpublisher/v3'
          apps = [
              {
                  'name': 'A+ Solution',
                  'package': 'de.aplussolution.workforce',
                  'aab': '/tmp/solution.aab',
                  'expected_version_code': '5',
                  'version_name': '1.0.0',
              },
              {
                  'name': 'A+ Esthetic',
                  'package': 'de.aplusesthetic.app',
                  'aab': '/tmp/esthetic.aab',
                  'expected_version_code': '4',
                  'version_name': '1.0.0',
              },
          ]

          info = json.loads(os.environ['GOOGLE_PLAY_SERVICE_ACCOUNT_JSON'])
          creds = service_account.Credentials.from_service_account_info(info, scopes=[SCOPE])
          creds.refresh(Request())
          session = AuthorizedSession(creds)
          results = {}

          def require(resp, label):
              if resp.ok:
                  return resp.json() if resp.content else {}
              try:
                  detail = json.dumps(resp.json(), ensure_ascii=False)
              except Exception:
                  detail = ' '.join(resp.text.split())[:3000]
              raise RuntimeError(f'{label}: HTTP {resp.status_code}: {detail}')

          for app in apps:
              pkg = quote(app['package'], safe='._-')
              edit = require(session.post(f'{API}/applications/{pkg}/edits', json={}, timeout=60), f"{app['name']} create edit")
              edit_id = edit['id']
              try:
                  data = Path(app['aab']).read_bytes()
                  bundle = require(
                      session.post(
                          f'{UPLOAD}/applications/{pkg}/edits/{edit_id}/bundles',
                          params={'uploadType': 'media'},
                          data=data,
                          headers={'Content-Type': 'application/octet-stream'},
                          timeout=300,
                      ),
                      f"{app['name']} upload bundle",
                  )
                  version_code = str(bundle['versionCode'])
                  if version_code != app['expected_version_code']:
                      raise RuntimeError(
                          f"{app['name']} uploaded versionCode {version_code}, expected {app['expected_version_code']}"
                      )
                  track_body = {
                      'track': 'production',
                      'releases': [{
                          'name': app['version_name'],
                          'versionCodes': [version_code],
                          'status': 'completed',
                          'releaseNotes': [{
                              'language': 'de-DE',
                              'text': 'Kleine technische Aktualisierung der App-Darstellung.',
                          }],
                      }],
                  }
                  require(
                      session.put(
                          f'{API}/applications/{pkg}/edits/{edit_id}/tracks/production',
                          json=track_body,
                          timeout=60,
                      ),
                      f"{app['name']} update production track",
                  )
                  require(
                      session.post(
                          f'{API}/applications/{pkg}/edits/{edit_id}:validate',
                          json={}, timeout=60,
                      ),
                      f"{app['name']} validate edit",
                  )
                  commit = require(
                      session.post(
                          f'{API}/applications/{pkg}/edits/{edit_id}:commit',
                          params={'changesInReviewBehavior': 'ERROR_IF_IN_REVIEW'},
                          json={}, timeout=60,
                      ),
                      f"{app['name']} commit edit",
                  )
                  results[app['package']] = {
                      'version_code': version_code,
                      'edit': commit,
                      'executor': 'github-actions',
                  }
                  print(f"SUCCESS {app['name']} versionCode={version_code} committed to production")
              except Exception:
                  try:
                      session.delete(f'{API}/applications/{pkg}/edits/{edit_id}', timeout=30)
                  except Exception:
                      pass
                  raise

          Path('/tmp/google-play-launcher-results.json').write_text(json.dumps(results, indent=2), encoding='utf-8')
          PY

      - name: Reconcile Publisher status after cloud upload
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" <<'REMOTE'
          set -euo pipefail
          cd /opt/aplus-publisher
          docker compose exec -T web python manage.py shell -c "from django.utils import timezone; from apps.publisher.models import Release,Job,Submission; targets=[('1d49500db4b8a02b2a0f1ac01ea314eb82984e00','5'),('c8fa10ccb1d44e4c6d747fcf8c3954c1933d9298','4')]; [(lambda r,b,vc: (Job.objects.filter(release=r,type='upload_google',status='failed').update(status='cancelled',error='Superseded by successful Google Play cloud upload.'), Job.objects.create(app=r.app,release=r,build=b,type='upload_google',status='succeeded',progress=100,result={'executor':'github-actions','version_code':vc},logs='Google Play production update committed successfully from GitHub cloud edge.',started_at=timezone.now(),finished_at=timezone.now()), Submission.objects.update_or_create(app=r.app,release=r,platform='android',defaults={'state':'in_review','submitted_at':timezone.now(),'raw':{'executor':'github-actions','version_code':vc}}), setattr(r,'status','in_review'), r.save(update_fields=['status','updated_at']), print(f'{r.app.slug}: release={r.pk} build={r.build_number} marked in_review')))(r,r.builds.filter(platform='android',status='succeeded').first(),vc) for s,vc in targets for r in [Release.objects.filter(source_commit=s).order_by('-created_at').first()] if r]"
          REMOTE

      - name: Final Publisher diagnostics
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py release_launcher_icon_updates --diagnose"
