name: Regenerate Smarbiz Store Review Account

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smarbiz-rotate-review-account.yml'

permissions:
  contents: read

jobs:
  rotate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Install SSH client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null

      - name: Create a fresh real Smarbiz review account and update Apple
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell" <<'PY'
          import json
          import os
          import urllib.request

          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings')
          import django
          django.setup()

          from apps.integrations.apple_store import AppleStoreClient
          from apps.publisher.models import MobileApp
          from apps.signing.management.commands.bootstrap_smarbiz_final import Command as SmarbizCommand

          app = MobileApp.objects.get(slug='smarbiz')

          # The operator accidentally replaced only Publisher's encrypted copy with
          # an unrelated password. Clear both fields and let the original bootstrap
          # create a NEW real Smarbiz account via /api/auth/signup, then store the
          # exact matching generated credential encrypted in Publisher.
          app.review_username = ''
          app.review_password_blob = ''
          app.save(update_fields=['review_username', 'review_password_blob', 'updated_at'])

          command = SmarbizCommand()
          app = command._upsert_app()
          if not app.review_username or not app.get_review_password():
              raise SystemExit('Fresh review account was not created.')

          # Verify the newly generated credential against the real public Smarbiz
          # login endpoint. The password is never printed.
          body = json.dumps({
              'email': app.review_username,
              'password': app.get_review_password(),
          }).encode('utf-8')
          request = urllib.request.Request(
              'https://smarbiz.sbs/api/auth/login',
              data=body,
              headers={'Content-Type': 'application/json', 'User-Agent': 'APlusPublisher/1.0'},
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.loads(response.read().decode('utf-8'))
              returned = (payload.get('user') or {}).get('email', '').lower()
              if response.status != 200 or not payload.get('access_token') or returned != app.review_username.lower():
                  raise SystemExit('Fresh review account failed the real Smarbiz login test.')
          print('smarbiz_review_login=verified')
          print('smarbiz_review_email=' + app.review_username)

          # Keep the already-submitted Apple version on the same verified account.
          apple = AppleStoreClient(app.apple_account)
          apple_app = apple.find_app(app.bundle_id)
          version = next(
              (v for v in apple.list_versions(apple_app['id']) if v.get('attributes', {}).get('versionString') == '1.0.0'),
              None,
          )
          if not version:
              raise SystemExit('Apple version 1.0.0 was not found.')
          contact = {
              'contactFirstName': 'Ashkan',
              'contactLastName': 'Asadian',
              'contactPhone': '+491727779721',
              'contactEmail': 'info@aplus-solution.de',
          }
          apple.set_review_details(version['id'], app, contact=contact)
          print('apple_review_credentials=updated')

          matched_state = 'unknown'
          for state in ('WAITING_FOR_REVIEW', 'IN_REVIEW', 'READY_FOR_REVIEW'):
              try:
                  submissions = apple.list_review_submissions(apple_app['id'], state)
              except Exception:
                  continue
              for submission in submissions:
                  try:
                      items = apple.list_review_submission_items(submission['id'])
                  except Exception:
                      continue
                  if any(
                      str((item.get('relationships', {}).get('appStoreVersion', {}).get('data') or {}).get('id')) == str(version['id'])
                      for item in items
                  ):
                      matched_state = state
                      break
              if matched_state != 'unknown':
                  break
          print('apple_review_state=' + matched_state)
          print('review_account_rotation=complete')
          PY
