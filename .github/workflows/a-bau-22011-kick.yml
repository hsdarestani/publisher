name: Kick A+Bau 2.2.4 build 22011

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/a-bau-22011-kick.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical A+Bau release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run a-bau-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            -f app_version=2.2.4 \
            -f build_number=22011
          echo "Dispatched A+Bau 2.2.4 build 22011 through canonical Publisher release."
