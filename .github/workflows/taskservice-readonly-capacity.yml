name: TaskService prerequisite capacity inspection
on:
  push:
    branches: ['codex/taskservice-readonly-capacity']
    paths: ['.github/workflows/taskservice-readonly-capacity.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 6
    steps:
      - name: Inspect the Publisher VPS with the existing deployment key
        shell: bash
        env:
          HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ -z "$HOST" || -z "$DEPLOY_KEY" ]]; then
            printf 'The Publisher production environment did not supply its host and deployment key.\n'
            exit 1
          fi
          port="${SSH_PORT:-22}"
          [[ "$HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]+$ && "$port" =~ ^[0-9]{1,5}$ ]]
          # Reimflow is a DNS-only alias for the Publisher origin confirmed in
          # Cloudflare. Require its valid HTTPS service on the same address.
          address="$(getent ahostsv4 "$HOST" | awk '{print $1}' | sort -u)"
          expected="$(getent ahostsv4 reimflow.smarbiz.sbs | awk '{print $1}' | sort -u)"
          if [[ -z "$address" || "$address" == *$'\n'* || "$address" != "$expected" ]]; then
            printf 'Publisher HOST does not resolve to the configured service origin.\n'
            exit 1
          fi
          if ! curl --silent --noproxy '*' --proto '=https' --connect-timeout 5 --max-time 12 \
            --resolve "reimflow.smarbiz.sbs:443:$address" -o /dev/null https://reimflow.smarbiz.sbs/; then
            printf 'Publisher origin did not pass the HTTPS service identity check.\n'
            exit 1
          fi
          umask 077
          temp="$(mktemp -d "$RUNNER_TEMP/publisher-taskservice.XXXXXXXX")"
          trap 'if [[ -n "${SSH_AGENT_PID:-}" ]]; then ssh-agent -k >/dev/null 2>&1 || true; fi; rm -rf -- "$temp"' EXIT
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$temp/key"
          unset DEPLOY_KEY
          if [[ -n "$DEPLOY_PASSPHRASE" ]]; then
            eval "$(ssh-agent -s)" >/dev/null
            printf '%s\n' '#!/bin/sh' 'printf "%s\n" "$DEPLOY_PASSPHRASE"' > "$temp/askpass"
            chmod 0700 "$temp/askpass"
            SSH_ASKPASS="$temp/askpass" SSH_ASKPASS_REQUIRE=force setsid ssh-add "$temp/key" </dev/null
          fi
          unset DEPLOY_PASSPHRASE
          ssh -i "$temp/key" -o IdentitiesOnly=yes -o BatchMode=yes -o ForwardAgent=no \
            -o StrictHostKeyChecking=accept-new -o HostKeyAlias=publisher-strato \
            -o UserKnownHostsFile="$temp/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o LogLevel=ERROR -o ConnectTimeout=10 -p "$port" root@"$address" 'bash -se' <<'REMOTE'
          set -euo pipefail
          export LC_ALL=C
          cd /opt/aplus-publisher
          printf 'authenticated_publisher_vps=yes\n'
          if [[ -r /etc/ssh/ssh_host_ed25519_key.pub ]]; then
            ssh-keygen -E sha256 -lf /etc/ssh/ssh_host_ed25519_key.pub | awk '{print "ssh_ed25519_fingerprint=" $2}'
          fi
          printf 'audit_utc='
          date -u '+%Y-%m-%dT%H:%M:%SZ'
          printf 'available_vcpu='
          nproc
          lscpu | awk -F: '/^(CPU\(s\)|Socket\(s\)|Core\(s\) per socket|Thread\(s\) per core):/ {print}'
          awk '{print "load_1_5_15=" $1 "," $2 "," $3}' /proc/loadavg
          free -m
          awk '$1 == "MemAvailable:" {print "memory_available_kib=" $2}' /proc/meminfo
          swapon --show=TYPE,SIZE,USED,PRIO
          df -h --output=size,used,avail,pcent,target / /opt
          df -i --output=itotal,iused,iavail,ipcent,target / /opt
          for resource in cpu memory io; do
            if [[ -r "/proc/pressure/$resource" ]]; then
              printf 'psi_%s\n' "$resource"
              cut -d' ' -f1-4 "/proc/pressure/$resource"
            fi
          done
          if command -v vmstat >/dev/null; then vmstat 1 4; fi
          docker ps --format '{{.Status}}' | awk '{total++; if ($0 ~ /unhealthy/) unhealthy++} END {print "running_containers=" total+0 ",unhealthy=" unhealthy+0}'
          docker compose ps --format 'table {{.Service}}\t{{.State}}\t{{.Health}}'
          docker stats --no-stream --format '{{.CPUPerc}} {{.MemUsage}} {{.BlockIO}}' | awk '{print "container_" NR, $0}'
          printf 'tcp_listener_count='
          ss -H -ltn | wc -l
          printf 'udp_listener_count='
          ss -H -lun | wc -l
          printf 'http_tls_and_db_ports_bound='
          ss -H -lnt | awk '{n=split($4,a,":"); if (a[n] ~ /^(80|443|5432|8000|8080)$/) print a[n]}' | sort -un | paste -sd, -
          printf 'publisher_local_http='
          curl -sS --connect-timeout 5 --max-time 10 -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8000/ || true
          docker compose exec -T db sh -c 'PGOPTIONS="-c default_transaction_read_only=on -c statement_timeout=5000" psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At' <<'SQL'
          SELECT 'pg_connections=' || count(*) || ',active=' || count(*) FILTER (WHERE state='active') ||
            ',max=' || current_setting('max_connections') FROM pg_stat_activity WHERE datname=current_database();
          SELECT 'pg_commits=' || xact_commit || ',rollbacks=' || xact_rollback || ',disk_reads=' || blks_read ||
            ',cache_hits=' || blks_hit FROM pg_stat_database WHERE datname=current_database();
          SQL
          count=0
          for dir in /opt/aplus-publisher/backups /var/backups/aplus-publisher; do
            if [[ -d "$dir" ]]; then
              printf 'backup_candidate_ages_bytes\n'
              find "$dir" -maxdepth 1 -type f -printf '%TY-%Tm-%Td %TH:%TM UTC %s\n' | sort -r | sed -n '1,5p'
              count=$((count + 1))
            fi
          done
          printf 'known_backup_directories_present=%s\n' "$count"
          REMOTE
