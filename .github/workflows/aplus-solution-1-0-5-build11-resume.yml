name: A+ Solution 1.0.5 Build 11 Resume

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aplus-solution-1-0-5-build11-resume.yml'

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: aplus-solution-1-0-5-build11-submit
  cancel-in-progress: false

env:
  RELEASE_ID: '31'
  APLUS_COMMIT: 'b9e024956026220fce9e5b9ba694b64f3138547c'
  STATUS_ISSUE: '74'

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    steps:
      - name: Install SSH tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null

      - name: Verify exact release and source
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          OUT="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T -e RELEASE_ID='$RELEASE_ID' -e APLUS_COMMIT='$APLUS_COMMIT' web python manage.py shell -c \"import os; from apps.publisher.models import Release; r=Release.objects.get(id=os.environ['RELEASE_ID']); assert r.version_name=='1.0.5'; assert r.build_number==11; assert r.source_commit==os.environ['APLUS_COMMIT']; print('release_verified=1.0.5-build11')\"" | tail -n 1 | tr -d '\r')"
          test "$OUT" = 'release_verified=1.0.5-build11'

      - name: Wake queued Android and iOS builders
        uses: actions/github-script@v7
        with:
          script: |
            for (const workflow_id of ['cloud-linux.yml','cloud-macos.yml']) {
              await github.rest.actions.createWorkflowDispatch({owner: context.repo.owner, repo: context.repo.repo, workflow_id, ref: 'main'});
            }

      - name: Wait for signed Android AAB and iOS IPA
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          for i in $(seq 1 240); do
            STATE="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
              "cd /opt/aplus-publisher && docker compose exec -T -e RELEASE_ID='$RELEASE_ID' web python manage.py shell -c \"import os; from apps.publisher.models import Build,Job,Release; r=Release.objects.get(id=os.environ['RELEASE_ID']); a=Build.objects.get(release=r,platform='android'); x=Build.objects.get(release=r,platform='ios'); af=Job.objects.filter(build=a,type='build_android',status='failed').order_by('-created_at').first(); xf=Job.objects.filter(build=x,type='build_ios',status='failed').order_by('-created_at').first(); print('|'.join(['android',a.status,'artifact' if a.artifact else '',(af.error or '')[:160].replace('|','/') if af else '','ios',x.status,'artifact' if x.artifact else '',(xf.error or '')[:160].replace('|','/') if xf else '']))\"" | tail -n 1 | tr -d '\r')"
            echo "Native build state: $STATE"
            IFS='|' read -r _ AST AART AERR _ IST IART IERR <<< "$STATE"
            if [ "$AST" = 'failed' ]; then echo "Android build failed: $AERR" >&2; exit 1; fi
            if [ "$IST" = 'failed' ]; then echo "iOS build failed: $IERR" >&2; exit 1; fi
            if [ "$AST" = 'succeeded' ] && [ "$AART" = 'artifact' ] && [ "$IST" = 'succeeded' ] && [ "$IART" = 'artifact' ]; then exit 0; fi
            sleep 20
          done
          echo 'Timed out waiting for native artifacts.' >&2
          exit 1

      - name: Queue Google Play production submit and Apple upload
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T -e RELEASE_ID='$RELEASE_ID' web python manage.py shell" <<'PY'
          import os
          from apps.publisher.models import Job, Release
          from apps.publisher.tasks import enqueue_job
          r = Release.objects.get(id=os.environ['RELEASE_ID'])
          app = r.app
          android = r.builds.get(platform='android')
          ios = r.builds.get(platform='ios')
          assert android.status == 'succeeded' and android.artifact
          assert ios.status == 'succeeded' and ios.artifact
          if not Job.objects.filter(release=r, type='submit_google', status__in=['queued','running','succeeded']).exists():
              enqueue_job('submit_google', app=app, release=r, build=android)
          if not ios.external_build_id and not Job.objects.filter(build=ios, type='upload_apple', status__in=['queued','running','succeeded']).exists():
              enqueue_job('upload_apple', app=app, release=r, build=ios, agent=True, platform='macos')
          print('store_delivery_queued')
          PY

      - name: Wake Mac upload worker
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({owner: context.repo.owner, repo: context.repo.repo, workflow_id: 'cloud-macos.yml', ref: 'main'});

      - name: Wait for Google production delivery and Apple processing
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          for i in $(seq 1 180); do
            STATE="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
              "cd /opt/aplus-publisher && docker compose exec -T -e RELEASE_ID='$RELEASE_ID' web python manage.py shell -c \"import os; from apps.publisher.models import Job,Release; r=Release.objects.get(id=os.environ['RELEASE_ID']); i=r.builds.get(platform='ios'); g=Job.objects.filter(release=r,type='submit_google').order_by('-created_at').first(); u=Job.objects.filter(release=r,type='upload_apple').order_by('-created_at').first(); print('|'.join([g.status if g else 'missing',(g.error or '')[:180].replace('|','/') if g else '',u.status if u else ('succeeded' if i.external_build_id else 'missing'),(u.error or '')[:180].replace('|','/') if u else '',i.external_build_id or '']))\"" | tail -n 1 | tr -d '\r')"
            echo "Store delivery state: $STATE"
            IFS='|' read -r GST GERR UST UERR APPLE_ID <<< "$STATE"
            if [ "$GST" = 'failed' ]; then echo "Google submit failed: $GERR" >&2; exit 1; fi
            if [ "$UST" = 'failed' ]; then echo "Apple upload failed: $UERR" >&2; exit 1; fi
            if [ "$GST" = 'succeeded' ] && [ -n "$APPLE_ID" ]; then exit 0; fi
            sleep 20
          done
          echo 'Timed out waiting for store delivery.' >&2
          exit 1

      - name: Submit Build 11 to App Review
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T -e RELEASE_ID='$RELEASE_ID' web python manage.py shell" <<'PY'
          import os, time
          from apps.integrations.apple_store import AppleStoreClient
          from apps.publisher.models import Job, Release
          from apps.publisher.tasks import enqueue_job
          r = Release.objects.get(id=os.environ['RELEASE_ID'])
          app = r.app
          build = r.builds.get(platform='ios')
          assert build.status == 'succeeded' and build.external_build_id
          client = AppleStoreClient(app.apple_account)
          apple_app = client.find_app(app.bundle_id)
          version = client.ensure_version(apple_app['id'], r.version_name)
          version_id = str(version['id'])
          canceled = []
          for state in ('WAITING_FOR_REVIEW','IN_REVIEW'):
              for submission in client.list_review_submissions(apple_app['id'], state):
                  item, _ = client._review_submission_matches(submission, version_id)
                  if item:
                      client.cancel_review_submission(submission['id'])
                      canceled.append(submission['id'])
          if canceled:
              for _ in range(30):
                  active = False
                  for state in ('WAITING_FOR_REVIEW','IN_REVIEW'):
                      for submission in client.list_review_submissions(apple_app['id'], state):
                          item, _ = client._review_submission_matches(submission, version_id)
                          if item:
                              active = True
                              break
                      if active:
                          break
                  if not active:
                      break
                  time.sleep(2)
              if active:
                  raise SystemExit('Prior Apple review did not leave the active queue.')
          if not Job.objects.filter(release=r, type='submit_apple', status__in=['queued','running','succeeded']).exists():
              enqueue_job('submit_apple', app=app, release=r, build=build)
          print('apple_review_queued')
          PY

      - name: Wait for both store submissions
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          for i in $(seq 1 120); do
            STATE="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
              "cd /opt/aplus-publisher && docker compose exec -T -e RELEASE_ID='$RELEASE_ID' web python manage.py shell -c \"import os; from apps.publisher.models import Job,Release,Submission; r=Release.objects.get(id=os.environ['RELEASE_ID']); g=Job.objects.filter(release=r,type='submit_google').order_by('-created_at').first(); a=Job.objects.filter(release=r,type='submit_apple').order_by('-created_at').first(); gs=Submission.objects.filter(release=r,platform='android').first(); aps=Submission.objects.filter(release=r,platform='ios').first(); print('|'.join([g.status if g else 'missing',(g.error or '')[:180].replace('|','/') if g else '',a.status if a else 'missing',(a.error or '')[:180].replace('|','/') if a else '',gs.state if gs else '',aps.state if aps else '',aps.external_id if aps else '']))\"" | tail -n 1 | tr -d '\r')"
            echo "Review submission state: $STATE"
            IFS='|' read -r GST GERR AST AERR GS AS AID <<< "$STATE"
            if [ "$GST" = 'failed' ]; then echo "Google failed: $GERR" >&2; exit 1; fi
            if [ "$AST" = 'failed' ]; then echo "Apple failed: $AERR" >&2; exit 1; fi
            if [ "$GST" = 'succeeded' ] && [ "$AST" = 'succeeded' ] && [ -n "$GS" ] && [ -n "$AS" ]; then exit 0; fi
            sleep 15
          done
          echo 'Timed out waiting for review submissions.' >&2
          exit 1

      - name: Publish success status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(printf '✅ A+ Solution 1.0.5 (Build 11) was built from the latest Dienstplan release and submitted to both stores.\n\n- Source commit: `%s`\n- Production: **live and verified**\n- Google Play production: **submitted**\n- App Store Connect: **submitted for review**\n- Workflow: %s/%s/actions/runs/%s\n\nStore review/processing is now controlled by Google and Apple.' "$APLUS_COMMIT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$STATUS_ISSUE" -f body="$body" -f state=closed >/dev/null

      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(printf '❌ A+ Solution 1.0.5 Build 11 resume hit a blocker.\n\n- Source commit: `%s`\n- Workflow: %s/%s/actions/runs/%s\n' "$APLUS_COMMIT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$STATUS_ISSUE" -f body="$body" -f state=open >/dev/null
