name: Inspect BE DIFFERENT 1.1 build 9 store status
on:
  push:
    branches: [main]
    paths: ['.github/workflows/be-different-1-1-submit.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: be-different-1-1-submit
  cancel-in-progress: false
jobs:
  submit:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    steps:
      - name: Verify exact store states without publishing changes
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" 'cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell' <<'PY'
          import json
          from apps.publisher.models import Release,Submission
          from apps.integrations.apple_store import AppleStoreClient
          from apps.integrations.google_play import GooglePlayClient
          r=Release.objects.get(pk=131,app__slug="be-different",build_number=9)
          a=r.app
          c=AppleStoreClient(a.apple_account)
          v=c.request("GET","/appStoreVersions/bec48543-3f4a-47b5-9fb6-53701512abb2")["data"]
          print("APPLE_VERIFIED_VERSION="+json.dumps({"id":v["id"],"version":v["attributes"]["versionString"],"state":v["attributes"]["appStoreState"]}))
          g=GooglePlayClient(a.google_account)
          e=g._open_edit(a.package_name)
          try:
              t=g._edit_request(e,"GET",f"/applications/{g._q(a.package_name)}/edits/{e.edit_id}/tracks/production")
              print("GOOGLE_VERIFIED_PRODUCTION="+json.dumps(t))
          finally:g._safe_delete_edit(e)
          print("BUILD9_SUBMISSIONS="+json.dumps(list(Submission.objects.filter(release=r).values("platform","state","external_id"))))
          print("NATIVE_SCREENSHOTS="+json.dumps(list(a.assets.filter(kind="screenshot").values("platform","locale","device_type","width","height"))))
          PY
