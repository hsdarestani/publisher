name: A+ Cloud Mac

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: aplus-cloud-macos
  cancel-in-progress: false

jobs:
  cloud-macos-agent:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Checkout A+ Publisher agent
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install agent dependencies
        run: pip install 'requests>=2.32,<3' 'PyJWT[crypto]>=2.10,<3'

      - name: Show Apple build environment
        run: |
          sw_vers
          xcodebuild -version
          xcrun --find iTMSTransporter

      - name: Wait for Publisher health
        run: |
          curl --fail --silent --show-error \
            --retry 18 --retry-all-errors --retry-delay 10 \
            --connect-timeout 10 --max-time 20 \
            https://publisher.smarbiz.sbs/healthz/

      - name: Claim and execute macOS jobs
        id: cloud
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: '1'
          PUBLISHER_URL: https://publisher.smarbiz.sbs
          PUBLISHER_MAX_JOBS: '3'
        run: |
          set +e
          python agents/cloud_macos.py 2>&1 | tee /tmp/cloud-mac.log
          AGENT_EXIT=${PIPESTATUS[0]}
          if [ "$AGENT_EXIT" -ne 0 ]; then
            echo "--- Publisher diagnostic response ---" | tee -a /tmp/cloud-mac.log
            python - <<'PY' 2>&1 | tee -a /tmp/cloud-mac.log
          import sys
          sys.path.insert(0, "agents")
          import requests
          from cloud_macos import GitHubOIDCAuth, GitHubOIDCProvider

          server = "https://publisher.smarbiz.sbs"
          session = requests.Session()
          session.auth = GitHubOIDCAuth(GitHubOIDCProvider(server))
          response = session.post(f"{server}/apps/agent-api/claim/", timeout=45)
          print(f"HTTP {response.status_code}")
          print(response.text[:4000])
          PY
            exit "$AGENT_EXIT"
          fi

      - name: Report cloud Mac status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const ok = '${{ steps.cloud.outcome }}' === 'success';
            const log = fs.existsSync('/tmp/cloud-mac.log')
              ? fs.readFileSync('/tmp/cloud-mac.log', 'utf8').slice(-12000)
              : 'No cloud Mac agent log was produced.';
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 3,
              title: ok ? 'A+ Cloud Mac healthy' : 'A+ Cloud Mac failed',
              state: ok ? 'closed' : 'open',
              body: (ok
                ? '✅ GitHub provisioned a real macOS runner, Xcode and Transporter were available, OIDC authentication to Publisher succeeded, and the agent checked the iOS queue.'
                : '### Cloud Mac failure\n\n```text\n' + log + '\n```')
                + '\n\nWorkflow run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            });

      - name: Enforce cloud Mac result
        if: steps.cloud.outcome == 'failure'
        run: exit 1
