name: Submit latest A+ Solution build to both stores

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kick-aplus-solution-1-0-2.yml'

permissions:
  contents: read
  actions: write
  issues: write

env:
  APLUS_COMMIT: '0500ae6623e423cda171010c31caa69be438aa71'
  STATUS_ISSUE: '74'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    steps:
      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass jq >/dev/null

      - name: Wait for Publisher deployment from this commit
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            JSON="$(curl -fsSL "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=20")"
            ROW="$(printf '%s' "$JSON" | jq -c '.workflow_runs[] | select(.name=="Validate and deploy A+ Publisher")' | head -n1)"
            if [ -n "$ROW" ]; then
              STATUS="$(printf '%s' "$ROW" | jq -r '.status')"
              CONCLUSION="$(printf '%s' "$ROW" | jq -r '.conclusion // ""')"
              echo "Publisher deploy: $STATUS $CONCLUSION"
              if [ "$STATUS" = 'completed' ]; then
                test "$CONCLUSION" = 'success'
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'Timed out waiting for Publisher deployment.' >&2
          exit 1

      - name: Verify exact A+ production commit is live
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            JSON="$(curl -fsSL https://api.github.com/repos/hsdarestani/aplussolution/issues/84)"
            STATE="$(printf '%s' "$JSON" | jq -r '.state')"
            BODY="$(printf '%s' "$JSON" | jq -r '.body // ""')"
            if printf '%s' "$BODY" | grep -Fq "Commit: $APLUS_COMMIT" && [ "$STATE" = 'closed' ] && printf '%s' "$BODY" | grep -Fq 'Overall: **success**'; then
              curl -fsS --retry 10 --retry-delay 3 https://solution.smarbiz.sbs/health/ >/dev/null
              echo "A+ production commit verified: $APLUS_COMMIT"
              exit 0
            fi
            sleep 10
          done
          echo 'Latest A+ production commit was not verified.' >&2
          exit 1

      - name: Prepare release and queue Android + iOS builds
        id: prepare
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py provision_ios_signing a-plus-solution --no-queue"

          OUT="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T -e APLUS_COMMIT='$APLUS_COMMIT' web python manage.py shell" <<'PY'
          import json, os, re
          from apps.integrations.apple_store import AppleStoreClient
          from apps.integrations.google_play import GooglePlayClient
          from apps.publisher.models import Build, Job, MobileApp, Release
          from apps.publisher.tasks import enqueue_job

          app=MobileApp.objects.get(slug='a-plus-solution')
          assert app.google_account and app.google_account.configured
          assert app.apple_account and app.apple_account.configured
          assert app.review_username and app.get_review_password()

          cfg=dict(app.build_config or {})
          cfg['android_command']='bash frontend/scripts/build-publisher-android.sh'
          cfg['android_artifact']='frontend/android/app/build/outputs/bundle/release/*.aab'
          cfg['ios_command']='bash frontend/scripts/build-publisher-ios-opaque.sh'
          cfg['ios_artifact']='frontend/ios/build/export/*.ipa'
          env=dict(cfg.get('env') or {})
          env['VITE_API_URL']='https://solution.smarbiz.sbs/api'
          cfg['env']=env
          app.build_config=cfg
          app.requires_login=True
          app.review_notes=(
              'A+ Solution is the internal workforce application used by A+ Solution GmbH for employee scheduling, OpenShifts, '
              'time tracking, availability, documents, contracts, notifications and internal communication. '
              'The supplied App Review account is a dedicated active employee test account with no invitation step and no two-factor authentication. '
              'This update includes the latest production scheduling and mobile usability improvements, including WIW-style OpenShift handling, '
              'shift editing/copy/delete actions, employee assignment, improved time and location workflows, dashboard synchronization and stability fixes. '
              'There are no in-app purchases.'
          )
          app.save(update_fields=['build_config','requires_login','review_notes','updated_at'])
          loc=app.localizations.filter(locale='de-DE').first()
          if loc:
              loc.release_notes='Verbesserte Dienstplanung und OpenShifts, schnellere mobile Abläufe, Schichtbearbeitung und Zuweisung sowie Stabilitätsverbesserungen.'
              loc.save(update_fields=['release_notes','updated_at'])

          apple=AppleStoreClient(app.apple_account)
          apple_app=apple.find_app(app.bundle_id)
          versions=apple.list_versions(apple_app['id'], limit=50)

          def semver(value):
              nums=[int(x) for x in re.findall(r'\d+', str(value or ''))[:3]]
              while len(nums)<3: nums.append(0)
              return tuple(nums)
          def bump(value):
              a,b,c=semver(value)
              return f'{a}.{b}.{c+1}'

          current=max(versions, key=lambda x: semver((x.get('attributes') or {}).get('versionString')), default=None)
          attrs=(current or {}).get('attributes') or {}
          current_version=attrs.get('versionString') or '1.0.2'
          current_state=attrs.get('appStoreState') or attrs.get('appVersionState') or 'UNKNOWN'
          replaceable={'PREPARE_FOR_SUBMISSION','READY_FOR_REVIEW','DEVELOPER_REJECTED','METADATA_REJECTED','REJECTED','WAITING_FOR_REVIEW','IN_REVIEW','INVALID_BINARY'}
          target_version=current_version if current_state in replaceable else bump(current_version)

          db_max=max(Release.objects.filter(app=app).values_list('build_number',flat=True), default=0)
          apple_max=0
          for item in apple.list_builds(apple_app['id'], limit=100):
              try: apple_max=max(apple_max,int((item.get('attributes') or {}).get('version')))
              except (TypeError,ValueError): pass

          google_max=0
          gp=GooglePlayClient(app.google_account)
          edit=None
          try:
              edit=gp._open_edit(app.package_name)
              tracks=gp._edit_request(edit,'GET',f'/applications/{gp._q(app.package_name)}/edits/{edit.edit_id}/tracks').get('tracks',[])
              for track in tracks:
                  for rel in track.get('releases') or []:
                      for code in rel.get('versionCodes') or []:
                          try: google_max=max(google_max,int(code))
                          except (TypeError,ValueError): pass
          finally:
              if edit: gp._safe_delete_edit(edit)

          build_number=max(db_max,apple_max,google_max)+1
          release,_=Release.objects.get_or_create(app=app,version_name=target_version,build_number=build_number)
          release.status='building'
          release.source_branch='main'
          release.source_commit=os.environ['APLUS_COMMIT']
          release.android_track='production'
          release.android_rollout=1
          release.ios_release_type='automatic'
          release.auto_submit=False
          release.release_notes='Aktuelle A+ Solution Workforce-Funktionen und Stabilitätsverbesserungen.'
          release.save()

          queued=[]
          for platform,job_type,runner in [('android','build_android','linux'),('ios','build_ios','macos')]:
              build,_=Build.objects.get_or_create(release=release,platform=platform)
              if not Job.objects.filter(build=build,type=job_type,status__in=['queued','running']).exists():
                  build.status='queued'; build.logs=''; build.finished_at=None; build.external_build_id=''; build.metadata={}
                  if build.artifact: build.artifact.delete(save=False)
                  build.artifact=''; build.artifact_size=0; build.artifact_checksum=''; build.save()
                  queued.append(str(enqueue_job(job_type,app=app,release=release,build=build,payload={'source':'latest-store-update'},agent=True,platform=runner).id))

          print('RELEASE_META_JSON='+json.dumps({'release_id':str(release.id),'version':target_version,'build':build_number,'apple_state':current_state,'queued':queued},separators=(',',':')))
          PY
          )"
          printf '%s\n' "$OUT"
          META="$(printf '%s\n' "$OUT" | sed -n 's/^RELEASE_META_JSON=//p' | tail -n1)"
          test -n "$META"
          echo "release_id=$(printf '%s' "$META" | jq -r '.release_id')" >> "$GITHUB_OUTPUT"
          echo "version=$(printf '%s' "$META" | jq -r '.version')" >> "$GITHUB_OUTPUT"
          echo "build=$(printf '%s' "$META" | jq -r '.build')" >> "$GITHUB_OUTPUT"
          echo "apple_state=$(printf '%s' "$META" | jq -r '.apple_state')" >> "$GITHUB_OUTPUT"

      - name: Publish running status
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
          BUILD: ${{ steps.prepare.outputs.build }}
          APPLE_STATE: ${{ steps.prepare.outputs.apple_state }}
        run: |
          body=$(printf 'A+ Solution store update is running.\n\n- Source commit: `%s`\n- Version: **%s**\n- Build: **%s**\n- Previous Apple state: **%s**\n- Android + iOS: **building**\n- Workflow: %s/%s/actions/runs/%s\n' "$APLUS_COMMIT" "$VERSION" "$BUILD" "$APPLE_STATE" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$STATUS_ISSUE" -f body="$body" -f state=open >/dev/null

      - name: Wake Android and iOS builders
        uses: actions/github-script@v7
        with:
          script: |
            for (const workflow_id of ['cloud-linux.yml','cloud-macos.yml']) {
              await github.rest.actions.createWorkflowDispatch({owner: context.repo.owner, repo: context.repo.repo, workflow_id, ref: 'main'});
            }

      - name: Wait for signed AAB and IPA
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          RELEASE_ID: ${{ steps.prepare.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          for i in $(seq 1 240); do
            STATE="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" "cd /opt/aplus-publisher && docker compose exec -T -e RELEASE_ID='$RELEASE_ID' web python manage.py shell -c \"import os; from apps.publisher.models import Build,Job,Release; r=Release.objects.get(id=os.environ['RELEASE_ID']); vals=[];\nfor p,t in [('android','build_android'),('ios','build_ios')]:\n b=Build.objects.get(release=r,platform=p); f=Job.objects.filter(build=b,type=t,status='failed').order_by('-created_at').first(); vals.append(':'.join([p,b.status,'artifact' if b.artifact else '',(f.error or '')[:180].replace('|','/') if f else '']));\nprint('|'.join(vals))\"" | tail -n1 | tr -d '\r')"
            echo "Build state: $STATE"
            if [[ "$STATE" == *"failed"* ]]; then echo "$STATE" >&2; exit 1; fi
            if [[ "$STATE" == android:succeeded:artifact:*"|"ios:succeeded:artifact:* ]]; then exit 0; fi
            sleep 20
          done
          exit 1

      - name: Queue Google Play submit and Apple upload
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          RELEASE_ID: ${{ steps.prepare.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" "cd /opt/aplus-publisher && docker compose exec -T -e RELEASE_ID='$RELEASE_ID' web python manage.py shell" <<'PY'
          import os
          from apps.publisher.models import Job,Release
          from apps.publisher.tasks import enqueue_job
          r=Release.objects.get(id=os.environ['RELEASE_ID']); app=r.app
          android=r.builds.get(platform='android'); ios=r.builds.get(platform='ios')
          assert android.status=='succeeded' and android.artifact
          assert ios.status=='succeeded' and ios.artifact
          if not Job.objects.filter(release=r,type='submit_google',status__in=['queued','running','succeeded']).exists(): enqueue_job('submit_google',app=app,release=r,build=android)
          if not ios.external_build_id and not Job.objects.filter(build=ios,type='upload_apple',status__in=['queued','running','succeeded']).exists(): enqueue_job('upload_apple',app=app,release=r,build=ios,agent=True,platform='macos')
          PY

      - name: Wake Mac uploader
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({owner: context.repo.owner, repo: context.repo.repo, workflow_id: 'cloud-macos.yml', ref: 'main'});

      - name: Wait for Google submit and processed Apple build
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          RELEASE_ID: ${{ steps.prepare.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          for i in $(seq 1 180); do
            STATE="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" "cd /opt/aplus-publisher && docker compose exec -T -e RELEASE_ID='$RELEASE_ID' web python manage.py shell -c \"import os; from apps.publisher.models import Job,Release; r=Release.objects.get(id=os.environ['RELEASE_ID']); i=r.builds.get(platform='ios'); g=Job.objects.filter(release=r,type='submit_google').order_by('-created_at').first(); u=Job.objects.filter(release=r,type='upload_apple').order_by('-created_at').first(); print('|'.join([g.status if g else 'missing',(g.error or '')[:180].replace('|','/') if g else '',u.status if u else ('succeeded' if i.external_build_id else 'missing'),(u.error or '')[:180].replace('|','/') if u else '',i.external_build_id or '']))\"" | tail -n1 | tr -d '\r')"
            echo "Delivery state: $STATE"
            IFS='|' read -r GST GERR UST UERR APPLE_ID <<< "$STATE"
            if [ "$GST" = 'failed' ]; then echo "$GERR" >&2; exit 1; fi
            if [ "$UST" = 'failed' ]; then echo "$UERR" >&2; exit 1; fi
            if [ "$GST" = 'succeeded' ] && [ -n "$APPLE_ID" ]; then exit 0; fi
            sleep 20
          done
          exit 1

      - name: Replace prior Apple review and submit current build
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          RELEASE_ID: ${{ steps.prepare.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" "cd /opt/aplus-publisher && docker compose exec -T -e RELEASE_ID='$RELEASE_ID' web python manage.py shell" <<'PY'
          import os,time
          from apps.integrations.apple_store import AppleStoreClient
          from apps.publisher.models import Job,Release
          from apps.publisher.tasks import enqueue_job
          r=Release.objects.get(id=os.environ['RELEASE_ID']); app=r.app; build=r.builds.get(platform='ios')
          client=AppleStoreClient(app.apple_account); apple_app=client.find_app(app.bundle_id); version=client.ensure_version(apple_app['id'],r.version_name); version_id=str(version['id'])
          canceled=[]
          for state in ('WAITING_FOR_REVIEW','IN_REVIEW'):
              for submission in client.list_review_submissions(apple_app['id'],state):
                  item,_=client._review_submission_matches(submission,version_id)
                  if item: client.cancel_review_submission(submission['id']); canceled.append(submission['id'])
          if canceled:
              for _ in range(30):
                  active=False
                  for state in ('WAITING_FOR_REVIEW','IN_REVIEW'):
                      for submission in client.list_review_submissions(apple_app['id'],state):
                          item,_=client._review_submission_matches(submission,version_id)
                          if item: active=True; break
                      if active: break
                  if not active: break
                  time.sleep(2)
              if active: raise SystemExit('Previous Apple review is still active.')
          if not Job.objects.filter(release=r,type='submit_apple',status__in=['queued','running','succeeded']).exists(): enqueue_job('submit_apple',app=app,release=r,build=build)
          print('canceled_prior_reviews='+','.join(canceled))
          PY

      - name: Wait until both stores are submitted
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          RELEASE_ID: ${{ steps.prepare.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          for i in $(seq 1 120); do
            STATE="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" "cd /opt/aplus-publisher && docker compose exec -T -e RELEASE_ID='$RELEASE_ID' web python manage.py shell -c \"import os; from apps.publisher.models import Job,Release,Submission; r=Release.objects.get(id=os.environ['RELEASE_ID']); g=Job.objects.filter(release=r,type='submit_google').order_by('-created_at').first(); a=Job.objects.filter(release=r,type='submit_apple').order_by('-created_at').first(); gs=Submission.objects.filter(release=r,platform='android').first(); aps=Submission.objects.filter(release=r,platform='ios').first(); print('|'.join([g.status if g else 'missing',(g.error or '')[:220].replace('|','/') if g else '',a.status if a else 'missing',(a.error or '')[:220].replace('|','/') if a else '',gs.state if gs else '',aps.state if aps else '',aps.external_id if aps else '']))\"" | tail -n1 | tr -d '\r')"
            echo "Review state: $STATE"
            IFS='|' read -r GST GERR AST AERR GS AS AID <<< "$STATE"
            if [ "$GST" = 'failed' ]; then echo "$GERR" >&2; exit 1; fi
            if [ "$AST" = 'failed' ]; then echo "$AERR" >&2; exit 1; fi
            if [ "$GST" = 'succeeded' ] && [ "$AST" = 'succeeded' ] && [ -n "$GS" ] && [ -n "$AS" ]; then exit 0; fi
            sleep 15
          done
          exit 1

      - name: Publish success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
          BUILD: ${{ steps.prepare.outputs.build }}
        run: |
          body=$(printf '✅ A+ Solution latest production build was submitted to both stores.\n\n- Source commit: `%s`\n- Version: **%s**\n- Build: **%s**\n- Google Play production: **submitted**\n- App Store Connect: **submitted for review**\n- Workflow: %s/%s/actions/runs/%s\n' "$APLUS_COMMIT" "$VERSION" "$BUILD" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$STATUS_ISSUE" -f body="$body" -f state=closed >/dev/null

      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
          BUILD: ${{ steps.prepare.outputs.build }}
        run: |
          body=$(printf '❌ A+ Solution latest store update hit a blocker.\n\n- Source commit: `%s`\n- Version: **%s**\n- Build: **%s**\n- Workflow: %s/%s/actions/runs/%s\n' "$APLUS_COMMIT" "${VERSION:-pending}" "${BUILD:-pending}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$STATUS_ISSUE" -f body="$body" -f state=open >/dev/null
