name: Stage TaskService native demo and verify the existing database backup
on:
  push:
    branches: [codex/taskservice-readonly-capacity]
    paths: ['.github/workflows/taskservice-native-demo-stage.yml']
permissions: { contents: read }
concurrency:
  group: taskservice-publisher-stage
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hsdarestani/taskservice
          ref: 8d73bb3efcd114fe7da760ec30f7e6eb5a015536
          persist-credentials: false
      - name: Build the candidate off the VPS
        run: docker build -f v2/Dockerfile -t taskservice:demo-8d73bb3 .
      - name: Require a successful candidate CI run
        run: |
          set -euo pipefail
          for attempt in {1..35}; do
            checks="$(curl -fsS --max-time 10 'https://api.github.com/repos/hsdarestani/taskservice/actions/runs?head_sha=8d73bb3efcd114fe7da760ec30f7e6eb5a015536&event=pull_request&per_page=15')" || { sleep 8; continue; }
            state="$(jq -r '[.workflow_runs[] | select(.name=="TaskService V2 validation")] | first | .conclusion // ""' <<<"$checks")"
            if [[ "$state" == success ]]; then exit 0; fi
            if [[ "$state" == failure || "$state" == cancelled ]]; then exit 1; fi
            sleep 8
          done
          exit 1
      - name: Stage the isolated native demo without changing public traffic
        shell: bash
        env:
          HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$KEY"
          port="$SSH_PORT"; if [ -z "$port" ]; then port=22; fi
          addr="$(getent ahostsv4 "$HOST" | awk '{print $1}' | sort -u)"
          expected="$(getent ahostsv4 reimflow.smarbiz.sbs | awk '{print $1}' | sort -u)"
          test -n "$addr" && test "$addr" = "$expected"
          curl --silent --show-error --fail --noproxy '*' --proto '=https' --connect-timeout 5 --max-time 12 --resolve "reimflow.smarbiz.sbs:443:$addr" -o /dev/null https://reimflow.smarbiz.sbs/
          umask 077
          tmp="$(mktemp -d "$RUNNER_TEMP/ts-resume.XXXXXXXX")"
          trap 'if [ -n "${SSH_AGENT_PID:-}" ]; then ssh-agent -k >/dev/null 2>&1 || true; fi; rm -rf "$tmp"' EXIT
          printf '%s\n' "$KEY" | tr -d '\r' > "$tmp/key"
          chmod 600 "$tmp/key"
          unset KEY
          if [ -n "$PASSPHRASE" ]; then
            eval "$(ssh-agent -s)" >/dev/null
            printf '%s\n' '#!/bin/sh' 'printf "%s\n" "$PASSPHRASE"' > "$tmp/askpass"
            chmod 700 "$tmp/askpass"
            SSH_ASKPASS="$tmp/askpass" SSH_ASKPASS_REQUIRE=force setsid ssh-add "$tmp/key" </dev/null
          fi
          unset PASSPHRASE
          ssh-keyscan -T 8 -t ed25519 -p "$port" "$addr" > "$tmp/scanned" 2>/dev/null
          while read -r _ keytype keydata; do
            [ "$keytype" = ssh-ed25519 ] || continue
            printf 'publisher-strato %s %s\n' "$keytype" "$keydata" > "$tmp/candidate"
            actual="$(ssh-keygen -E sha256 -lf "$tmp/candidate" | awk '{print $2}')"
            if [ "$actual" = 'SHA256:G5zZTiYxEm6Hm2v/CYFe/4e7K3YwRCbOkABFBBy93vg' ]; then
              mv "$tmp/candidate" "$tmp/known_hosts"; break
            fi
          done < "$tmp/scanned"
          test -s "$tmp/known_hosts"
          ssh_publisher=(ssh -i "$tmp/key" -o IdentitiesOnly=yes -o BatchMode=yes -o ForwardAgent=no
            -o StrictHostKeyChecking=yes -o HostKeyAlias=publisher-strato -o HostKeyAlgorithms=ssh-ed25519
            -o UserKnownHostsFile="$tmp/known_hosts" -o GlobalKnownHostsFile=/dev/null
            -o ConnectTimeout=10 -p "$port" root@"$addr")
          "${ssh_publisher[@]}" '
            set -eu
            awk '\''/^MemAvailable:/ {if ($2 < 512000) exit 1; seen=1} END {if (!seen) exit 1}'\'' /proc/meminfo
            test "$(systemctl show taskservice.slice -p MemoryMax --value)" = 1610612736
            test "$(df --output=avail /var/lib/docker | tail -1)" -ge 3145728
          '
          docker save taskservice:demo-8d73bb3 | gzip -1 | "${ssh_publisher[@]}" 'docker load >/dev/null'
          "${ssh_publisher[@]}" 'bash -se -- taskservice:demo-8d73bb3' < v2/ops/stage-native-demo.sh
          "${ssh_publisher[@]}" '
            set -eu
            found="$(find /opt/taskservice/backups -maxdepth 1 -type d -name "pre-native-demo-*" | sort | tail -1)"
            test -n "$found"
            cd "$found"
            sha256sum -c --quiet SHA256SUMS
            cat taskservice.pgdump
          ' > "$tmp/pilot.pgdump"
          docker run --rm -d --name taskservice-demo-restore -e POSTGRES_HOST_AUTH_METHOD=trust postgres:18 >/dev/null
          trap 'docker rm -f taskservice-demo-restore >/dev/null 2>&1 || true; if [[ -n "${SSH_AGENT_PID:-}" ]]; then ssh-agent -k >/dev/null 2>&1 || true; fi; rm -rf -- "$tmp"' EXIT
          for attempt in {1..30}; do
            if docker exec taskservice-demo-restore pg_isready -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec taskservice-demo-restore psql -X -q -v ON_ERROR_STOP=1 -U postgres -c 'CREATE ROLE taskservice_api; CREATE ROLE taskservice_worker; CREATE ROLE taskservice_platform;'
          docker exec taskservice-demo-restore createdb -U postgres rehearsal
          docker exec -i taskservice-demo-restore pg_restore --no-owner --no-acl --exit-on-error -U postgres -d rehearsal < "$tmp/pilot.pgdump"
          docker exec taskservice-demo-restore psql -X -At -U postgres -d rehearsal -c 'SELECT count(*) FROM ts.tenants' | grep -Eq '^[1-9][0-9]*$'
          printf 'VERIFIED_TASKSERVICE_DB_RESTORE=disposable_runner\n'
