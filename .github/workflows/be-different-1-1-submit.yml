name: Submit BE DIFFERENT 1.1 build 8
on:
  push:
    branches: [main]
    paths: ['.github/workflows/be-different-1-1-submit.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: be-different-1-1-submit
  cancel-in-progress: false
jobs:
  submit:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    steps:
      - name: Advance and inspect exact release
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" 'cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell' <<'PY'
          import json
          from apps.publisher.models import Release,Job,Submission
          from apps.publisher.tasks import enqueue_job
          r=Release.objects.get(pk=130,app__slug="be-different",version_name="1.1.0",build_number=8)
          r.auto_submit=True
          r.save(update_fields=["auto_submit","updated_at"])
          print("ASSETS="+json.dumps(list(r.app.assets.values("id","platform","kind","locale","device_type","width","height","file"))))
          for failed in Job.objects.filter(release=r,type="submit_apple",status="failed").order_by("-id")[:1]:
              print("APPLE_ERROR="+json.dumps((failed.logs or "")[-18000:]))
          for b in []:
              submitted=Submission.objects.filter(release=r,platform=b.platform,state__in=["in_review","approved","live"]).exists()
              if submitted: continue
              kind=("submit_google" if b.platform=="android" else ("submit_apple" if b.external_build_id else "upload_apple"))
              if b.status!="succeeded": continue
              if Job.objects.filter(release=r,type=kind,status__in=["queued","running"]).exists(): continue
              j=enqueue_job(kind,release=r,build=b,agent=kind=="upload_apple",platform="macos" if kind=="upload_apple" else "")
              print("QUEUED="+json.dumps({"id":j.pk,"type":kind}))
          print("RELEASE="+json.dumps({"id":r.pk,"status":r.status,"track":r.android_track,"source":r.source_commit}))
          print("BUILDS="+json.dumps(list(r.builds.values("id","platform","status","external_build_id","artifact_size"))))
          print("JOBS="+json.dumps(list(Job.objects.filter(release=r).values("id","type","status","error"))))
          print("SUBMISSIONS="+json.dumps(list(Submission.objects.filter(release=r).values("platform","state","external_id","last_error"))))
          from apps.integrations.apple_store import AppleStoreClient
          from apps.integrations.google_play import GooglePlayClient
          c=AppleStoreClient(r.app.apple_account)
          a=c.find_app(r.app.bundle_id)
          versions=c.request("GET",f"/apps/{a['id']}/appStoreVersions",params={"filter[versionString]":"1.1.0","filter[platform]":"IOS"})
          print("APPLE_STORE="+json.dumps([{"id":v["id"],"attributes":v["attributes"]} for v in versions.get("data",[])]))
          g=GooglePlayClient(r.app.google_account)
          e=g._open_edit(r.app.package_name)
          try:
              print("GOOGLE_STORE="+json.dumps(g._edit_request(e,"GET",f"/applications/{g._q(r.app.package_name)}/edits/{e.edit_id}/tracks")))
          finally: g._safe_delete_edit(e)
          from apps.integrations.apple_compliance import apply_app_store_compliance,find_editable_app_info,ensure_build_encryption_declaration
          from apps.publisher.store_compliance import _BASE_BUSINESS_AGE_RATING
          profile=dict(_BASE_BUSINESS_AGE_RATING)
          profile.update({"healthOrWellnessTopics":True,"messagingAndChat":True,"userGeneratedContent":True})
          print("COMPLIANCE="+json.dumps(apply_app_store_compliance(c,a["id"],content_rights="USES_THIRD_PARTY_CONTENT",age_rating=profile)))
          info=find_editable_app_info(c,a["id"])
          c.request("PATCH",f"/appInfos/{info['id']}",data=json.dumps({"data":{"type":"appInfos","id":info["id"],"relationships":{"primaryCategory":{"data":{"type":"appCategories","id":"HEALTH_AND_FITNESS"}}}}}))
          ensure_build_encryption_declaration(c,r.builds.get(platform="ios").external_build_id,False)
          import apps.signing.management.commands.set_a_bau_apple_free_price as pricing
          pricing.APP_SLUG="be-different"
          pricing.Command().handle()
          r.android_track="production"
          r.save(update_fields=["android_track","updated_at"])
          from apps.publisher.tasks import _publish_existing_google_version
          try:
              result=_publish_existing_google_version(g,r.app,r)
              Submission.objects.filter(release=r,platform="android").update(raw=result,state="ready_for_review" if result.get("edit",{}).get("_changes_not_sent_for_review") else "in_review")
              print("GOOGLE_PRODUCTION="+json.dumps(result))
          except Exception as exc:
              print("GOOGLE_PRODUCTION_ERROR="+str(exc))
              if "draft app" in str(exc):
                  edit=g._open_edit(r.app.package_name)
                  try:
                      g._edit_request(edit,"PUT",f"/applications/{g._q(r.app.package_name)}/edits/{edit.edit_id}/tracks/production",json_body={"track":"production","releases":[{"name":"1.1.0","versionCodes":["8"],"status":"draft","releaseNotes":[{"language":"en-US","text":"A complete BE DIFFERENT redesign with a new visual identity, updated navigation and redesigned screens and forms."},{"language":"de-DE","text":"Komplettes BE DIFFERENT Redesign mit neuer visueller Identität, überarbeiteter Navigation und neu gestalteten Ansichten und Formularen."}]}]})
                      g._validate_edit(edit)
                      print("GOOGLE_PRODUCTION_DRAFT="+json.dumps(g._commit_edit(edit)))
                      Submission.objects.filter(release=r,platform="android").update(state="ready_for_review")
                  except Exception:
                      g._safe_delete_edit(edit)
                      raise
          import requests
          from apps.integrations.apple_store import BASE_URL
          original=c.request
          def detailed(method,path,**kwargs):
              headers=kwargs.pop("headers",{})
              headers.update({"Authorization":"Bearer "+c.token(),"Content-Type":"application/json"})
              response=requests.request(method,BASE_URL+path,headers=headers,timeout=90,**kwargs)
              if not response.ok:
                  print("APPLE_BLOCKERS="+json.dumps(response.json()))
                  raise RuntimeError("Apple eligibility failed: "+str(response.status_code))
              return {} if response.status_code==204 else response.json()
          c.request=detailed
          try:
              version_id=versions["data"][0]["id"]
              drafts=c.list_review_submissions(a["id"],"READY_FOR_REVIEW")
              draft=next((s for s in drafts if not c.request("GET",f"/reviewSubmissions/{s['id']}/items").get("data")),None)
              if draft:
                  c.request("POST","/reviewSubmissionItems",data=json.dumps({"data":{"type":"reviewSubmissionItems","relationships":{"reviewSubmission":{"data":{"type":"reviewSubmissions","id":draft["id"]}},"appStoreVersion":{"data":{"type":"appStoreVersions","id":version_id}}}}}))
                  result=c.request("PATCH",f"/reviewSubmissions/{draft['id']}",data=json.dumps({"data":{"type":"reviewSubmissions","id":draft["id"],"attributes":{"submitted":True}}}))
                  print("APPLE_SUBMITTED="+json.dumps(result))
              else: print("APPLE_DRAFTS="+json.dumps([{"id":s["id"],"attributes":s.get("attributes",{})} for s in drafts]))
          except Exception as exc: print("ELIGIBILITY="+str(exc))
          PY
