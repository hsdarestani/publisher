name: BE DIFFERENT release 47 final store status read-only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bedifferent-release47-status-20261123.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 9
    steps:
      - name: Inspect Publisher release 47 and real store submissions (read only)
        env:
          HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$SSH_PRIVATE_KEY"
          port="${SSH_PORT:-22}"
          umask 077
          key="$RUNNER_TEMP/bd47-status-key"
          known="$RUNNER_TEMP/bd47-known-hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' >"$key"
          chmod 600 "$key"
          ssh-keyscan -T 10 -p "$port" -H "$HOST" >"$known" 2>/dev/null
          test -s "$known"
          if [ -n "$SSH_HOST_FINGERPRINT" ]; then
            ssh-keygen -lf "$known" | grep -F -- "$SSH_HOST_FINGERPRINT" >/dev/null
          fi
          if [ -n "$SSH_KEY_PASSPHRASE" ]; then
            eval "$(ssh-agent -s)" >/dev/null
            askpass="$RUNNER_TEMP/ssh-askpass"
            printf '%s\n' '#!/bin/sh' 'printf "%s" "$SSH_KEY_PASSPHRASE"' >"$askpass"
            chmod 700 "$askpass"
            DISPLAY=:0 SSH_ASKPASS="$askpass" SSH_ASKPASS_REQUIRE=force setsid ssh-add "$key" </dev/null
          fi
          ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" -p "$port" root@"$HOST" 'cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell' <<'PY'
          import json
          from apps.publisher.models import Release, Job, Build, Submission
          r=Release.objects.select_related('app').get(pk=47)
          assert r.app.slug=='be-different'
          assert r.version_name=='1.3.6' and r.build_number==27
          def emit(k,v): print(k+'='+json.dumps(v,sort_keys=True,default=str),flush=True)
          emit('BD_RELEASE47',dict(id=r.pk,version=r.version_name,build=r.build_number,status=r.status,source_commit=r.source_commit,auto_submit=r.auto_submit,android_track=r.android_track))
          emit('BD_RELEASE47_BUILDS',list(Build.objects.filter(release=r).values('id','platform','status','external_build_id','artifact_size','finished_at')))
          emit('BD_RELEASE47_JOBS',[dict(id=j.id,type=j.type,status=j.status,error=(j.error or '')[-350:]) for j in Job.objects.filter(release=r).order_by('-pk')[:25]])
          emit('BD_RELEASE47_SUBMISSIONS',list(Submission.objects.filter(release=r).values('platform','state','external_id','submitted_at','last_error')))
          PY
