name: Retry A+ Solution Strato store release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/kick-aplus-strato-release-v2.yml']
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch current Strato release workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'aplus-solution-strato-store-release.yml',
              ref: 'main'
            });
