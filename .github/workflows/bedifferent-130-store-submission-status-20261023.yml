name: BE DIFFERENT 1.3.1 Build 22 Submission Status
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bedifferent-130-store-submission-status-20261023.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Read-only Publisher release 27 and native submission status
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          test -n "$HOST"
          PORT="${SSH_PORT:-22}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 12 -p "$PORT" -H "$HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          test -s "$HOME/.ssh/known_hosts"
          if [ -n "$SSH_HOST_FINGERPRINT" ]; then
            ssh-keygen -lf "$HOME/.ssh/known_hosts" | grep -F -- "$SSH_HOST_FINGERPRINT" >/dev/null
          fi
          chmod 600 "$HOME/.ssh/known_hosts"
          REMOTE_ARGS=(-p "$PORT" -o ConnectTimeout=15 -o StrictHostKeyChecking=yes)
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            umask 077
            KEY="$RUNNER_TEMP/bedifferent-readonly-ssh-key"
            printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$KEY"
            chmod 600 "$KEY"
            if [ -n "$SSH_KEY_PASSPHRASE" ]; then
              eval "$(ssh-agent -s)" >/dev/null
              ASKPASS="$RUNNER_TEMP/bedifferent-readonly-askpass"
              printf '%s\n' '#!/bin/sh' 'printf "%s" "$SSH_KEY_PASSPHRASE"' > "$ASKPASS"
              chmod 700 "$ASKPASS"
              DISPLAY=:0 SSH_ASKPASS="$ASKPASS" SSH_ASKPASS_REQUIRE=force setsid ssh-add "$KEY" </dev/null
            fi
            REMOTE_ARGS+=(-i "$KEY" -o IdentitiesOnly=yes -o BatchMode=yes)
          else
            test -n "$PASS"
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
            REMOTE_ARGS+=(-o PreferredAuthentications=password -o PubkeyAuthentication=no)
          fi
          cat > "$RUNNER_TEMP/bd-status-remote.sh" <<'REMOTE'
          set -euo pipefail
          cd /opt/aplus-publisher
          docker compose exec -T web python manage.py shell <<'PY'
          import json
          from apps.publisher.models import Release, Build, Job, Submission
          qs = Release.objects.filter(pk=27, app__slug="be-different", version_name="1.3.1", build_number=22)
          if not qs.exists():
              print("STORE_STATUS="+json.dumps({"release_found": False}))
          else:
              r=qs.get()
              row={
                  "release_found": True,
                  "release_id": r.id,
                  "version":r.version_name,
                  "build_number":r.build_number,
                  "release_status":r.status,
                  "auto_submit":r.auto_submit,
                  "source_commit":r.source_commit[:12],
                  "builds": [
                    {"platform":b.platform,"status":b.status,"has_artifact":bool(b.artifact),"external_build_id":b.external_build_id}
                    for b in Build.objects.filter(release=r).order_by("platform")
                  ],
                  "jobs": [
                    {"id":j.id,"type":j.type,"status":j.status,"progress":j.progress,"has_error":bool(j.error),"failed_error":j.error[-1800:] if j.status=="failed" else ""}
                    for j in Job.objects.filter(release=r).order_by("id")
                  ],
                  "submissions": [
                    {"platform":s.platform,"state":s.state,"external_id":s.external_id,"submitted_at":str(s.submitted_at or ""),"has_error":bool(s.last_error)}
                    for s in Submission.objects.filter(release=r).order_by("platform")
                  ],
              }
              print("STORE_STATUS="+json.dumps(row,ensure_ascii=False))

          # Inspect App Store Connect in read-only mode; never print account credentials.
          try:
              from apps.publisher.models import MobileApp
              from apps.integrations.apple_store import AppleStoreClient
              app=MobileApp.objects.get(slug="be-different")
              apple=AppleStoreClient(app.apple_account)
              ap=apple.find_app(app.bundle_id)
              versions=apple.list_versions(str(ap["id"]))
              print("APPLE_VERSION_STATES="+json.dumps([
                {"id":v["id"],"version":v.get("attributes",{}).get("versionString"),"state":v.get("attributes",{}).get("appStoreState")}
                for v in versions if v.get("attributes",{}).get("versionString") in ("1.3.0","1.3.1")
              ]))
              for state in ("WAITING_FOR_REVIEW","IN_REVIEW","READY_FOR_REVIEW","UNRESOLVED_ISSUES","PENDING_DEVELOPER_RELEASE","PENDING_APPLE_RELEASE"):
                  submissions=apple.list_review_submissions(str(ap["id"]),state)
                  matches=[]
                  for sub in submissions:
                      items=apple.list_review_submission_items(sub["id"])
                      target={str(v["id"]):v.get("attributes",{}).get("versionString") for v in versions if v.get("attributes",{}).get("versionString") in ("1.3.0","1.3.1")}
                      matched=[]
                      for version_id,version_name in target.items():
                          if any(apple._item_targets_version(item,version_id) for item in items):
                              matched.append(version_name)
                      if matched:
                          matches.append({"id":sub["id"],"versions":matched})
                  if matches:
                      print("APPLE_REVIEW_"+state+"="+json.dumps(matches))
          except Exception as exc:
              print("APPLE_AUDIT_ERROR="+type(exc).__name__+":"+str(exc)[:250])
          PY
          REMOTE
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            ssh "${REMOTE_ARGS[@]}" "root@$HOST" 'bash -se' < "$RUNNER_TEMP/bd-status-remote.sh"
          else
            SSHPASS="$PASS" sshpass -e ssh "${REMOTE_ARGS[@]}" "root@$HOST" 'bash -se' < "$RUNNER_TEMP/bd-status-remote.sh"
          fi

# Read-only recheck on 2026-10-23 after build 22 Android success and pending iOS.

# Follow-up read-only check after both native build workflows completed on 2026-10-23.
