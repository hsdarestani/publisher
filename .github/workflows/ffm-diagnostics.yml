# Operational setup check for FFM: capacity and provider readiness only (read-only; 2026-10-21)
name: FFM Aktuell — read-only server diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ffm-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 9
    steps:
      - name: Inspect isolated FFM containers without changes
        env:
          HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          test "$HOST" = "82.165.187.14"
          test -n "$SSH_PRIVATE_KEY"
          PORT="${SSH_PORT:-22}"
          umask 077
          KEY="$RUNNER_TEMP/ffm-diagnostic-key"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$KEY"
          chmod 600 "$KEY"
          if [ -n "$SSH_KEY_PASSPHRASE" ]; then
            eval "$(ssh-agent -s)" >/dev/null
            ASKPASS="$RUNNER_TEMP/ffm-diagnostic-askpass"
            printf '%s\n' '#!/bin/sh' 'printf "%s" "$SSH_KEY_PASSPHRASE"' > "$ASKPASS"
            chmod 700 "$ASKPASS"
            DISPLAY=:0 SSH_ASKPASS="$ASKPASS" SSH_ASKPASS_REQUIRE=force setsid ssh-add "$KEY" </dev/null
          fi
          mkdir -p "$HOME/.ssh"
          ssh-keyscan -T 10 -p "$PORT" -H "$HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          if [ -n "$SSH_HOST_FINGERPRINT" ]; then
            ssh-keygen -lf "$HOME/.ssh/known_hosts" | grep -F -- "$SSH_HOST_FINGERPRINT" >/dev/null
          fi
          ssh -i "$KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$PORT" root@"$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          echo '=== FFM CONTAINERS ==='
          cd /opt/ffm-aktuell
          docker compose ps -a </dev/null || true
          echo '=== FFM PROVIDER CONFIGURATION (booleans only) ==='
          docker compose exec -T web node -e '
            const e=process.env;
            console.log(JSON.stringify({
              googleOAuth:!!(e.GOOGLE_OAUTH_CLIENT_ID&&e.GOOGLE_OAUTH_CLIENT_SECRET),
              appleOAuth:!!(e.APPLE_SERVICE_ID&&e.APPLE_TEAM_ID&&e.APPLE_KEY_ID&&e.APPLE_PRIVATE_KEY),
              emailDelivery:!!(e.RESEND_API_KEY&&e.FFM_EMAIL_FROM),
              scannerConfigured:!!e.CLAMD_HOST,
              aiConfigured:!!e.OPENAI_API_KEY,
              webPushConfigured:!!(e.WEB_PUSH_PUBLIC_KEY&&e.WEB_PUSH_PRIVATE_KEY&&e.WEB_PUSH_SUBJECT&&e.PUSH_WORKER_TOKEN)
            }));
            let pushSigningValid=false;
            try {
              const crypto=require("node:crypto"),pub=Buffer.from(e.WEB_PUSH_PUBLIC_KEY,"base64url"),priv=Buffer.from(e.WEB_PUSH_PRIVATE_KEY,"base64url");
              const jwk={kty:"EC",crv:"P-256",x:pub.subarray(1,33).toString("base64url"),y:pub.subarray(33,65).toString("base64url")};
              const key=crypto.createPrivateKey({key:{...jwk,d:priv.toString("base64url")},format:"jwk"});
              const message=Buffer.from("FFM VAPID readiness check");
              pushSigningValid=crypto.verify("sha256",message,crypto.createPublicKey({key:jwk,format:"jwk"}),crypto.sign("sha256",message,key));
            }catch{}
            console.log(JSON.stringify({pushSigningValid,schedulerInstalled:require("node:fs").existsSync("/app/start-server.mjs")}));
            fetch("http://127.0.0.1:3000/api/media/status").then(async r=>console.log("mediaStatus",r.status,JSON.stringify(await r.json()))).catch(()=>console.log("mediaStatus unavailable"));
          ' </dev/null
          echo '=== HOST CAPACITY ==='
          free -m
          df -h /opt
          echo '=== PUBLISHER CONTAINERS ==='
          cd /opt/aplus-publisher
          docker compose ps caddy web </dev/null
          REMOTE
