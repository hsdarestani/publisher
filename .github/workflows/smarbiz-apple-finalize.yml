name: Finalize Smarbiz App Store Review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smarbiz-apple-finalize.yml'

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Install SSH client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null

      - name: Set review contact and retry review submission
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell" <<'PY'
          from django.utils import timezone
          from apps.integrations.apple_store import AppleStoreClient
          from apps.publisher.models import Build, MobileApp, Submission

          app = MobileApp.objects.get(slug='smarbiz')
          build = Build.objects.get(
              release__app=app,
              release__version_name='1.0.0',
              release__build_number=2,
              platform='ios',
          )
          client = AppleStoreClient(app.apple_account)
          record = client.find_app(app.bundle_id)
          version = client.ensure_version(record['id'], '1.0.0')

          contact = {
              'contactFirstName': 'Ashkan',
              'contactLastName': 'Asadian',
              'contactPhone': '+491727779721',
              'contactEmail': 'info@aplus-solution.de',
          }
          client.set_review_details(version['id'], app, contact=contact)
          print('review_contact=ready')

          # Keep the already VALID build attached before retrying the existing
          # READY_FOR_REVIEW submission. No rebuild or re-upload is performed.
          client.attach_build(version['id'], build.external_build_id)
          result = client.submit_version(record['id'], version['id'])
          submission = result['submission']
          state = submission.get('attributes', {}).get('state', '')
          Submission.objects.update_or_create(
              app=app,
              release=build.release,
              platform='ios',
              defaults={
                  'state': 'in_review',
                  'external_id': submission['id'],
                  'submitted_at': timezone.now(),
                  'raw': result,
                  'last_error': '',
              },
          )
          build.release.status = 'in_review'
          build.release.save(update_fields=['status', 'updated_at'])
          print(f'RESULT=SUBMITTED state={state}')
          PY
