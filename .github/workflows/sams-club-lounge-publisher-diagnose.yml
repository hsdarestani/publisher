name: Sams Club Lounge Publisher Diagnose

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sams-club-lounge-publisher-diagnose.yml'

permissions:
  contents: read

env:
  EXPECTED_BUNDLE_ID: de.aplussolution.samscard
  EXPECTED_APP_NAME: Sams Club Lounge

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install SSH helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null

      - name: Read safe Publisher configuration only
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell" <<'PY'
          import json
          from apps.publisher.models import MobileApp, StoreAccount

          bundle = 'de.aplussolution.samscard'
          qs = MobileApp.objects.filter(bundle_id=bundle)
          print('SAMS_MATCH_COUNT='+str(qs.count()))

          for account in StoreAccount.objects.filter(provider='apple', enabled=True):
              print('APPLE_ACCOUNT='+json.dumps({
                  'id': account.pk,
                  'name': account.name,
                  'organization': account.organization,
                  'configured': account.configured,
                  'team_id': account.apple_team_id,
                  'status': account.status,
              }, sort_keys=True))

          for app in MobileApp.objects.exclude(repository_url='').order_by('pk'):
              if not app.get_repository_token():
                  continue
              print('TOKEN_CANDIDATE='+json.dumps({
                  'id': app.pk,
                  'slug': app.slug,
                  'name': app.name,
                  'repository_url': app.repository_url,
                  'bundle_id': app.bundle_id,
                  'apple_account_id': app.apple_account_id,
                  'apple_team_id': app.apple_account.apple_team_id if app.apple_account else '',
              }, sort_keys=True))
          PY
