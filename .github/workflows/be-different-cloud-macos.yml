name: BE DIFFERENT Cloud Mac

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/be-different-cloud-macos.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: be-different-cloud-macos
  cancel-in-progress: false

jobs:
  be-different-macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Publisher agent
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install agent dependencies
        run: pip install 'requests>=2.32,<3' 'PyJWT[crypto]>=2.10,<3'

      - name: Wait for Publisher deployment
        run: |
          for i in {1..36}; do
            if curl --fail --silent --show-error --connect-timeout 10 --max-time 20 https://publisher.smarbiz.sbs/healthz/; then
              sleep 20
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Build and deliver BE DIFFERENT iOS
        env:
          PYTHONUNBUFFERED: '1'
          PUBLISHER_URL: https://publisher.smarbiz.sbs
          PUBLISHER_MAX_JOBS: '2'
          PUBLISHER_AGENT_PLATFORM: macos_bedifferent
          PUBLISHER_AGENT_APP_SLUG: be-different
          FIREBASE_IOS_GOOGLE_SERVICE_INFO_B64: ${{ secrets.BEDIFFERENT_FIREBASE_IOS_GOOGLE_SERVICE_INFO_B64 }}
        run: python agents/custom_cloud_macos_altool.py

