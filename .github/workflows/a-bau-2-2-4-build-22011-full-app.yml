name: Release A+Bau Full App 2.2.4 build 22011

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/a-bau-2-2-4-build-22011-full-app.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: a-bau-22011-current-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 55
    env:
      APP_VERSION: '2.2.4'
      BUILD_NUMBER: '22011'
    steps:
      - name: Install SSH client helper
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq sshpass >/dev/null

      - name: Wait for Publisher hotfix and verify reviewer credential
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          export SSHPASS="$PASS"
          for i in $(seq 1 90); do
            if sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST" \
              "cd /opt/aplus-publisher && docker compose exec -T web sh -lc \"grep -Fq 'Aufträge, Termine, Zeiterfassung, Baustellendoku, Aufmaß und Finanzen.' /app/apps/signing/management/commands/bootstrap_a_bau.py\""; then
              break
            fi
            if [ "$i" = "90" ]; then
              echo "Publisher metadata hotfix did not reach production." >&2
              exit 2
            fi
            sleep 5
          done
          sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python - <<'PY'
import os, django
os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings')
django.setup()
from apps.publisher.models import MobileApp
app = MobileApp.objects.get(slug='a-bau')
assert app.review_username == 'demo', app.review_username
assert app.get_review_password(), 'Publisher review password missing'
print('A+Bau Publisher reviewer credential is ready for Store review.')
PY"

      - name: Queue current A+Bau source for both stores
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          export SSHPASS="$PASS"
          sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST"             "cd /opt/aplus-publisher && docker compose exec -T web python manage.py bootstrap_a_bau --app-version '$APP_VERSION' --build-number '$BUILD_NUMBER' --queue --publish"

      - name: Wake Android and iOS Publisher cloud agents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run cloud-linux.yml --repo "$GITHUB_REPOSITORY"
          gh workflow run cloud-macos.yml --repo "$GITHUB_REPOSITORY"

      - name: Advance publishing and require both store submissions
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          export SSHPASS="$PASS"
          for i in $(seq 1 80); do
            echo "=== A+Bau build $BUILD_NUMBER Publisher pass $i ==="
            OUTPUT="$(sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST"               "cd /opt/aplus-publisher && docker compose exec -T web python manage.py bootstrap_a_bau --app-version '$APP_VERSION' --build-number '$BUILD_NUMBER' --publish")"
            printf '%s\n' "$OUTPUT"
            if printf '%s\n' "$OUTPUT" | grep -q 'job=upload_google:succeeded' &&                printf '%s\n' "$OUTPUT" | grep -q 'job=submit_apple:succeeded'; then
              echo "A+Bau $APP_VERSION build $BUILD_NUMBER submitted to Google Play and Apple."
              exit 0
            fi
            if printf '%s\n' "$OUTPUT" | grep -Eq 'job=(build_android|build_ios|upload_google|submit_apple):failed'; then
              echo "Publisher reported a failed A+Bau release job." >&2
              exit 3
            fi
            sleep 30
          done
          echo "Timed out waiting for both store submissions." >&2
          exit 4

      - name: Final non-secret Publisher state
        if: always()
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          PORT="${SSH_PORT:-22}"
          export SSHPASS="$PASS"
          sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST"             "cd /opt/aplus-publisher && docker compose exec -T web python manage.py bootstrap_a_bau --app-version '$APP_VERSION' --build-number '$BUILD_NUMBER' --publish"
