name: A+ Cloud Linux

on:
  workflow_dispatch:
  schedule:
    # Polling fallback for queued Android jobs.
    - cron: '*/5 * * * *'
  workflow_run:
    workflows: ['Validate and deploy A+ Publisher']
    types: [completed]

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: aplus-cloud-linux
  cancel-in-progress: false

jobs:
  cloud-linux-agent:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout A+ Publisher agent
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install agent dependencies
        run: pip install 'requests>=2.32,<3' 'PyJWT[crypto]>=2.10,<3'

      - name: Show Android build environment
        run: |
          java -version
          flutter --version
          flutter doctor -v

      - name: Wait for Publisher health
        run: |
          curl --fail --silent --show-error \
            --retry 18 --retry-all-errors --retry-delay 10 \
            --connect-timeout 10 --max-time 20 \
            https://publisher.smarbiz.sbs/healthz/

      - name: Claim and execute Android jobs
        id: cloud
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: '1'
          PUBLISHER_URL: https://publisher.smarbiz.sbs
          PUBLISHER_MAX_JOBS: '3'
        run: |
          set +e
          python agents/cloud_linux.py 2>&1 | tee /tmp/cloud-linux.log
          AGENT_EXIT=${PIPESTATUS[0]}
          exit "$AGENT_EXIT"

      - name: Report cloud Linux status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const ok = '${{ steps.cloud.outcome }}' === 'success';
            const log = fs.existsSync('/tmp/cloud-linux.log')
              ? fs.readFileSync('/tmp/cloud-linux.log', 'utf8').slice(-12000)
              : 'No cloud Linux agent log was produced.';
            const body = ok
              ? '✅ Cloud Linux completed successfully.\n\n```text\n' + log + '\n```'
              : '### Cloud Linux failure\n\n```text\n' + log + '\n```';
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 4,
              title: ok ? 'A+ Cloud Linux healthy' : 'A+ Cloud Linux failed',
              state: ok ? 'closed' : 'open',
              body: body + '\n\nWorkflow run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            });

      - name: Enforce cloud Linux result
        if: steps.cloud.outcome == 'failure'
        run: exit 1
