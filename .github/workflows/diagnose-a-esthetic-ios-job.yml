name: Diagnose A+ Esthetic iOS job

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-a-esthetic-ios-job.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Read non-secret iOS job state
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell -c \"from apps.publisher.models import MobileApp,Job,BuildAgent; a=MobileApp.objects.get(slug='a-esthetic'); js=Job.objects.filter(app=a,type='build_ios').order_by('-created_at')[:6]; print('IOS_JOB_STATE'); [print('job',j.id,j.status,'started',j.started_at,'finished',j.finished_at,'build',getattr(j.build,'status',None)) for j in js]; [print('agent',x.id,x.name,'current_job',x.current_job_id,'last_seen',x.last_seen_at) for x in BuildAgent.objects.filter(platform__in=['macos','universal'])]\""
