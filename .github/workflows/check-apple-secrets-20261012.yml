name: Check Apple recovery secret presence
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-apple-secrets-20261012.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Check presence without printing secrets
        env:
          ISSUER: ${{ secrets.APPLE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          P8: ${{ secrets.APPLE_PRIVATE_KEY_P8 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for k in ISSUER KEY_ID P8 TEAM; do
            if [ -z "${!k}" ]; then
              echo "${k}: MISSING"
              missing=1
            else
              echo "${k}: PRESENT"
            fi
          done
          exit "$missing"
