name: Submit A+ Studio to Google Play production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/a-studio-google-production-submit.yml'

permissions:
  contents: read

concurrency:
  group: a-studio-google-production-submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      PACKAGE_NAME: de.aplussolution.studio
      VERSION_NAME: 1.0.0
      BUILD_NUMBER: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          python -m pip install --disable-pip-version-check 'google-auth>=2.40,<3' 'requests>=2.32,<3'

      - name: Fetch the signed AAB from A+ Publisher production
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          export SSHPASS="$PASS"
          PORT="${SSH_PORT:-22}"
          SSH=(sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST")

          META="$(${SSH[@]} 'cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell -c "from apps.publisher.models import MobileApp,Release; a=MobileApp.objects.get(slug=\"a-studio\"); r=Release.objects.get(app=a,version_name=\"1.0.0\",build_number=1); b=r.builds.get(platform=\"android\"); print(\"META|\"+b.status+\"|\"+str(b.artifact.path)+\"|\"+str(b.artifact_checksum or \"\"))"' | grep '^META|' | tail -1)"
          IFS='|' read -r _ STATUS ARTIFACT_PATH EXPECTED_SHA <<< "$META"
          test "$STATUS" = succeeded || { echo "::error::Publisher Android build is not succeeded: $STATUS"; exit 2; }
          test -n "$ARTIFACT_PATH" || { echo "::error::Publisher AAB artifact path is empty"; exit 2; }

          echo "Publisher artifact: $ARTIFACT_PATH"
          ${SSH[@]} "cd /opt/aplus-publisher && docker compose exec -T web cat '$ARTIFACT_PATH'" > a-studio-release.aab
          test -s a-studio-release.aab || { echo "::error::Downloaded AAB is empty"; exit 2; }

          ACTUAL_SHA="$(sha256sum a-studio-release.aab | awk '{print $1}')"
          echo "AAB bytes: $(stat -c%s a-studio-release.aab)"
          echo "AAB sha256: $ACTUAL_SHA"
          if [ -n "$EXPECTED_SHA" ] && [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
            echo "::error::AAB checksum mismatch (Publisher=$EXPECTED_SHA runner=$ACTUAL_SHA)"
            exit 2
          fi
          echo "AAB_SHA256=$ACTUAL_SHA" >> "$GITHUB_ENV"

      - name: Register AAB on Production and attempt first rollout
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" || { echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is missing"; exit 2; }
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote

          from google.auth.transport.requests import AuthorizedSession, Request
          from google.oauth2 import service_account

          package = os.environ['PACKAGE_NAME']
          version_name = os.environ['VERSION_NAME']
          expected_version_code = os.environ['BUILD_NUMBER']
          info = json.loads(os.environ['GOOGLE_PLAY_SERVICE_ACCOUNT_JSON'])
          creds = service_account.Credentials.from_service_account_info(
              info,
              scopes=['https://www.googleapis.com/auth/androidpublisher'],
          )
          creds.refresh(Request())
          session = AuthorizedSession(creds)
          api = 'https://androidpublisher.googleapis.com/androidpublisher/v3'
          upload = 'https://androidpublisher.googleapis.com/upload/androidpublisher/v3'
          q = lambda value: quote(str(value), safe='._-')

          def detail(resp):
              try:
                  return json.dumps(resp.json(), ensure_ascii=False)
              except Exception:
                  return ' '.join(resp.text.replace('\n', ' ').split())[:5000]

          def require(resp, label):
              if not resp.ok:
                  raise RuntimeError(f'{label}: HTTP {resp.status_code} {detail(resp)}')
              return resp.json() if resp.content else {}

          def create_edit():
              return require(
                  session.post(f'{api}/applications/{q(package)}/edits', json={}, timeout=60),
                  'Create edit',
              )['id']

          def delete_edit(edit_id):
              try:
                  session.delete(f'{api}/applications/{q(package)}/edits/{q(edit_id)}', timeout=30)
              except Exception:
                  pass

          def list_bundles(edit_id):
              return require(
                  session.get(
                      f'{api}/applications/{q(package)}/edits/{q(edit_id)}/bundles',
                      timeout=60,
                  ),
                  'List bundles',
              ).get('bundles', [])

          def ensure_bundle(edit_id):
              bundles = list_bundles(edit_id)
              bundle = next(
                  (item for item in bundles if str(item.get('versionCode')) == str(expected_version_code)),
                  None,
              )
              if bundle:
                  print(f'bundle_reused=true version_code={bundle["versionCode"]}')
                  return bundle
              data = Path('a-studio-release.aab').read_bytes()
              bundle = require(
                  session.post(
                      f'{upload}/applications/{q(package)}/edits/{q(edit_id)}/bundles',
                      params={'uploadType': 'media'},
                      data=data,
                      headers={'Content-Type': 'application/octet-stream'},
                      timeout=600,
                  ),
                  'Upload AAB',
              )
              print(f'bundle_uploaded=true version_code={bundle["versionCode"]}')
              return bundle

          def track_body(version_code, status):
              return {
                  'track': 'production',
                  'releases': [{
                      'name': version_name,
                      'versionCodes': [str(version_code)],
                      'status': status,
                      'releaseNotes': [{
                          'language': 'de-DE',
                          'text': 'Erste Version von A+ Studio mit AI Builder, Projektverwaltung, Preview, Publishing und Store-Anfragen.',
                      }],
                  }],
              }

          def set_track(edit_id, version_code, status):
              return require(
                  session.put(
                      f'{api}/applications/{q(package)}/edits/{q(edit_id)}/tracks/production',
                      json=track_body(version_code, status),
                      timeout=60,
                  ),
                  f'Update Production track status={status}',
              )

          def validate(edit_id):
              return require(
                  session.post(
                      f'{api}/applications/{q(package)}/edits/{q(edit_id)}:validate',
                      json={},
                      timeout=60,
                  ),
                  'Validate edit',
              )

          def commit(edit_id):
              return require(
                  session.post(
                      f'{api}/applications/{q(package)}/edits/{q(edit_id)}:commit',
                      params={'changesInReviewBehavior': 'CANCEL_IN_REVIEW_AND_SUBMIT'},
                      timeout=60,
                  ),
                  'Commit edit',
              )

          # Phase 1: first production release on a brand-new Play app must exist as draft.
          edit1 = create_edit()
          print('phase1_edit=' + edit1)
          try:
              bundle = ensure_bundle(edit1)
              version_code = str(bundle['versionCode'])
              if version_code != str(expected_version_code):
                  raise RuntimeError(f'Unexpected versionCode {version_code}; expected {expected_version_code}.')
              set_track(edit1, version_code, 'draft')
              validate(edit1)
              committed1 = commit(edit1)
              print('production_draft_committed=true')
          except Exception:
              delete_edit(edit1)
              raise

          # Phase 2: now that the Production draft exists, ask Google to transition the
          # same release to completed and submit it. Some first-launch apps still force
          # this final transition through Play Console; preserve the committed draft if so.
          final_submitted = False
          final_error = ''
          committed2 = None
          edit2 = create_edit()
          print('phase2_edit=' + edit2)
          try:
              track = require(
                  session.get(
                      f'{api}/applications/{q(package)}/edits/{q(edit2)}/tracks/production',
                      timeout=60,
                  ),
                  'Read Production track',
              )
              releases = track.get('releases') or []
              matched = next(
                  (release for release in releases if str(version_code) in [str(v) for v in release.get('versionCodes', [])]),
                  None,
              )
              if not matched:
                  raise RuntimeError('Committed Production draft release is not visible in the follow-up edit.')
              set_track(edit2, version_code, 'completed')
              validate(edit2)
              committed2 = commit(edit2)
              final_submitted = True
              print('GOOGLE_PRODUCTION_SUBMITTED=true')
          except Exception as exc:
              final_error = str(exc)
              print('GOOGLE_PRODUCTION_SUBMITTED=false')
              print('phase2_error=' + final_error)
              delete_edit(edit2)

          result = {
              'success': True,
              'package_name': package,
              'track': 'production',
              'version_name': version_name,
              'version_code': version_code,
              'bundle': bundle,
              'draft_edit': committed1,
              'submitted_for_review': final_submitted,
              'submission_edit': committed2,
              'submission_error': final_error,
              'needs_console_start_rollout': not final_submitted,
              'aab_sha256': os.environ.get('AAB_SHA256', ''),
          }
          Path('google-production-result.json').write_text(
              json.dumps(result, indent=2, ensure_ascii=False),
              encoding='utf-8',
          )
          print('version_code=' + version_code)
          print('needs_console_start_rollout=' + str(not final_submitted).lower())
          PY

      - name: Sync Google production state back into Publisher
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          export SSHPASS="$PASS"
          PORT="${SSH_PORT:-22}"
          RESULT_B64="$(base64 -w0 google-production-result.json)"
          sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T -e RESULT_B64='$RESULT_B64' web python manage.py shell -c \"import os,base64,json; from django.utils import timezone; from apps.publisher.models import MobileApp,Release,Submission; raw=json.loads(base64.b64decode(os.environ['RESULT_B64'])); a=MobileApp.objects.get(slug='a-studio'); r=Release.objects.get(app=a,version_name='1.0.0',build_number=1); submitted=bool(raw.get('submitted_for_review')); Submission.objects.update_or_create(app=a,release=r,platform='android',defaults={'state':'in_review' if submitted else 'draft','external_id':str(raw.get('version_code','')),'submitted_at':timezone.now() if submitted else None,'raw':raw}); r.status='in_review' if submitted else 'uploaded'; r.save(update_fields=['status','updated_at']); print('publisher_google_submission_synced='+str(submitted).lower())\""

      - name: Upload sanitized production result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a-studio-google-production-result
          path: google-production-result.json
          if-no-files-found: ignore
          retention-days: 14
