name: Deploy reviewer credential validation fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-review-credential-fix.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy Publisher backend fix
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          command_timeout: 10m
          script: |
            set -eu
            cd /opt/aplus-publisher
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build web
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8000/healthz/ >/dev/null 2>&1 || curl -fsS https://publisher.smarbiz.sbs/healthz/ >/dev/null 2>&1; then
                echo 'Publisher web healthy with reviewer credential fix deployed.'
                exit 0
              fi
              sleep 3
            done
            echo 'Publisher health check failed after deployment.' >&2
            docker compose ps
            exit 2
