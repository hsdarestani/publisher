name: Validate and deploy A+ Publisher

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: publisher-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand source bundle
        run: |
          if compgen -G 'source-bundle.b64.part*' > /dev/null; then
            cat source-bundle.b64.part* | base64 --decode > source-bundle.tar.gz
          fi
          if [ -f source-bundle.tar.gz ]; then
            tar -xzf source-bundle.tar.gz
          fi
          if [ -d overrides ]; then
            cp -a overrides/. .
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Django checks and tests
        id: django
        continue-on-error: true
        env:
          DEBUG: '1'
          DJANGO_SECRET_KEY: ci-only-key
        run: |
          set -o pipefail
          {
            python manage.py check
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            python manage.py test
          } 2>&1 | tee /tmp/django-ci.log
      - name: Report Django failure on PR
        if: steps.django.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('/tmp/django-ci.log', 'utf8').split('\n').slice(-120).join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '### CI runtime failure\n\n```text\n' + log + '\n```'
            });
      - name: Enforce Django result
        if: steps.django.outcome == 'failure'
        run: exit 1
      - name: Compile agents
        run: |
          python -m py_compile agents/runner.py
          python -m py_compile agents/cloud_macos.py
          python -m py_compile agents/cloud_linux.py
      - name: Validate compose
        run: |
          cp .env.example .env
          docker compose config

  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Expand source bundle
        run: |
          if compgen -G 'source-bundle.b64.part*' > /dev/null; then
            cat source-bundle.b64.part* | base64 --decode > source-bundle.tar.gz
          fi
          if [ -f source-bundle.tar.gz ]; then
            tar -xzf source-bundle.tar.gz
          fi
          if [ -d overrides ]; then
            cp -a overrides/. .
          fi
      - name: Package release
        run: tar --exclude=.git --exclude=.env -czf /tmp/aplus-publisher.tar.gz .
      - name: Prepare optional deployment settings
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          PUBLISHER_GITHUB_TOKEN: ${{ secrets.PUBLISHER_GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_COMPLIANCE_MODEL: ${{ vars.OPENAI_COMPLIANCE_MODEL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          PUBLISHER_AUTOMATION_TOKEN: ${{ secrets.PUBLISHER_AUTOMATION_TOKEN }}
        run: |
          : > /tmp/aplus-publisher-overrides.env
          [ -n "$ADMIN_EMAIL" ] && printf 'ADMIN_EMAIL=%s\n' "$ADMIN_EMAIL" >> /tmp/aplus-publisher-overrides.env || true
          [ -n "$ADMIN_PASSWORD" ] && printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" >> /tmp/aplus-publisher-overrides.env || true
          [ -n "$PUBLISHER_GITHUB_TOKEN" ] && printf 'PUBLISHER_GITHUB_TOKEN=%s\n' "$PUBLISHER_GITHUB_TOKEN" >> /tmp/aplus-publisher-overrides.env || true
          [ -n "$OPENAI_API_KEY" ] && printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY" >> /tmp/aplus-publisher-overrides.env || true
          [ -n "$OPENAI_COMPLIANCE_MODEL" ] && printf 'OPENAI_COMPLIANCE_MODEL=%s\n' "$OPENAI_COMPLIANCE_MODEL" >> /tmp/aplus-publisher-overrides.env || true
          [ -n "$SENTRY_DSN" ] && printf 'SENTRY_DSN=%s\n' "$SENTRY_DSN" >> /tmp/aplus-publisher-overrides.env || true
          [ -n "$PUBLISHER_AUTOMATION_TOKEN" ] && printf 'PUBLISHER_AUTOMATION_TOKEN=%s\n' "$PUBLISHER_AUTOMATION_TOKEN" >> /tmp/aplus-publisher-overrides.env || true
      - name: Check SSH key setup
        id: ssh_setup
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SSH_PRIVATE_KEY is not configured yet; publisher deployment will be skipped."
          fi
      - name: Deploy over SSH key and verify public HTTPS
        id: production
        if: steps.ssh_setup.outputs.ready == 'true'
        continue-on-error: true
        timeout-minutes: 35
        env:
          HOST: ${{ secrets.HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          {
            test -n "$HOST" && test -n "$SSH_PRIVATE_KEY"
            PORT="${SSH_PORT:-22}"
            umask 077
            KEY_FILE="$RUNNER_TEMP/aplus-publisher-ssh-key"
            printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$KEY_FILE"
            chmod 600 "$KEY_FILE"

            if [ -n "$SSH_KEY_PASSPHRASE" ]; then
              eval "$(ssh-agent -s)" > /dev/null
              ASKPASS_FILE="$RUNNER_TEMP/aplus-publisher-askpass"
              printf '%s\n' '#!/bin/sh' 'printf "%s" "$SSH_KEY_PASSPHRASE"' > "$ASKPASS_FILE"
              chmod 700 "$ASKPASS_FILE"
              DISPLAY=:0 SSH_ASKPASS="$ASKPASS_FILE" SSH_ASKPASS_REQUIRE=force \
                setsid ssh-add "$KEY_FILE" < /dev/null
            fi

            install -d -m 700 "$HOME/.ssh"
            ssh-keyscan -T 10 -p "$PORT" -H "$HOST" >> "$HOME/.ssh/known_hosts"
            test -s "$HOME/.ssh/known_hosts"
            chmod 600 "$HOME/.ssh/known_hosts"
            if [ -n "$SSH_HOST_FINGERPRINT" ]; then
              ssh-keygen -lf "$HOME/.ssh/known_hosts" | grep -F -- "$SSH_HOST_FINGERPRINT" >/dev/null
            else
              echo "::warning::SSH host key was accepted on first use; set SSH_HOST_FINGERPRINT to pin the server identity."
            fi

            SSH_ARGS=(-i "$KEY_FILE" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes)
            chmod 600 /tmp/aplus-publisher-overrides.env
            scp "${SSH_ARGS[@]}" -P "$PORT" \
              /tmp/aplus-publisher.tar.gz /tmp/aplus-publisher-overrides.env scripts/deploy.sh root@"$HOST":/tmp/
            ssh "${SSH_ARGS[@]}" -p "$PORT" root@"$HOST" \
              'umask 077; chmod 700 /tmp/deploy.sh; chmod 600 /tmp/aplus-publisher-overrides.env; trap "rm -f /tmp/aplus-publisher-overrides.env /tmp/aplus-publisher.tar.gz /tmp/deploy.sh" EXIT; /tmp/deploy.sh /tmp/aplus-publisher.tar.gz /tmp/aplus-publisher-overrides.env'
            echo "Comparing STRATO origin and public Cloudflare health endpoints..."
            ORIGIN_CODE="$(curl -ksS -L --connect-timeout 8 --max-time 20 \
              --resolve "publisher.smarbiz.sbs:443:$HOST" \
              -o /dev/null -w '%{http_code}' \
              https://publisher.smarbiz.sbs/healthz/ || true)"
            echo "STRATO origin /healthz/ HTTP $ORIGIN_CODE"
            EDGE_CODE="$(curl -sS -L --connect-timeout 8 --max-time 20 \
              -o /dev/null -w '%{http_code}' \
              https://publisher.smarbiz.sbs/healthz/ || true)"
            echo "Public Cloudflare /healthz/ HTTP $EDGE_CODE"
            if [ "$ORIGIN_CODE" = 200 ] && [ "$EDGE_CODE" != 200 ]; then
              echo "::error::STRATO origin is healthy but Cloudflare routing is not. Check the proxied publisher DNS A record and origin rules in Cloudflare."
              exit 1
            fi
            if [ "$ORIGIN_CODE" != 200 ]; then
              echo "::error::Direct STRATO HTTPS health check failed. Review Caddy TLS, host routing and app config."
              exit 1
            fi
            if [ "$EDGE_CODE" != 200 ]; then
              echo "::error::Public Publisher HTTPS health check failed with HTTP $EDGE_CODE."
              exit 1
            fi
            echo "Publisher is healthy through both STRATO and Cloudflare."
          } 2>&1 | tee /tmp/deploy-ci.log
      - name: Report production result
        if: steps.production.outcome != 'skipped'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const ok = '${{ steps.production.outcome }}' === 'success';
            const raw = fs.existsSync('/tmp/deploy-ci.log') ? fs.readFileSync('/tmp/deploy-ci.log', 'utf8') : 'No deployment log was produced.';
            const log = raw.split('\n').slice(-80).join('\n');
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 2,
              title: ok ? 'Production deployment healthy' : 'Production deployment failed',
              state: ok ? 'closed' : 'open',
              body: ok ? '✅ Production deployment and public HTTPS health check completed successfully on `publisher.smarbiz.sbs`.\n\nWorkflow run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId : '### Production deployment failure\n\n```text\n' + log + '\n```'
            });
      - name: Enforce production result
        if: steps.production.outcome == 'failure'
        run: exit 1

  materialize-source:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace bundle with readable source
        run: |
          if compgen -G 'source-bundle.b64.part*' > /dev/null; then
            cat source-bundle.b64.part* | base64 --decode > source-bundle.tar.gz
          fi
          if [ ! -f source-bundle.tar.gz ]; then
            exit 0
          fi
          cp .github/workflows/deploy.yml /tmp/deploy.yml
          tar -xzf source-bundle.tar.gz
          cp /tmp/deploy.yml .github/workflows/deploy.yml
          if [ -d overrides ]; then
            cp -a overrides/. .
          fi
          rm -rf overrides
          rm -f source-bundle.tar.gz source-bundle.b64.part*
          git config user.name "A+ Publisher Bot"
          git config user.email "publisher-bot@users.noreply.github.com"
          git add -A
          git commit -m "Materialize A+ Publisher source"
          git push origin HEAD:main
