<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Sams Club Lounge app icon">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="78%">
      <stop offset="0" stop-color="#24102f"/>
      <stop offset="0.58" stop-color="#100718"/>
      <stop offset="1" stop-color="#030207"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff52ff"/>
      <stop offset="0.48" stop-color="#b72cff"/>
      <stop offset="1" stop-color="#ff4de4"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect x="22" y="22" width="980" height="980" rx="190" fill="none" stroke="#8a27c8" stroke-width="24" opacity="0.36" filter="url(#glow)"/>
  <rect x="24" y="24" width="976" height="976" rx="188" fill="none" stroke="url(#neon)" stroke-width="8" filter="url(#softGlow)"/>
  <g fill="#ffffff" filter="url(#softGlow)">
    <path d="M211 712 C145 655 131 552 162 462 C187 389 225 337 222 260 C221 221 209 189 194 161 C253 205 282 263 271 328 C260 393 221 438 197 491 C166 560 170 638 211 712 Z"/>
    <text x="168" y="710" font-family="Arial, Helvetica, sans-serif" font-size="430" font-weight="300" letter-spacing="-28">SCL</text>
  </g>
  <text x="512" y="324" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="300" letter-spacing="3">MORE THAN A BAR</text>
  <line x1="182" y1="742" x2="842" y2="742" stroke="#ffffff" stroke-width="4" opacity="0.94" filter="url(#softGlow)"/>
  <g fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="54" font-style="italic" font-weight="300">
    <text x="270" y="807" text-anchor="middle">Sam’s</text>
    <text x="512" y="807" text-anchor="middle">Club</text>
    <text x="754" y="807" text-anchor="middle">Lounge</text>
  </g>
</svg>
