name: FFM Aktuell public health
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ffm-public-health.yml']
  schedule:
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ffm-public-health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public HTTPS and published API contracts
        run: |
          node --input-type=module <<'JS'
          const base='https://ffm-aktuell.smarbiz.sbs';
          async function check(){
            const response=await fetch(base+'/api/health',{signal:AbortSignal.timeout(12000),redirect:'error'});
            if(!response.ok)throw Error('Application health HTTP '+response.status);
            const health=await response.json();
            if(health.status!=='ok'||health.service!=='ffm-aktuell')throw Error('Invalid application health');
            const docs=await fetch(base+'/api-docs',{signal:AbortSignal.timeout(12000),redirect:'error'});
            if(!docs.ok)throw Error('API reference HTTP '+docs.status);
            const api=await fetch(base+'/api/openapi',{signal:AbortSignal.timeout(12000),redirect:'error'});
            if(!api.ok)throw Error('OpenAPI HTTP '+api.status);
            const spec=await api.json();
            if(!spec.paths?.['/api/health']?.get||!spec.paths?.['/api/billing/webhook']?.post)throw Error('Published API contract is incomplete');
            console.log('FFM public HTTPS, database-backed health and API reference OK');
          }
          for(let attempt=1;attempt<=3;attempt++){
            try{await check();break}
            catch(error){console.error('Attempt '+attempt+': '+error.message);if(attempt===3)process.exit(1);await new Promise(r=>setTimeout(r,15000))}
          }
          JS
