name: Upload A+ Solution staging iOS to App Store Connect

on:
  push:
    branches: [ops/aplussolution-staging]
    paths:
      - '.github/workflows/aplussolution-staging-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  upload-ios:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: ${{ secrets.HOST }}
      PASS: ${{ secrets.PASS }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
    steps:
      - name: Install SSH helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Queue staging App Store Connect upload only
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplus-publisher
          docker compose exec -T web python manage.py shell <<'PY'
          from apps.publisher.models import MobileApp, Release, Build, Job
          from apps.publisher.tasks import enqueue_job
          import json

          app = MobileApp.objects.get(slug='a-plus-solution-staging')
          release = Release.objects.get(app=app, version_name='1.0.0', build_number=1)
          build = Build.objects.get(release=release, platform='ios')

          assert app.bundle_id == 'de.aplussolution.staging', f'Unsafe bundle: {app.bundle_id}'
          assert build.status == 'succeeded', f'iOS build not ready: {build.status}'
          assert bool(build.artifact), 'iOS IPA artifact missing'
          assert build.artifact_size > 0, 'iOS IPA is empty'
          assert bool(build.artifact_checksum), 'iOS IPA checksum missing'

          release.auto_submit = False
          release.save(update_fields=['auto_submit', 'updated_at'])

          # Never create an App Store review submission from this staging upload.
          assert not Job.objects.filter(
              release=release,
              type='submit_apple',
              status__in=['queued', 'running', 'succeeded'],
          ).exists(), 'A staging submit_apple job already exists; refusing to continue.'

          active = Job.objects.filter(
              release=release,
              build=build,
              type='upload_apple',
              status__in=['queued', 'running', 'succeeded'],
          ).order_by('-created_at').first()

          if active is None:
              active = enqueue_job(
                  'upload_apple',
                  app=app,
                  release=release,
                  build=build,
                  agent=True,
                  platform='macos',
              )
              active.append_log('Staging-only upload to App Store Connect/TestFlight. App Review submission is disabled.')
              created = True
          else:
              created = False

          print('IOS_UPLOAD=' + json.dumps({
              'bundle_id': app.bundle_id,
              'release_id': release.id,
              'build_id': build.id,
              'artifact_size': build.artifact_size,
              'job_id': active.id,
              'job_status': active.status,
              'created': created,
              'auto_submit': release.auto_submit,
          }, sort_keys=True))
          PY
          REMOTE

      - name: Wake cloud Mac
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'cloud-macos.yml',
              ref: 'main'
            });
