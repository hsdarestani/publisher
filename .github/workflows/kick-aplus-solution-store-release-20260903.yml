name: Kick A+ Solution Store Release 2026-09-03

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kick-aplus-solution-store-release-20260903.yml'

permissions:
  contents: write

jobs:
  retarget:
    runs-on: ubuntu-latest
    steps:
      - name: Point A+ store release at latest production commit
        uses: actions/github-script@v7
        with:
          script: |
            const path = '.github/workflows/aplus-solution-current-release.yml';
            const target = '1f383b6de87314715a61cb74bd1b84d7e75861c9';
            const { data } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: 'main',
            });
            if (Array.isArray(data) || !data.content || !data.sha) {
              core.setFailed('Could not load current A+ store release workflow.');
              return;
            }
            const source = Buffer.from(data.content, 'base64').toString('utf8');
            const next = source.replace(/APLUS_COMMIT:\s*'[0-9a-f]+'/i, `APLUS_COMMIT: '${target}'`);
            if (next === source) {
              if (source.includes(`APLUS_COMMIT: '${target}'`)) {
                core.info('Store release workflow already targets the requested commit.');
                return;
              }
              core.setFailed('APLUS_COMMIT marker was not found.');
              return;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: `Release A+ Solution mobile from ${target.slice(0, 12)}`,
              content: Buffer.from(next, 'utf8').toString('base64'),
              sha: data.sha,
              branch: 'main',
            });
            core.info(`A+ store release retargeted to ${target}`);
