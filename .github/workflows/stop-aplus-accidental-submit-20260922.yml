name: Stop A+ accidental store submit 2026-09-22

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stop-aplus-accidental-submit-20260922.yml'
  workflow_dispatch:

jobs:
  stop:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install SSH tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
      - name: Delete accidental A+ release before store steps
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell" <<'PY'
          from apps.publisher.models import MobileApp, Release
          app = MobileApp.objects.get(slug='a-plus-solution')
          qs = Release.objects.filter(
              app=app,
              source_commit='7be8d4f9442837106e9c509a7b6474603de8421c',
              status='building',
          )
          rows = list(qs.values_list('id','version_name','build_number'))
          print('deleting=', rows)
          qs.delete()
          print('guard_complete')
          PY
