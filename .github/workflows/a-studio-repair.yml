name: Repair A+ Studio store release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/a-studio-repair.yml'
      - 'apps/signing/management/commands/repair_a_studio_release.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/a-studio-repair.yml'
      - 'apps/signing/management/commands/repair_a_studio_release.py'

permissions:
  contents: read
  actions: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate repair command
        env:
          DEBUG: '1'
          DJANGO_SECRET_KEY: ci-secret
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          python manage.py check
          python manage.py help repair_a_studio_release >/dev/null
          python -m py_compile apps/signing/management/commands/repair_a_studio_release.py

  repair:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Wait for this Publisher revision to be live
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FOUND=0
          for i in $(seq 1 90); do
            STATE="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --branch main --limit 30 \
              --json headSha,status,conclusion \
              --jq ".[] | select(.headSha == \"$GITHUB_SHA\") | [.status, (.conclusion // \"\")] | @tsv" | head -n 1)"
            if [ "$STATE" = $'completed\tsuccess' ]; then
              FOUND=1
              break
            fi
            if printf '%s' "$STATE" | grep -q $'^completed\t'; then
              echo "Publisher deploy for $GITHUB_SHA did not succeed: $STATE" >&2
              exit 2
            fi
            sleep 5
          done
          if [ "$FOUND" -ne 1 ]; then
            echo "Publisher deploy for $GITHUB_SHA was not confirmed." >&2
            exit 3
          fi

      - name: Repair Apple signing and reset orphaned build jobs
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py repair_a_studio_release --app-version 1.0.0 --build-number 1"

      - name: Wake exactly one Linux and one macOS Publisher agent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run cloud-linux.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh workflow run cloud-macos.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Read state after agents start
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sleep 20
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py bootstrap_a_studio --app-version 1.0.0 --build-number 1 --diagnose-only"
