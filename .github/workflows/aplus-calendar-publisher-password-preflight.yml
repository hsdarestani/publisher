name: A+ Solution Apple Publisher connection recovery preflight
on:
  push:
    branches: [main]
    paths: ['.github/workflows/aplus-calendar-publisher-password-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    env:
      HOST: ${{ secrets.HOST }}
      PORT: ${{ secrets.SSH_PORT }}
      SSHPASS: ${{ secrets.PASS }}
    steps:
      - name: Check password-based Strato Publisher access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST"
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq sshpass >/dev/null
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -T 8 -p "${PORT:-22}" -H "$HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          if [ -z "$SSHPASS" ]; then
            echo 'PUBLISHER_PASSWORD_SECRET_MISSING'
            exit 1
          fi
          if ! sshpass -e ssh -o BatchMode=no -o PreferredAuthentications=password -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -p "${PORT:-22}" root@"$HOST" 'test -d /opt/aplus-publisher'; then
            echo 'PUBLISHER_PASSWORD_AUTH_UNAVAILABLE'
            exit 1
          fi
          echo 'PUBLISHER_PASSWORD_AUTH_OK'
      - name: Inspect live releases, Apple states, signing without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          sshpass -e ssh -o BatchMode=no -o PreferredAuthentications=password -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -p "${PORT:-22}" root@"$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplus-publisher
          docker compose exec -T web python manage.py shell <<'PY'
          import json
          from apps.publisher.models import MobileApp,Release,Job
          from apps.signing.models import IOSDistributionCredential,IOSProvisioningProfile
          from apps.integrations.apple_store import AppleStoreClient
          app=MobileApp.objects.get(slug='a-plus-solution')
          r={'repository':app.repository_url,'bundle':app.bundle_id,
          'apple_account':bool(app.apple_account and app.apple_account.configured),
          'ios_certificate':IOSDistributionCredential.objects.filter(store_account=app.apple_account).exists(),
          'ios_profile':IOSProvisioningProfile.objects.filter(app=app).exists(),
          'review_credentials':bool(app.review_username and app.get_review_password()),
          'ios_command':(app.build_config or {}).get('ios_command'),
          'recent_releases':[{'version':x.version_name,'build':x.build_number,'state':x.status,'source':(x.source_commit or '')[:12]}
             for x in Release.objects.filter(app=app).order_by('-created_at')[:12]],
          'active_ios_jobs':[{'kind':j.type,'state':j.status,'version':j.release.version_name if j.release else None,
           'build':j.release.build_number if j.release else None}
           for j in Job.objects.filter(app=app,type__in=['build_ios','upload_apple','submit_apple'],status__in=['queued','running','claimed'])[:15]]}
          try:
            c=AppleStoreClient(app.apple_account); aa=c.find_app(app.bundle_id)
            r['versions']=[{'v':(v.get('attributes') or {}).get('versionString'),
               'state':(v.get('attributes') or {}).get('appStoreState')} for v in c.list_versions(aa['id'],limit=100)]
            builds=c.list_builds(aa['id'],limit=100)
            r['apple_max_build']=max([int((b.get('attributes') or {}).get('version')) for b in builds
                 if str((b.get('attributes') or {}).get('version','')).isdigit()] or [0])
            r['apple_builds']=[{'build':(b.get('attributes') or {}).get('version'),
                   'processing':(b.get('attributes') or {}).get('processingState')} for b in builds[:10]]
          except Exception as exc: r['apple_error_type']=type(exc).__name__
          print('APLUS_PUBLISHER_PREFLIGHT='+json.dumps(r,default=str,separators=(',',':')))
          PY
          REMOTE
