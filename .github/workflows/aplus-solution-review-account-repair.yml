name: Repair A+ Solution App Store review account

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aplus-solution-review-account-repair.yml'

permissions:
  contents: read
  actions: write
  id-token: write

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Install SSH tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null

      - name: Wait for protected A+ credential sync endpoint
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 50); do
            CODE="$(curl -sS -o /tmp/review-sync-probe.json -w '%{http_code}' \
              -X POST -H 'Content-Type: application/json' \
              --data '{"password":"probe-not-a-real-password"}' \
              https://solution.smarbiz.sbs/api/auth/store-review/sync/ || true)"
            echo "review_sync_endpoint_http=$CODE"
            if [ "$CODE" = "403" ]; then exit 0; fi
            sleep 10
          done
          echo 'Protected review credential sync endpoint did not become ready.' >&2
          exit 1

      - name: Rotate Publisher credential and synchronize it through GitHub OIDC
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          REVIEW_PASSWORD="$(openssl rand -base64 48 | tr -d '\n/+=' | head -c 36)"
          test "${#REVIEW_PASSWORD}" -ge 30
          echo "::add-mask::$REVIEW_PASSWORD"
          REVIEW_B64="$(printf '%s' "$REVIEW_PASSWORD" | base64 -w0)"
          echo "::add-mask::$REVIEW_B64"

          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T -e REVIEW_B64='$REVIEW_B64' web python manage.py shell -c \"import base64,os; from apps.publisher.models import MobileApp; p=base64.b64decode(os.environ['REVIEW_B64']).decode(); a=MobileApp.objects.get(slug='a-plus-solution'); a.requires_login=True; a.review_username='store-review@aplus-solution.de'; a.set_review_password(p); a.save(update_fields=['requires_login','review_username','review_password_blob','updated_at']); assert a.get_review_password()==p; print('publisher_review_credential=rotated')\""

          OIDC_JSON="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=aplus-store-review-sync")"
          export OIDC_JSON
          OIDC_TOKEN="$(python3 - <<'PY'
          import json, os
          print(json.loads(os.environ['OIDC_JSON'])['value'])
          PY
          )"
          test -n "$OIDC_TOKEN"
          echo "::add-mask::$OIDC_TOKEN"
          export REVIEW_PASSWORD

          HTTP_CODE="$(python3 - <<'PY' | curl -sS -o /tmp/review-sync.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            --data-binary @- https://solution.smarbiz.sbs/api/auth/store-review/sync/
          import json, os
          print(json.dumps({'password': os.environ['REVIEW_PASSWORD']}))
          PY
          )"
          echo "review_credential_sync_http=$HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            cat /tmp/review-sync.json
            exit 1
          fi

          LOGIN_CODE="$(python3 - <<'PY' | curl -sS --retry 5 --retry-all-errors --retry-delay 3 \
            --connect-timeout 15 --max-time 30 -o /tmp/aplus-login.json -w '%{http_code}' \
            -H 'Content-Type: application/json' --data-binary @- \
            https://solution.smarbiz.sbs/api/auth/login/
          import json, os
          print(json.dumps({'email':'store-review@aplus-solution.de','password':os.environ['REVIEW_PASSWORD']}))
          PY
          )"
          echo "reviewer_login_http=$LOGIN_CODE"
          test "$LOGIN_CODE" = "200"
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/aplus-login.json'))
          user=data.get('user') or {}
          assert data.get('access') and data.get('refresh')
          assert user.get('email') == 'store-review@aplus-solution.de'
          assert user.get('role') == 'worker'
          print('reviewer_login=verified')
          PY

      - name: Dispatch Build 5 resubmission
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'aplus-solution-ios-build5-resubmit.yml',
              ref: 'main'
            });
