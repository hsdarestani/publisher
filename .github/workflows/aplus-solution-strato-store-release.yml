name: A+ Solution Strato Store Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aplus-solution-strato-store-release.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

env:
  APLUS_COMMIT: 'cbaefc551ff8415b5ef293e3ab314385e4f2d94a'
  PRODUCTION_URL: 'https://app.aplus-solution.de'
  STATUS_ISSUE: '74'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    steps:
      - name: Install release tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass jq >/dev/null

      - name: Verify exact Strato production and review login
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          ISSUE_JSON="$(curl -fsSL https://api.github.com/repos/hsdarestani/aplussolution/issues/84)"
          BODY="$(printf '%s' "$ISSUE_JSON" | jq -r '.body // ""')"
          STATE="$(printf '%s' "$ISSUE_JSON" | jq -r '.state')"
          test "$STATE" = 'closed'
          printf '%s' "$BODY" | grep -Fq "Commit: $APLUS_COMMIT"
          printf '%s' "$BODY" | grep -Fq 'Overall: **success**'
          curl -fsS --retry 12 --retry-delay 5 --max-time 20 "$PRODUCTION_URL/health/" >/dev/null

          PORT="${SSH_PORT:-22}"
          REVIEW_SECRET_B64="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell -c \"import base64; from apps.publisher.models import MobileApp; a=MobileApp.objects.get(slug='a-plus-solution'); assert a.review_username=='store-review@aplus-solution.de'; p=a.get_review_password(); assert p; print(base64.b64encode(p.encode()).decode())\"" \
            | tail -n 1 | tr -d '\r')"
          test -n "$REVIEW_SECRET_B64"
          echo "::add-mask::$REVIEW_SECRET_B64"
          REVIEW_PASSWORD="$(printf '%s' "$REVIEW_SECRET_B64" | base64 -d)"
          echo "::add-mask::$REVIEW_PASSWORD"
          export REVIEW_PASSWORD
          CODE="$(python3 - <<'PY' | curl -sS -o /tmp/review-login.json -w '%{http_code}' -H 'Content-Type: application/json' --data-binary @- "$PRODUCTION_URL/api/auth/login/"
          import json, os
          print(json.dumps({'email':'store-review@aplus-solution.de','password':os.environ['REVIEW_PASSWORD']}))
          PY
          )"
          test "$CODE" = '200'
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/review-login.json'))
          user=data.get('user') or {}
          assert data.get('access') and data.get('refresh')
          assert user.get('email')=='store-review@aplus-solution.de'
          assert user.get('role')=='worker'
          print('production reviewer login verified')
          PY

      - name: Prepare release and queue Android and iOS builds
        id: prepare
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py provision_ios_signing a-plus-solution --no-queue"

          OUT="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T -e APLUS_COMMIT='$APLUS_COMMIT' web python manage.py shell" <<'PY'
          import json, os, re
          from apps.integrations.apple_store import AppleStoreClient
          from apps.integrations.google_play import GooglePlayClient
          from apps.publisher.models import Build, Job, MobileApp, Release
          from apps.publisher.tasks import enqueue_job

          app=MobileApp.objects.get(slug='a-plus-solution')
          assert app.google_account and app.google_account.configured
          assert app.apple_account and app.apple_account.configured
          assert app.repository_url
          assert app.review_username=='store-review@aplus-solution.de'
          assert app.get_review_password()

          cfg=dict(app.build_config or {})
          cfg['android_command']='bash frontend/scripts/build-publisher-android.sh'
          cfg['android_artifact']='frontend/android/app/build/outputs/bundle/release/*.aab'
          cfg['ios_command']='bash frontend/scripts/build-publisher-ios-opaque.sh'
          cfg['ios_artifact']='frontend/ios/build/export/*.ipa'
          env=dict(cfg.get('env') or {})
          env['VITE_API_URL']='https://app.aplus-solution.de/api'
          cfg['env']=env
          app.build_config=cfg
          app.requires_login=True
          app.review_notes=(
              'A+ Solution is the internal workforce application used by A+ Solution GmbH for employee scheduling, '
              'availability, OpenShifts, time tracking, absences, contracts/documents, notifications and internal communication. '
              'The supplied App Review account is a dedicated active employee test account with no invitation step and no two-factor authentication. '
              'The production backend has migrated to app.aplus-solution.de; the review account was verified immediately before submission. '
              'This update keeps native push notifications, documents, calendar, PDF sharing, filters and notification settings available. '
              'There are no in-app purchases.'
          )
          app.save(update_fields=['build_config','requires_login','review_notes','updated_at'])
          loc=app.localizations.filter(locale='de-DE').first()
          if loc:
              loc.release_notes='Stabilitätsupdate nach Servermigration; Push-Benachrichtigungen, Kalender, Dokumente und PDF-Funktionen bleiben verfügbar.'
              loc.save(update_fields=['release_notes','updated_at'])

          apple=AppleStoreClient(app.apple_account)
          apple_app=apple.find_app(app.bundle_id)
          versions=apple.list_versions(apple_app['id'],limit=50)
          def semver(value):
              nums=[int(x) for x in re.findall(r'\d+',str(value or ''))[:3]]
              while len(nums)<3: nums.append(0)
              return tuple(nums)
          def bump(value):
              a,b,c=semver(value); return f'{a}.{b}.{c+1}'
          current=max(versions,key=lambda x:semver((x.get('attributes') or {}).get('versionString')),default=None)
          attrs=(current or {}).get('attributes') or {}
          current_version=attrs.get('versionString') or '1.0.0'
          current_state=attrs.get('appStoreState') or attrs.get('appVersionState') or 'UNKNOWN'
          replaceable={'PREPARE_FOR_SUBMISSION','READY_FOR_REVIEW','DEVELOPER_REJECTED','METADATA_REJECTED','REJECTED','WAITING_FOR_REVIEW','IN_REVIEW','INVALID_BINARY'}
          target_version=current_version if current_state in replaceable else bump(current_version)

          db_max=max(Release.objects.filter(app=app).values_list('build_number',flat=True),default=0)
          apple_max=0
          for item in apple.list_builds(apple_app['id'],limit=50):
              try: apple_max=max(apple_max,int((item.get('attributes') or {}).get('version')))
              except (TypeError,ValueError): pass
          google_max=0
          gp=GooglePlayClient(app.google_account); edit=None
          try:
              edit=gp._open_edit(app.package_name)
              tracks=gp._edit_request(edit,'GET',f'/applications/{gp._q(app.package_name)}/edits/{edit.edit_id}/tracks').get('tracks',[])
              for track in tracks:
                  for rel in track.get('releases') or []:
                      for code in rel.get('versionCodes') or []:
                          try: google_max=max(google_max,int(code))
                          except (TypeError,ValueError): pass
          finally:
              if edit: gp._safe_delete_edit(edit)

          build_number=max(db_max,apple_max,google_max)+1
          release,_=Release.objects.get_or_create(app=app,version_name=target_version,build_number=build_number)
          release.status='building'; release.source_branch='main'; release.source_commit=os.environ['APLUS_COMMIT']
          release.android_track='production'; release.android_rollout=1; release.ios_release_type='automatic'; release.auto_submit=False
          release.release_notes='Stabilitätsupdate nach Servermigration auf app.aplus-solution.de.'
          release.save()

          queued=[]
          for platform,job_type,runner in [('android','build_android','linux'),('ios','build_ios','macos')]:
              build,_=Build.objects.get_or_create(release=release,platform=platform)
              active=Job.objects.filter(build=build,type=job_type,status__in=['queued','running']).exists()
              if build.status=='succeeded' and build.artifact: continue
              if not active:
                  build.status='queued'; build.logs=''; build.finished_at=None; build.external_build_id=''; build.metadata={}
                  if build.artifact: build.artifact.delete(save=False)
                  build.artifact=''; build.artifact_size=0; build.artifact_checksum=''; build.save()
                  queued.append(str(enqueue_job(job_type,app=app,release=release,build=build,payload={'source':'strato-store-release'},agent=True,platform=runner).id))
          print('RELEASE_META_JSON='+json.dumps({'release_id':str(release.id),'version':target_version,'build':build_number,'apple_state':current_state,'queued':queued},separators=(',',':')))
          PY
          )"
          printf '%s\n' "$OUT"
          META="$(printf '%s\n' "$OUT" | sed -n 's/^RELEASE_META_JSON=//p' | tail -n 1)"
          test -n "$META"
          echo "release_id=$(printf '%s' "$META" | jq -r '.release_id')" >> "$GITHUB_OUTPUT"
          echo "version=$(printf '%s' "$META" | jq -r '.version')" >> "$GITHUB_OUTPUT"
          echo "build=$(printf '%s' "$META" | jq -r '.build')" >> "$GITHUB_OUTPUT"
          echo "apple_state=$(printf '%s' "$META" | jq -r '.apple_state')" >> "$GITHUB_OUTPUT"

      - name: Mark release as building
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
          BUILD: ${{ steps.prepare.outputs.build }}
          APPLE_STATE: ${{ steps.prepare.outputs.apple_state }}
        shell: bash
        run: |
          body=$(printf 'A+ Solution Strato store release is running.\n\n- Source commit: `%s`\n- Version: **%s**\n- Build: **%s**\n- Production: **https://app.aplus-solution.de**\n- Previous Apple state: **%s**\n- Android AAB: **building**\n- iOS IPA: **building**\n- Workflow: %s/%s/actions/runs/%s\n' "$APLUS_COMMIT" "$VERSION" "$BUILD" "$APPLE_STATE" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$STATUS_ISSUE" -f body="$body" -f state=open >/dev/null

      - name: Wake cloud builders
        uses: actions/github-script@v7
        with:
          script: |
            for (const workflow_id of ['cloud-linux.yml','cloud-macos.yml']) {
              await github.rest.actions.createWorkflowDispatch({owner: context.repo.owner, repo: context.repo.repo, workflow_id, ref: 'main'});
            }

      - name: Wait for signed AAB and IPA
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          RELEASE_ID: ${{ steps.prepare.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          for i in $(seq 1 240); do
            STATE="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
              "cd /opt/aplus-publisher && docker compose exec -T -e RELEASE_ID='$RELEASE_ID' web python manage.py shell" <<'POLL'
          import os,re
          from apps.publisher.models import Build,Job,Release
          r=Release.objects.get(id=os.environ['RELEASE_ID']); values=[]
          for platform,job_type in [('android','build_android'),('ios','build_ios')]:
              b=Build.objects.get(release=r,platform=platform); failed=Job.objects.filter(build=b,type=job_type,status='failed').order_by('-created_at').first()
              error=re.sub(r'\s+',' ',str(failed.error or '')).replace('|','/')[:300] if failed else ''
              values.append(':'.join([platform,b.status,'artifact' if b.artifact else '',error]))
          print('|'.join(values))
          POLL
            )"
            STATE="$(printf '%s\n' "$STATE" | tail -n 1 | tr -d '\r')"
            echo "Native build state: $STATE"
            if [[ "$STATE" == *":failed:"* ]]; then echo "$STATE" >&2; exit 1; fi
            if [[ "$STATE" == android:succeeded:artifact:*"|"ios:succeeded:artifact:* ]]; then exit 0; fi
            sleep 20
          done
          echo 'Timed out waiting for native builds.' >&2; exit 1

      - name: Queue Google submission and Apple upload
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          RELEASE_ID: ${{ steps.prepare.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T -e RELEASE_ID='$RELEASE_ID' web python manage.py shell" <<'PY'
          import os
          from apps.publisher.models import Job,Release
          from apps.publisher.tasks import enqueue_job
          r=Release.objects.get(id=os.environ['RELEASE_ID']); app=r.app
          android=r.builds.get(platform='android'); ios=r.builds.get(platform='ios')
          assert android.status=='succeeded' and android.artifact
          assert ios.status=='succeeded' and ios.artifact
          if not Job.objects.filter(release=r,type='submit_google',status__in=['queued','running','succeeded']).exists():
              print('google='+str(enqueue_job('submit_google',app=app,release=r,build=android).id))
          if not ios.external_build_id and not Job.objects.filter(build=ios,type='upload_apple',status__in=['queued','running','succeeded']).exists():
              print('apple_upload='+str(enqueue_job('upload_apple',app=app,release=r,build=ios,agent=True,platform='macos').id))
          PY

      - name: Wake cloud Mac for App Store upload
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({owner: context.repo.owner, repo: context.repo.repo, workflow_id: 'cloud-macos.yml', ref: 'main'});

      - name: Wait for Google delivery and processed Apple build
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          RELEASE_ID: ${{ steps.prepare.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          for i in $(seq 1 180); do
            STATE="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
              "cd /opt/aplus-publisher && docker compose exec -T -e RELEASE_ID='$RELEASE_ID' web python manage.py shell" <<'POLL'
          import os,re
          from apps.publisher.models import Job,Release
          r=Release.objects.get(id=os.environ['RELEASE_ID']); ios=r.builds.get(platform='ios')
          g=Job.objects.filter(release=r,type='submit_google').order_by('-created_at').first(); u=Job.objects.filter(release=r,type='upload_apple').order_by('-created_at').first()
          def err(j): return re.sub(r'\s+',' ',str(j.error or '')).replace('|','/')[:300] if j else ''
          print('|'.join([g.status if g else 'missing',err(g),u.status if u else ('succeeded' if ios.external_build_id else 'missing'),err(u),ios.external_build_id or '']))
          POLL
            )"
            STATE="$(printf '%s\n' "$STATE" | tail -n 1 | tr -d '\r')"
            echo "Store delivery: $STATE"
            IFS='|' read -r GST GERR UST UERR APPLE_ID <<< "$STATE"
            if [ "$GST" = failed ]; then echo "Google: $GERR" >&2; exit 1; fi
            if [ "$UST" = failed ]; then echo "Apple upload: $UERR" >&2; exit 1; fi
            if [ "$GST" = succeeded ] && [ -n "$APPLE_ID" ]; then exit 0; fi
            sleep 20
          done
          echo 'Timed out waiting for store delivery.' >&2; exit 1

      - name: Replace prior Apple review with this build and submit
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          RELEASE_ID: ${{ steps.prepare.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T -e RELEASE_ID='$RELEASE_ID' web python manage.py shell" <<'PY'
          import os,time
          from apps.integrations.apple_store import AppleStoreClient
          from apps.publisher.models import Job,Release
          from apps.publisher.tasks import enqueue_job
          r=Release.objects.get(id=os.environ['RELEASE_ID']); app=r.app; build=r.builds.get(platform='ios')
          assert build.status=='succeeded' and build.external_build_id
          client=AppleStoreClient(app.apple_account); apple_app=client.find_app(app.bundle_id); version=client.ensure_version(apple_app['id'],r.version_name); version_id=str(version['id'])
          canceled=[]
          for state in ('WAITING_FOR_REVIEW','IN_REVIEW'):
              for submission in client.list_review_submissions(apple_app['id'],state):
                  item,_=client._review_submission_matches(submission,version_id)
                  if item: client.cancel_review_submission(submission['id']); canceled.append(submission['id'])
          if canceled:
              for _ in range(30):
                  active=False
                  for state in ('WAITING_FOR_REVIEW','IN_REVIEW'):
                      for submission in client.list_review_submissions(apple_app['id'],state):
                          item,_=client._review_submission_matches(submission,version_id)
                          if item: active=True; break
                      if active: break
                  if not active: break
                  time.sleep(2)
              if active: raise SystemExit('Prior Apple review did not leave active queue.')
          if not Job.objects.filter(release=r,type='submit_apple',status__in=['queued','running','succeeded']).exists():
              print('apple_submit='+str(enqueue_job('submit_apple',app=app,release=r,build=build).id))
          print('prior_reviews_canceled='+str(len(canceled)))
          PY

      - name: Wait until both stores are submitted
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          RELEASE_ID: ${{ steps.prepare.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          for i in $(seq 1 120); do
            STATE="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
              "cd /opt/aplus-publisher && docker compose exec -T -e RELEASE_ID='$RELEASE_ID' web python manage.py shell" <<'POLL'
          import os,re
          from apps.publisher.models import Job,Release,Submission
          r=Release.objects.get(id=os.environ['RELEASE_ID'])
          g=Job.objects.filter(release=r,type='submit_google').order_by('-created_at').first(); a=Job.objects.filter(release=r,type='submit_apple').order_by('-created_at').first()
          gs=Submission.objects.filter(release=r,platform='android').first(); ap=Submission.objects.filter(release=r,platform='ios').first()
          def err(j): return re.sub(r'\s+',' ',str(j.error or '')).replace('|','/')[:300] if j else ''
          print('|'.join([g.status if g else 'missing',err(g),a.status if a else 'missing',err(a),gs.state if gs else '',ap.state if ap else '',ap.external_id if ap else '']))
          POLL
            )"
            STATE="$(printf '%s\n' "$STATE" | tail -n 1 | tr -d '\r')"
            echo "Review submission: $STATE"
            IFS='|' read -r GST GERR AST AERR GS AS AID <<< "$STATE"
            if [ "$GST" = failed ]; then echo "Google: $GERR" >&2; exit 1; fi
            if [ "$AST" = failed ]; then echo "Apple: $AERR" >&2; exit 1; fi
            if [ "$GST" = succeeded ] && [ "$AST" = succeeded ] && [ -n "$GS" ] && [ -n "$AS" ]; then exit 0; fi
            sleep 15
          done
          echo 'Timed out waiting for store submissions.' >&2; exit 1

      - name: Publish verified final status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
          BUILD: ${{ steps.prepare.outputs.build }}
        shell: bash
        run: |
          body=$(printf '✅ A+ Solution Strato release was built and submitted to both stores.\n\n- Source commit: `%s`\n- Version: **%s**\n- Build: **%s**\n- Production: **https://app.aplus-solution.de**\n- Google Play production: **submitted**\n- App Store Connect: **submitted for review**\n- Workflow: %s/%s/actions/runs/%s\n\nStore review/processing is now controlled by Google and Apple.' "$APLUS_COMMIT" "$VERSION" "$BUILD" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$STATUS_ISSUE" -f body="$body" -f state=closed >/dev/null

      - name: Publish blocker
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
          BUILD: ${{ steps.prepare.outputs.build }}
        shell: bash
        run: |
          body=$(printf '❌ A+ Solution Strato store release hit a blocker.\n\n- Source commit: `%s`\n- Version: **%s**\n- Build: **%s**\n- Production: **https://app.aplus-solution.de**\n- Workflow: %s/%s/actions/runs/%s\n\nOpen the failed workflow step for the exact blocker.' "$APLUS_COMMIT" "${VERSION:-pending}" "${BUILD:-pending}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$STATUS_ISSUE" -f body="$body" -f state=open >/dev/null
