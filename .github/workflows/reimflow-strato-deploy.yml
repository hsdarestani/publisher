name: Deploy Reimflow on STRATO (isolated)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reimflow-strato-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reimflow-strato
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Checkout current Reimflow
        uses: actions/checkout@v4
        with:
          repository: hsdarestani/Reimflow
          ref: main
          path: reimflow-src
      - name: Validate and package unchanged modules
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile reimflow-src/api.py
          cd reimflow-src
          tar -czf "$RUNNER_TEMP/reimflow-strato.tar.gz" index.html app.js api.py styles.css themes.css ai-engine.css sonic-atelier.css theme-engine.js sonic-atelier.js
      - name: Provision isolated containers and Caddy route
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.HOST }}
          DEPLOY_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          EXPECTED_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          test "$DEPLOY_HOST" = "82.165.187.14" || { echo "::error::Publisher HOST must point to the new STRATO 82.165.187.14"; exit 1; }
          test -n "$DEPLOY_KEY" || { echo "::error::Missing production SSH_PRIVATE_KEY in Publisher"; exit 1; }
          PORT="$DEPLOY_PORT"
          if [ -z "$PORT" ]; then PORT=22; fi
          umask 077
          KEY="$RUNNER_TEMP/reimflow-deploy-key"
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$KEY"
          chmod 600 "$KEY"
          if [ -n "$DEPLOY_KEY_PASSPHRASE" ]; then
            eval "$(ssh-agent -s)" > /dev/null
            ASKPASS="$RUNNER_TEMP/reimflow-askpass"
            printf '%s\n' '#!/bin/sh' 'printf "%s" "$DEPLOY_KEY_PASSPHRASE"' > "$ASKPASS"
            chmod 700 "$ASKPASS"
            DISPLAY=:0 SSH_ASKPASS="$ASKPASS" SSH_ASKPASS_REQUIRE=force setsid ssh-add "$KEY" < /dev/null
          fi
          mkdir -p "$HOME/.ssh"
          ssh-keyscan -T 10 -p "$PORT" -H "$DEPLOY_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          test -s "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          if [ -n "$EXPECTED_FINGERPRINT" ]; then
            ssh-keygen -lf "$HOME/.ssh/known_hosts" | grep -F -- "$EXPECTED_FINGERPRINT" >/dev/null
          fi
          ENVFILE="$RUNNER_TEMP/reimflow-strato.env"
          printf 'OPENAI_MODEL=gpt-5-mini\n' > "$ENVFILE"
          if [ -n "$OPENAI_API_KEY" ]; then
            printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY" >> "$ENVFILE"
          fi
          chmod 600 "$ENVFILE"
          scp -i "$KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -P "$PORT" "$RUNNER_TEMP/reimflow-strato.tar.gz" "$ENVFILE" root@"$DEPLOY_HOST":/tmp/
          ssh -i "$KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$PORT" root@"$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          test -f /opt/aplus-publisher/docker-compose.yml
          test -f /opt/aplus-publisher/Caddyfile
          command -v docker
          docker compose version
          CADDY_ID="$(cd /opt/aplus-publisher && docker compose ps -q caddy)"
          test -n "$CADDY_ID"
          docker inspect "$CADDY_ID" --format '{{range $name, $network := .NetworkSettings.Networks}}{{println $name}}{{end}}' | head -n 1 > /tmp/reimflow-publisher-network
          PUBLISHER_NETWORK="$(cat /tmp/reimflow-publisher-network)"
          test -n "$PUBLISHER_NETWORK"
          mkdir -p /opt/reimflow/site /opt/reimflow/data
          chmod 755 /opt/reimflow/site
          chown 10001:10001 /opt/reimflow/data
          rm -f /opt/reimflow/site/*.js /opt/reimflow/site/*.css /opt/reimflow/site/*.html
          tar -xzf /tmp/reimflow-strato.tar.gz -C /opt/reimflow/site
          mv /opt/reimflow/site/api.py /opt/reimflow/api.py
          chmod 644 /opt/reimflow/api.py
          cp /tmp/reimflow-strato.env /opt/reimflow/.env
          chmod 600 /opt/reimflow/.env
          printf 'PUBLISHER_NETWORK=%s\n' "$PUBLISHER_NETWORK" >> /opt/reimflow/.env
          cat > /opt/reimflow/nginx.conf <<'NGINX'
          server {
              listen 80;
              server_name _;
              root /usr/share/nginx/html;
              index index.html;
              location /api/ {
                  proxy_pass http://127.0.0.1:8787;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $http_x_forwarded_for;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_connect_timeout 5s;
                  proxy_read_timeout 60s;
                  client_max_body_size 32k;
              }
              location / {
                  add_header Cache-Control "no-cache" always;
                  try_files $uri $uri/ /index.html;
              }
          }
          NGINX
          cat > /opt/reimflow/docker-compose.yml <<'COMPOSE'
          name: reimflow
          services:
            web:
              image: nginx:alpine
              restart: unless-stopped
              read_only: true
              tmpfs:
                - /var/cache/nginx
                - /var/run
                - /tmp
              volumes:
                - ./site:/usr/share/nginx/html:ro
                - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
              networks:
                default: {}
                publisher:
                  aliases:
                    - reimflow-web
              mem_limit: 96m
              cpus: 0.4
              security_opt:
                - no-new-privileges:true
            api:
              image: python:3.12-alpine
              restart: unless-stopped
              user: "10001:10001"
              network_mode: service:web
              depends_on:
                - web
              working_dir: /app
              command: ["python", "-u", "/app/api.py"]
              env_file: .env
              environment:
                REIMFLOW_DB: /var/lib/reimflow/reimflow.sqlite3
              volumes:
                - ./api.py:/app/api.py:ro
                - ./data:/var/lib/reimflow
              read_only: true
              tmpfs:
                - /tmp
              mem_limit: 192m
              cpus: 0.6
              security_opt:
                - no-new-privileges:true
          networks:
            default: {}
            publisher:
              external: true
              name: ${PUBLISHER_NETWORK}
          COMPOSE
          cd /opt/reimflow
          docker compose config --quiet
          docker compose up -d --pull always --remove-orphans
          for i in $(seq 1 20); do
            if docker compose exec -T api python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8787/api/health',timeout=3).read().decode())" </dev/null; then
              break
            fi
            if [ "$i" -eq 20 ]; then docker compose logs --tail=50 api web; exit 1; fi
            sleep 2
          done
          if ! grep -qF 'reimflow.smarbiz.sbs {' /opt/aplus-publisher/Caddyfile; then
            cat >> /opt/aplus-publisher/Caddyfile <<'CADDY'
          
          # Isolated Reimflow test application; no publisher paths or ports changed.
          reimflow.smarbiz.sbs {
            encode zstd gzip
            reverse_proxy reimflow-web:80
            header X-Content-Type-Options nosniff
          }
          CADDY
          fi
          cd /opt/aplus-publisher
          # Publisher deployment rewrites the host Caddyfile. The existing container may
          # still bind-mount the deleted inode and serve the old Publisher-only config.
          if ! docker compose exec -T caddy grep -qF 'reimflow.smarbiz.sbs {' /etc/caddy/Caddyfile </dev/null; then
            echo "Recreating only the Caddy proxy to refresh the stale file bind mount."
            docker compose up -d --no-deps --force-recreate caddy
          fi
          CADDY_ID="$(docker compose ps -q caddy)"
          docker compose exec -T caddy grep -qF 'reimflow.smarbiz.sbs {' /etc/caddy/Caddyfile </dev/null
          docker compose exec -T caddy caddy validate --config /etc/caddy/Caddyfile </dev/null
          docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile </dev/null
          docker exec "$CADDY_ID" wget -qO- http://reimflow-web/ | grep -q Reimflow
          rm -f /tmp/reimflow-strato.tar.gz /tmp/reimflow-strato.env /tmp/reimflow-publisher-network
          echo "Reimflow containers healthy and Publisher Caddy reloaded."
          REMOTE
      - name: Verify public domain and AI health
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 15); do
            SITE="$(curl -fsSL --max-time 12 https://reimflow.smarbiz.sbs/ || true)"
            HEALTH="$(curl -fsSL --max-time 12 https://reimflow.smarbiz.sbs/api/health || true)"
            if echo "$SITE" | grep -q 'Reimflow' && echo "$HEALTH" | grep -q '"ok": true'; then
              echo "Reimflow site: OK"
              echo "API status: $HEALTH"
              # Verify the source deployed with the themed dark search skeleton.
              LOADING_CSS="$(curl -fsSL --max-time 12 'https://reimflow.smarbiz.sbs/sonic-atelier.css?v=20261013-dark-loader')"
              if [[ "$LOADING_CSS" != *'saSkeletonShimmer'* ]] || [[ "$SITE" != *'20261013-dark-loader'* ]]; then
                echo "::error::Reimflow site is up but dark skeleton stylesheet is stale."
                exit 1
              fi
              echo "Dark skeleton CSS: verified"
              exit 0
            fi
            sleep 4
          done
          echo "::error::Public Reimflow site/API not yet reachable; check Cloudflare SSL mode and DNS."
          exit 1
