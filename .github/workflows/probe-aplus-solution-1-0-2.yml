name: Finalize A+ Solution iOS 1.0.2 review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-aplus-solution-1-0-2.yml'

permissions:
  contents: read
  issues: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Resolve App Store build and submit 1.0.2
        id: finalize
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          PORT="${SSH_PORT:-22}"
          SCRIPT_B64="$(base64 -w0 <<'PY'
          import time
          from django.utils import timezone
          from apps.integrations.apple_store import AppleStoreClient
          from apps.publisher.models import MobileApp, Release, Job
          from apps.publisher.tasks import run_job

          app = MobileApp.objects.get(slug='a-plus-solution')
          release = Release.objects.get(app=app, version_name='1.0.2', build_number=8)
          build = release.builds.get(platform='ios')
          client = AppleStoreClient(app.apple_account)
          record = client.find_app(app.bundle_id)
          app_id = record['id']

          print(f'app_id={app_id}')
          print(f'publisher_build_external_id_before={build.external_build_id}')

          versions = client.list_versions(app_id)
          for item in versions:
              attrs = item.get('attributes', {})
              print(f'version={attrs.get("versionString")} id={item["id"]} state={attrs.get("appStoreState") or attrs.get("appVersionState")}')

          exact = next((v for v in versions if v.get('attributes', {}).get('versionString') == '1.0.2'), None)
          old = next((v for v in versions if v.get('attributes', {}).get('versionString') == '1.0.1'), None)

          if not exact and old:
              for submission in client.list_review_submissions(app_id, 'WAITING_FOR_REVIEW'):
                  item, _ = client._review_submission_matches(submission, old['id'])
                  if item:
                      result = client.cancel_review_submission(submission['id'])
                      print(f'cancelled_submission={submission["id"]}')
                      print(f'cancel_state={result.get("attributes", {}).get("state")}')

              deadline = time.time() + 180
              while time.time() < deadline:
                  current = next((v for v in client.list_versions(app_id) if v['id'] == old['id']), None)
                  attrs = (current or {}).get('attributes', {})
                  state = attrs.get('appStoreState') or attrs.get('appVersionState')
                  print(f'old_version_state={state}')
                  if state in {'PREPARE_FOR_SUBMISSION', 'READY_FOR_REVIEW', 'DEVELOPER_REJECTED', 'METADATA_REJECTED', 'REJECTED'}:
                      break
                  time.sleep(10)

          version = client.ensure_version(app_id, '1.0.2')
          vattrs = version.get('attributes', {})
          print(f'target_version_id={version["id"]}')
          print(f'target_version={vattrs.get("versionString")}')
          print(f'target_state={vattrs.get("appStoreState") or vattrs.get("appVersionState")}')

          apple_builds = client.list_builds(app_id, build_number=str(release.build_number), limit=50)
          valid = [b for b in apple_builds if b.get('attributes', {}).get('processingState') == 'VALID']
          for b in apple_builds:
              attrs = b.get('attributes', {})
              print(f'apple_build_id={b["id"]} processing={attrs.get("processingState")} uploaded={attrs.get("uploadedDate")} version={attrs.get("version")}')
          if not valid:
              raise RuntimeError('No VALID App Store build found for build number 8.')
          apple_build = valid[0]
          build.external_build_id = apple_build['id']
          build.save(update_fields=['external_build_id', 'updated_at'])
          print(f'publisher_build_external_id_after={build.external_build_id}')

          Job.objects.filter(
              app=app,
              release=release,
              type='submit_apple',
              status__in=['queued', 'running'],
          ).update(
              status='cancelled',
              finished_at=timezone.now(),
              error='Superseded by corrected App Store build-ID submission.',
          )

          job = Job.objects.create(
              type='submit_apple',
              app=app,
              release=release,
              build=build,
              payload={'source': 'correct-app-store-build-id-and-submit'},
              available_to_agents=False,
          )
          run_job.apply(args=[job.pk]).get()
          job.refresh_from_db()
          print(f'submit_job={job.pk}')
          print(f'submit_status={job.status}')
          if job.error:
              print(f'submit_error={job.error}')
          if job.status != 'succeeded':
              raise RuntimeError(job.error or f'submit_apple ended as {job.status}')

          submission = release.submissions.filter(platform='ios').order_by('-updated_at').first()
          print(f'submission_state={submission.state if submission else "missing"}')
          print(f'submission_external_id={submission.external_id if submission else "missing"}')
          print('FINAL=SUCCESS')
          PY
          )"

          set +e
          OUTPUT="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && printf '%s' '$SCRIPT_B64' | base64 -d | docker compose exec -T web python manage.py shell" 2>&1)"
          RC=$?
          set -e
          printf '%s\n' "$OUTPUT"
          {
            echo 'output<<EOF'
            printf '%s\n' "$OUTPUT"
            echo EOF
          } >> "$GITHUB_OUTPUT"
          if [ "$RC" -ne 0 ]; then exit "$RC"; fi

      - name: Update release status issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT: ${{ steps.finalize.outputs.output }}
        run: |
          set -euo pipefail
          BODY_FILE="$(mktemp)"
          {
            echo 'Result: **final iOS 1.0.2 review submission**'
            echo
            echo '```text'
            printf '%s\n' "${OUTPUT:-workflow failed before output capture}"
            echo '```'
            echo
            echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$BODY_FILE"
          gh issue edit 79 --repo "$GITHUB_REPOSITORY" --body-file "$BODY_FILE"
