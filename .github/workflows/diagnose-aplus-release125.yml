name: Diagnose A+ Solution release 125

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-aplus-release125.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - name: Read release 125 status
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST"             "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell -c 'import json; from apps.publisher.models import Release,Job,Submission; r=Release.objects.get(pk=125); print(json.dumps({"release":{"id":r.id,"status":r.status,"version_name":r.version_name,"build_number":r.build_number,"auto_submit":r.auto_submit},"builds":[{"id":b.id,"platform":b.platform,"status":b.status,"external_build_id":b.external_build_id} for b in r.builds.all()],"jobs":[{"id":j.id,"type":j.type,"status":j.status,"error":j.error[-500:]} for j in Job.objects.filter(release=r).order_by("created_at")],"submissions":[{"platform":s.platform,"state":s.state,"external_id":s.external_id,"last_error":s.last_error} for s in Submission.objects.filter(release=r)]}, default=str))'"
