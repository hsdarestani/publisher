name: A+ Esthetic Apple review recovery

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/a-esthetic-submit-status.yml'

permissions:
  contents: read

concurrency:
  group: a-esthetic-apple-review-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Safely advance and submit current A+ Esthetic release
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          PY_CODE=$(cat <<'PY'
          import json, time
          from apps.integrations.apple_store import AppleStoreClient
          from apps.publisher.models import MobileApp, Release, Submission
          from apps.publisher.tasks import enqueue_job

          SOURCE='d7efb450b3493cf153aa680cd2a0e923345744e9'
          EDITABLE={'PREPARE_FOR_SUBMISSION','READY_FOR_REVIEW','DEVELOPER_REJECTED','METADATA_REJECTED','REJECTED'}
          TRANSITIONAL={'PROCESSING_FOR_DISTRIBUTION','PROCESSING_TO_AVAILABLE','PENDING_APPLE_RELEASE','WAITING_FOR_EXPORT_COMPLIANCE'}
          app=MobileApp.objects.get(slug='a-esthetic')
          release=Release.objects.filter(app=app,source_commit=SOURCE).order_by('-created_at').first()
          if not release: raise SystemExit('release_missing')
          ios=release.builds.get(platform='ios')
          if ios.status!='succeeded' or not ios.external_build_id: raise SystemExit('ios_build_not_ready')
          client=AppleStoreClient(app.apple_account)
          app_id=client.find_app(app.bundle_id)['id']

          def vs(): return client.list_versions(app_id)
          def vst(v):
              a=v.get('attributes',{}); return a.get('appStoreState') or a.get('appVersionState') or ''
          def rs(): return client.request('GET',f'/apps/{app_id}/reviewSubmissions?limit=200').get('data',[])
          def rst(r): return r.get('attributes',{}).get('state') or ''
          def its(r): return client.list_review_submission_items(r['id'])
          def ist(i): return i.get('attributes',{}).get('state') or ''
          def vid(i): return str((i.get('relationships',{}).get('appStoreVersion',{}).get('data') or {}).get('id') or '')
          def live_item(r,v): return next((i for i in its(r) if vid(i)==str(v) and ist(i)!='REMOVED'),None)

          target_name=release.version_name
          versions=vs()
          for v in versions:
              print('APPLE_VERSION',v['id'],v.get('attributes',{}).get('versionString'),vst(v))
          target=next((v for v in versions if v.get('attributes',{}).get('versionString')==target_name),None)

          if target:
              for r in rs():
                  if rst(r) in {'WAITING_FOR_REVIEW','IN_REVIEW'} and live_item(r,target['id']):
                      Submission.objects.update_or_create(app=app,release=release,platform='ios',defaults={'state':'in_review','external_id':r['id']})
                      release.status='in_review'; release.save(update_fields=['status','updated_at'])
                      print('FINAL already_active ios=in_review',target_name,release.build_number)
                      raise SystemExit(0)

          # Never interrupt an active review. The scheduled run will try again after Apple changes state.
          other_in_review=next((v for v in versions if vst(v)=='IN_REVIEW' and (not target or v['id']!=target['id'])),None)
          if other_in_review:
              print('APPLE_BLOCKED_ACTIVE_REVIEW',other_in_review.get('attributes',{}).get('versionString'))
              print('APPLE_ACTION=leave_existing_review_untouched')
              raise SystemExit(0)

          # Publisher uses manual iOS release. Once Apple approves the currently reviewed version,
          # release that approved version so App Store Connect can open the slot for the queued update.
          pending_release=next((v for v in versions if vst(v)=='PENDING_DEVELOPER_RELEASE' and (not target or v['id']!=target['id'])),None)
          if pending_release:
              release_body={
                  'data':{
                      'type':'appStoreVersionReleaseRequests',
                      'relationships':{
                          'appStoreVersion':{
                              'data':{'type':'appStoreVersions','id':pending_release['id']}
                          }
                      }
                  }
              }
              try:
                  client.request('POST','/appStoreVersionReleaseRequests',data=json.dumps(release_body))
                  print('APPLE_PREVIOUS_RELEASE_REQUESTED',pending_release.get('attributes',{}).get('versionString'),pending_release['id'])
              except Exception as exc:
                  # A duplicate request/state race is harmless; re-read the state before deciding.
                  refreshed=next((v for v in vs() if v['id']==pending_release['id']),None)
                  current=vst(refreshed) if refreshed else 'MISSING'
                  if current=='PENDING_DEVELOPER_RELEASE':
                      raise
                  print('APPLE_PREVIOUS_RELEASE_ALREADY_ADVANCING',current,str(exc)[:400])
              print('APPLE_ACTION=wait_for_previous_distribution')
              raise SystemExit(0)

          # Processing/Apple-release states are intentionally left untouched. A later scheduled run resumes.
          transition=next((v for v in versions if vst(v) in TRANSITIONAL and (not target or v['id']!=target['id'])),None)
          if transition:
              print('APPLE_PREVIOUS_VERSION_TRANSITIONING',transition.get('attributes',{}).get('versionString'),vst(transition))
              raise SystemExit(0)

          waiting=next((v for v in versions if vst(v)=='WAITING_FOR_REVIEW' and (not target or v['id']!=target['id'])),None)
          if target is None and waiting:
              old_id=waiting['id']
              print('APPLE_REPLACE_WAITING',waiting.get('attributes',{}).get('versionString'),'->',target_name)
              canceled=False
              for r in rs():
                  if rst(r)=='WAITING_FOR_REVIEW' and live_item(r,old_id):
                      client.cancel_review_submission(r['id']); print('APPLE_REVIEW_CANCELED',r['id']); canceled=True
              if not canceled: raise SystemExit('waiting_review_submission_not_found')
              state='WAITING_FOR_REVIEW'; deadline=time.time()+180
              while time.time()<deadline:
                  cur=next((v for v in vs() if v['id']==old_id),None)
                  if not cur: raise SystemExit('version_disappeared')
                  state=vst(cur); print('APPLE_WAIT_EDITABLE',state)
                  if state in EDITABLE: break
                  time.sleep(5)
              if state not in EDITABLE: raise SystemExit('version_not_editable:'+state)
              target=client.update_version_string(old_id,target_name)
              print('APPLE_VERSION_RENAMED',target['id'],target_name)

          if target is None:
              # READY_FOR_SALE / READY_FOR_DISTRIBUTION versions are historical and do not block a new version.
              editable=next((v for v in vs() if vst(v) in EDITABLE),None)
              if editable:
                  target=editable if editable.get('attributes',{}).get('versionString')==target_name else client.update_version_string(editable['id'],target_name)
              else:
                  target=client.create_version(app_id,target_name)
              print('APPLE_TARGET_READY',target['id'],target_name)

          target_id=target['id']
          client.set_build_uses_non_exempt_encryption(ios.external_build_id,False)
          client.attach_build(target_id,ios.external_build_id)
          print('APPLE_BUILD_ATTACHED',ios.external_build_id)

          ready=None
          for r in rs():
              if rst(r)!='READY_FOR_REVIEW': continue
              if live_item(r,target_id): ready=r; break
              live=[i for i in its(r) if ist(i)!='REMOVED' and vid(i)]
              if not live and ready is None: ready=r
          if ready is None:
              body={'data':{'type':'reviewSubmissions','attributes':{},'relationships':{'app':{'data':{'type':'apps','id':app_id}}}}}
              ready=client.request('POST','/reviewSubmissions',data=json.dumps(body))['data']
          if not live_item(ready,target_id):
              body={'data':{'type':'reviewSubmissionItems','relationships':{'reviewSubmission':{'data':{'type':'reviewSubmissions','id':ready['id']}},'appStoreVersion':{'data':{'type':'appStoreVersions','id':target_id}}}}}
              for attempt in range(1,37):
                  try:
                      item=client.request('POST','/reviewSubmissionItems',data=json.dumps(body))['data']; print('APPLE_TARGET_ATTACHED',ready['id'],item['id']); break
                  except Exception as exc:
                      if 'ITEM_PART_OF_ANOTHER_SUBMISSION' not in str(exc): raise
                      if attempt==36: raise
                      time.sleep(5)

          # A previous failed submit job should not poison recovery. Requeue a clean submit when needed.
          job=release.jobs.filter(type='submit_apple',status__in=['queued','running']).first()
          if not job: job=enqueue_job('submit_apple',app=app,release=release,build=ios)
          print('APPLE_SUBMIT_JOB',job.id,job.status)
          deadline=time.time()+900
          while time.time()<deadline:
              job.refresh_from_db(); print('APPLE_SUBMIT_STATE',job.id,job.status,job.progress)
              if job.status=='succeeded': break
              if job.status=='failed': raise SystemExit('apple_submit_failed:'+(job.error or '')[:1600])
              time.sleep(10)
          if job.status!='succeeded': raise SystemExit('apple_submit_timeout')

          active=None
          for r in rs():
              if rst(r) in {'WAITING_FOR_REVIEW','IN_REVIEW'} and live_item(r,target_id): active=r; break
          if not active: raise SystemExit('apple_review_not_active_after_submit')
          Submission.objects.update_or_create(app=app,release=release,platform='ios',defaults={'state':'in_review','external_id':active['id']})
          release.status='in_review'; release.save(update_fields=['status','updated_at'])
          android=Submission.objects.filter(release=release,platform='android').first()
          print('APPLE_ACTIVE_REVIEW',active['id'],rst(active))
          print('FINAL android='+str(android.state if android else 'missing'),'ios=in_review','version='+target_name,'build='+str(release.build_number))
          PY
          )
          ENCODED=$(printf '%s' "$PY_CODE" | base64 -w0)
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && printf '%s' '$ENCODED' | base64 -d | docker compose exec -T web python manage.py shell"
