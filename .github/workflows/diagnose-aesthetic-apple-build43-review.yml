name: Diagnose A+ Esthetic Apple review for Build 43
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-aesthetic-apple-build43-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect Build 43 Android and iOS release jobs without modifying them
        env:
          HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$SSH_PRIVATE_KEY"
          PORT="${SSH_PORT:-22}"
          umask 077
          KEY="$RUNNER_TEMP/esthetic-apple-diagnostic-key"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$KEY"
          chmod 600 "$KEY"
          if [ -n "$SSH_KEY_PASSPHRASE" ]; then
            eval "$(ssh-agent -s)" >/dev/null
            ASKPASS="$RUNNER_TEMP/apple-askpass"
            printf '%s\n' '#!/bin/sh' 'printf "%s" "$SSH_KEY_PASSPHRASE"' > "$ASKPASS"
            chmod 700 "$ASKPASS"
            DISPLAY=:0 SSH_ASKPASS="$ASKPASS" SSH_ASKPASS_REQUIRE=force setsid ssh-add "$KEY" </dev/null
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          fi
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -T 10 -p "$PORT" -H "$HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          test -s "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          if [ -n "$SSH_HOST_FINGERPRINT" ]; then
            ssh-keygen -lf "$HOME/.ssh/known_hosts" | grep -F -- "$SSH_HOST_FINGERPRINT" >/dev/null
          fi
          PY_CODE=$(cat <<'PY'
          from apps.publisher.models import MobileApp, Release, Submission
          from apps.integrations.apple_store import AppleStoreClient
          app=MobileApp.objects.get(slug='a-esthetic')
          target=Release.objects.get(app=app,version_name='1.0.37',build_number=43)
          print('RELEASE',target.pk,target.status,target.source_commit)
          for build in target.builds.all():
              print('BUILD',build.platform,build.status,'external',bool(build.external_build_id))
          for sub in Submission.objects.filter(app=app).order_by('-pk')[:12]:
              print('SUBMISSION',sub.release.version_name,sub.platform,sub.state)
          for job in target.jobs.filter(type__in=('upload_apple','submit_apple','submit_google')).order_by('-pk')[:10]:
              print('JOB',job.pk,job.type,job.status,'error_type',type(job.error).__name__,'has_error',bool(job.error))
          client=AppleStoreClient(app.apple_account)
          asc=client.find_app(app.bundle_id)
          print('APPLE_VERSIONS_START')
          for version in client.list_versions(asc['id']):
              attrs=version.get('attributes',{})
              print('APPLE_VERSION',version.get('id'),attrs.get('versionString'),attrs.get('appStoreState'),attrs.get('platform'))
          print('APPLE_VERSIONS_END')
          print('REVIEW_SUBMISSIONS_START')
          for state in ('WAITING_FOR_REVIEW','IN_REVIEW','READY_FOR_REVIEW','UNRESOLVED_ISSUES'):
              try:
                  for row in client.list_review_submissions(asc['id'],state)[:8]:
                      print('APPLE_REVIEW',row.get('id'),state)
              except Exception as exc:
                  print('APPLE_REVIEW_ERROR',state,type(exc).__name__,str(exc)[:100])
          print('REVIEW_SUBMISSIONS_END')
          PY
          )
          ENCODED=$(printf '%s' "$PY_CODE" | base64 -w0)
          ssh -i "$KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$PORT" root@"$HOST" \
            "cd /opt/aplus-publisher && printf '%s' '$ENCODED' | base64 -d | docker compose exec -T web python manage.py shell"
