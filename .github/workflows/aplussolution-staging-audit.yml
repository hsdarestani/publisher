name: Monitor A+ Solution staging push release

on:
  push:
    branches: [ops/aplussolution-staging]
    paths:
      - '.github/workflows/aplussolution-staging-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: ${{ secrets.HOST }}
      PASS: ${{ secrets.PASS }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
    steps:
      - name: Install SSH helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
      - name: Read staging build 2 status
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplus-publisher
          docker compose exec -T web python manage.py shell <<'PY'
          import json
          from apps.publisher.models import MobileApp, Release, Job, Submission

          app = MobileApp.objects.get(slug='a-plus-solution-staging')
          release = Release.objects.get(app=app, version_name='1.0.0', build_number=2)
          builds = []
          for b in release.builds.order_by('platform'):
              builds.append({
                  'id': b.id,
                  'platform': b.platform,
                  'status': b.status,
                  'commit_sha': b.commit_sha,
                  'artifact': b.artifact.name if b.artifact else '',
                  'artifact_size': b.artifact_size,
                  'checksum': bool(b.artifact_checksum),
                  'external_build_id': b.external_build_id,
              })
          jobs = []
          for j in Job.objects.filter(release=release).order_by('id'):
              jobs.append({
                  'id': j.id,
                  'type': j.type,
                  'status': j.status,
                  'progress': j.progress,
                  'required_platform': j.required_platform,
                  'error': j.error[-1200:] if j.error else '',
                  'logs_tail': j.logs[-1800:] if j.logs else '',
              })
          submissions = list(Submission.objects.filter(release=release).values('platform','state','external_id','submitted_at','last_error'))
          assert app.package_name == 'de.aplussolution.staging'
          assert app.bundle_id == 'de.aplussolution.staging'
          assert release.android_track == 'internal'
          assert release.auto_submit is False
          assert not Job.objects.filter(release=release, type='submit_apple').exists()
          print('STAGING_BUILD_2_STATUS=' + json.dumps({
              'release_id': release.id,
              'release_status': release.status,
              'source_commit': release.source_commit,
              'android_track': release.android_track,
              'ios_release_type': release.ios_release_type,
              'auto_submit': release.auto_submit,
              'builds': builds,
              'jobs': jobs,
              'submissions': submissions,
          }, default=str))
          PY
          REMOTE
