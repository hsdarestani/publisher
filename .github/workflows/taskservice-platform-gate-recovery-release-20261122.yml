name: TaskService verified release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/taskservice-platform-gate-recovery-release-20261122.yml'
      - 'ops/taskservice/**'
  pull_request:
    paths: ['ops/taskservice/**', '.github/workflows/taskservice-platform-gate-recovery-release-20261122.yml']
  workflow_dispatch:
    inputs:
      phase:
        description: Operation
        type: choice
        options: [preflight, rehearse, release]
        default: preflight
        required: true
      pull_request:
        description: Merged TaskService PR for release
        type: number
        default: 5
permissions:
  contents: read
  actions: read
concurrency:
  group: taskservice-platform-gate-recovery
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          bash -n ops/taskservice/publisher-ssh.sh
          bash -n ops/taskservice/host-release.sh
          python3 -m unittest discover -s ops/taskservice -p 'test_*.py'
  verify:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      PHASE: ${{ inputs.phase || 'preflight' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Publisher and TaskService availability, capacity and backup configuration
        env:
          HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          source ops/taskservice/publisher-ssh.sh
          host_release preflight
      - name: Rehearse encrypted backup and isolated restore
        if: env.PHASE == 'rehearse'
        env:
          HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          source ops/taskservice/publisher-ssh.sh
          host_release rehearse
      - name: Resolve merged release tree and successful validation
        if: env.PHASE == 'release'
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_PR: ${{ inputs.pull_request }}
        run: python3 ops/taskservice/resolve-release.py
      - uses: actions/checkout@v4
        if: env.PHASE == 'release'
        with:
          repository: hsdarestani/taskservice
          ref: ${{ steps.source.outputs.sha }}
          path: taskservice-src
          persist-credentials: false
      - name: Build the validated image off-server
        if: env.PHASE == 'release'
        env:
          REVISION: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git -C taskservice-src rev-parse HEAD)" = "$REVISION"
          docker build --label "org.opencontainers.image.revision=$REVISION" -f taskservice-src/v2/Dockerfile -t "taskservice:v3-$REVISION" taskservice-src
      - name: Prepare public browser checks
        if: env.PHASE == 'release'
        run: |
          python3 -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install 'playwright==1.62.0'
          "$RUNNER_TEMP/smoke/bin/playwright" install --with-deps chromium
      - name: Back up, restore, migrate and verify both services
        if: env.PHASE == 'release'
        env:
          REVISION: ${{ steps.source.outputs.sha }}
          HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          source ops/taskservice/publisher-ssh.sh
          bytes=$(docker image inspect -f '{{.Size}}' "taskservice:v3-$REVISION")
          [[ $bytes =~ ^[1-9][0-9]*$ ]]
          available=$("${SSH[@]}" root@"$HOST" 'df -PB1 "$(docker info --format "{{.DockerRootDir}}")" | tail -1' | awk '{print $4}')
          (( available > bytes * 2 ))
          docker save "taskservice:v3-$REVISION" | gzip -1 | "${SSH[@]}" root@"$HOST" 'gzip -dc | docker load >/dev/null'
          host_release release "$REVISION"
          if ! "$RUNNER_TEMP/smoke/bin/python" ops/taskservice/live-smoke.py; then
            host_release rollback "$REVISION"
            exit 1
          fi
