name: A+ Solution Native Fix Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aplus-solution-splash-rollback-build-20260920.yml'

permissions:
  contents: read
  actions: write

env:
  APLUS_COMMIT: '7be8d4f9442837106e9c509a7b6474603de8421c'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    steps:
      - name: Install SSH tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null

      - name: Verify source commit is still current
        shell: bash
        run: |
          set -euo pipefail
          HEAD="$(curl -fsSL https://api.github.com/repos/hsdarestani/aplussolution/branches/main | python3 -c "import json,sys; print(json.load(sys.stdin)['commit']['sha'])")"
          test "$HEAD" = "$APLUS_COMMIT"
          echo "Building exact A+ Solution commit: $APLUS_COMMIT"

      - name: Queue Android and iOS builds in Publisher
        id: queue
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST"             "cd /opt/aplus-publisher && docker compose exec -T web python manage.py provision_ios_signing a-plus-solution --no-queue"

          OUT="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST"             "cd /opt/aplus-publisher && docker compose exec -T -e APLUS_COMMIT='$APLUS_COMMIT' web python manage.py shell" <<'PY'
          import json, os
          from apps.publisher.models import Build, Job, MobileApp, Release
          from apps.publisher.tasks import enqueue_job

          app = MobileApp.objects.get(slug='a-plus-solution')
          cfg = dict(app.build_config or {})
          cfg['android_command'] = 'bash frontend/scripts/build-publisher-android.sh'
          cfg['android_artifact'] = 'frontend/android/app/build/outputs/bundle/release/*.aab'
          cfg['ios_command'] = 'bash frontend/scripts/build-publisher-ios-opaque.sh'
          cfg['ios_artifact'] = 'frontend/ios/build/export/*.ipa'
          env = dict(cfg.get('env') or {})
          env['VITE_API_URL'] = 'https://app.aplus-solution.de/api'
          cfg['env'] = env
          app.build_config = cfg
          app.save(update_fields=['build_config','updated_at'])

          release = Release.objects.filter(
              app=app,
              source_commit=os.environ['APLUS_COMMIT'],
          ).order_by('-build_number').first()

          if release is None:
              previous = Release.objects.filter(app=app).order_by('-build_number').first()
              version_name = previous.version_name if previous else '1.0.0'
              build_number = max(Release.objects.filter(app=app).values_list('build_number', flat=True), default=0) + 1
              release = Release.objects.create(
                  app=app,
                  version_name=version_name,
                  build_number=build_number,
                  status='building',
                  source_branch='main',
                  source_commit=os.environ['APLUS_COMMIT'],
                  android_track='internal',
                  android_rollout=1,
                  ios_release_type='manual',
                  auto_submit=False,
                  release_notes='iOS WebView lifecycle stability and larger mobile header logo. Build only; no store submission.'
              )
          else:
              version_name = release.version_name
              build_number = release.build_number
              release.status = 'building'
              release.auto_submit = False
              release.save(update_fields=['status','auto_submit','updated_at'])

          queued = []
          for platform, job_type, runner in [
              ('android','build_android','linux'),
              ('ios','build_ios','macos'),
          ]:
              build, _ = Build.objects.get_or_create(release=release, platform=platform)
              active = Job.objects.filter(
                  build=build,
                  type=job_type,
                  status__in=['queued','running'],
              ).exists()
              if build.status == 'succeeded' and build.artifact:
                  continue
              if not active:
                  build.status = 'queued'
                  build.logs = ''
                  build.finished_at = None
                  build.external_build_id = ''
                  build.metadata = {}
                  if build.artifact:
                      build.artifact.delete(save=False)
                  build.artifact = ''
                  build.artifact_size = 0
                  build.artifact_checksum = ''
                  build.save()
                  job = enqueue_job(
                      job_type,
                      app=app,
                      release=release,
                      build=build,
                      payload={'source':'ios-webview-restart-fix-build-only'},
                      agent=True,
                      platform=runner,
                  )
                  queued.append(str(job.id))

          print('BUILD_META_JSON='+json.dumps({
              'release_id': str(release.id),
              'version': version_name,
              'build': build_number,
              'jobs': queued,
          }, separators=(',',':')))
          PY
          )"
          printf '%s\n' "$OUT"
          META="$(printf '%s\n' "$OUT" | sed -n 's/^BUILD_META_JSON=//p' | tail -n 1)"
          test -n "$META"
          echo "release_id=$(printf '%s' "$META" | python3 -c "import json,sys; print(json.load(sys.stdin)['release_id'])")" >> "$GITHUB_OUTPUT"
          echo "version=$(printf '%s' "$META" | python3 -c "import json,sys; print(json.load(sys.stdin)['version'])")" >> "$GITHUB_OUTPUT"
          echo "build=$(printf '%s' "$META" | python3 -c "import json,sys; print(json.load(sys.stdin)['build'])")" >> "$GITHUB_OUTPUT"

      - name: Wake Android and iOS builders
        uses: actions/github-script@v7
        with:
          script: |
            for (const workflow_id of ['cloud-linux.yml','cloud-macos.yml']) {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id,
                ref: 'main'
              });
            }

      - name: Wait for signed AAB and IPA
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          RELEASE_ID: ${{ steps.queue.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          for i in $(seq 1 240); do
            STATE="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST"               "cd /opt/aplus-publisher && docker compose exec -T -e RELEASE_ID='$RELEASE_ID' web python manage.py shell" <<'PY'
          import os, re
          from apps.publisher.models import Build, Job, Release
          r = Release.objects.get(id=os.environ['RELEASE_ID'])
          values = []
          for platform, job_type in [('android','build_android'),('ios','build_ios')]:
              b = Build.objects.get(release=r, platform=platform)
              failed = Job.objects.filter(build=b, type=job_type, status='failed').order_by('-created_at').first()
              err = re.sub(r'\s+', ' ', str(failed.error or '')).replace('|','/')[:300] if failed else ''
              values.append(':'.join([platform, b.status, 'artifact' if b.artifact else '', err]))
          print('|'.join(values))
          PY
            )"
            STATE="$(printf '%s\n' "$STATE" | tail -n 1 | tr -d '\r')"
            echo "Native build state: $STATE"
            if [[ "$STATE" == *":failed:"* ]]; then
              echo "$STATE" >&2
              exit 1
            fi
            if [[ "$STATE" == android:succeeded:artifact:*"|"ios:succeeded:artifact:* ]]; then
              echo "Both build artifacts are ready."
              exit 0
            fi
            sleep 20
          done
          echo "Timed out waiting for builds." >&2
          exit 1

      - name: Prepare store submission and replace prior Apple review
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          RELEASE_ID: ${{ steps.queue.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T -e RELEASE_ID='$RELEASE_ID' web python manage.py shell" <<'PY'
          import os, time
          from apps.integrations.apple_store import AppleStoreClient
          from apps.publisher.models import Release

          r = Release.objects.get(id=os.environ['RELEASE_ID'])
          app = r.app
          r.android_track = 'production'
          r.android_rollout = 1
          r.ios_release_type = 'automatic'
          r.auto_submit = False
          r.release_notes = 'Vorherigen A+ Solution App-Start wiederhergestellt.'
          r.save(update_fields=['android_track','android_rollout','ios_release_type','auto_submit','release_notes','updated_at'])

          loc = app.localizations.filter(locale='de-DE').first()
          if loc:
              loc.release_notes = 'Vorherigen A+ Solution App-Start wiederhergestellt.'
              loc.save(update_fields=['release_notes','updated_at'])

          client = AppleStoreClient(app.apple_account)
          apple_app = client.find_app(app.bundle_id)
          canceled = []
          for state in ('WAITING_FOR_REVIEW','IN_REVIEW'):
              for submission in client.list_review_submissions(apple_app['id'], state):
                  client.cancel_review_submission(submission['id'])
                  canceled.append(str(submission['id']))

          if canceled:
              for _ in range(45):
                  active = []
                  for state in ('WAITING_FOR_REVIEW','IN_REVIEW'):
                      active.extend(client.list_review_submissions(apple_app['id'], state))
                  if not active:
                      break
                  time.sleep(2)
              else:
                  raise SystemExit('Prior Apple review did not leave active review state in time.')

          print('canceled_prior_reviews=' + ','.join(canceled))
          PY

      - name: Queue Google Play submission and App Store upload
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          RELEASE_ID: ${{ steps.queue.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T -e RELEASE_ID='$RELEASE_ID' web python manage.py shell" <<'PY'
          import os
          from apps.publisher.models import Job, Release
          from apps.publisher.tasks import enqueue_job

          r = Release.objects.get(id=os.environ['RELEASE_ID'])
          app = r.app
          android = r.builds.get(platform='android')
          ios = r.builds.get(platform='ios')
          assert android.status == 'succeeded' and android.artifact
          assert ios.status == 'succeeded' and ios.artifact

          if not Job.objects.filter(release=r,type='submit_google',status__in=['queued','running','succeeded']).exists():
              enqueue_job('submit_google', app=app, release=r, build=android)
          if not Job.objects.filter(release=r,type='upload_apple',status__in=['queued','running','succeeded']).exists():
              enqueue_job('upload_apple', app=app, release=r, build=ios, agent=True, platform='macos')
          PY

      - name: Wake Cloud Mac for App Store upload
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'cloud-macos.yml',
              ref: 'main'
            });

      - name: Wait for Google submission and Apple processed build
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          RELEASE_ID: ${{ steps.queue.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          for i in $(seq 1 180); do
            STATE="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
              "cd /opt/aplus-publisher && docker compose exec -T -e RELEASE_ID='$RELEASE_ID' web python manage.py shell" <<'PY'
          import os, re
          from apps.publisher.models import Job, Release
          r = Release.objects.get(id=os.environ['RELEASE_ID'])
          ios = r.builds.get(platform='ios')
          g = Job.objects.filter(release=r,type='submit_google').order_by('-created_at').first()
          u = Job.objects.filter(release=r,type='upload_apple').order_by('-created_at').first()
          def err(j): return re.sub(r'\s+',' ',str(j.error or '')).replace('|','/')[:300] if j else ''
          print('|'.join([g.status if g else 'missing',err(g),u.status if u else 'missing',err(u),ios.external_build_id or '']))
          PY
            )"
            STATE="$(printf '%s\n' "$STATE" | tail -n 1 | tr -d '\r')"
            echo "Store delivery state: $STATE"
            IFS='|' read -r GST GERR UST UERR APPLE_ID <<< "$STATE"
            if [ "$GST" = failed ]; then echo "Google submission failed: $GERR" >&2; exit 1; fi
            if [ "$UST" = failed ]; then echo "Apple upload failed: $UERR" >&2; exit 1; fi
            if [ "$GST" = succeeded ] && [ "$UST" = succeeded ] && [ -n "$APPLE_ID" ]; then exit 0; fi
            sleep 20
          done
          echo "Timed out waiting for store delivery." >&2
          exit 1

      - name: Submit current Apple build for review
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          RELEASE_ID: ${{ steps.queue.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T -e RELEASE_ID='$RELEASE_ID' web python manage.py shell" <<'PY'
          import os
          from apps.publisher.models import Job, Release
          from apps.publisher.tasks import enqueue_job
          r = Release.objects.get(id=os.environ['RELEASE_ID'])
          app = r.app
          build = r.builds.get(platform='ios')
          if not Job.objects.filter(release=r,type='submit_apple',status__in=['queued','running','succeeded']).exists():
              enqueue_job('submit_apple', app=app, release=r, build=build)
          PY

      - name: Wait for both stores submitted
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          RELEASE_ID: ${{ steps.queue.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          for i in $(seq 1 120); do
            STATE="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
              "cd /opt/aplus-publisher && docker compose exec -T -e RELEASE_ID='$RELEASE_ID' web python manage.py shell" <<'PY'
          import os, re
          from apps.publisher.models import Job, Release, Submission
          r = Release.objects.get(id=os.environ['RELEASE_ID'])
          g = Job.objects.filter(release=r,type='submit_google').order_by('-created_at').first()
          a = Job.objects.filter(release=r,type='submit_apple').order_by('-created_at').first()
          gs = Submission.objects.filter(release=r,platform='android').first()
          aps = Submission.objects.filter(release=r,platform='ios').first()
          def err(j): return re.sub(r'\s+',' ',str(j.error or '')).replace('|','/')[:300] if j else ''
          print('|'.join([g.status if g else 'missing',err(g),a.status if a else 'missing',err(a),gs.state if gs else '',aps.state if aps else '',aps.external_id if aps else '']))
          PY
            )"
            STATE="$(printf '%s\n' "$STATE" | tail -n 1 | tr -d '\r')"
            echo "Review submission state: $STATE"
            IFS='|' read -r GST GERR AST AERR GS AS AID <<< "$STATE"
            if [ "$GST" = failed ]; then echo "Google submission failed: $GERR" >&2; exit 1; fi
            if [ "$AST" = failed ]; then echo "Apple submission failed: $AERR" >&2; exit 1; fi
            if [ "$GST" = succeeded ] && [ "$AST" = succeeded ] && [ -n "$GS" ] && [ -n "$AS" ]; then exit 0; fi
            sleep 15
          done
          echo "Timed out waiting for final store submissions." >&2
          exit 1

      - name: Confirm store submission completion
        run: |
          echo "A+ Solution release submitted."
          echo "Source: $APLUS_COMMIT"
          echo "Version: ${{ steps.queue.outputs.version }}"
          echo "Build: ${{ steps.queue.outputs.build }}"
          echo "Google Play: submitted"
          echo "App Store Connect: submitted for review"
