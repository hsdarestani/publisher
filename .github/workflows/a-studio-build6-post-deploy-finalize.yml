name: Finalize A+ Studio Build 6 after Publisher deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Validate and deploy A+ Publisher']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: a-studio-build6-post-deploy-finalize
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - name: Install SSH client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null

      - name: Wait for stable Publisher health
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            if curl --fail --silent --show-error --connect-timeout 10 --max-time 20 https://publisher.smarbiz.sbs/healthz/ >/dev/null; then
              sleep 10
              curl --fail --silent --show-error --connect-timeout 10 --max-time 20 https://publisher.smarbiz.sbs/healthz/ >/dev/null && exit 0
            fi
            sleep 5
          done
          echo '::error::Publisher did not become stably healthy.'
          exit 2

      - name: Recover orphaned Google job and ensure one active retry
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$PASS"
          PORT="${SSH_PORT:-22}"
          sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell" <<'PY'
          from django.utils import timezone
          from apps.publisher.models import MobileApp, Release
          from apps.publisher.tasks import enqueue_job

          app = MobileApp.objects.get(slug='a-studio')
          release = Release.objects.get(app=app, version_name='1.0.0', build_number=6)
          android = release.builds.get(platform='android')
          ios = release.builds.get(platform='ios')
          if android.status != 'succeeded' or not android.artifact:
              raise SystemExit(f'Android Build 6 missing: {android.status} artifact={bool(android.artifact)}')
          if ios.status != 'succeeded' or not ios.artifact or not ios.external_build_id:
              raise SystemExit(f'iOS Build 6 not processed: {ios.status} artifact={bool(ios.artifact)} id={ios.external_build_id!r}')
          print('ARTIFACTS|android=succeeded|ios=succeeded|apple_id=' + ios.external_build_id)

          latest = release.jobs.filter(type='upload_google').order_by('-created_at').first()
          if latest and latest.status == 'succeeded':
              print('GOOGLE_JOB|already_succeeded|' + str(latest.id))
          else:
              # This workflow runs only after Publisher deployment has completed.
              # Any Google job left in `running` from before that deployment is an
              # orphan because the Celery worker was replaced during deployment.
              if latest and latest.status == 'running':
                  latest.status = 'failed'
                  latest.error = 'Recovered orphaned Google upload after Publisher worker restart.'
                  latest.finished_at = timezone.now()
                  latest.save(update_fields=['status','error','finished_at','updated_at'])
                  print('GOOGLE_JOB|orphan_recovered|' + str(latest.id))
                  latest = None
              if latest and latest.status == 'queued':
                  print('GOOGLE_JOB|queued|' + str(latest.id))
              else:
                  job = enqueue_job('upload_google', app=app, release=release, build=android)
                  print('GOOGLE_JOB|retry_queued|' + str(job.id))
          PY

      - name: Wait for Google upload job
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$PASS"
          PORT="${SSH_PORT:-22}"
          SSH=(sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST")
          for i in $(seq 1 60); do
            OUT="$(${SSH[@]} "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell -c \"from apps.publisher.models import MobileApp,Release; a=MobileApp.objects.get(slug='a-studio'); r=Release.objects.get(app=a,version_name='1.0.0',build_number=6); j=r.jobs.filter(type='upload_google').order_by('-created_at').first(); print('GOOGLE|'+(j.status if j else 'missing')+'|'+((j.error or '')[-1200:].replace(chr(10),' ').replace('|','/') if j else ''))\"" 2>/dev/null | grep '^GOOGLE|' | tail -1 || true)"
            echo "$OUT"
            STATUS="$(printf '%s' "$OUT" | cut -d'|' -f2)"
            if [ "$STATUS" = succeeded ]; then exit 0; fi
            if [ "$STATUS" = failed ]; then
              echo '::error::Google Build 6 upload failed.'
              exit 2
            fi
            sleep 10
          done
          echo '::error::Timed out waiting for Google Build 6 upload.'
          exit 2

      - name: Verify Google Production versionCode 6
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$PASS"
          PORT="${SSH_PORT:-22}"
          sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell" <<'PY'
          from apps.integrations.google_play import GooglePlayClient
          from apps.publisher.models import MobileApp

          app = MobileApp.objects.get(slug='a-studio')
          client = GooglePlayClient(app.google_account)
          edit = client._open_edit(app.package_name)
          try:
              track = client._edit_request(edit, 'GET', f'/applications/{client._q(app.package_name)}/edits/{edit.edit_id}/tracks/production')
              match = next((r for r in (track.get('releases') or []) if '6' in [str(v) for v in r.get('versionCodes', [])]), None)
              if not match:
                  raise SystemExit('Google Production does not contain versionCode 6.')
              if match.get('status') != 'completed':
                  raise SystemExit(f"Google Build 6 is not completed: {match.get('status')}")
              print('GOOGLE_PRODUCTION|versionCode=6|status=completed')
          finally:
              client._safe_delete_edit(edit)
          PY

      - name: Verify Apple Build 6 and safely replace Build 5 review
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$PASS"
          PORT="${SSH_PORT:-22}"
          sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell" <<'PY'
          import time
          from django.utils import timezone
          from apps.integrations.apple_store import AppleStoreClient
          from apps.publisher.models import MobileApp, Release, Submission
          from apps.publisher.review_contacts import apple_review_contact

          app = MobileApp.objects.get(slug='a-studio')
          release = Release.objects.get(app=app, version_name='1.0.0', build_number=6)
          build = release.builds.get(platform='ios')
          client = AppleStoreClient(app.apple_account)
          record = client.find_app(app.bundle_id)
          version = next((v for v in client.list_versions(record['id']) if v.get('attributes', {}).get('versionString') == '1.0.0'), None)
          if not version:
              raise SystemExit('Apple version 1.0.0 not found.')
          version_id = str(version['id'])

          remote = client.request('GET', f'/builds/{build.external_build_id}?fields[builds]=version,processingState,usesNonExemptEncryption').get('data') or {}
          attrs = remote.get('attributes', {})
          if attrs.get('processingState') != 'VALID' or str(attrs.get('version')) != '6':
              raise SystemExit(f'Apple Build 6 invalid: {attrs!r}')
          if attrs.get('usesNonExemptEncryption') is None:
              client.set_build_uses_non_exempt_encryption(build.external_build_id, False)
              attrs = (client.request('GET', f'/builds/{build.external_build_id}?fields[builds]=version,processingState,usesNonExemptEncryption').get('data') or {}).get('attributes', {})
          if attrs.get('usesNonExemptEncryption') is not False:
              raise SystemExit(f"Unexpected export compliance: {attrs.get('usesNonExemptEncryption')!r}")
          print('APPLE_BUILD6|id=' + build.external_build_id + '|state=VALID|encryption=false')

          def active_reviews():
              found = []
              for state in ('IN_REVIEW','WAITING_FOR_REVIEW'):
                  for sub in client.list_review_submissions(record['id'], state):
                      item, _ = client._review_submission_matches(sub, version_id)
                      if item:
                          found.append((state, sub, item))
              return found

          active = active_reviews()
          attached = client.request('GET', f'/appStoreVersions/{version_id}/build').get('data') or {}
          if str(attached.get('id')) == str(build.external_build_id) and active:
              # Idempotent success: Build 6 is already attached to the active review.
              state, submission, item = active[0]
              print('APPLE_REVIEW|already_build6|state=' + state + '|submission=' + str(submission['id']))
          else:
              for state, submission, _item in active:
                  print('APPLE_CANCEL|submission=' + str(submission['id']) + '|state=' + state)
                  client.cancel_review_submission(submission['id'])
              if active:
                  for _ in range(45):
                      if not active_reviews(): break
                      time.sleep(2)
                  else:
                      raise SystemExit('Apple review did not leave active state after cancellation.')

              client.attach_build(version_id, build.external_build_id)
              client.set_review_details(version_id, app, contact=apple_review_contact(app) or None)
              for loc in app.localizations.all():
                  client.set_localization(version_id, loc)
              client.submit_version(record['id'], version_id)

              final = None
              for _ in range(45):
                  values = active_reviews()
                  if values:
                      final = values[0]
                      break
                  time.sleep(2)
              if not final:
                  raise SystemExit('Apple did not expose Build 6 as WAITING_FOR_REVIEW or IN_REVIEW.')
              state, submission, item = final
              attached = client.request('GET', f'/appStoreVersions/{version_id}/build').get('data') or {}
              if str(attached.get('id')) != str(build.external_build_id):
                  raise SystemExit(f"Wrong Apple build attached: {attached.get('id')}")
              print('APPLE_REVIEW|build=6|state=' + state + '|submission=' + str(submission['id']))

          Submission.objects.update_or_create(
              app=app, release=release, platform='ios',
              defaults={'state':'in_review','external_id':submission['id'],'submitted_at':timezone.now(),'last_error':'','raw':{'submission':submission,'item':item,'build_number':6,'usesNonExemptEncryption':False}},
          )
          for old in Submission.objects.filter(app=app, platform='ios', release__build_number__lt=6, state='in_review'):
              old.state='replaced_by_build_6'; old.save(update_fields=['state','updated_at'])
          for old_release in Release.objects.filter(app=app, version_name='1.0.0', build_number__lt=6, status='in_review'):
              old_release.status='uploaded'; old_release.save(update_fields=['status','updated_at'])
          release.status='in_review'; release.save(update_fields=['status','updated_at'])
          print('APPLE_ATTACHED_BUILD=' + str((client.request('GET', f'/appStoreVersions/{version_id}/build').get('data') or {}).get('id')))
          PY

      - name: Final Publisher state and public health
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$PASS"
          PORT="${SSH_PORT:-22}"
          sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell -c \"from apps.publisher.models import MobileApp,Release; a=MobileApp.objects.get(slug='a-studio'); r=Release.objects.get(app=a,version_name='1.0.0',build_number=6); print('FINAL|release='+r.status); [print('BUILD|'+b.platform+'|'+b.status+'|artifact='+str(bool(b.artifact))+'|external='+str(b.external_build_id or '')) for b in r.builds.order_by('platform')]; [print('SUBMISSION|'+s.platform+'|'+s.state+'|'+str(s.external_id or '')) for s in r.submissions.order_by('platform')]\""
          curl --fail --silent --show-error --location --max-time 30 https://studio.aplus-solution.de/health/ >/dev/null
          curl --fail --silent --show-error --location --max-time 30 https://studio.aplus-solution.de/api/mobile/config/ >/dev/null
          echo 'A+ Studio production health verified.'
