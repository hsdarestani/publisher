name: Retry A+ Esthetic iOS build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retry-a-esthetic-ios.yml'

permissions:
  contents: read

jobs:
  retry:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Requeue iOS build using existing Publisher signing
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py provision_ios_signing a-esthetic --app-version 1.0.0 --build-number 1"
