name: A+ Solution Build 63 submit to both stores
on:
  workflow_run:
    workflows: ['A+ Solution 1.0.27 live store release']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: aplus-solution-build63-store-submit
  cancel-in-progress: false
jobs:
  submit:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 160
    environment: production
    env:
      HOST: ${{ secrets.HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
      SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Submit signed build 63 from Publisher and verify live App Store and Play delivery
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$SSH_PRIVATE_KEY"
          PORT="${SSH_PORT:-22}"
          umask 077
          KEY="$RUNNER_TEMP/aplus-submit-key"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$KEY"
          chmod 600 "$KEY"
          if [ -n "$SSH_KEY_PASSPHRASE" ]; then
            eval "$(ssh-agent -s)" >/dev/null
            ASKPASS="$RUNNER_TEMP/aplus-submit-askpass"
            printf '%s\n' '#!/bin/sh' 'printf "%s" "$SSH_KEY_PASSPHRASE"' > "$ASKPASS"
            chmod 700 "$ASKPASS"
            DISPLAY=:0 SSH_ASKPASS="$ASKPASS" SSH_ASKPASS_REQUIRE=force setsid ssh-add "$KEY" </dev/null
          fi
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -T 10 -p "$PORT" -H "$HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          test -s "$HOME/.ssh/known_hosts"
          if [ -n "$SSH_HOST_FINGERPRINT" ]; then
            ssh-keygen -lf "$HOME/.ssh/known_hosts" | grep -F -- "$SSH_HOST_FINGERPRINT" >/dev/null
          fi
          publisher() {
            ssh -i "$KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$PORT" root@"$HOST" 'bash -se'
          }

          publisher <<'REMOTE'
          set -euo pipefail
          cd /opt/aplus-publisher
          docker compose exec -T web python manage.py shell <<'PY'
          import json, requests
          from apps.publisher.models import MobileApp, Release, Job
          from apps.publisher.tasks import enqueue_job
          from apps.integrations.apple_store import AppleStoreClient
          app=MobileApp.objects.get(slug='a-plus-solution')
          r=Release.objects.get(app=app,version_name='1.0.27',build_number=63)
          assert r.source_commit=='84b3e2d2f624cf0a0e64a14bb470cd5e2ef39e8e','Refusing different source'
          android=r.builds.get(platform='android'); ios=r.builds.get(platform='ios')
          assert android.status=='succeeded' and bool(android.artifact),'Signed Google Play AAB not ready'
          assert ios.status=='succeeded' and bool(ios.artifact),'Signed App Store IPA not ready'
          assert app.google_account and app.google_account.configured
          assert app.apple_account and app.apple_account.configured

          # Restore prior accepted reviewer access only after verifying credentials against current production.
          client=AppleStoreClient(app.apple_account)
          apple_app=client.find_app(app.bundle_id)
          versions=client.list_versions(apple_app['id'],limit=50)
          prior=next((v for v in versions if (v.get('attributes') or {}).get('versionString')=='1.0.26'),None)
          reviewer_ok=bool(app.review_username and app.get_review_password())
          contact={}
          if prior:
              try:
                  d=client.request('GET',f"/appStoreVersions/{prior['id']}/appStoreReviewDetail").get('data') or {}
                  attrs=d.get('attributes') or {}
                  contact={k:attrs[k] for k in ('contactFirstName','contactLastName','contactPhone','contactEmail') if attrs.get(k)}
                  user=attrs.get('demoAccountName');password=attrs.get('demoAccountPassword')
                  if user and password:
                      res=requests.post('https://app.aplus-solution.de/api/auth/login/',json={'email':user,'password':password},timeout=20)
                      if res.status_code==200 and res.json().get('access'):
                          app.review_username=user
                          app.set_review_password(password)
                          app.requires_login=True
                          app.save(update_fields=['review_username','review_password_blob','requires_login','updated_at'])
                          reviewer_ok=True
              except Exception as e:
                  print('REVIEW_RESTORE_STATUS='+type(e).__name__)
          print('REVIEW_ACCESS_STATUS='+('verified' if reviewer_ok else 'missing')+'; existing contact fields='+str(len(contact)))
          queued=[]
          for job_type,build,agent,platform in [('submit_google',android,False,''),('upload_apple',ios,True,'macos')]:
              existing=Job.objects.filter(release=r,type=job_type,status__in=['queued','running','claimed','succeeded']).first()
              if not existing:
                  job=enqueue_job(job_type,app=app,release=r,build=build,agent=agent,platform=platform)
                  queued.append([job_type,job.pk])
          print('STORE_DELIVERY_QUEUED='+json.dumps(queued))
          PY
          REMOTE

          gh api -X POST repos/hsdarestani/publisher/actions/workflows/cloud-macos.yml/dispatches -f ref=main >/dev/null
          echo "Apple upload runner requested; Google publisher submission queued."

          # Confirm Google submission and Apple upload separately.
          LAST=""
          for n in $(seq 1 210); do
            LINE="$(publisher <<'REMOTE' | grep 'DELIVERY_STATE=' | tail -n 1
          set -euo pipefail
          cd /opt/aplus-publisher
          docker compose exec -T web python manage.py shell <<'PY'
          from apps.publisher.models import Release,Job
          r=Release.objects.get(app__slug='a-plus-solution',version_name='1.0.27',build_number=63)
          j={t:Job.objects.filter(release=r,type=t).order_by('-created_at').first() for t in ('submit_google','upload_apple')}
          print('DELIVERY_STATE='+'|'.join(t+':'+(v.status if v else 'missing') for t,v in j.items())+'|ios_external:'+str(bool(r.builds.get(platform='ios').external_build_id)))
          PY
          REMOTE
            )"
            if [ "$LINE" != "$LAST" ]; then echo "$LINE";LAST="$LINE";fi
            if [[ "$LINE" == *"failed"* ]]; then
              echo "::warning::At least one platform delivery failed. Inspect Publisher job details."
              break
            fi
            if [[ "$LINE" == *"submit_google:succeeded|upload_apple:succeeded|ios_external:True"* ]]; then break; fi
            sleep 20
          done

          # Queue Apple review only if a verified reviewer login exists.
          publisher <<'REMOTE'
          set -euo pipefail
          cd /opt/aplus-publisher
          docker compose exec -T web python manage.py shell <<'PY'
          from apps.publisher.models import Release, Job
          from apps.publisher.tasks import enqueue_job
          r=Release.objects.get(app__slug='a-plus-solution',version_name='1.0.27',build_number=63)
          a=r.app;i=r.builds.get(platform='ios')
          has_review=bool(a.review_username and a.get_review_password())
          upload=Job.objects.filter(release=r,type='upload_apple',status='succeeded').exists()
          if i.external_build_id and upload and has_review:
              existing=Job.objects.filter(release=r,type='submit_apple',status__in=['queued','running','succeeded']).first()
              if not existing:
                  j=enqueue_job('submit_apple',app=a,release=r,build=i)
                  print('APPLE_REVIEW_QUEUED='+str(j.id))
              else: print('APPLE_REVIEW_ALREADY='+existing.status)
          else:
              print('APPLE_REVIEW_BLOCKED upload='+str(upload)+' processed_build='+str(bool(i.external_build_id))+' reviewer_login='+str(has_review))
          PY
          REMOTE

          for n in $(seq 1 90); do
            STATE="$(publisher <<'REMOTE' | grep 'FINAL_STORE_STATE=' | tail -n 1
          set -euo pipefail
          cd /opt/aplus-publisher
          docker compose exec -T web python manage.py shell <<'PY'
          from apps.publisher.models import Release,Job,Submission
          r=Release.objects.get(app__slug='a-plus-solution',version_name='1.0.27',build_number=63)
          s={}
          for platform,kind in [('google','submit_google'),('apple','submit_apple')]:
              j=Job.objects.filter(release=r,type=kind).order_by('-created_at').first()
              s[platform]=j.status if j else 'not_queued'
          print('FINAL_STORE_STATE=google:'+s['google']+'|apple:'+s['apple'])
          PY
          REMOTE
            )"
            if [ "$STATE" != "$LAST" ]; then echo "$STATE";LAST="$STATE";fi
            if [[ "$STATE" == *"google:succeeded|apple:succeeded"* ]]; then echo "BOTH_STORES_SUBMITTED"; exit 0; fi
            if [[ "$STATE" == *"failed"* || "$STATE" == *"not_queued"* ]]; then echo "::warning::One or both stores could not be submitted.";exit 1;fi
            sleep 20
          done
          echo "Store submission verification timed out" >&2
          exit 1
