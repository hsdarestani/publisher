name: Inspect A+ Solution staging iOS agent

on:
  push:
    branches: [ops/aplussolution-staging]
    paths:
      - '.github/workflows/aplussolution-staging-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: ${{ secrets.HOST }}
      PASS: ${{ secrets.PASS }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
    steps:
      - name: Install SSH helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
      - name: Inspect iOS job and agent
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplus-publisher
          docker compose exec -T web python manage.py shell <<'PY'
          from apps.publisher.models import Job, BuildAgent
          import json
          job = Job.objects.get(pk=2563)
          print('JOB=' + json.dumps({
              'id': job.id,
              'status': job.status,
              'progress': job.progress,
              'updated_at': job.updated_at.isoformat(),
              'started_at': job.started_at.isoformat() if job.started_at else None,
              'error': job.error[-1200:] if job.error else '',
              'logs_tail': (job.logs or '')[-12000:],
          }, default=str))
          for agent in BuildAgent.objects.filter(platform='macos').order_by('id'):
              print('AGENT=' + json.dumps({
                  'id': agent.id,
                  'name': agent.name,
                  'enabled': agent.enabled,
                  'hostname': agent.hostname,
                  'last_seen_at': agent.last_seen_at.isoformat() if agent.last_seen_at else None,
                  'online': agent.online,
                  'current_job_id': agent.current_job_id,
              }, default=str))
          PY
          REMOTE
