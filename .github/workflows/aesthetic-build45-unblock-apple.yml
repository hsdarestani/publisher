name: Unblock A+ Esthetic 1.0.39 Apple review slot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aesthetic-build45-unblock-apple.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unblock:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: production
    steps:
      - name: Prepare current Publisher SSH identity
        env:
          HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$SSH_PRIVATE_KEY"
          PORT="${SSH_PORT:-22}"
          umask 077
          KEY="$RUNNER_TEMP/a-esthetic-release-45-key"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$KEY"
          chmod 600 "$KEY"
          if [ -n "$SSH_KEY_PASSPHRASE" ]; then
            eval "$(ssh-agent -s)" >/dev/null
            ASKPASS="$RUNNER_TEMP/a-esthetic-release-45-askpass"
            printf '%s\n' '#!/bin/sh' 'printf "%s" "$SSH_KEY_PASSPHRASE"' > "$ASKPASS"
            chmod 700 "$ASKPASS"
            DISPLAY=:0 SSH_ASKPASS="$ASKPASS" SSH_ASKPASS_REQUIRE=force setsid ssh-add "$KEY" </dev/null
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          fi
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -T 10 -p "$PORT" -H "$HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          test -s "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          if [ -n "$SSH_HOST_FINGERPRINT" ]; then
            ssh-keygen -lf "$HOME/.ssh/known_hosts" | grep -F -- "$SSH_HOST_FINGERPRINT" >/dev/null
          fi
          echo "PUBLISHER_SSH_KEY_PATH=$KEY" >> "$GITHUB_ENV"
      - name: Cancel only older A+ 1.0.38 review and prepare 1.0.39
        env:
          HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          PY_CODE=$(cat <<'PY'
          import time
          from apps.integrations.apple_store import AppleStoreClient
          from apps.publisher.models import MobileApp, Release, Submission
          
          app=MobileApp.objects.get(slug='a-esthetic')
          release=Release.objects.get(app=app, version_name='1.0.39', build_number=45)
          assert release.source_commit=='9a857817b5a8e59b681ae56c72fa283c6f93e136', 'unexpected_source_commit'
          ios=release.builds.get(platform='ios')
          assert ios.status=='succeeded' and ios.external_build_id, 'ios_binary_not_uploaded'
          existing=Submission.objects.filter(release=release,platform='ios').first()
          if existing and existing.state in ('in_review','approved','live'):
           print('APPLE_ALREADY_SUBMITTED',existing.state)
          else:
           client=AppleStoreClient(app.apple_account)
           record=client.find_app(app.bundle_id)
           app_id=record['id']
           versions=client.list_versions(app_id)
           newer=[v for v in versions if v.get('attributes',{}).get('versionString')=='1.0.39']
           prior=[v for v in versions if v.get('attributes',{}).get('versionString')=='1.0.38']
           if newer:
            print('TARGET_VERSION_ALREADY_EXISTS',newer[0].get('attributes',{}).get('appStoreState'))
           else:
            assert len(prior)==1, 'prior_1.0.38_version_not_unique'
            previous=prior[0]
            status=previous.get('attributes',{}).get('appStoreState') or previous.get('attributes',{}).get('appVersionState')
            assert status in ('WAITING_FOR_REVIEW','PREPARE_FOR_SUBMISSION','DEVELOPER_REJECTED','READY_FOR_REVIEW'), 'unexpected_previous_version_status:'+str(status)
            if status=='WAITING_FOR_REVIEW':
             matching=[]
             for submission in client.list_review_submissions(app_id,'WAITING_FOR_REVIEW'):
              item,items=client._review_submission_matches(submission,previous['id'])
              if item:
               assert len(items)==1, 'review_contains_unrelated_items'
               matching.append(submission)
             assert len(matching)==1, 'previous_review_not_uniquely_matched'
             client.cancel_review_submission(matching[0]['id'])
             print('CANCEL_OLD_REVIEW_REQUESTED', '1.0.38')
             for attempt in range(45):
              still_open=False
              for state in ('WAITING_FOR_REVIEW','IN_REVIEW'):
               for submission in client.list_review_submissions(app_id,state):
                item,_=client._review_submission_matches(submission,previous['id'])
                still_open=still_open or bool(item)
              if not still_open:
               break
              time.sleep(2)
             else:
              raise RuntimeError('old_review_still_active_after_cancel')
            editable=('PREPARE_FOR_SUBMISSION','READY_FOR_REVIEW','DEVELOPER_REJECTED','METADATA_REJECTED','REJECTED')
            for attempt in range(45):
             fresh=next((v for v in client.list_versions(app_id) if v['id']==previous['id']),None)
             state=(fresh or {}).get('attributes',{}).get('appStoreState')
             if state in editable:
              break
             time.sleep(2)
            else:
             raise RuntimeError('old_version_not_editable_after_cancellation')
            changed=client.update_version_string(previous['id'],'1.0.39')
            print('APPLE_VERSION_RELABELED',changed['attributes'].get('versionString'),changed['attributes'].get('appStoreState'))
           print('APPLE_READY_FOR_PUBLISHER_SUBMIT',True)
          PY
          )
          ENCODED="$(printf '%s' "$PY_CODE" | base64 -w0)"
          ssh -i "$PUBLISHER_SSH_KEY_PATH" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$PORT" root@"$HOST" "cd /opt/aplus-publisher && printf '%s' '$ENCODED' | base64 -d | docker compose exec -T web python manage.py shell"
