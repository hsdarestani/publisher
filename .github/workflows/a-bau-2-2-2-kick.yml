name: Kick A+Bau 2.2.2 Publisher queue

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/a-bau-2-2-2-kick.yml'

permissions:
  contents: write
  actions: write

jobs:
  kick:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Queue release and capture Publisher output
        id: queue
        continue-on-error: true
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -uo pipefail
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq sshpass >/dev/null
          PORT="${SSH_PORT:-22}"; export SSHPASS="$PASS"
          mkdir -p status

          ready=0
          for attempt in $(seq 1 90); do
            if sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST" \
              "cd /opt/aplus-publisher && docker compose exec -T web python manage.py help bootstrap_a_bau_safe >/dev/null 2>&1"; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" != "1" ]; then
            echo 'bootstrap_a_bau_safe was not deployed' > status/a-bau-2.2.2-kick.log
            cat status/a-bau-2.2.2-kick.log
            exit 2
          fi

          set +e
          sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py bootstrap_a_bau_safe --app-version 2.2.2 --build-number 22003 --queue --publish" \
            > status/a-bau-2.2.2-kick.log 2>&1
          rc=$?
          set -e
          printf '\nexit_code=%s\n' "$rc" >> status/a-bau-2.2.2-kick.log
          cat status/a-bau-2.2.2-kick.log
          exit "$rc"
      - name: Wake cloud agents
        if: steps.queue.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run cloud-linux.yml --repo "$GITHUB_REPOSITORY"
          gh workflow run cloud-macos.yml --repo "$GITHUB_REPOSITORY"
      - name: Commit queue receipt
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'A+ Publisher Release Bot'
          git config user.email 'app@aplus-solution.de'
          git pull --rebase origin main
          git add status/a-bau-2.2.2-kick.log
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record A+Bau 2.2.2 Publisher queue result'
            git push origin HEAD:main
          fi
      - name: Fail if queue failed
        if: steps.queue.outcome != 'success'
        run: exit 1
