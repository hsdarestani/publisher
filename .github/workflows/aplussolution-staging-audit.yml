name: Retry A+ Solution staging iOS build

on:
  push:
    branches: [ops/aplussolution-staging]
    paths:
      - '.github/workflows/aplussolution-staging-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  retry-ios:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: ${{ secrets.HOST }}
      PASS: ${{ secrets.PASS }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
    steps:
      - name: Install SSH client helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Queue corrected staging iOS build
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplus-publisher
          docker compose exec -T web python manage.py shell <<'PY'
          from apps.publisher.models import MobileApp, Release, Build, Job
          from apps.publisher.tasks import enqueue_job
          import json

          app = MobileApp.objects.get(slug='a-plus-solution-staging')
          release = Release.objects.get(app=app, version_name='1.0.0', build_number=1)
          build = Build.objects.get(release=release, platform='ios')

          release.source_branch = 'staging'
          release.source_commit = '2532fde283cd52608cbfdda22e1673339bd227a2'
          release.status = 'building'
          release.auto_submit = False
          release.save(update_fields=['source_branch', 'source_commit', 'status', 'auto_submit', 'updated_at'])

          active = Job.objects.filter(
              release=release,
              build=build,
              type='build_ios',
              status__in=['queued', 'running'],
          ).order_by('-created_at').first()

          if active is None:
              build.status = 'queued'
              build.save(update_fields=['status', 'updated_at'])
              active = enqueue_job(
                  'build_ios',
                  app=app,
                  release=release,
                  build=build,
                  agent=True,
                  platform='macos',
              )
              created = True
          else:
              created = False

          print('IOS_RETRY=' + json.dumps({
              'release_id': release.id,
              'source_commit': release.source_commit,
              'build_id': build.id,
              'job_id': active.id,
              'job_status': active.status,
              'created': created,
              'auto_submit': release.auto_submit,
          }, sort_keys=True))
          PY
          REMOTE

      - name: Wake cloud Mac
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'cloud-macos.yml',
              ref: 'main'
            });
