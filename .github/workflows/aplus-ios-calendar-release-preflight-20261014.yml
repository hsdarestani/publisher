name: A+ Solution Apple Calendar release preflight
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aplus-ios-calendar-release-preflight-20261014.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    env:
      HOST: ${{ secrets.HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
      SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
    steps:
      - name: Connect without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$SSH_PRIVATE_KEY"
          PORT="${SSH_PORT:-22}"
          KEY="$RUNNER_TEMP/aplus-calendar-preflight.key"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$KEY"
          chmod 600 "$KEY"
          if [ -n "$SSH_KEY_PASSPHRASE" ]; then
            eval "$(ssh-agent -s)" >/dev/null
            ASKPASS="$RUNNER_TEMP/aplus-calendar-askpass"
            printf '%s\n' '#!/bin/sh' 'printf "%s" "$SSH_KEY_PASSPHRASE"' > "$ASKPASS"
            chmod 700 "$ASKPASS"
            DISPLAY=:0 SSH_ASKPASS="$ASKPASS" SSH_ASKPASS_REQUIRE=force setsid ssh-add "$KEY" </dev/null
          fi
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -T 10 -p "$PORT" -H "$HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          test -s "$HOME/.ssh/known_hosts"
          if [ -n "$SSH_HOST_FINGERPRINT" ]; then
            ssh-keygen -lf "$HOME/.ssh/known_hosts" | grep -F -- "$SSH_HOST_FINGERPRINT" >/dev/null
          fi
          echo "PUBLISHER_SSH_KEY=$KEY" >> "$GITHUB_ENV"
          echo "PUBLISHER_SSH_PORT=$PORT" >> "$GITHUB_ENV"
      - name: Read current Publisher and Apple App Store state
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$PUBLISHER_SSH_KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p "$PUBLISHER_SSH_PORT" root@"$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplus-publisher
          docker compose exec -T web python manage.py shell <<'PY'
          import json,re
          from apps.publisher.models import MobileApp,Release,Job
          from apps.signing.models import IOSDistributionCredential, IOSProvisioningProfile
          from apps.integrations.apple_store import AppleStoreClient
          app=MobileApp.objects.get(slug='a-plus-solution')
          report={'repository':app.repository_url,'bundle_id':app.bundle_id,'configured_apple_account':bool(app.apple_account and app.apple_account.configured),
                  'distribution_credentials':IOSDistributionCredential.objects.filter(store_account=app.apple_account).exists(),
                  'provisioning_profiles':IOSProvisioningProfile.objects.filter(app=app).exists(),
                  'review_credentials_present':bool(app.review_username and app.get_review_password()),
                  'ios_build_script':(app.build_config or {}).get('ios_command'),
                  'ios_artifact_glob':(app.build_config or {}).get('ios_artifact')}
          latest=Release.objects.filter(app=app).order_by('-created_at')[:8]
          report['recent_releases']=[{'version':x.version_name,'build':x.build_number,'source':(x.source_commit or '')[:12],
            'state':x.status,'ios_build_state':next(iter([b.status for b in x.builds.filter(platform='ios')]),None),
            'ios_external_id':any(bool(b.external_build_id) for b in x.builds.filter(platform='ios'))} for x in latest]
          report['active_ios_jobs']=[{'type':j.type,'status':j.status,'release_version':j.release.version_name if j.release else '',
            'build':j.release.build_number if j.release else None} for j in Job.objects.filter(app=app, type__in=['build_ios','upload_apple','submit_apple'], status__in=['queued','running','claimed']).select_related('release')[:15]]
          try:
            client=AppleStoreClient(app.apple_account); aa=client.find_app(app.bundle_id)
            report['apple_versions']=[{'version':(x.get('attributes') or {}).get('versionString'),'state':(x.get('attributes') or {}).get('appStoreState')}
              for x in client.list_versions(aa['id'],limit=75)][:20]
            bs=client.list_builds(aa['id'],limit=100)
            report['apple_highest_build_number']=max([int((b.get('attributes') or {}).get('version')) for b in bs
              if str((b.get('attributes') or {}).get('version','')).isdigit()] or [0])
            report['recent_apple_builds']=[{'build':(b.get('attributes') or {}).get('version'),
                'processing':(b.get('attributes') or {}).get('processingState')} for b in bs[:8]]
          except Exception as e: report['apple_error_type']=type(e).__name__
          print('CALENDAR_RELEASE_PREFLIGHT='+json.dumps(report,default=str,separators=(',',':')))
          PY
          REMOTE
      - name: Clean ephemeral key
        if: always()
        run: rm -f "$RUNNER_TEMP/aplus-calendar-preflight.key" "$RUNNER_TEMP/aplus-calendar-askpass"
