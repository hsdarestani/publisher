name: A+ Studio Build 10 App Store Resubmit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/a-studio-build10-resubmit.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: a-studio-build10-resubmit
  cancel-in-progress: false

env:
  APP_VERSION: '1.0.0'
  BUILD_NUMBER: '10'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null

      - name: Verify production Cloud App Builder boundary
        run: |
          set -euo pipefail
          body="$(curl -4 -fsS --retry 20 --retry-delay 3 --retry-all-errors \
            --connect-timeout 10 --max-time 20 https://studio.aplus-solution.de/api/mobile/config/)"
          python - "$body" <<'PY'
          import json, sys
          data=json.loads(sys.argv[1])
          caps=data.get('capabilities') or {}
          assert data.get('mode') == 'cloud_app_builder', data
          for key in ('existing_account_access','project_creation','cloud_app_generation','project_requests'):
              assert caps.get(key) is True, (key, caps.get(key))
          for key in ('account_registration','code_download','local_code_execution','external_app_preview','store_status','mobile_publishing','mobile_purchases'):
              assert caps.get(key) is False, (key, caps.get(key))
          print('production_mobile_boundary=cloud_app_builder_no_generated_runtime')
          PY

      - name: Create Build 10 release and queue native builds
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          OUTPUT="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py bootstrap_a_studio_builder_v2 --app-version $APP_VERSION --build-number $BUILD_NUMBER --queue")"
          printf '%s\n' "$OUTPUT"
          printf '%s\n' "$OUTPUT" | grep -q 'mobile_positioning=cloud_app_builder_no_generated_runtime'
          printf '%s\n' "$OUTPUT" | grep -q 'source_commit=d435b5c066120045cb0f61cfc0f79a20298ffbcc'
          printf '%s\n' "$OUTPUT" | grep -q 'release=1.0.0(10) status=building'

      - name: Wake build agents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run cloud-linux.yml --repo "$GITHUB_REPOSITORY"
          gh workflow run cloud-macos.yml --repo "$GITHUB_REPOSITORY"

      - name: Wait for iOS Build 10 artifact
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          for i in $(seq 1 90); do
            OUTPUT="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
              "cd /opt/aplus-publisher && docker compose exec -T web python manage.py bootstrap_a_studio_builder_v2 --app-version $APP_VERSION --build-number $BUILD_NUMBER --diagnose-only")"
            LINE="$(printf '%s\n' "$OUTPUT" | grep '^build_ios=' | tail -n1 || true)"
            echo "$LINE"
            if printf '%s\n' "$LINE" | grep -q 'build_ios=succeeded artifact=yes'; then exit 0; fi
            if printf '%s\n' "$LINE" | grep -q 'build_ios=failed'; then
              printf '%s\n' "$OUTPUT" >&2
              exit 1
            fi
            sleep 20
          done
          echo 'Timed out waiting for Build 10 IPA.' >&2
          exit 1

      - name: Queue Build 10 App Store upload
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py bootstrap_a_studio_builder_v2 --app-version $APP_VERSION --build-number $BUILD_NUMBER --publish"

      - name: Wake upload agent
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cloud-macos.yml --repo "$GITHUB_REPOSITORY"

      - name: Wait for Apple processing
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          for i in $(seq 1 120); do
            OUTPUT="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
              "cd /opt/aplus-publisher && docker compose exec -T web python manage.py bootstrap_a_studio_builder_v2 --app-version $APP_VERSION --build-number $BUILD_NUMBER --diagnose-only")"
            BUILD="$(printf '%s\n' "$OUTPUT" | grep '^build_ios=' | tail -n1 || true)"
            UPLOAD="$(printf '%s\n' "$OUTPUT" | grep '^job=upload_apple:' | tail -n1 || true)"
            echo "$BUILD"
            echo "$UPLOAD"
            if printf '%s\n' "$UPLOAD" | grep -q 'job=upload_apple:failed'; then
              printf '%s\n' "$OUTPUT" >&2
              exit 1
            fi
            if printf '%s\n' "$UPLOAD" | grep -q 'job=upload_apple:succeeded' && \
               printf '%s\n' "$BUILD" | grep -q 'external_id=' && \
               ! printf '%s\n' "$BUILD" | grep -q 'external_id=-'; then
              exit 0
            fi
            sleep 20
          done
          echo 'Timed out waiting for App Store Connect processing.' >&2
          exit 1

      - name: Resolve rejection and submit Build 10
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          OUTPUT="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py bootstrap_a_studio_builder_v2 --app-version $APP_VERSION --build-number $BUILD_NUMBER --publish")"
          printf '%s\n' "$OUTPUT"
          printf '%s\n' "$OUTPUT" | grep -q 'APPLE_REVIEW|build=10|'
          printf '%s\n' "$OUTPUT" | grep -q 'release=1.0.0(10) status=in_review'

      - name: Verify final state
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          OUTPUT="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py bootstrap_a_studio_builder_v2 --app-version $APP_VERSION --build-number $BUILD_NUMBER --diagnose-only")"
          printf '%s\n' "$OUTPUT"
          printf '%s\n' "$OUTPUT" | grep -q 'mobile_positioning=cloud_app_builder_no_generated_runtime'
          printf '%s\n' "$OUTPUT" | grep -q 'source_commit=d435b5c066120045cb0f61cfc0f79a20298ffbcc'
          printf '%s\n' "$OUTPUT" | grep -q 'release=1.0.0(10) status=in_review'
