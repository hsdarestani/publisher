name: Complete BE DIFFERENT native screenshots and store review 7
on:
  push:
    branches: [main]
    paths: ['.github/workflows/be-different-review7-complete.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: be-different-review7-complete-${{ github.run_id }}
  cancel-in-progress: false
env:
  HOST: ${{ secrets.HOST }}
  PASS: ${{ secrets.PASS }}
  SSH_PORT: ${{ secrets.SSH_PORT }}
jobs:
  prepare:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Prepare verified review login and store metadata
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          for attempt in 1 2 3 4; do
            if sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" 'cd /opt/aplus-publisher && docker compose exec -T web python -' < scripts/be_different_review7/prepare.py; then exit 0; fi
            sleep 20
          done
          exit 1
  ios:
    needs: prepare
    runs-on: macos-15
    environment: production
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hsdarestani/aymantraining
          ref: 2a9d0e7f01e00528735ad6c4a0a196b36b554ed5
          path: native-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install capture tools
        run: |
          brew install sshpass
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Read review credentials privately
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" 'cd /opt/aplus-publisher && docker compose exec -T web python -' < scripts/be_different_review7/read_credentials.py > /tmp/bd-review-private.json
          python3 - <<'PY'
          import os,json
          data=json.load(open("/tmp/bd-review-private.json"))
          for key,value in (("REVIEW_USER",data["username"]),("REVIEW_PASS",data["password"])):
              print("::add-mask::"+value)
              with open(os.environ["GITHUB_ENV"],"a") as f:f.write(key+"="+value+"\n")
          os.remove("/tmp/bd-review-private.json")
          PY
      - name: Build actual iOS app for simulator
        working-directory: native-source/mobile
        run: |
          set -euo pipefail
          export NODE_ENV=production
          npm ci --include=dev
          npm install --include=dev --no-save --package-lock=false query-string@7.1.3 react-native-screens@4.11.1 react-native-safe-area-context@5.4.0
          CI=1 npx expo prebuild --platform ios --clean
          python3 scripts/patch-fmt-apple-clang.py ios/Pods
          cd ios
          xcodebuild -workspace BEDIFFERENT.xcworkspace -scheme BEDIFFERENT -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/bd-review-derived CODE_SIGNING_ALLOWED=NO build > /tmp/bd-review-build.log 2>&1 || { tail -n 100 /tmp/bd-review-build.log; exit 1; }
          tail -n 12 /tmp/bd-review-build.log
      - name: Capture authenticated native iPhone UI in both languages
        run: |
          set -euo pipefail
          runtime="$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; print(next(x["identifier"] for x in json.load(sys.stdin)["runtimes"] if x["isAvailable"] and x["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS")))')"
          udid="$(xcrun simctl create 'BE DIFFERENT Store Capture' com.apple.CoreSimulator.SimDeviceType.iPhone-14-Plus "$runtime")"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100
          xcrun simctl install "$udid" /tmp/bd-review-derived/Build/Products/Release-iphonesimulator/BEDIFFERENT.app
          mkdir -p screenshots
          maestro --device "$udid" test -e REVIEW_USER="$REVIEW_USER" -e REVIEW_PASS="$REVIEW_PASS" -e SHOTDIR="$PWD/screenshots" scripts/be_different_review7/ios.yaml
      - name: Save captured native screenshots in Publisher
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" 'mkdir -p /tmp/be-different-review7'
          for image in screenshots/*.png; do
            sshpass -p "$PASS" scp -P "$PORT" -o StrictHostKeyChecking=no "$image" root@"$HOST":/tmp/be-different-review7/
          done
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" 'cd /opt/aplus-publisher && CID=$(docker compose ps -q web) && docker cp /tmp/be-different-review7 "$CID":/tmp/'
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" 'cd /opt/aplus-publisher && docker compose exec -T web python -' < scripts/be_different_review7/save_screenshots.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.job }}-native-store-screenshots
          path: screenshots/*.png
          retention-days: 14
  android:
    needs: prepare
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hsdarestani/aymantraining
          ref: 2a9d0e7f01e00528735ad6c4a0a196b36b554ed5
          path: native-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install capture tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Read review credentials privately
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" 'cd /opt/aplus-publisher && docker compose exec -T web python -' < scripts/be_different_review7/read_credentials.py > /tmp/bd-review-private.json
          python3 - <<'PY'
          import os,json
          data=json.load(open("/tmp/bd-review-private.json"))
          for key,value in (("REVIEW_USER",data["username"]),("REVIEW_PASS",data["password"])):
              print("::add-mask::"+value)
              with open(os.environ["GITHUB_ENV"],"a") as f:f.write(key+"="+value+"\n")
          os.remove("/tmp/bd-review-private.json")
          PY
      - name: Build actual Android app with embedded release JS
        working-directory: native-source/mobile
        run: |
          export NODE_ENV=production
          npm ci --include=dev
          npm install --include=dev --no-save --package-lock=false query-string@7.1.3 react-native-screens@4.11.1 react-native-safe-area-context@5.4.0
          CI=1 npx expo prebuild --platform android --clean
          chmod +x android/gradlew
          ./android/gradlew -p android --no-daemon :app:assembleRelease
      - name: Capture authenticated native Android UI in both languages
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install native-source/mobile/android/app/build/outputs/apk/release/app-release.apk
            mkdir -p screenshots
            maestro test -e REVIEW_USER="$REVIEW_USER" -e REVIEW_PASS="$REVIEW_PASS" -e SHOTDIR="$PWD/screenshots" scripts/be_different_review7/android.yaml
      - name: Save captured native screenshots in Publisher
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" 'mkdir -p /tmp/be-different-review7'
          for image in screenshots/*.png; do
            sshpass -p "$PASS" scp -P "$PORT" -o StrictHostKeyChecking=no "$image" root@"$HOST":/tmp/be-different-review7/
          done
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" 'cd /opt/aplus-publisher && CID=$(docker compose ps -q web) && docker cp /tmp/be-different-review7 "$CID":/tmp/'
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" 'cd /opt/aplus-publisher && docker compose exec -T web python -' < scripts/be_different_review7/save_screenshots.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.job }}-native-store-screenshots
          path: screenshots/*.png
          retention-days: 14

# Include explicit App Info localizations before version localization creation.
