name: Trigger Smarbiz iPad Resubmit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-smarbiz-ipad-resubmit.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch verified iPad resubmission workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/smarbiz-guideline4-resubmit.yml/dispatches" \
            -d '{"ref":"main"}'
          echo 'SMARBIZ_IPAD_RESUBMIT_DISPATCHED=true'
