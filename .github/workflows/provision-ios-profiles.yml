name: Restore iOS signing profiles on STRATO

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provision-ios-profiles.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    steps:
      - name: Validate stored Apple Distribution private key and provision iOS profiles
        shell: bash
        env:
          HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$SSH_PRIVATE_KEY"
          PORT="${SSH_PORT:-22}"
          umask 077
          KEY_FILE="$RUNNER_TEMP/publisher-apple-link-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          if [ -n "$SSH_KEY_PASSPHRASE" ]; then
            eval "$(ssh-agent -s)" >/dev/null
            ASKPASS_FILE="$RUNNER_TEMP/publisher-askpass"
            printf '%s\n' '#!/bin/sh' 'printf "%s" "$SSH_KEY_PASSPHRASE"' > "$ASKPASS_FILE"
            chmod 700 "$ASKPASS_FILE"
            DISPLAY=:0 SSH_ASKPASS="$ASKPASS_FILE" SSH_ASKPASS_REQUIRE=force \
              setsid ssh-add "$KEY_FILE" </dev/null
          fi
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -T 10 -p "$PORT" -H "$HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          test -s "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          if [ -n "$SSH_HOST_FINGERPRINT" ]; then
            ssh-keygen -lf "$HOME/.ssh/known_hosts" | grep -F -- "$SSH_HOST_FINGERPRINT" >/dev/null
          fi
          ssh -i "$KEY_FILE" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -p "$PORT" root@"$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplus-publisher
          docker compose exec -T web python manage.py shell <<'PY'
          import json, base64
          from datetime import datetime, timezone as dt_timezone
          from cryptography import x509
          from cryptography.hazmat.primitives import serialization
          from apps.publisher.models import MobileApp, StoreAccount
          from apps.signing.models import IOSDistributionCredential, IOSProvisioningProfile
          from apps.signing.services import ensure_ios_signing
          from apps.integrations.apple_store import AppleStoreClient
          account=StoreAccount.objects.get(provider='apple',name='apple',enabled=True,status='connected')
          if not account.configured:
              raise RuntimeError('Apple API credentials missing in Publisher database')
          cert=IOSDistributionCredential.objects.filter(store_account=account).first()
          if not cert:
              raise RuntimeError('No Publisher-managed Distribution certificate found. Refusing to create a new certificate automatically.')
          creds=cert.get_credentials()
          private=creds.get('private_key_pem','')
          der=creds.get('certificate_content_base64','')
          if not private or not der:
              raise RuntimeError('The stored Distribution certificate lacks its matching private key or certificate content')
          private_key=serialization.load_pem_private_key(private.encode('utf-8'),password=None)
          certificate=x509.load_der_x509_certificate(base64.b64decode(der))
          if private_key.public_key().public_numbers()!=certificate.public_key().public_numbers():
              raise RuntimeError('Saved Distribution private key does not match certificate')
          now=datetime.now(dt_timezone.utc)
          if certificate.not_valid_after_utc <= now:
              raise RuntimeError('Distribution certificate expired')
          client=AppleStoreClient(account)
          apple_certs=client.request('GET','/certificates?limit=200').get('data',[])
          matches=[item for item in apple_certs if item.get('id')==cert.apple_certificate_id]
          if len(matches)!=1:
              raise RuntimeError('Publisher Distribution certificate no longer exists in Apple Developer account')
          if (matches[0].get('attributes') or {}).get('certificateType')!='DISTRIBUTION':
              raise RuntimeError('The saved Apple certificate is not a Distribution certificate')
          apps=[MobileApp.objects.get(slug=slug) for slug in ('a-plus-solution','a-esthetic')]
          for app in apps:
              if app.apple_account_id != account.id or not app.apple_app_id:
                  raise RuntimeError('App Store links missing for '+app.slug)
          from dateutil.parser import isoparse
          from django.utils import timezone
          existing_profiles=client.request('GET','/profiles?limit=200').get('data',[])
          def find_and_adopt(app, bundle_resource_id, target_name):
              for candidate in existing_profiles:
                  attrs=candidate.get('attributes') or {}
                  if attrs.get('name')!=target_name or attrs.get('profileType')!='IOS_APP_STORE' or attrs.get('profileState')!='ACTIVE':
                      continue
                  pid=candidate.get('id')
                  try:
                      detail=client.request('GET',f'/profiles/{pid}?include=bundleId,certificates').get('data') or {}
                  except Exception:
                      continue
                  rel=detail.get('relationships') or {}
                  bundle=(rel.get('bundleId') or {}).get('data') or {}
                  certificates=(rel.get('certificates') or {}).get('data') or []
                  attrs2=detail.get('attributes') or {}
                  if str(bundle.get('id'))!=str(bundle_resource_id):
                      continue
                  if not any(str(c.get('id'))==str(cert.apple_certificate_id) for c in certificates):
                      continue
                  payload=attrs2.get('profileContent') or ''
                  if not payload:
                      continue
                  expires=isoparse(attrs2['expirationDate']) if attrs2.get('expirationDate') else None
                  record=IOSProvisioningProfile(
                      app=app,distribution_credential=cert,
                      apple_profile_id=pid,
                      profile_name=attrs2.get('name') or target_name,
                      profile_uuid=attrs2.get('uuid',''),
                      expires_at=expires)
                  record.set_credentials({
                      'profile_content_base64':payload,
                      'profile_type':'IOS_APP_STORE',
                      'recovered_at':timezone.now().isoformat()})
                  record.save()
                  return record
              return None
          def make_profile(app, bundle_resource_id, name):
              body={'data':{
                  'type':'profiles',
                  'attributes':{'name':name,'profileType':'IOS_APP_STORE'},
                  'relationships':{
                      'bundleId':{'data':{'type':'bundleIds','id':bundle_resource_id}},
                      'certificates':{'data':[{'type':'certificates','id':cert.apple_certificate_id}]},
                  },
              }}
              item=client.request('POST','/profiles',data=json.dumps(body))['data']
              attrs=item.get('attributes') or {}
              content=attrs.get('profileContent') or ''
              if not content:
                  raise RuntimeError('Apple generated profile without downloadable content: '+app.slug)
              expires=isoparse(attrs['expirationDate']) if attrs.get('expirationDate') else None
              result=IOSProvisioningProfile(
                  app=app,distribution_credential=cert,
                  apple_profile_id=item['id'],
                  profile_name=attrs.get('name') or name,
                  profile_uuid=attrs.get('uuid',''),
                  expires_at=expires)
              result.set_credentials({
                  'profile_content_base64':content,
                  'profile_type':'IOS_APP_STORE',
                  'created_at':timezone.now().isoformat()})
              result.save()
              return result
          print('IOS_CERTIFICATE_PREFLIGHT_OK=1; validated existing matching Distribution certificate; not creating a new one.')
          results={}
          for app in apps:
              existing=IOSProvisioningProfile.objects.filter(app=app).first()
              action='already_present'
              if existing:
                  profile=existing
              else:
                  bundles=client.request('GET',f'/bundleIds?filter[identifier]={app.bundle_id}&limit=10').get('data',[])
                  bundle=next((b for b in bundles if (b.get('attributes') or {}).get('identifier')==app.bundle_id),None)
                  if not bundle:
                      raise RuntimeError('Bundle ID not found in Apple Developer: '+app.slug)
                  base_name=f'A+ Publisher {app.bundle_id} App Store'
                  profile=find_and_adopt(app,bundle['id'],base_name)
                  if profile:
                      action='recovered_existing'
                  else:
                      recovery_name=f'A+ Publisher {app.bundle_id} STRATO Recovery 20261012'
                      profile=find_and_adopt(app,bundle['id'],recovery_name)
                      if profile:
                          action='recovered_strato'
                      else:
                          if any((p.get('attributes') or {}).get('name')==recovery_name for p in existing_profiles):
                              raise RuntimeError('STRATO profile name already exists but cannot be safely adopted for '+app.slug)
                          profile=make_profile(app,bundle['id'],recovery_name)
                          action='created_new_profile_using_existing_certificate'
              if profile.distribution_credential_id!=cert.pk or not profile.get_credentials().get('profile_content_base64'):
                  raise RuntimeError('Profile signing material not ready for '+app.slug)
              results[app.slug]={
                  'profile_ready':True,
                  'action':action,
                  'apple_profile_id':profile.apple_profile_id,
                  'profile_uuid':profile.profile_uuid,
                  'expires':profile.expires_at.isoformat() if profile.expires_at else None}
          print('IOS_SIGNING_PROFILES_RESULT='+json.dumps(results,sort_keys=True))
          PY
          REMOTE
