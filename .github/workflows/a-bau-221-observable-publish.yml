name: Submit verified A+Bau 2.2.1 to Google Play

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq sshpass >/dev/null
          python -m pip install -q 'google-auth>=2.40,<3' 'requests>=2.32,<3'
      - name: Retrieve signed AAB and credential
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"; export SSHPASS="$PASS"
          SSH=(sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST")
          "${SSH[@]}" "cd /opt/aplus-publisher && docker compose exec -T web python -" > /tmp/google.json <<'PY'
          import json,os,django
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings'); django.setup()
          from apps.publisher.models import MobileApp
          a=MobileApp.objects.select_related('google_account').get(slug='a-bau')
          print(json.dumps(a.google_account.get_credentials()))
          PY
          chmod 600 /tmp/google.json
          "${SSH[@]}" "cd /opt/aplus-publisher && docker compose exec -T web python -" > /tmp/a-bau-22002.aab <<'PY'
          import os,sys,django
          from pathlib import Path
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings'); django.setup()
          from apps.publisher.models import MobileApp,Release
          a=MobileApp.objects.get(slug='a-bau'); r=Release.objects.get(app=a,version_name='2.2.1',build_number=22002); b=r.builds.get(platform='android')
          assert b.status=='succeeded' and b.artifact,b.status
          sys.stdout.buffer.write(Path(b.artifact.path).read_bytes())
          PY
          EXPECTED="$("${SSH[@]}" "cd /opt/aplus-publisher && docker compose exec -T web python -c \"import os,django; os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings'); django.setup(); from apps.publisher.models import MobileApp,Release; a=MobileApp.objects.get(slug='a-bau'); r=Release.objects.get(app=a,version_name='2.2.1',build_number=22002); print(r.builds.get(platform='android').artifact_checksum)\"" | tail -n1 | tr -d '\r')"
          ACTUAL="$(sha256sum /tmp/a-bau-22002.aab | awk '{print $1}')"
          test -n "$EXPECTED" && test "$EXPECTED" = "$ACTUAL"
          echo "signed_aab_checksum_verified=$ACTUAL"
      - name: Verify exact signed AAB startup payload
        run: |
          python - <<'PY'
          import json,re,zipfile
          with zipfile.ZipFile('/tmp/a-bau-22002.aab') as z:
              names=set(z.namelist())
              index=next(n for n in names if n.endswith('/assets/public/index.html'))
              bundle=next(n for n in names if n.endswith('/assets/public/app.bundle.js'))
              config=next(n for n in names if n.endswith('/assets/capacitor.config.json'))
              assert not [n for n in names if n.endswith('/assets/public/app.js')]
              html=z.read(index).decode('utf-8','replace'); js=z.read(bundle).decode('utf-8','replace'); cfg=json.loads(z.read(config))
              assert cfg.get('appName')=='A+Bau'
              assert '<title>A+Bau</title>' in html and 'src="app.bundle.js"' in html
              assert 'KAYI Haustechnik' not in html and 'Natives Baustellen-Aufmaß' not in html
              assert not re.search(r"from\s+['\"]@capacitor/core['\"]",js)
              assert 'Anmelden' in js and 'A+Bau' in js
              print('SIGNED_AAB_STARTUP_VERIFY=SUCCESS')
          PY
      - name: Upload and stage 22002 on production
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import quote
          from google.auth.transport.requests import AuthorizedSession,Request
          from google.oauth2 import service_account
          info=json.loads(Path('/tmp/google.json').read_text()); pkg='de.kayihaustechnik.app'; q=quote(pkg,safe='._-'); code='22002'
          c=service_account.Credentials.from_service_account_info(info,scopes=['https://www.googleapis.com/auth/androidpublisher']); c.refresh(Request()); s=AuthorizedSession(c)
          api='https://androidpublisher.googleapis.com/androidpublisher/v3'; upload='https://androidpublisher.googleapis.com/upload/androidpublisher/v3'
          def body(r):
              try:return json.dumps(r.json(),ensure_ascii=False)[:2400]
              except:return ' '.join(r.text.split())[:2400]
          er=s.post(f'{api}/applications/{q}/edits',json={},timeout=60); print(f'edit_open=HTTP_{er.status_code}')
          if not er.ok:raise RuntimeError(body(er))
          eid=er.json()['id']
          try:
              lr=s.get(f'{api}/applications/{q}/edits/{eid}/bundles',timeout=60)
              if not lr.ok:raise RuntimeError('list bundles '+body(lr))
              existing=next((b for b in lr.json().get('bundles',[]) if str(b.get('versionCode'))==code),None)
              if existing:
                  print('bundle_22002=reused')
              else:
                  ur=s.post(f'{upload}/applications/{q}/edits/{eid}/bundles',params={'uploadType':'media'},data=Path('/tmp/a-bau-22002.aab').read_bytes(),headers={'Content-Type':'application/octet-stream'},timeout=600)
                  print(f'bundle_upload=HTTP_{ur.status_code}')
                  if not ur.ok:raise RuntimeError('upload '+body(ur))
                  assert str(ur.json().get('versionCode'))==code,ur.json()
              notes=[{'language':'de-DE','text':'Startproblem beim Öffnen der App behoben. Der A+Bau Login und die native App-Oberfläche laden jetzt zuverlässig.'}]
              tr=s.put(f'{api}/applications/{q}/edits/{eid}/tracks/production',json={'track':'production','releases':[{'name':'2.2.1 (22002)','versionCodes':[code],'status':'completed','releaseNotes':notes}]},timeout=120)
              print(f'track_update=HTTP_{tr.status_code}')
              if not tr.ok:raise RuntimeError('track '+body(tr))
              review_params={'changesNotSentForReview':'true'}
              vr=s.post(f'{api}/applications/{q}/edits/{eid}:validate',params=review_params,json={},timeout=120); print(f'validate=HTTP_{vr.status_code}')
              if not vr.ok:raise RuntimeError('validate '+body(vr))
              cr=s.post(f'{api}/applications/{q}/edits/{eid}:commit',params=review_params,json={},timeout=120); print(f'commit=HTTP_{cr.status_code}')
              if not cr.ok:raise RuntimeError('commit '+body(cr))
              print('GOOGLE_PLAY_22002_STAGED_FOR_MANUAL_REVIEW=SUCCESS')
          except Exception:
              try:s.delete(f'{api}/applications/{q}/edits/{eid}',timeout=60)
              except:pass
              raise
          # fresh edit verification
          e2=s.post(f'{api}/applications/{q}/edits',json={},timeout=60)
          if not e2.ok:raise RuntimeError('verify edit '+body(e2))
          v=e2.json()['id']
          try:
              rr=s.get(f'{api}/applications/{q}/edits/{v}/tracks/production',timeout=60)
              if not rr.ok:raise RuntimeError('verify track '+body(rr))
              rels=rr.json().get('releases') or []
              safe=[{'name':r.get('name'),'status':r.get('status'),'versionCodes':[str(x) for x in r.get('versionCodes') or []]} for r in rels]
              print('POST_COMMIT_PRODUCTION='+json.dumps(safe,sort_keys=True))
              assert any(code in r['versionCodes'] for r in safe),safe
          finally:
              s.delete(f'{api}/applications/{q}/edits/{v}',timeout=60)
          PY
      - name: Record staged submission in Publisher
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"; export SSHPASS="$PASS"
          sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST" "cd /opt/aplus-publisher && docker compose exec -T web python -" <<'PY'
          import os,django
          from django.utils import timezone
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings'); django.setup()
          from apps.publisher.models import MobileApp,Release,Submission
          a=MobileApp.objects.get(slug='a-bau'); r=Release.objects.get(app=a,version_name='2.2.1',build_number=22002); b=r.builds.get(platform='android')
          Submission.objects.update_or_create(app=a,release=r,platform='android',defaults={'state':'ready_for_review','external_id':'22002','submitted_at':timezone.now(),'last_error':'','raw':{'package_name':a.package_name,'track':'production','version_code':'22002','artifact_sha256':b.artifact_checksum or '','reason':'Broken Functionality startup fix','publisher_path':'github-hosted-runner','manual_review_required':True}})
          r.status='ready'; r.save(update_fields=['status','updated_at'])
          print('publisher_google_22002_ready_for_manual_review=true')
          PY
      - name: Cleanup
        if: always()
        run: rm -f /tmp/google.json /tmp/a-bau-22002.aab
