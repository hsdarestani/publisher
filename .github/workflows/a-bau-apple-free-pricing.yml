name: Set A+Bau App Store price to free

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/a-bau-apple-free-pricing.yml'
      - 'apps/signing/management/commands/set_a_bau_apple_free_price.py'

permissions:
  contents: read

jobs:
  price:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Wait for free-pricing command in Publisher production
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          for i in $(seq 1 90); do
            if sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
              "cd /opt/aplus-publisher && docker compose exec -T web python manage.py help set_a_bau_apple_free_price >/dev/null 2>&1"; then
              exit 0
            fi
            sleep 5
          done
          exit 2

      - name: Set official free App Store price point
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py set_a_bau_apple_free_price"
