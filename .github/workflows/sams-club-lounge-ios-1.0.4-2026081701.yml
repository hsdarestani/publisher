name: Sams Club Lounge iOS 1.0.4 (2026081701)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sams-club-lounge-ios-1.0.4-2026081701.yml'

permissions:
  contents: read
  actions: write
  id-token: write

env:
  SAMS_SOURCE_COMMIT: 8d1a60a17bd46d24d1b6d4190995ea20f35161be
  SAMS_VERSION: '1.0.4'
  SAMS_BUILD: '2026081701'
  SAMS_BUNDLE_ID: de.aplussolution.samscard
  SAMS_APPSTORE_ID: '6794268917'

jobs:
  release-sams-ios:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install release tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null

      - name: Configure Sams Club Lounge in Publisher and queue signed build
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T \
              -e SAMS_SOURCE_COMMIT='$SAMS_SOURCE_COMMIT' \
              -e SAMS_VERSION='$SAMS_VERSION' \
              -e SAMS_BUILD='$SAMS_BUILD' \
              -e SAMS_BUNDLE_ID='$SAMS_BUNDLE_ID' \
              -e SAMS_APPSTORE_ID='$SAMS_APPSTORE_ID' \
              web python manage.py shell" <<'PY'
          import os
          import requests
          from django.utils import timezone
          from apps.publisher.models import Build, Job, MobileApp, Release, StoreAccount
          from apps.signing.services import ensure_ios_signing

          commit=os.environ['SAMS_SOURCE_COMMIT']
          version=os.environ['SAMS_VERSION']
          build_number=int(os.environ['SAMS_BUILD'])
          bundle=os.environ['SAMS_BUNDLE_ID']
          appstore_id=os.environ['SAMS_APPSTORE_ID']

          if bundle != 'de.aplussolution.samscard' or appstore_id != '6794268917':
              raise SystemExit('Sams identity guard failed.')

          apple_accounts=StoreAccount.objects.filter(provider='apple',enabled=True,apple_team_id='884MVA2MD5')
          if apple_accounts.count()!=1:
              raise SystemExit(f'Expected exactly one Apple Team 884MVA2MD5 account, got {apple_accounts.count()}')
          apple=apple_accounts.get()
          if not apple.configured:
              raise SystemExit('Sams Apple account is not configured.')

          token_source=MobileApp.objects.filter(repository_token_blob__gt='').order_by('pk').first()
          if not token_source:
              raise SystemExit('Publisher has no repository credential to access private source.')
          token=token_source.get_repository_token()
          probe=requests.get(
              'https://api.github.com/repos/hsdarestani/apluscard',
              headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json'},
              timeout=30,
          )
          if probe.status_code != 200:
              raise SystemExit(f'Private Sams source access failed with HTTP {probe.status_code}.')
          repo=probe.json()
          if repo.get('full_name') != 'hsdarestani/apluscard':
              raise SystemExit('Repository credential resolved the wrong repository.')
          print('SAMS_PRIVATE_REPO_ACCESS=ok')

          collisions=MobileApp.objects.filter(bundle_id=bundle).exclude(slug='sams-club-lounge')
          if collisions.exists():
              raise SystemExit('Another Publisher app already owns the Sams bundle ID.')

          app, _=MobileApp.objects.update_or_create(
              slug='sams-club-lounge',
              defaults={
                  'name':'Sams Club Lounge',
                  'client_name':'Sams Club Lounge',
                  'platform':'ios',
                  'framework':'other',
                  'status':'active',
                  'bundle_id':bundle,
                  'apple_app_id':appstore_id,
                  'repository_url':'https://github.com/hsdarestani/apluscard.git',
                  'default_branch':'main',
                  'apple_account':apple,
                  'build_config':{
                      'ios_command':'bash mobile/ci/build-ios-publisher.sh',
                      'ios_artifact':'artifacts/sams-club-lounge.ipa',
                  },
              },
          )
          app.set_repository_token(token)
          app.save(update_fields=['repository_token_blob','updated_at'])

          if app.name!='Sams Club Lounge' or app.bundle_id!=bundle or app.repository_url!='https://github.com/hsdarestani/apluscard.git':
              raise SystemExit('Publisher Sams app identity mismatch after setup.')

          profile=ensure_ios_signing(app)
          if profile.app_id != app.pk or not profile.profile_uuid:
              raise SystemExit('Sams iOS signing profile was not provisioned correctly.')
          print('SAMS_SIGNING_PROFILE=ready')

          release,_=Release.objects.update_or_create(
              app=app,version_name=version,build_number=build_number,
              defaults={
                  'status':'building',
                  'source_branch':'main',
                  'source_commit':commit,
                  'ios_release_type':'manual',
                  'auto_submit':False,
                  'release_notes':'Verbesserte E-Mail-Bestätigung und zuverlässigeres Öffnen von Bestätigungslinks in der iOS-App.',
              },
          )
          Job.objects.filter(release=release,type__in=['build_ios','upload_apple','submit_apple'],status__in=['queued','running']).update(
              status='cancelled',finished_at=timezone.now(),error='Superseded by Sams Club Lounge 1.0.4 release workflow.'
          )
          build,_=Build.objects.get_or_create(release=release,platform='ios')
          if build.artifact:
              build.artifact.delete(save=False)
          build.status='queued'; build.agent=None; build.commit_sha=''; build.artifact=''; build.artifact_size=0
          build.artifact_checksum=''; build.logs=''; build.started_at=None; build.finished_at=None
          build.external_build_id=''; build.metadata={}; build.save()
          job=Job.objects.create(
              type='build_ios',app=app,release=release,build=build,
              payload={'source':'sams-club-lounge-ios-1.0.4'},available_to_agents=True,required_platform='macos',
          )
          print('SAMS_APP_ID='+str(app.pk))
          print('SAMS_RELEASE_ID='+str(release.pk))
          print('SAMS_BUILD_JOB_ID='+str(job.pk))
          PY

      - name: Wake Cloud Mac for Sams build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cloud-macos.yml --repo "$GITHUB_REPOSITORY"

      - name: Wait for Sams signed IPA
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          PORT="${SSH_PORT:-22}"
          for i in $(seq 1 100); do
            DATA="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
              "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell -c \"from apps.publisher.models import Build,Job; b=Build.objects.get(release__app__slug='sams-club-lounge',release__version_name='1.0.4',release__build_number=2026081701,platform='ios'); j=Job.objects.filter(build=b,type='build_ios').order_by('-created_at').first(); print(b.status+'|'+((j.error if j else '') or ''))\"" | tail -n1)"
            STATUS="${DATA%%|*}"; ERROR="${DATA#*|}"
            echo "Sams build status: $STATUS"
            if [ "$STATUS" = "succeeded" ]; then break; fi
            if [ "$STATUS" = "failed" ]; then
              echo "Sams build failed: $ERROR" >&2
              sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
                "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell -c \"from apps.publisher.models import Job; j=Job.objects.filter(release__app__slug='sams-club-lounge',release__build_number=2026081701,type='build_ios').order_by('-created_at').first(); print(j.logs[-30000:] if j else '')\""
              exit 1
            fi
            [ "$i" -lt 100 ] || { echo 'Timed out waiting for Sams iOS build.' >&2; exit 1; }
            sleep 30
          done

      - name: Queue Sams App Store upload
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell" <<'PY'
          from apps.publisher.models import Build, Job
          b=Build.objects.get(release__app__slug='sams-club-lounge',release__version_name='1.0.4',release__build_number=2026081701,platform='ios')
          if b.status!='succeeded': raise SystemExit('Sams IPA is not ready.')
          old=Job.objects.filter(build=b,type='upload_apple',status__in=['queued','running','succeeded']).order_by('-created_at').first()
          if old:
              print(f'SAMS_UPLOAD_JOB={old.pk}:{old.status}')
          else:
              j=Job.objects.create(type='upload_apple',app=b.release.app,release=b.release,build=b,payload={'source':'sams-club-lounge-ios-1.0.4'},available_to_agents=True,required_platform='macos')
              print(f'SAMS_UPLOAD_JOB={j.pk}:queued')
          PY

      - name: Wake Cloud Mac for Sams upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cloud-macos.yml --repo "$GITHUB_REPOSITORY"

      - name: Wait for Apple to process Sams build
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          PORT="${SSH_PORT:-22}"
          for i in $(seq 1 100); do
            DATA="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
              "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell -c \"from apps.publisher.models import Build,Job; b=Build.objects.get(release__app__slug='sams-club-lounge',release__version_name='1.0.4',release__build_number=2026081701,platform='ios'); j=Job.objects.filter(build=b,type='upload_apple').order_by('-created_at').first(); print((j.status if j else 'missing')+'|'+(b.external_build_id or '-'))\"" | tail -n1)"
            STATUS="${DATA%%|*}"; EXT="${DATA#*|}"
            echo "Sams Apple upload: $STATUS / $EXT"
            if [ "$STATUS" = "succeeded" ] && [ "$EXT" != "-" ]; then break; fi
            if [ "$STATUS" = "failed" ]; then
              sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
                "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell -c \"from apps.publisher.models import Job; j=Job.objects.filter(release__app__slug='sams-club-lounge',release__build_number=2026081701,type='upload_apple').order_by('-created_at').first(); print(j.error if j else ''); print(j.logs[-30000:] if j else '')\""
              exit 1
            fi
            [ "$i" -lt 100 ] || { echo 'Timed out waiting for Sams App Store processing.' >&2; exit 1; }
            sleep 30
          done

      - name: Attach Sams build, preserve review info, and submit 1.0.4
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell" <<'PY'
          import json
          from django.utils import timezone
          from apps.integrations.apple_store import AppleStoreClient
          from apps.publisher.models import Build, Submission

          b=Build.objects.get(release__app__slug='sams-club-lounge',release__version_name='1.0.4',release__build_number=2026081701,platform='ios')
          if b.status!='succeeded' or not b.external_build_id:
              raise SystemExit(f'Sams build is not Apple-ready: {b.status}/{b.external_build_id!r}')
          release=b.release; app=release.app
          if app.name!='Sams Club Lounge' or app.bundle_id!='de.aplussolution.samscard' or app.apple_app_id!='6794268917':
              raise SystemExit('Refusing to submit a non-Sams app.')

          client=AppleStoreClient(app.apple_account)
          record=client.find_app(app.bundle_id)
          if str(record['id'])!='6794268917' or record.get('attributes',{}).get('name')!='Sams Club Lounge':
              raise SystemExit('App Store Connect resolved the wrong app.')
          target=client.find_editable_version(record['id'],'1.0.4')
          source=client.find_editable_version(record['id'],'1.0.3')
          if not target or not source:
              raise SystemExit('Expected Sams App Store versions 1.0.3 and 1.0.4.')

          client.set_build_uses_non_exempt_encryption(b.external_build_id,False)
          client.attach_build(target['id'],b.external_build_id)

          # Preserve the live version's private App Review contact/demo data without logging it.
          source_detail=client.request('GET',f"/appStoreVersions/{source['id']}/appStoreReviewDetail").get('data')
          target_detail=client.request('GET',f"/appStoreVersions/{target['id']}/appStoreReviewDetail").get('data')
          if source_detail:
              allowed=('contactFirstName','contactLastName','contactPhone','contactEmail','demoAccountName','demoAccountPassword','demoAccountRequired','notes')
              attrs={k:v for k,v in source_detail.get('attributes',{}).items() if k in allowed and v not in (None,'')}
              if target_detail:
                  body={'data':{'type':'appStoreReviewDetails','id':target_detail['id'],'attributes':attrs}}
                  client.request('PATCH',f"/appStoreReviewDetails/{target_detail['id']}",data=json.dumps(body))
              else:
                  body={'data':{'type':'appStoreReviewDetails','attributes':attrs,'relationships':{'appStoreVersion':{'data':{'type':'appStoreVersions','id':target['id']}}}}}
                  client.request('POST','/appStoreReviewDetails',data=json.dumps(body))
              print('SAMS_REVIEW_INFO_CARRIED=true')
          else:
              print('SAMS_REVIEW_INFO_CARRIED=false')

          result=client.submit_version(record['id'],target['id'])
          submission=result['submission']
          state=submission.get('attributes',{}).get('state','')
          Submission.objects.update_or_create(
              app=app,release=release,platform='ios',
              defaults={'state':'in_review','external_id':submission['id'],'submitted_at':timezone.now(),'last_error':'','raw':{'submission':submission,'sams_release':True}},
          )
          release.status='in_review'; release.save(update_fields=['status','updated_at'])

          attached=client.request('GET',f"/appStoreVersions/{target['id']}/build").get('data') or {}
          if str(attached.get('id'))!=str(b.external_build_id):
              raise SystemExit('Sams 1.0.4 is not attached to the uploaded build.')
          if state not in {'WAITING_FOR_REVIEW','IN_REVIEW'}:
              raise SystemExit(f'Unexpected Sams review submission state after submit: {state}')
          print('SAMS_BUILD_EXTERNAL_ID='+str(b.external_build_id))
          print('SAMS_REVIEW_SUBMISSION_ID='+str(submission['id']))
          print('SAMS_REVIEW_STATE='+state)
          PY
