name: A+Bau 2.2.1 observable release check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  state:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq sshpass >/dev/null
          python -m pip install -q 'google-auth>=2.40,<3' 'requests>=2.32,<3'
      - name: Show safe Publisher and Google Play state
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"; export SSHPASS="$PASS"
          SSH=(sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST")
          "${SSH[@]}" "cd /opt/aplus-publisher && docker compose exec -T web python -" <<'PY'
          import json, os, django
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings'); django.setup()
          from apps.publisher.models import MobileApp,Release,Submission,Job
          a=MobileApp.objects.get(slug='a-bau')
          r=Release.objects.filter(app=a,version_name='2.2.1',build_number=22002).first()
          out={'release_exists':bool(r)}
          if r:
              out['release_status']=r.status
              out['builds']={b.platform:b.status for b in r.builds.all()}
              out['submissions']={s.platform:s.state for s in Submission.objects.filter(app=a,release=r)}
              out['jobs']=[{'type':j.type,'status':j.status,'error':(j.error or '')[:300]} for j in Job.objects.filter(app=a,release=r).order_by('-created_at')[:10]]
          print('PUBLISHER_STATE='+json.dumps(out,sort_keys=True))
          PY
          "${SSH[@]}" "cd /opt/aplus-publisher && docker compose exec -T web python -" > /tmp/google.json <<'PY'
          import json, os, django
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings'); django.setup()
          from apps.publisher.models import MobileApp
          a=MobileApp.objects.select_related('google_account').get(slug='a-bau')
          print(json.dumps(a.google_account.get_credentials()))
          PY
          chmod 600 /tmp/google.json
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import quote
          from google.auth.transport.requests import AuthorizedSession,Request
          from google.oauth2 import service_account
          info=json.loads(Path('/tmp/google.json').read_text()); pkg='de.kayihaustechnik.app'; q=quote(pkg,safe='._-')
          c=service_account.Credentials.from_service_account_info(info,scopes=['https://www.googleapis.com/auth/androidpublisher']); c.refresh(Request()); s=AuthorizedSession(c)
          api='https://androidpublisher.googleapis.com/androidpublisher/v3'
          er=s.post(f'{api}/applications/{q}/edits',json={},timeout=60)
          out={'edit_http':er.status_code}
          if er.ok:
              eid=er.json()['id']
              try:
                  tr=s.get(f'{api}/applications/{q}/edits/{eid}/tracks/production',timeout=60)
                  out['track_http']=tr.status_code
                  if tr.ok:
                      out['production_releases']=[{'name':r.get('name'),'status':r.get('status'),'versionCodes':[str(x) for x in r.get('versionCodes') or []]} for r in (tr.json().get('releases') or [])]
              finally:
                  s.delete(f'{api}/applications/{q}/edits/{eid}',timeout=60)
          print('GOOGLE_PLAY_STATE='+json.dumps(out,sort_keys=True))
          PY
          rm -f /tmp/google.json
