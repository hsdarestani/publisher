name: Release A+ Studio to Apple and Google

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/a-studio-release.yml'
      - 'apps/signing/management/commands/bootstrap_a_studio.py'
      - 'apps/signing/management/commands/bootstrap_a_studio_builder.py'
      - 'apps/signing/management/commands/bootstrap_a_studio_builder_v2.py'
      - 'apps/publisher/job_recovery.py'
      - 'apps/publisher/management/commands/recover_a_studio_jobs.py'
      - 'apps/publisher/store_compliance.py'
      - 'apps/publisher/review_contacts.py'
      - 'apps/integrations/apple_assets.py'
      - 'apps/integrations/apple_compliance.py'
      - 'apps/integrations/apple_store.py'
      - 'apps/publisher/tasks.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/a-studio-release.yml'
      - 'apps/signing/management/commands/bootstrap_a_studio.py'
      - 'apps/signing/management/commands/bootstrap_a_studio_builder.py'
      - 'apps/signing/management/commands/bootstrap_a_studio_builder_v2.py'
      - 'apps/publisher/job_recovery.py'
      - 'apps/publisher/management/commands/recover_a_studio_jobs.py'
      - 'apps/publisher/store_compliance.py'
      - 'apps/publisher/review_contacts.py'
      - 'apps/integrations/apple_assets.py'
      - 'apps/integrations/apple_compliance.py'
      - 'apps/integrations/apple_store.py'
      - 'apps/publisher/tasks.py'

permissions:
  contents: read
  actions: write

concurrency:
  group: a-studio-build10-app-store
  cancel-in-progress: false

env:
  APP_VERSION: '1.0.0'
  BUILD_NUMBER: '10'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate Django and Build 10 release modules
        env:
          DEBUG: '1'
          DJANGO_SECRET_KEY: ci-secret
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          set -euo pipefail
          python manage.py check
          python manage.py test apps.publisher.test_job_recovery
          python manage.py help bootstrap_a_studio_builder_v2 >/dev/null
          python manage.py help recover_a_studio_jobs >/dev/null
          python -m py_compile \
            apps/signing/management/commands/bootstrap_a_studio.py \
            apps/signing/management/commands/bootstrap_a_studio_builder.py \
            apps/signing/management/commands/bootstrap_a_studio_builder_v2.py \
            apps/publisher/job_recovery.py \
            apps/publisher/management/commands/recover_a_studio_jobs.py \
            apps/integrations/apple_assets.py \
            apps/integrations/apple_compliance.py \
            apps/integrations/apple_store.py \
            apps/publisher/tasks.py

  release:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    steps:
      - name: Install release tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null

      - name: Wait for Build 10 Publisher command in production
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          for i in $(seq 1 90); do
            if sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
              "cd /opt/aplus-publisher && docker compose exec -T web python manage.py help bootstrap_a_studio_builder_v2 >/dev/null"; then
              echo 'Build 10 Publisher command is live.'
              exit 0
            fi
            sleep 5
          done
          echo 'Build 10 Publisher command never appeared in production.' >&2
          exit 2

      - name: Verify real Cloud App Builder boundary in production
        run: |
          set -euo pipefail
          body="$(curl -4 -fsS --retry 30 --retry-delay 3 --retry-all-errors \
            --connect-timeout 10 --max-time 20 https://studio.aplus-solution.de/api/mobile/config/)"
          python - "$body" <<'PY'
          import json, sys
          data=json.loads(sys.argv[1])
          caps=data.get('capabilities') or {}
          if data.get('mode') != 'cloud_app_builder':
              raise SystemExit(f"Production mode is {data.get('mode')!r}, expected cloud_app_builder")
          for key in ('existing_account_access','project_creation','cloud_app_generation','project_requests'):
              if caps.get(key) is not True:
                  raise SystemExit(f'Required App Builder capability is not enabled: {key}')
          for key in ('account_registration','code_download','local_code_execution','external_app_preview','store_status','mobile_publishing','mobile_purchases'):
              if caps.get(key) is not False:
                  raise SystemExit(f'Unsafe iOS capability is not disabled: {key}')
          print('production_mobile_boundary=cloud_app_builder_no_generated_runtime')
          PY
          curl -4 -fsS https://studio.aplus-solution.de/mobile/ >/dev/null
          curl -4 -fsS https://studio.aplus-solution.de/mobile/privacy/ >/dev/null
          curl -4 -fsS https://studio.aplus-solution.de/mobile/terms/ >/dev/null
          curl -4 -fsS https://studio.aplus-solution.de/mobile/support/ >/dev/null

      - name: Recover stale Build 10 jobs and queue builds
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py recover_a_studio_jobs --app-version $APP_VERSION --build-number $BUILD_NUMBER --stale-after-minutes 10"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py bootstrap_a_studio_builder_v2 --app-version $APP_VERSION --build-number $BUILD_NUMBER --queue"

      - name: Wake build agents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run cloud-linux.yml --repo "$GITHUB_REPOSITORY"
          gh workflow run cloud-macos.yml --repo "$GITHUB_REPOSITORY"

      - name: Wait for iOS Build 10 artifact
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          for i in $(seq 1 80); do
            OUTPUT="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
              "cd /opt/aplus-publisher && docker compose exec -T web python manage.py bootstrap_a_studio_builder_v2 --app-version $APP_VERSION --build-number $BUILD_NUMBER --diagnose-only")"
            printf '%s\n' "$OUTPUT"
            if printf '%s\n' "$OUTPUT" | grep -q 'build_ios=succeeded artifact=yes'; then
              exit 0
            fi
            if printf '%s\n' "$OUTPUT" | grep -q 'build_ios=failed'; then
              echo 'A+ Studio iOS Build 10 failed.' >&2
              exit 1
            fi
            sleep 20
          done
          echo 'Timed out waiting for A+ Studio iOS Build 10.' >&2
          exit 1

      - name: Queue App Store upload for Build 10
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py bootstrap_a_studio_builder_v2 --app-version $APP_VERSION --build-number $BUILD_NUMBER --publish"

      - name: Wake App Store upload agent
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cloud-macos.yml --repo "$GITHUB_REPOSITORY"

      - name: Wait for Apple to process Build 10
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          for i in $(seq 1 100); do
            OUTPUT="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
              "cd /opt/aplus-publisher && docker compose exec -T web python manage.py bootstrap_a_studio_builder_v2 --app-version $APP_VERSION --build-number $BUILD_NUMBER --diagnose-only")"
            printf '%s\n' "$OUTPUT"
            LINE="$(printf '%s\n' "$OUTPUT" | grep 'build_ios=succeeded artifact=yes external_id=' | tail -n1 || true)"
            if [ -n "$LINE" ] && ! printf '%s\n' "$LINE" | grep -q 'external_id=-'; then
              if printf '%s\n' "$OUTPUT" | grep -q 'job=upload_apple:succeeded'; then
                exit 0
              fi
            fi
            if printf '%s\n' "$OUTPUT" | grep -q 'job=upload_apple:failed'; then
              echo 'Build 10 App Store upload failed.' >&2
              exit 1
            fi
            sleep 20
          done
          echo 'Timed out waiting for Apple processing of Build 10.' >&2
          exit 1

      - name: Resolve previous rejection and submit Build 10
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          OUTPUT="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py bootstrap_a_studio_builder_v2 --app-version $APP_VERSION --build-number $BUILD_NUMBER --publish")"
          printf '%s\n' "$OUTPUT"
          printf '%s\n' "$OUTPUT" | grep -q 'APPLE_REVIEW|build=10|'
          printf '%s\n' "$OUTPUT" | grep -q 'release=1.0.0(10) status=in_review'

      - name: Final App Store state
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          OUTPUT="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py bootstrap_a_studio_builder_v2 --app-version $APP_VERSION --build-number $BUILD_NUMBER --diagnose-only")"
          printf '%s\n' "$OUTPUT"
          printf '%s\n' "$OUTPUT" | grep -q 'mobile_positioning=cloud_app_builder_no_generated_runtime'
          printf '%s\n' "$OUTPUT" | grep -q 'source_commit=d435b5c066120045cb0f61cfc0f79a20298ffbcc'
          printf '%s\n' "$OUTPUT" | grep -q 'release=1.0.0(10) status=in_review'
