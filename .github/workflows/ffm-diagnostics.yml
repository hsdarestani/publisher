name: FFM Aktuell — read-only server diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ffm-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 9
    steps:
      - name: Inspect isolated FFM containers without changes
        env:
          HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          test "$HOST" = "82.165.187.14"
          test -n "$SSH_PRIVATE_KEY"
          PORT="${SSH_PORT:-22}"
          umask 077
          KEY="$RUNNER_TEMP/ffm-diagnostic-key"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$KEY"
          chmod 600 "$KEY"
          if [ -n "$SSH_KEY_PASSPHRASE" ]; then
            eval "$(ssh-agent -s)" >/dev/null
            ASKPASS="$RUNNER_TEMP/ffm-diagnostic-askpass"
            printf '%s\n' '#!/bin/sh' 'printf "%s" "$SSH_KEY_PASSPHRASE"' > "$ASKPASS"
            chmod 700 "$ASKPASS"
            DISPLAY=:0 SSH_ASKPASS="$ASKPASS" SSH_ASKPASS_REQUIRE=force setsid ssh-add "$KEY" </dev/null
          fi
          mkdir -p "$HOME/.ssh"
          ssh-keyscan -T 10 -p "$PORT" -H "$HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          if [ -n "$SSH_HOST_FINGERPRINT" ]; then
            ssh-keygen -lf "$HOME/.ssh/known_hosts" | grep -F -- "$SSH_HOST_FINGERPRINT" >/dev/null
          fi
          ssh -i "$KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$PORT" root@"$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          echo '=== FFM CONTAINERS ==='
          cd /opt/ffm-aktuell
          docker compose ps -a </dev/null || true
          echo '=== DATABASE LOGS (sanitized operational output) ==='
          docker compose logs --tail=55 db </dev/null || true
          echo '=== WEB LOGS (sanitized operational output) ==='
          docker compose logs --tail=35 web </dev/null || true
          echo '=== HOST CAPACITY ==='
          free -m
          df -h /opt
          echo '=== PUBLISHER CONTAINERS ==='
          cd /opt/aplus-publisher
          docker compose ps caddy web </dev/null
          REMOTE
