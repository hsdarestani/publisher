name: Submit BE DIFFERENT 1.1 build 8
on:
  push:
    branches: [main]
    paths: ['.github/workflows/be-different-1-1-submit.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: be-different-1-1-submit
  cancel-in-progress: false
jobs:
  submit:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    steps:
      - name: Advance and inspect exact release
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" 'cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell' <<'PY'
          import json
          from apps.publisher.models import Release,Job,Submission
          for r in Release.objects.filter(pk__in=[130,131],app__slug="be-different"):
              print("RELEASE_STATUS="+json.dumps({"id":r.pk,"version":r.version_name,"build":r.build_number,"status":r.status,"track":r.android_track,"builds":list(r.builds.values("id","platform","status","external_build_id","artifact_size")),"jobs":list(Job.objects.filter(release=r).values("id","type","status","error")),"submissions":list(Submission.objects.filter(release=r).values("platform","state","external_id","last_error"))}))
          PY

# Status refresh after store account access and build 9 upload.
