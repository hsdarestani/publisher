name: A+ Esthetic Apple review recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/a-esthetic-submit-status.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - name: Replace waiting Apple version with latest A+ Esthetic build
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          PY_CODE=$(cat <<'PY'
          import json
          import time
          from apps.integrations.apple_store import AppleStoreClient
          from apps.publisher.models import MobileApp, Release, Submission
          from apps.publisher.tasks import enqueue_job

          SOURCE_COMMIT = 'd5ef2cd6bdf40d85c47aba8e73a99fd6bc0b5c4c'
          EDITABLE = {'PREPARE_FOR_SUBMISSION','READY_FOR_REVIEW','DEVELOPER_REJECTED','METADATA_REJECTED','REJECTED'}

          app = MobileApp.objects.get(slug='a-esthetic')
          release = Release.objects.filter(app=app, source_commit=SOURCE_COMMIT).order_by('-created_at').first()
          if not release:
              raise SystemExit('latest_release_missing')
          ios = release.builds.get(platform='ios')
          if ios.status != 'succeeded' or not ios.external_build_id:
              raise SystemExit(f'ios_build_not_ready status={ios.status} external={bool(ios.external_build_id)}')
          if not app.apple_account or not app.apple_account.configured:
              raise SystemExit('apple_account_missing')

          client = AppleStoreClient(app.apple_account)
          record = client.find_app(app.bundle_id)
          app_id = record['id']
          target_string = release.version_name
          target = client.find_editable_version(app_id, target_string)

          if not target:
              versions = client.list_versions(app_id)
              waiting = next(
                  (v for v in versions if (v.get('attributes',{}).get('appStoreState') or v.get('attributes',{}).get('appVersionState')) == 'WAITING_FOR_REVIEW'),
                  None,
              )
              if not waiting:
                  raise SystemExit('no_editable_or_waiting_apple_version_found')
              old_string = waiting.get('attributes',{}).get('versionString') or ''
              old_id = waiting['id']
              print(f'APPLE_REPLACE waiting_version={old_string} waiting_id={old_id} target={target_string}')

              canceled = False
              for review in client.list_review_submissions(app_id, 'WAITING_FOR_REVIEW'):
                  items = client.list_review_submission_items(review['id'])
                  if any(client._item_targets_version(item, old_id) for item in items):
                      client.cancel_review_submission(review['id'])
                      print(f'APPLE_REVIEW_CANCELED id={review["id"]}')
                      canceled = True
              if not canceled:
                  raise SystemExit('waiting_review_submission_not_found')

              deadline = time.time() + 150
              state = 'WAITING_FOR_REVIEW'
              while time.time() < deadline:
                  current = next((v for v in client.list_versions(app_id) if v.get('id') == old_id), None)
                  if not current:
                      raise SystemExit('waiting_version_disappeared')
                  state = current.get('attributes',{}).get('appStoreState') or current.get('attributes',{}).get('appVersionState') or ''
                  print(f'APPLE_WAIT_CANCELED_STATE state={state}')
                  if state in EDITABLE:
                      break
                  time.sleep(5)
              if state not in EDITABLE:
                  raise SystemExit(f'apple_version_not_editable_after_cancel state={state}')

              target = client.update_version_string(old_id, target_string)
              print(f'APPLE_VERSION_RENAMED id={old_id} version={target_string}')
          else:
              print(f'APPLE_TARGET_VERSION_EXISTS id={target["id"]} version={target_string}')

          target_id = target['id']

          # Reuse an existing READY_FOR_REVIEW draft if Apple left one behind.
          ready_match = None
          empty_ready = None
          for review in client.list_review_submissions(app_id, 'READY_FOR_REVIEW'):
              items = client.list_review_submission_items(review['id'])
              if any(client._item_targets_version(item, target_id) for item in items):
                  ready_match = review
                  print(f'APPLE_READY_DRAFT_MATCH id={review["id"]}')
                  break
              version_items = [
                  item for item in items
                  if (item.get('relationships',{}).get('appStoreVersion',{}).get('data') or {}).get('id')
              ]
              if not version_items and empty_ready is None:
                  empty_ready = review

          if ready_match is None and empty_ready is not None:
              item_body = {'data': {'type': 'reviewSubmissionItems', 'relationships': {
                  'reviewSubmission': {'data': {'type': 'reviewSubmissions', 'id': empty_ready['id']}},
                  'appStoreVersion': {'data': {'type': 'appStoreVersions', 'id': target_id}},
              }}}
              client.request('POST', '/reviewSubmissionItems', data=json.dumps(item_body))
              print(f'APPLE_READY_DRAFT_REUSED id={empty_ready["id"]} target={target_id}')

          active = release.jobs.filter(type='submit_apple', status__in=['queued','running']).first()
          if active:
              job = active
              print(f'APPLE_SUBMIT_JOB_REUSED id={job.id} status={job.status}')
          else:
              job = enqueue_job('submit_apple', app=app, release=release, build=ios)
              print(f'APPLE_SUBMIT_JOB_QUEUED id={job.id}')

          deadline = time.time() + 900
          while time.time() < deadline:
              job.refresh_from_db()
              print(f'APPLE_SUBMIT_JOB_STATE id={job.id} status={job.status} progress={job.progress}')
              if job.status == 'succeeded':
                  break
              if job.status == 'failed':
                  raise SystemExit('apple_submit_failed: ' + (job.error or '')[:1500])
              time.sleep(10)
          if job.status != 'succeeded':
              raise SystemExit(f'apple_submit_timeout status={job.status}')

          sub = Submission.objects.filter(release=release, platform='ios').first()
          if not sub or sub.state != 'in_review':
              raise SystemExit(f'apple_submission_not_in_review state={sub.state if sub else "missing"}')
          android = Submission.objects.filter(release=release, platform='android').first()
          print(f'FINAL android={android.state if android else "missing"} ios={sub.state} version={release.version_name} build={release.build_number}')
          PY
          )
          ENCODED=$(printf '%s' "$PY_CODE" | base64 -w0)
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && printf '%s' '$ENCODED' | base64 -d | docker compose exec -T web python manage.py shell"
