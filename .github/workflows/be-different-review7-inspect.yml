name: Inspect BE DIFFERENT review requirements 7
on:
  push:
    branches: [main]
    paths: ['.github/workflows/be-different-review7-inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - name: Read store errors and current listing assets
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" 'cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell' <<'PY'
          import json,base64
          from apps.publisher.models import MobileApp,Release,Submission
          from apps.integrations.apple_store import AppleStoreClient
          from apps.integrations.google_play import GooglePlayClient
          a=MobileApp.objects.get(slug="be-different")
          print("NATIVE_ASSETS="+json.dumps(list(a.assets.values("id","kind","platform","locale","device_type","width","height"))))
          for asset in a.assets.filter(kind="screenshot",device_type="APP_WATCH_SERIES_7"):
              print("WATCH_PNG="+json.dumps({"locale":asset.locale,"data":base64.b64encode(open(asset.file.path,"rb").read()).decode()}))
          c=AppleStoreClient(a.apple_account)
          v=c.request("GET","/appStoreVersions/bec48543-3f4a-47b5-9fb6-53701512abb2")["data"]
          print("APPLE_VERSION_STATE="+json.dumps(v["attributes"]))
          g=GooglePlayClient(a.google_account)
          e=g._open_edit(a.package_name)
          try:
              print("GOOGLE_TRACKS="+json.dumps(g._edit_request(e,"GET",f"/applications/{g._q(a.package_name)}/edits/{e.edit_id}/tracks")))
              print("GOOGLE_LISTING_DETAILS="+json.dumps(g._edit_request(e,"GET",f"/applications/{g._q(a.package_name)}/edits/{e.edit_id}/details")))
          finally:
              g._safe_delete_edit(e)
          
          PY

# Refresh verified paired Watch images after native capture success.
