name: A+ Solution iOS Build Only 2026-09-22

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aplus-solution-ios-build-only-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  APLUS_COMMIT: 'aeba3af74f426f27756a6b708ed25cf05bd8cfe9'

jobs:
  ios-build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    steps:
      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass jq >/dev/null

      - name: Verify exact A+ source commit
        shell: bash
        run: |
          set -euo pipefail
          HEAD="$(curl -fsSL https://api.github.com/repos/hsdarestani/aplussolution/branches/main | jq -r '.commit.sha')"
          test "$HEAD" = "$APLUS_COMMIT"
          echo "Building exact A+ Solution source: $APLUS_COMMIT"

      - name: Provision signing and queue iOS build only
        id: prepare
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py provision_ios_signing a-plus-solution --no-queue"

          OUT="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T -e APLUS_COMMIT='$APLUS_COMMIT' web python manage.py shell" <<'PY'
          import json, os
          from apps.integrations.apple_store import AppleStoreClient
          from apps.publisher.models import Build, Job, MobileApp, Release
          from apps.publisher.tasks import enqueue_job

          app = MobileApp.objects.get(slug='a-plus-solution')
          assert app.apple_account and app.apple_account.configured

          cfg = dict(app.build_config or {})
          cfg['ios_command'] = 'bash frontend/scripts/build-publisher-ios-opaque.sh'
          cfg['ios_artifact'] = 'frontend/ios/build/export/*.ipa'
          env = dict(cfg.get('env') or {})
          env['VITE_API_URL'] = 'https://app.aplus-solution.de/api'
          cfg['env'] = env
          app.build_config = cfg
          app.save(update_fields=['build_config','updated_at'])

          apple = AppleStoreClient(app.apple_account)
          apple_app = apple.find_app(app.bundle_id)
          apple_max = 0
          for item in apple.list_builds(apple_app['id'], limit=100):
              try:
                  apple_max = max(apple_max, int((item.get('attributes') or {}).get('version') or 0))
              except (TypeError, ValueError):
                  pass

          db_max = max(Release.objects.filter(app=app).values_list('build_number', flat=True), default=0)
          build_number = max(db_max, apple_max) + 1

          release = Release.objects.filter(
              app=app,
              source_commit=os.environ['APLUS_COMMIT'],
          ).order_by('-build_number').first()

          if release is None:
              previous = Release.objects.filter(app=app).order_by('-build_number').first()
              version_name = previous.version_name if previous else '1.0.0'
              release = Release.objects.create(
                  app=app,
                  version_name=version_name,
                  build_number=build_number,
                  status='building',
                  source_branch='main',
                  source_commit=os.environ['APLUS_COMMIT'],
                  ios_release_type='manual',
                  auto_submit=False,
                  release_notes='iOS WebView lifecycle stability fix and larger mobile header logo. Build only; no App Store submission.',
              )
          else:
              release.status = 'building'
              release.auto_submit = False
              release.ios_release_type = 'manual'
              release.save(update_fields=['status','auto_submit','ios_release_type','updated_at'])

          build, _ = Build.objects.get_or_create(release=release, platform='ios')
          active = Job.objects.filter(build=build, type='build_ios', status__in=['queued','running']).exists()
          if build.status == 'succeeded' and build.artifact:
              queued = None
          elif active:
              queued = 'already-active'
          else:
              build.status = 'queued'
              build.logs = ''
              build.finished_at = None
              build.external_build_id = ''
              build.metadata = {}
              if build.artifact:
                  build.artifact.delete(save=False)
              build.artifact = ''
              build.artifact_size = 0
              build.artifact_checksum = ''
              build.save()
              job = enqueue_job(
                  'build_ios',
                  app=app,
                  release=release,
                  build=build,
                  payload={'source':'ios-webview-restart-fix-build-only'},
                  agent=True,
                  platform='macos',
              )
              queued = str(job.id)

          print('META='+json.dumps({
              'release_id':str(release.id),
              'version':release.version_name,
              'build':release.build_number,
              'queued':queued,
          },separators=(',',':')))
          PY
          )"
          printf '%s\n' "$OUT"
          META="$(printf '%s\n' "$OUT" | sed -n 's/^META=//p' | tail -n 1)"
          test -n "$META"
          echo "release_id=$(printf '%s' "$META" | jq -r '.release_id')" >> "$GITHUB_OUTPUT"
          echo "version=$(printf '%s' "$META" | jq -r '.version')" >> "$GITHUB_OUTPUT"
          echo "build=$(printf '%s' "$META" | jq -r '.build')" >> "$GITHUB_OUTPUT"

      - name: Wake Cloud Mac
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'cloud-macos.yml',
              ref: 'main'
            });

      - name: Wait for signed IPA
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          RELEASE_ID: ${{ steps.prepare.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          for i in $(seq 1 180); do
            STATE="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
              "cd /opt/aplus-publisher && docker compose exec -T -e RELEASE_ID='$RELEASE_ID' web python manage.py shell" <<'PY'
          import os,re
          from apps.publisher.models import Job,Release
          r=Release.objects.get(id=os.environ['RELEASE_ID'])
          b=r.builds.get(platform='ios')
          j=Job.objects.filter(build=b,type='build_ios').order_by('-created_at').first()
          err=re.sub(r'\s+',' ',str(j.error or '')).replace('|','/')[:300] if j else ''
          print('|'.join([b.status,'artifact' if b.artifact else '',j.status if j else 'missing',err]))
          PY
            )"
            STATE="$(printf '%s\n' "$STATE" | tail -n 1 | tr -d '\r')"
            echo "iOS build state: $STATE"
            IFS='|' read -r BST ART JST ERR <<< "$STATE"
            if [ "$BST" = failed ] || [ "$JST" = failed ]; then echo "$ERR" >&2; exit 1; fi
            if [ "$BST" = succeeded ] && [ "$ART" = artifact ]; then exit 0; fi
            sleep 20
          done
          echo "Timed out waiting for signed IPA." >&2
          exit 1

      - name: Confirm build-only result
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          BUILD: ${{ steps.prepare.outputs.build }}
        run: |
          echo "Signed A+ Solution iOS IPA built successfully."
          echo "Version: $VERSION"
          echo "Build: $BUILD"
          echo "Source: $APLUS_COMMIT"
          echo "Store submission: NOT performed."
