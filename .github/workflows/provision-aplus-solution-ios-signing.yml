name: Provision A+ Solution iOS signing

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provision-aplus-solution-ios-signing.yml'

permissions:
  contents: read
  actions: write

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Wait for Publisher deploy and provision signing
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

          # Re-provision if needed and queue the failed build again. The app
          # build script now consumes Publisher's manual App Store profile.
          for i in $(seq 1 60); do
            if sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
              "cd /opt/aplus-publisher && docker compose exec -T web python manage.py help provision_ios_signing >/dev/null 2>&1"; then
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Publisher deploy did not expose provision_ios_signing in time." >&2
              exit 2
            fi
            sleep 5
          done

          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py provision_ios_signing a-plus-solution --app-version 1.0.0 --build-number 1"

      - name: Wake Cloud Mac
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'cloud-macos.yml',
              ref: 'main'
            });
