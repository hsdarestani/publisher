name: Probe A+ Solution 1.0.2 release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-aplus-solution-1-0-2.yml'

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - name: Probe and advance Publisher release
        id: probe
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          PORT="${SSH_PORT:-22}"
          OUTPUT="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py release_aplus_solution_push --app-version 1.0.2 --build-number 8 --source-commit 168716ecb75b984f30f00ce831d939327d913eb7 --publish")"
          printf '%s\n' "$OUTPUT"
          {
            echo 'output<<EOF'
            printf '%s\n' "$OUTPUT"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Update release status issue
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT: ${{ steps.probe.outputs.output }}
        run: |
          set -euo pipefail
          TITLE='A+ Solution 1.0.2 native push release'
          BODY_FILE="$(mktemp)"
          {
            echo 'Result: **progress probe**'
            echo
            echo '```text'
            printf '%s\n' "$OUTPUT"
            echo '```'
            echo
            echo "Probe run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$BODY_FILE"
          NUMBER="$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "$TITLE in:title" --json number,title --jq '.[] | select(.title == "A+ Solution 1.0.2 native push release") | .number' | head -n1)"
          if [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$BODY_FILE"
            gh issue reopen "$NUMBER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$BODY_FILE"
          fi
