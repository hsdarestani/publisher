name: Verify A+ Solution staging iOS upload

on:
  push:
    branches: [ops/aplussolution-staging]
    paths:
      - '.github/workflows/aplussolution-staging-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: ${{ secrets.HOST }}
      PASS: ${{ secrets.PASS }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
    steps:
      - name: Install SSH helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
      - name: Verify App Store Connect delivery state
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplus-publisher
          docker compose exec -T web python manage.py shell <<'PY'
          from apps.publisher.models import MobileApp, Release, Build, Job, Submission
          import json
          app = MobileApp.objects.get(slug='a-plus-solution-staging')
          release = Release.objects.get(app=app, version_name='1.0.0', build_number=1)
          build = Build.objects.get(release=release, platform='ios')
          job = Job.objects.get(pk=2565)
          submit_jobs = list(Job.objects.filter(release=release, type='submit_apple').values('id','status','error'))
          submission = Submission.objects.filter(release=release, platform='ios').first()
          print('STATE=' + json.dumps({
              'app_bundle': app.bundle_id,
              'release_status': release.status,
              'auto_submit': release.auto_submit,
              'build_status': build.status,
              'artifact_size': build.artifact_size,
              'external_build_id': build.external_build_id,
              'upload_job': {
                  'id': job.id,
                  'status': job.status,
                  'progress': job.progress,
                  'error': job.error[-1500:] if job.error else '',
                  'result': job.result,
                  'logs_tail': (job.logs or '')[-8000:],
              },
              'submit_apple_jobs': submit_jobs,
              'submission': ({
                  'state': submission.state,
                  'external_id': submission.external_id,
                  'last_error': submission.last_error,
              } if submission else None),
          }, default=str))
          PY
          REMOTE
