name: A+ Studio iOS Build 5 No Registration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/a-studio-ios-build5-no-registration.yml'

permissions:
  contents: read
  actions: write

env:
  ASTUDIO_COMMIT: 5945d390f61359864644841ec31a8f8f4bcc96fc
  APP_VERSION: '1.0.0'
  APP_BUILD: '5'

jobs:
  release-ios:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Install release tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null

      - name: Queue clean iOS Build 5
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T -e ASTUDIO_COMMIT='$ASTUDIO_COMMIT' web python manage.py shell" <<'PY'
          import os
          from django.utils import timezone
          from apps.publisher.models import Build, Job, MobileApp, Release, Submission

          commit = os.environ['ASTUDIO_COMMIT']
          app = MobileApp.objects.get(slug='a-studio')
          if not app.apple_account or not app.apple_account.configured:
              raise SystemExit('A+ Studio Apple account is not configured.')
          if not app.review_username or not app.get_review_password():
              raise SystemExit('A+ Studio App Review credentials are missing.')

          app.requires_login = True
          app.review_notes = (
              "Guideline 3.1.1 remediation for Build 5: business/organization account registration has been completely "
              "removed from the iOS app. The iOS binary contains no Create Account button, company registration form, "
              "or call to the mobile signup endpoint. The first screen now offers existing-account Sign In and a fully "
              "local Demo only. A pre-created review account is supplied in App Review Information. A+ Studio for iOS is "
              "a free project-companion app: it contains no purchases, subscriptions, credits, prices, feature unlocks, "
              "external payment links, or calls to action to purchase outside the app. Users can view project status, "
              "create project briefings, send change/support requests, and view existing distribution status read-only. "
              "The iOS app does not generate, download, install, preview, publish, or execute application code or other apps."
          )
          config = dict(app.build_config or {})
          config['ios_command'] = 'bash scripts/build-ios.sh'
          config['ios_artifact'] = 'artifacts/a-studio.ipa'
          app.build_config = config
          app.save(update_fields=['requires_login','review_notes','build_config','updated_at'])

          for loc in app.localizations.all():
              if loc.locale.lower().startswith('de'):
                  loc.release_notes = 'App-Review-Anpassung: Die Kontoregistrierung wurde aus der iOS-App entfernt. Anmeldung nur für bestehende Konten.'
              else:
                  loc.release_notes = 'App Review update: account registration was removed from the iOS app. Existing-account sign-in only.'
              loc.save(update_fields=['release_notes','updated_at'])

          release, _ = Release.objects.update_or_create(
              app=app,
              version_name='1.0.0',
              build_number=5,
              defaults={
                  'status':'building',
                  'source_branch':'main',
                  'source_commit':commit,
                  'android_track':'production',
                  'android_rollout':1,
                  'ios_release_type':'manual',
                  'auto_submit':False,
                  'release_notes':'Guideline 3.1.1 fix: iOS account registration removed; existing-account login only.',
              },
          )
          Job.objects.filter(
              release=release,
              type__in=['build_ios','upload_apple','submit_apple'],
              status__in=['queued','running'],
          ).update(status='cancelled', finished_at=timezone.now(), error='Superseded by clean Build 5 resubmission.')
          Submission.objects.filter(release=release, platform='ios').delete()

          build, _ = Build.objects.get_or_create(release=release, platform='ios')
          if build.artifact:
              build.artifact.delete(save=False)
          build.status='queued'
          build.agent=None
          build.commit_sha=''
          build.artifact=''
          build.artifact_size=0
          build.artifact_checksum=''
          build.logs=''
          build.started_at=None
          build.finished_at=None
          build.external_build_id=''
          build.metadata={}
          build.save()

          job = Job.objects.create(
              type='build_ios',
              app=app,
              release=release,
              build=build,
              payload={'source':'a-studio-ios-build5-no-registration'},
              available_to_agents=True,
              required_platform='macos',
          )
          print('source_commit='+commit)
          print('release_id='+str(release.pk))
          print('build_id='+str(build.pk))
          print('build_job_id='+str(job.pk))
          print('review_user='+app.review_username)
          PY

      - name: Wake Cloud Mac for Build 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cloud-macos.yml --repo "$GITHUB_REPOSITORY"

      - name: Wait for iOS Build 5
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          for i in $(seq 1 90); do
            DATA="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
              "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell -c \"from apps.publisher.models import Build,Job; b=Build.objects.get(release__app__slug='a-studio',release__version_name='1.0.0',release__build_number=5,platform='ios'); j=Job.objects.filter(build=b,type='build_ios').order_by('-created_at').first(); print(b.status+'|'+((j.error if j else '') or ''))\"" | tail -n1)"
            STATUS="${DATA%%|*}"
            ERROR="${DATA#*|}"
            echo "Build 5 status: $STATUS"
            if [ "$STATUS" = "succeeded" ]; then break; fi
            if [ "$STATUS" = "failed" ]; then
              echo "Build failed: $ERROR" >&2
              sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
                "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell -c \"from apps.publisher.models import Job; j=Job.objects.filter(release__app__slug='a-studio',release__build_number=5,type='build_ios').order_by('-created_at').first(); print(j.logs[-20000:] if j else '')\""
              exit 1
            fi
            if [ "$i" -eq 90 ]; then echo 'Timed out waiting for Build 5.' >&2; exit 1; fi
            sleep 30
          done

      - name: Queue App Store upload
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell" <<'PY'
          from apps.publisher.models import Build, Job
          b = Build.objects.get(release__app__slug='a-studio', release__version_name='1.0.0', release__build_number=5, platform='ios')
          if b.status != 'succeeded':
              raise SystemExit('Build 5 is not succeeded.')
          old = Job.objects.filter(build=b, type='upload_apple', status__in=['queued','running','succeeded']).order_by('-created_at').first()
          if old:
              print(f'apple_upload_job={old.pk}:{old.status}')
          else:
              job = Job.objects.create(
                  type='upload_apple', app=b.release.app, release=b.release, build=b,
                  payload={'source':'a-studio-ios-build5-no-registration'},
                  available_to_agents=True, required_platform='macos',
              )
              print(f'apple_upload_job={job.pk}:queued')
          PY

      - name: Wake Cloud Mac for App Store upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cloud-macos.yml --repo "$GITHUB_REPOSITORY"

      - name: Wait for App Store processing
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          for i in $(seq 1 100); do
            DATA="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
              "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell -c \"from apps.publisher.models import Build,Job; b=Build.objects.get(release__app__slug='a-studio',release__version_name='1.0.0',release__build_number=5,platform='ios'); j=Job.objects.filter(build=b,type='upload_apple').order_by('-created_at').first(); print((j.status if j else 'missing')+'|'+(b.external_build_id or '-'))\"" | tail -n1)"
            STATUS="${DATA%%|*}"
            EXT="${DATA#*|}"
            echo "App Store upload: $STATUS / $EXT"
            if [ "$STATUS" = "succeeded" ] && [ "$EXT" != "-" ]; then break; fi
            if [ "$STATUS" = "failed" ]; then
              sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
                "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell -c \"from apps.publisher.models import Job; j=Job.objects.filter(release__app__slug='a-studio',release__build_number=5,type='upload_apple').order_by('-created_at').first(); print(j.error if j else ''); print(j.logs[-20000:] if j else '')\""
              exit 1
            fi
            if [ "$i" -eq 100 ]; then echo 'Timed out waiting for App Store processing.' >&2; exit 1; fi
            sleep 30
          done

      - name: Attach Build 5 and resubmit rejected version
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell" <<'PY'
          import json, time
          from django.utils import timezone
          from apps.integrations.apple_store import AppleStoreClient
          from apps.publisher.models import Build, Submission
          from apps.publisher.review_contacts import apple_review_contact

          b = Build.objects.get(release__app__slug='a-studio', release__version_name='1.0.0', release__build_number=5, platform='ios')
          if b.status != 'succeeded' or not b.external_build_id:
              raise SystemExit(f'Build 5 not ready: {b.status} / {b.external_build_id!r}')
          release = b.release
          app = release.app
          client = AppleStoreClient(app.apple_account)
          record = client.find_app(app.bundle_id)
          version = client.ensure_version(record['id'], '1.0.0')
          version_id = str(version['id'])

          # Resolve the previous rejected review item before submitting the replacement build.
          target = None
          target_items = []
          target_state = None
          for state in ('UNRESOLVED_ISSUES','READY_FOR_REVIEW','WAITING_FOR_REVIEW','IN_REVIEW'):
              for sub in client.list_review_submissions(record['id'], state):
                  matches = []
                  for item in client.list_review_submission_items(sub['id']):
                      rel = item.get('relationships',{}).get('appStoreVersion',{}).get('data') or {}
                      if str(rel.get('id')) == version_id:
                          matches.append(item)
                  if matches:
                      target, target_items, target_state = sub, matches, state
                      break
              if target:
                  break

          if target_state == 'UNRESOLVED_ISSUES':
              for item in target_items:
                  if item.get('attributes',{}).get('state') == 'REJECTED':
                      body = {'data': {'type':'reviewSubmissionItems','id':item['id'],'attributes':{'resolved':True}}}
                      client.request('PATCH', f"/reviewSubmissionItems/{item['id']}", data=json.dumps(body))
              time.sleep(2)

          client.attach_build(version['id'], b.external_build_id)
          client.set_review_details(version['id'], app, contact=apple_review_contact(app) or None)
          for loc in app.localizations.all():
              client.set_localization(version['id'], loc)

          if target_state in {'UNRESOLVED_ISSUES','READY_FOR_REVIEW'} and target:
              body = {'data': {'type':'reviewSubmissions','id':target['id'],'attributes':{'submitted':True}}}
              final = client.request('PATCH', f"/reviewSubmissions/{target['id']}", data=json.dumps(body))['data']
              result = {'submission': final, 'reused': True}
          elif target_state in {'WAITING_FOR_REVIEW','IN_REVIEW'} and target:
              result = {'submission': target, 'reused': True, 'already_submitted': True}
          else:
              result = client.submit_version(record['id'], version['id'])

          submission = result['submission']
          Submission.objects.update_or_create(
              app=app, release=release, platform='ios',
              defaults={
                  'state':'in_review',
                  'external_id':submission['id'],
                  'submitted_at':timezone.now(),
                  'last_error':'',
                  'raw':{'submission':submission,'build5_no_registration':True},
              },
          )
          release.status='in_review'
          release.save(update_fields=['status','updated_at'])

          attached = client.request('GET', f"/appStoreVersions/{version['id']}/build").get('data') or {}
          if str(attached.get('id')) != str(b.external_build_id):
              raise SystemExit(f'App Store version is not attached to Build 5: {attached.get("id")} != {b.external_build_id}')
          detail = client.request('GET', f"/appStoreVersions/{version['id']}/appStoreReviewDetail").get('data') or {}
          attrs = detail.get('attributes',{})
          if not attrs.get('demoAccountRequired') or not attrs.get('demoAccountName'):
              raise SystemExit('App Review demo credentials were not saved.')
          print('build5_external_id='+str(b.external_build_id))
          print('review_demo_account='+str(attrs.get('demoAccountName')))
          print('submission_id='+str(submission['id']))
          print('submission_state='+str(submission.get('attributes',{}).get('state')))
          PY

      - name: Verify App Review state
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          for i in $(seq 1 30); do
            STATE="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
              "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell" <<'PY' | tail -n1
          import json
          from apps.integrations.apple_store import AppleStoreClient
          from apps.publisher.models import MobileApp
          app=MobileApp.objects.get(slug='a-studio')
          client=AppleStoreClient(app.apple_account)
          record=client.find_app(app.bundle_id)
          version=next(v for v in client.list_versions(record['id']) if v.get('attributes',{}).get('versionString')=='1.0.0')
          matches=[]
          for state in ('WAITING_FOR_REVIEW','IN_REVIEW','READY_FOR_REVIEW','UNRESOLVED_ISSUES'):
              for sub in client.list_review_submissions(record['id'],state):
                  for item in client.list_review_submission_items(sub['id']):
                      rel=item.get('relationships',{}).get('appStoreVersion',{}).get('data') or {}
                      if str(rel.get('id'))==str(version['id']):
                          matches.append({'state':state,'submission':sub['id'],'item_state':item.get('attributes',{}).get('state')})
          print(json.dumps(matches,sort_keys=True))
          PY
          )"
            echo "App Review state: $STATE"
            if python3 - "$STATE" <<'PY'
          import json, sys
          rows=json.loads(sys.argv[1])
          raise SystemExit(0 if any(r.get('state') in {'WAITING_FOR_REVIEW','IN_REVIEW'} for r in rows) else 1)
          PY
            then
              echo 'A+ Studio Build 5 is active in App Review.'
              exit 0
            fi
            sleep 10
          done
          echo 'Build 5 was uploaded but review did not reach WAITING_FOR_REVIEW/IN_REVIEW.' >&2
          exit 1
