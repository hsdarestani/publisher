name: Enable A+ Solution staging iOS push

on:
  push:
    branches: [ops/aplussolution-staging]
    paths:
      - '.github/workflows/aplussolution-staging-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enable-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: ${{ secrets.HOST }}
      PASS: ${{ secrets.PASS }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
    steps:
      - name: Install SSH helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
      - name: Enable Apple push and regenerate staging profile
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplus-publisher
          docker compose exec -T web python manage.py shell <<'PY'
          import base64
          import json
          import plistlib
          import subprocess
          import tempfile
          from pathlib import Path

          from apps.integrations.apple_store import AppleStoreClient, IntegrationError
          from apps.publisher.models import MobileApp
          from apps.signing.models import IOSProvisioningProfile
          from apps.signing.services import ensure_ios_app_store_profile

          app = MobileApp.objects.get(slug='a-plus-solution-staging')
          assert app.bundle_id == 'de.aplussolution.staging', app.bundle_id
          assert app.apple_account_id, 'Staging app has no Apple account.'

          client = AppleStoreClient(app.apple_account)
          bundle_data = client.request('GET', f'/bundleIds?filter[identifier]={app.bundle_id}&limit=10').get('data', [])
          bundle = next((item for item in bundle_data if item.get('attributes', {}).get('identifier') == app.bundle_id), None)
          if not bundle:
              raise RuntimeError(f'Apple Bundle ID not found: {app.bundle_id}')

          capabilities = client.request('GET', f"/bundleIds/{bundle['id']}/bundleIdCapabilities?limit=50").get('data', [])
          push = next((item for item in capabilities if item.get('attributes', {}).get('capabilityType') == 'PUSH_NOTIFICATIONS'), None)
          if not push:
              body = {
                  'data': {
                      'type': 'bundleIdCapabilities',
                      'attributes': {'capabilityType': 'PUSH_NOTIFICATIONS'},
                      'relationships': {
                          'bundleId': {'data': {'type': 'bundleIds', 'id': bundle['id']}}
                      },
                  }
              }
              push = client.request('POST', '/bundleIdCapabilities', data=json.dumps(body)).get('data')

          old = IOSProvisioningProfile.objects.filter(app=app).first()
          if old:
              if old.apple_profile_id:
                  try:
                      client.request('DELETE', f'/profiles/{old.apple_profile_id}')
                  except IntegrationError as exc:
                      if '404' not in str(exc):
                          raise
              old.delete()

          profile = ensure_ios_app_store_profile(app)
          creds = profile.get_credentials()
          profile_b64 = creds.get('profile_content_base64', '')
          if not profile_b64:
              raise RuntimeError('Regenerated profile has no profile content.')

          with tempfile.TemporaryDirectory(prefix='aplus-profile-check-') as tmp:
              der = Path(tmp) / 'profile.mobileprovision'
              der.write_bytes(base64.b64decode(profile_b64))
              decoded = subprocess.run(
                  ['openssl', 'smime', '-inform', 'der', '-verify', '-noverify', '-in', str(der)],
                  check=True,
                  capture_output=True,
              ).stdout
              plist = plistlib.loads(decoded)
          entitlements = plist.get('Entitlements', {})
          aps = entitlements.get('aps-environment')
          if aps != 'production':
              raise RuntimeError(f'Push-enabled profile missing production aps-environment: {aps!r}')

          print('IOS_PUSH_READY=' + json.dumps({
              'bundle_id': app.bundle_id,
              'push_capability_id': push.get('id') if push else None,
              'profile_id': profile.apple_profile_id,
              'profile_uuid': profile.profile_uuid,
              'profile_name': profile.profile_name,
              'aps_environment': aps,
              'expires_at': profile.expires_at,
          }, default=str))
          PY
          REMOTE
