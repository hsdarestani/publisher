name: Submit verified BE DIFFERENT iOS build 9 for review
on:
  push:
    branches: [main]
    paths: ['.github/workflows/be-different-1-1-submit.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: be-different-1-1-submit
  cancel-in-progress: false
jobs:
  submit:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    steps:
      - name: Advance and inspect exact release
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" 'cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell' <<'PY'
          import json
          from django.utils import timezone
          from apps.publisher.models import Release,Submission,Job
          from apps.publisher.tasks import handle_submit_apple
          from apps.integrations.apple_store import AppleStoreClient
          r=Release.objects.get(pk=131,app__slug="be-different",build_number=9)
          a=r.app
          c=AppleStoreClient(a.apple_account)
          vid="bec48543-3f4a-47b5-9fb6-53701512abb2"
          v=c.request("GET","/appStoreVersions/"+vid)["data"]
          if v["attributes"]["appStoreState"] not in ("WAITING_FOR_REVIEW","IN_REVIEW","PENDING_DEVELOPER_RELEASE","READY_FOR_SALE"):
              for locale in ("de-DE","en-US"):
                  assert a.assets.filter(kind="screenshot",platform="ios",locale=locale,device_type="APP_IPHONE_65").count()==3
              j=Job.objects.get(pk=3696,release=r)
              result=handle_submit_apple(j)
              print("APPLE_REVIEW_SUBMISSION_STATE="+result["submission"]["attributes"]["state"])
              j.status="succeeded";j.result=result;j.error="";j.finished_at=timezone.now()
              j.save(update_fields=["status","result","error","finished_at","updated_at"])
          v=c.request("GET","/appStoreVersions/"+vid)["data"]
          print("APPLE_ACTUAL_VERSION_STATE="+v["attributes"]["appStoreState"])
          print("BUILD9_SUBMISSIONS="+json.dumps(list(Submission.objects.filter(release=r).values("platform","state","external_id"))))
          PY
