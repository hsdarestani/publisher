name: Kick A+Bau 2.2.2 build 22008

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/a-bau-22008-kick.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical A+Bau release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run a-bau-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            -f app_version=2.2.2 \
            -f build_number=22008
          echo "Dispatched A+Bau 2.2.2 build 22008 through canonical Publisher release."
