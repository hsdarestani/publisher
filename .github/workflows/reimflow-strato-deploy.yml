name: Deploy Reimflow on STRATO (isolated)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reimflow-strato-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reimflow-strato
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Checkout current Reimflow
        uses: actions/checkout@v4
        with:
          repository: hsdarestani/Reimflow
          ref: main
          path: reimflow-src
      - name: Validate and package unchanged modules
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile reimflow-src/rhyme_jobs.py reimflow-src/api.py reimflow-src/platform_api.py reimflow-src/role_admin.py reimflow-src/rap-flow-analysis.py reimflow-src/rhyme-quality.py reimflow-src/rhyme-intent.py
          cd reimflow-src
          python3 -m unittest discover -s tests -p "test_platform_api.py"
          python3 -m unittest discover -s tests -p "test_rap_flow.py"
          python3 -m unittest discover -s tests -p "test_rhyme_api.py"
          python3 -m unittest discover -s tests -p "test_rhyme_async_http.py"
          python3 -m unittest discover -s tests -p "test_rhyme_timeout_fallback.py"
          python3 -m unittest discover -s tests -p "test_rhyme_quality.py"
          python3 -m unittest discover -s tests -p "test_german_only.py"
          grep -q 'max_output_tokens":8500' api.py
          python3 -m unittest discover -s tests -p "test_rhyme_intent.py"
          cd ..
          cd reimflow-src
          tar -czf "$RUNNER_TEMP/reimflow-strato.tar.gz" index.html app.js platform.js rhyme-fallback.js rhyme-previews.js api.py rhyme_jobs.py platform_api.py role_admin.py rhyme-quality.py rhyme-intent.py styles.css themes.css platform.css ux-simple.css ai-engine.css sonic-atelier.css comic-flow.css comic-variants.css theme-engine.js sonic-atelier.js flow-scoring.js flow-challenge.js flow-challenge.css rap-audio.js rap-flow.js rap-flow.css rap-flow-analysis.py
      - name: Provision isolated containers and Caddy route
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.HOST }}
          DEPLOY_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          EXPECTED_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REIMFLOW_SMTP_HOST: ${{ secrets.REIMFLOW_SMTP_HOST }}
          REIMFLOW_SMTP_PORT: ${{ secrets.REIMFLOW_SMTP_PORT }}
          REIMFLOW_SMTP_USER: ${{ secrets.REIMFLOW_SMTP_USER }}
          REIMFLOW_SMTP_PASSWORD: ${{ secrets.REIMFLOW_SMTP_PASSWORD }}
          REIMFLOW_SMTP_FROM: ${{ secrets.REIMFLOW_SMTP_FROM }}
        run: |
          set -euo pipefail
          test "$DEPLOY_HOST" = "82.165.187.14" || { echo "::error::Publisher HOST must point to the new STRATO 82.165.187.14"; exit 1; }
          test -n "$DEPLOY_KEY" || { echo "::error::Missing production SSH_PRIVATE_KEY in Publisher"; exit 1; }
          PORT="$DEPLOY_PORT"
          if [ -z "$PORT" ]; then PORT=22; fi
          umask 077
          KEY="$RUNNER_TEMP/reimflow-deploy-key"
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$KEY"
          chmod 600 "$KEY"
          if [ -n "$DEPLOY_KEY_PASSPHRASE" ]; then
            eval "$(ssh-agent -s)" > /dev/null
            ASKPASS="$RUNNER_TEMP/reimflow-askpass"
            printf '%s\n' '#!/bin/sh' 'printf "%s" "$DEPLOY_KEY_PASSPHRASE"' > "$ASKPASS"
            chmod 700 "$ASKPASS"
            DISPLAY=:0 SSH_ASKPASS="$ASKPASS" SSH_ASKPASS_REQUIRE=force setsid ssh-add "$KEY" < /dev/null
          fi
          mkdir -p "$HOME/.ssh"
          ssh-keyscan -T 10 -p "$PORT" -H "$DEPLOY_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          test -s "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          if [ -n "$EXPECTED_FINGERPRINT" ]; then
            ssh-keygen -lf "$HOME/.ssh/known_hosts" | grep -F -- "$EXPECTED_FINGERPRINT" >/dev/null
          fi
          ENVFILE="$RUNNER_TEMP/reimflow-strato.env"
          printf 'OPENAI_MODEL=gpt-5.6-sol\nRHYME_REVIEW_MODEL=gpt-5.6-terra\nREIMFLOW_RHYME_EFFORT=low\n' > "$ENVFILE"
          if [ -n "$OPENAI_API_KEY" ]; then
            printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY" >> "$ENVFILE"
          fi
          # SMTP stays optional until the operator configures dedicated secrets.
          if [ -n "$REIMFLOW_SMTP_HOST" ]; then
            printf "REIMFLOW_SMTP_HOST=%s\\n" "$REIMFLOW_SMTP_HOST" >> "$ENVFILE"
            printf "REIMFLOW_SMTP_PORT=%s\\n" "${REIMFLOW_SMTP_PORT:-587}" >> "$ENVFILE"
            printf "REIMFLOW_SMTP_USER=%s\\n" "$REIMFLOW_SMTP_USER" >> "$ENVFILE"
            printf "REIMFLOW_SMTP_PASSWORD=%s\\n" "$REIMFLOW_SMTP_PASSWORD" >> "$ENVFILE"
            printf "REIMFLOW_SMTP_FROM=%s\\n" "$REIMFLOW_SMTP_FROM" >> "$ENVFILE"
          fi
          chmod 600 "$ENVFILE"
          scp -i "$KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -P "$PORT" "$RUNNER_TEMP/reimflow-strato.tar.gz" "$ENVFILE" root@"$DEPLOY_HOST":/tmp/
          ssh -i "$KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$PORT" root@"$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          test -f /opt/aplus-publisher/docker-compose.yml
          test -f /opt/aplus-publisher/Caddyfile
          command -v docker
          docker compose version
          CADDY_ID="$(cd /opt/aplus-publisher && docker compose ps -q caddy)"
          test -n "$CADDY_ID"
          docker inspect "$CADDY_ID" --format '{{range $name, $network := .NetworkSettings.Networks}}{{println $name}}{{end}}' | head -n 1 > /tmp/reimflow-publisher-network
          PUBLISHER_NETWORK="$(cat /tmp/reimflow-publisher-network)"
          test -n "$PUBLISHER_NETWORK"
          mkdir -p /opt/reimflow/site /opt/reimflow/data
          chmod 755 /opt/reimflow/site
          chown 10001:10001 /opt/reimflow/data
          # Keep previous source snapshot for immediate manual rollback without touching DB/media.
          if [ -f /opt/reimflow/api.py ]; then
            mkdir -p /opt/reimflow/source-backups
            BACKUP="/opt/reimflow/source-backups/before-$(date -u +%Y%m%dT%H%M%SZ).tar.gz"
            tar -czf "$BACKUP" -C /opt/reimflow site api.py 2>/dev/null || true
          fi
          rm -f /opt/reimflow/site/*.js /opt/reimflow/site/*.css /opt/reimflow/site/*.html
          tar -xzf /tmp/reimflow-strato.tar.gz -C /opt/reimflow/site
          mv /opt/reimflow/site/api.py /opt/reimflow/api.py
          mv /opt/reimflow/site/rhyme_jobs.py /opt/reimflow/rhyme_jobs.py
          mv /opt/reimflow/site/platform_api.py /opt/reimflow/platform_api.py
          mv /opt/reimflow/site/role_admin.py /opt/reimflow/role_admin.py
          mv /opt/reimflow/site/rap-flow-analysis.py /opt/reimflow/rap-flow-analysis.py
          mv /opt/reimflow/site/rhyme-quality.py /opt/reimflow/rhyme-quality.py
          mv /opt/reimflow/site/rhyme-intent.py /opt/reimflow/rhyme-intent.py
          chmod 644 /opt/reimflow/platform_api.py /opt/reimflow/rhyme_jobs.py /opt/reimflow/role_admin.py
          chmod 644 /opt/reimflow/api.py /opt/reimflow/rap-flow-analysis.py /opt/reimflow/rhyme-quality.py /opt/reimflow/rhyme-intent.py
          cp /tmp/reimflow-strato.env /opt/reimflow/.env
          chmod 600 /opt/reimflow/.env
          printf 'PUBLISHER_NETWORK=%s\n' "$PUBLISHER_NETWORK" >> /opt/reimflow/.env
          cat > /opt/reimflow/nginx.conf <<'NGINX'
          server {
              listen 80;
              server_name _;
              root /usr/share/nginx/html;
              index index.html;
              client_max_body_size 14m;  # Allow licensed audio uploads up to 12 MiB
              location = /api/flow/analyze {
                  proxy_pass http://127.0.0.1:8787;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $http_x_forwarded_for;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_connect_timeout 5s;
                  proxy_read_timeout 95s;
                  proxy_send_timeout 40s;
                  client_max_body_size 5m;
                  client_body_timeout 35s;
              }
              location = /api/rhymes {
                  proxy_pass http://127.0.0.1:8787;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $http_x_forwarded_for;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_connect_timeout 5s;
                  proxy_read_timeout 150s;
                  proxy_send_timeout 150s;
                  client_max_body_size 64k;
              }
              location /api/ {
                  proxy_pass http://127.0.0.1:8787;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $http_x_forwarded_for;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_connect_timeout 5s;
                  proxy_read_timeout 60s;
                  client_max_body_size 14m;
              }
              location / {
                  add_header Cache-Control "no-cache" always;
                  try_files $uri $uri/ /index.html;
              }
          }
          NGINX
          cat > /opt/reimflow/docker-compose.yml <<'COMPOSE'
          name: reimflow
          services:
            web:
              image: nginx:alpine
              restart: unless-stopped
              read_only: true
              tmpfs:
                - /var/cache/nginx
                - /var/run
                - /tmp
              volumes:
                - ./site:/usr/share/nginx/html:ro
                - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
              networks:
                default: {}
                publisher:
                  aliases:
                    - reimflow-web
              mem_limit: 96m
              cpus: 0.4
              security_opt:
                - no-new-privileges:true
            api:
              image: python:3.12-alpine
              restart: unless-stopped
              user: "10001:10001"
              network_mode: service:web
              depends_on:
                - web
              working_dir: /app
              command: ["python", "-u", "/app/api.py"]
              env_file: .env
              environment:
                REIMFLOW_DB: /var/lib/reimflow/reimflow.sqlite3
              volumes:
                - ./api.py:/app/api.py:ro
                - ./rhyme_jobs.py:/app/rhyme_jobs.py:ro
                - ./platform_api.py:/app/platform_api.py:ro
                - ./role_admin.py:/app/role_admin.py:ro
                - ./rap-flow-analysis.py:/app/rap-flow-analysis.py:ro
                - ./rhyme-quality.py:/app/rhyme-quality.py:ro
                - ./rhyme-intent.py:/app/rhyme-intent.py:ro
                - ./data:/var/lib/reimflow
              read_only: true
              tmpfs:
                - /tmp
              mem_limit: 256m
              cpus: 0.6
              security_opt:
                - no-new-privileges:true
          networks:
            default: {}
            publisher:
              external: true
              name: ${PUBLISHER_NETWORK}
          COMPOSE
          cd /opt/reimflow
          docker compose config --quiet
          docker compose up -d --pull always --remove-orphans
          # api.py uses bind mounts and replacement inodes: recreate just API to
          # guarantee current code and model settings are running.
          docker compose up -d --no-deps --force-recreate api
          echo "Reimflow rhyme API restarted with updated configuration."
          # Mount content is updated without guaranteeing container recreation;
          # always load the new nginx location/body-size configuration safely.
          docker compose exec -T web nginx -t </dev/null
          docker compose exec -T web nginx -s reload </dev/null
          echo "NGINX audio upload configuration reloaded (5 MiB)."
          for i in $(seq 1 20); do
            if docker compose exec -T api python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8787/api/health',timeout=3).read().decode())" </dev/null; then
              break
            fi
            if [ "$i" -eq 20 ]; then docker compose logs --tail=50 api web; exit 1; fi
            sleep 2
          done
          if ! grep -qF 'reimflow.smarbiz.sbs {' /opt/aplus-publisher/Caddyfile; then
            cat >> /opt/aplus-publisher/Caddyfile <<'CADDY'
          
          # Isolated Reimflow test application; no publisher paths or ports changed.
          reimflow.smarbiz.sbs {
            encode zstd gzip
            reverse_proxy reimflow-web:80
            header X-Content-Type-Options nosniff
          }
          CADDY
          fi
          # Prevent future shared TLS regressions when Publisher has replaced
          # the Caddyfile inode. Restore PWYW alongside Publisher and Reimflow.
          if ! grep -qF 'pwyw.smarbiz.sbs {' /opt/aplus-publisher/Caddyfile; then
            cat >> /opt/aplus-publisher/Caddyfile <<'PWYW_CADDY'
          
          # PWYW game lounge, isolated on the Publisher Docker network.
          pwyw.smarbiz.sbs {
            encode zstd gzip
            reverse_proxy pwyw-web:8080
            header X-Content-Type-Options nosniff
          }
          PWYW_CADDY
          fi
          cd /opt/aplus-publisher
          grep -qF 'publisher.smarbiz.sbs' Caddyfile
          grep -qF 'reimflow.smarbiz.sbs {' Caddyfile
          grep -qF 'pwyw.smarbiz.sbs {' Caddyfile
          CADDY_ID="$(docker compose ps -q caddy)"
          test -n "$CADDY_ID"
          # Docker bind mount can still reference an obsolete file inode.
          # Validate and hot-reload a fresh staged COPY of the complete host
          # file; never restart/recreate Caddy or its neighboring applications.
          docker cp Caddyfile "$CADDY_ID":/tmp/Caddyfile-all-three-sites
          docker exec "$CADDY_ID" caddy validate --config /tmp/Caddyfile-all-three-sites
          docker exec "$CADDY_ID" caddy reload --config /tmp/Caddyfile-all-three-sites
          docker exec "$CADDY_ID" rm -f /tmp/Caddyfile-all-three-sites
          docker exec "$CADDY_ID" wget -qO- http://pwyw-web:8080/api/health | grep -q '"ok":true'
          INTERNAL_SITE="$(docker exec "$CADDY_ID" wget -qO- http://reimflow-web/)"
          [[ "$INTERNAL_SITE" == *"Reimflow"* ]]
          rm -f /tmp/reimflow-strato.tar.gz /tmp/reimflow-strato.env /tmp/reimflow-publisher-network
          echo "Reimflow containers healthy and Publisher Caddy reloaded."
          REMOTE
      - name: Require independently reviewed German-only rhyme candidates for real searches
        shell: bash
        run: |
          set -euo pipefail
          for QUERY in "Blue Ferrari" "Blue Talisman" "Blue paper" "Jude Bellingham" "Abendhimmel"; do
            PAYLOAD="$(python3 -c 'import json,sys;print(json.dumps({"query":sys.argv[1],"category":"Alle","syllables":"Alle"}))' "$QUERY")"
            STATUS="$(curl -sS --max-time 145 -o "$RUNNER_TEMP/quality-response" -w '%{http_code}' \
              -H 'Content-Type: application/json' -H 'Accept: application/json' \
              -d "$PAYLOAD" https://reimflow.smarbiz.sbs/api/rhymes || true)"
            if [[ "$STATUS" == "202" ]]; then
              JOB_ID="$(python3 - "$RUNNER_TEMP/quality-response" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf8"))
          assert data.get("pending") is True and data.get("job_id")
          print(data["job_id"])
          PY
              )"
              for POLL in $(seq 1 100); do
                sleep 2
                STATUS="$(curl -sS --max-time 12 -o "$RUNNER_TEMP/quality-response" -w '%{http_code}' \
                  -H 'Accept: application/json' "https://reimflow.smarbiz.sbs/api/rhymes/jobs/$JOB_ID" || true)"
                if [[ "$STATUS" != "202" ]]; then break; fi
              done
            fi
            echo "Rhyme quality live HTTP for $QUERY: $STATUS"
            if [[ "$STATUS" != "200" ]]; then
              echo "::error::High quality AI rhyme endpoint failed for $QUERY (HTTP $STATUS)."
              exit 1
            fi
            python3 - "$RUNNER_TEMP/quality-response" "$QUERY" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding="utf8") as f: data=json.load(f)
          query=sys.argv[2]
          items=data.get("rhymes") or []
          print("Review:",query,"candidates approved:",len(items),
                "timing_ms:",data.get("timing_ms"),
                "generator:",data.get("model"),"reviewer:",data.get("review_model"),
                "accepted words:",", ".join(str(x.get("word")) for x in items))
          assert data.get("ok") is True and data.get("quality_reviewed") is True
          assert data.get("review_model"),"Second model must judge every result"
          assert all(x.get("strength") in ("stark","brauchbar") for x in items)
          assert all(x.get("score")==0 and x.get("confidence")==0 for x in items)
          assert all(x.get("german_valid") is True for x in items),"Non-German or unverified rhyme passed the language gate"
          if query=="Abendhimmel":
              times=data.get("timing_ms") or {}
              assert all(isinstance(times.get(stage),int) and times[stage]>=0
                         for stage in ("generation","review")),"Missing cold AI latency measurements"
              print("COLD GERMAN RHYME GENERATION ms:",times["generation"],
                    "INDEPENDENT REVIEW ms:",times["review"],
                    "TOTAL ms:",times["generation"]+times["review"])
          assert all(x.get("register")!="Englisch/Code-Switch" for x in items),"English code-switch escaped into German-only suggestions"
          # Foreign input is allowed, but German-only mode may have zero legitimate rhymes.
          # Never force English suggestions to satisfy a result-count assertion.
          if query=="Blue Ferrari":
              rejected={"toyota","karaoke","marinade","batterie","fabriki"}
              assert not rejected.intersection(str(x.get("word","")).casefold() for x in items),"Phonetically weak Ferrari matches passed"
          PY
          done
      - name: Diagnose isolated Reimflow API after failed live quality check
        if: failure()
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.HOST }}
          DEPLOY_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/reimflow-deploy-key"
          if [ ! -s "$KEY" ] || [ -z "$DEPLOY_HOST" ]; then
            echo "Deployment SSH unavailable for API log diagnosis."
            exit 0
          fi
          PORT="${DEPLOY_PORT:-22}"
          if [ -n "$DEPLOY_KEY_PASSPHRASE" ]; then
            eval "$(ssh-agent -s)" >/dev/null
            DISPLAY=:0 SSH_ASKPASS="$RUNNER_TEMP/reimflow-askpass" SSH_ASKPASS_REQUIRE=force setsid ssh-add "$KEY" </dev/null
          fi
          ssh -i "$KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$PORT" root@"$DEPLOY_HOST"             'cd /opt/reimflow && docker compose logs --since=12m --tail=140 api 2>&1 | grep -E "rhyme upstream:|rhyme request failed:|rhyme quality gate:|Reimflow API listening" || true'
      - name: Verify public domain and AI health
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 15); do
            SITE="$(curl -fsSL --max-time 12 https://reimflow.smarbiz.sbs/ || true)"
            HEALTH="$(curl -fsSL --max-time 12 https://reimflow.smarbiz.sbs/api/health || true)"
            if [[ "$SITE" == *"Reimflow"* ]] && [[ "$HEALTH" == *'"ok": true'* ]]; then
              PLATFORM="$(curl -fsSL --max-time 12 https://reimflow.smarbiz.sbs/api/platform/bootstrap || true)"
              if [[ "$PLATFORM" != *'"ok": true'* ]]; then
                echo "::error::Reimflow platform API unavailable after deployment."
                exit 1
              fi
              echo "Reimflow community API: OK"
              PLATFORM_JS="$(curl -fsSL --max-time 12 https://reimflow.smarbiz.sbs/platform.js?v=20261015-real1)"
              if [[ "$SITE" != *'platform.js?v=20261015-real1'* ]] || [[ "$PLATFORM_JS" != *'ReimflowPlatform'* ]]; then
                echo "::error::Real community client missing after deploy."
                exit 1
              fi
              if [[ "$SITE" != *"app.js?v=20261019-fast1"* ]]; then
                echo "::error::German-only rhyme client is missing from the deployed site."
                exit 1
              fi
              echo "Reimflow site: OK (German-only client verified)"
              echo "API status: $HEALTH"
              # Verify the source deployed with the themed dark search skeleton.
              LOADING_CSS="$(curl -fsSL --max-time 12 'https://reimflow.smarbiz.sbs/sonic-atelier.css?v=20261014-de1')"
              if [[ "$LOADING_CSS" != *'saSkeletonShimmer'* ]] || [[ "$SITE" != *'20261014-de1'* ]]; then
                echo "::error::Reimflow site is up but dark skeleton stylesheet is stale."
                exit 1
              fi
              echo "Dark skeleton CSS: verified"
              # Comic Flow CSS is a separate theme layer and must be shipped with the source.
              COMIC_CSS="$(curl -fsSL --max-time 12 'https://reimflow.smarbiz.sbs/comic-flow.css?v=20261014-de1')"
              if [[ "$COMIC_CSS" != *'REIMFLOW / COMIC FLOW'* ]] || [[ "$SITE" != *'20261014-de1'* ]]; then
                echo "::error::Comic Flow stylesheet was not deployed or the page still references an old version."
                exit 1
              fi
              echo "Comic Flow CSS: verified"
              VARIANTS_CSS="$(curl -fsSL --max-time 12 'https://reimflow.smarbiz.sbs/comic-variants.css?v=20261014-de1')"
              if [[ "$VARIANTS_CSS" != *'FOUR COMIC EDITIONS'* ]] || [[ "$VARIANTS_CSS" != *'data-comic-style="graffiti"'* ]] || [[ "$VARIANTS_CSS" != *'data-comic-style="novel"'* ]] || [[ "$VARIANTS_CSS" != *'data-comic-style="clean"'* ]]; then
                echo "::error::One or more comic variants are missing from deployed CSS."
                exit 1
              fi
              if [[ "$SITE" != *'comic-variants.css?v=20261014-de1'* ]] || [[ "$SITE" != *'data-theme-option="comic-clean"'* ]]; then
                echo "::error::Deployed HTML is missing the four-edition theme switcher."
                exit 1
              fi
              echo "Four comic editions and switcher: verified"
              # Validate the new self-contained rhythm challenge assets after publishing.
              FLOW_JS="$(curl -fsSL --max-time 12 'https://reimflow.smarbiz.sbs/flow-challenge.js?v=20261014-de1')"
              FLOW_SCORE="$(curl -fsSL --max-time 12 'https://reimflow.smarbiz.sbs/flow-scoring.js?v=20261014-de1')"
              FLOW_CSS="$(curl -fsSL --max-time 12 'https://reimflow.smarbiz.sbs/flow-challenge.css?v=20261014-flow1')"
              if [[ "$SITE" != *'data-page="flow"'* ]] || [[ "$SITE" != *'flow-challenge.js?v=20261014-de1'* ]] || [[ "$FLOW_JS" != *'REIMFLOW'* && "$FLOW_JS" != *'Reimflow Arcade'* ]]; then
                echo "::error::Flow Challenge game page or runtime is missing."
                exit 1
              fi
              if [[ "$FLOW_SCORE" != *'ReimflowTiming'* ]] || [[ "$FLOW_CSS" != *'FLOW CHALLENGE ARCADE'* ]]; then
                echo "::error::Flow Challenge assets did not reach STRATO."
                exit 1
              fi
              echo "Flow Challenge: game, scoring and responsive CSS verified"
              # Regression guard: navigation must iterate across all page sections.
              APP_JS="$(curl -fsSL --max-time 12 'https://reimflow.smarbiz.sbs/app.js?v=20261019-fast1')"
              if [[ "$SITE" != *'app.js?v=20261019-fast1'* ]] || ! grep -Fq '$(".page").forEach' <<< "$APP_JS" || [[ "$APP_JS" != *"/api/rhymes/jobs/"* ]]; then
                echo "::error::Navigation repair is not deployed (incorrect querySelector/forEach)."
                exit 1
              fi
              echo "Navigation repair: live JavaScript verified"
              # Full German gameplay localization; no stale English state screens.
