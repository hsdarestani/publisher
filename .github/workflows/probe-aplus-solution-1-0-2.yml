name: Finalize A+ Solution iOS 1.0.2 review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-aplus-solution-1-0-2.yml'

permissions:
  contents: read
  issues: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Restart Publisher and submit corrected build
        id: finalize
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          PORT="${SSH_PORT:-22}"
          SCRIPT_B64="$(base64 -w0 <<'PY'
          from django.utils import timezone
          from apps.integrations.apple_store import AppleStoreClient
          from apps.publisher.models import MobileApp, Release, Job
          from apps.publisher.tasks import run_job

          app = MobileApp.objects.get(slug='a-plus-solution')
          release = Release.objects.get(app=app, version_name='1.0.2', build_number=8)
          build = release.builds.get(platform='ios')
          client = AppleStoreClient(app.apple_account)
          app_id = client.find_app(app.bundle_id)['id']

          versions = client.list_versions(app_id)
          exact = next((v for v in versions if v.get('attributes', {}).get('versionString') == '1.0.2'), None)
          old = next((v for v in versions if v.get('attributes', {}).get('versionString') == '1.0.1'), None)
          if not exact and old:
              for submission in client.list_review_submissions(app_id, 'WAITING_FOR_REVIEW'):
                  item, _ = client._review_submission_matches(submission, old['id'])
                  if item:
                      client.cancel_review_submission(submission['id'])
                      print(f'cancelled_submission={submission["id"]}')
              exact = client.ensure_version(app_id, '1.0.2')
          elif not exact:
              exact = client.ensure_version(app_id, '1.0.2')

          attrs = exact.get('attributes', {})
          print(f'version_id={exact["id"]}')
          print(f'version_string={attrs.get("versionString")}')
          print(f'version_state={attrs.get("appStoreState") or attrs.get("appVersionState")}')

          apple_builds = client.list_builds(app_id, build_number=str(release.build_number), limit=50)
          valid = [b for b in apple_builds if b.get('attributes', {}).get('processingState') == 'VALID']
          if not valid:
              raise RuntimeError('No VALID App Store build found for build number 8.')
          apple_build = valid[0]
          print(f'app_store_build_id={apple_build["id"]}')
          print(f'publisher_external_id_before={build.external_build_id}')
          build.external_build_id = apple_build['id']
          build.save(update_fields=['external_build_id', 'updated_at'])
          print(f'publisher_external_id_after={build.external_build_id}')

          Job.objects.filter(
              app=app, release=release, type='submit_apple', status__in=['queued', 'running']
          ).update(
              status='cancelled', finished_at=timezone.now(),
              error='Superseded by corrected App Store build-ID submission.'
          )
          job = Job.objects.create(
              type='submit_apple', app=app, release=release, build=build,
              payload={'source': 'final-ios-1.0.2'}, available_to_agents=False,
          )
          run_job.apply(args=[job.pk]).get()
          job.refresh_from_db()
          print(f'submit_job={job.pk}')
          print(f'submit_status={job.status}')
          if job.error:
              print(f'submit_error={job.error}')
          if job.status != 'succeeded':
              raise RuntimeError(job.error or f'submit_apple ended as {job.status}')

          submission = release.submissions.filter(platform='ios').order_by('-updated_at').first()
          print(f'submission_state={submission.state if submission else "missing"}')
          print(f'submission_external_id={submission.external_id if submission else "missing"}')
          print('FINAL=SUCCESS')
          PY
          )"

          set +e
          OUTPUT="$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose up -d web worker beat >/dev/null && sleep 8 && printf '%s' '$SCRIPT_B64' | base64 -d | docker compose exec -T web python manage.py shell" 2>&1)"
          RC=$?
          set -e
          printf '%s\n' "$OUTPUT"
          {
            echo 'output<<EOF'
            printf '%s\n' "$OUTPUT"
            echo EOF
          } >> "$GITHUB_OUTPUT"
          if [ "$RC" -ne 0 ]; then exit "$RC"; fi

      - name: Update release status issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT: ${{ steps.finalize.outputs.output }}
        run: |
          set -euo pipefail
          BODY_FILE="$(mktemp)"
          {
            echo 'Result: **final iOS 1.0.2 review submission**'
            echo
            echo '```text'
            printf '%s\n' "${OUTPUT:-workflow failed before output capture}"
            echo '```'
            echo
            echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$BODY_FILE"
          gh issue edit 79 --repo "$GITHUB_REPOSITORY" --body-file "$BODY_FILE"
