name: Queue A+ Esthetic iOS build 2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retry-a-esthetic-ios.yml'

permissions:
  contents: read
  actions: write

jobs:
  retry:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Create release 1.0.0 build 2 and queue iOS build
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

          CODE="from apps.publisher.models import MobileApp,Release; a=MobileApp.objects.get(slug='a-esthetic'); r,created=Release.objects.get_or_create(app=a,version_name='1.0.0',build_number=2,defaults={'status':'draft','source_branch':'main','source_commit':'30bb2d63ffaa6fa6b28162812d140984174827c1','ios_release_type':'manual','auto_submit':False,'release_notes':'Updated app icon.'}); changed=False; desired='30bb2d63ffaa6fa6b28162812d140984174827c1'; changed=(r.source_commit!=desired or r.source_branch!='main'); r.source_commit=desired; r.source_branch='main'; r.auto_submit=False; r.save(update_fields=['source_commit','source_branch','auto_submit','updated_at']); print('release_id='+str(r.id)); print('created='+str(created).lower()); print('source_commit='+r.source_commit)"
          ENCODED=$(printf '%s' "$CODE" | base64 -w0)
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && printf '%s' '$ENCODED' | base64 -d | docker compose exec -T web python manage.py shell"

          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py provision_ios_signing a-esthetic --app-version 1.0.0 --build-number 2"

      - name: Wake Cloud Mac
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'cloud-macos.yml',
              ref: 'main'
            });
