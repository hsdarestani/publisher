name: Finalize A+ build 12 Apple review

on:
  push:
    branches: ['diag/aplus-build12-submit']
    paths: ['.github/workflows/diag-aplus-build12-submit.yml']

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
      - name: Detach rejected build 11, attach build 12, submit review
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell" <<'PY'
          import json
          from django.utils import timezone
          from apps.integrations.apple_store import AppleStoreClient
          from apps.publisher.models import Job, Release, Submission
          from apps.publisher.readiness import evaluate_release
          from apps.publisher.review_contacts import apple_review_contact

          r=Release.objects.get(id=32)
          assert r.version_name == '1.0.5' and r.build_number == 12
          app=r.app
          ios=r.builds.get(platform='ios')
          assert ios.status == 'succeeded' and ios.artifact and ios.external_build_id

          client=AppleStoreClient(app.apple_account)
          record=client.find_app(app.bundle_id)
          version=client.find_editable_version(record['id'],r.version_name)
          assert version
          version_id=version['id']
          state=(version.get('attributes') or {}).get('appStoreState') or (version.get('attributes') or {}).get('appVersionState')
          assert state in {'DEVELOPER_REJECTED','PREPARE_FOR_SUBMISSION','READY_FOR_REVIEW','METADATA_REJECTED','REJECTED'}, state

          new_id=str(ios.external_build_id)
          new_build=client.request('GET',f'/builds/{new_id}').get('data') or {}
          assert (new_build.get('attributes') or {}).get('processingState') == 'VALID'
          new_pre=client.request('GET',f'/builds/{new_id}/preReleaseVersion').get('data') or {}
          assert (new_pre.get('attributes') or {}).get('version') == r.version_name

          current=client.request('GET',f'/appStoreVersions/{version_id}/build').get('data')
          old_id=str((current or {}).get('id') or '')
          print(f'apple_version_state={state}')
          print(f'old_build={old_id or "none"}')
          print(f'new_build={new_id}')

          if old_id != new_id:
              detach_body={'data': None}
              client.request('PATCH',f'/appStoreVersions/{version_id}/relationships/build',data=json.dumps(detach_body))
              try:
                  client.attach_build(version_id,new_id)
              except Exception:
                  if old_id:
                      try:
                          client.attach_build(version_id,old_id)
                      except Exception as rollback_exc:
                          print(f'ROLLBACK_FAILED={rollback_exc}')
                  raise

          attached=client.request('GET',f'/appStoreVersions/{version_id}/build').get('data') or {}
          assert str(attached.get('id') or '') == new_id, attached
          print('build12_attached=yes')

          contact=apple_review_contact(app)
          client.set_review_details(version_id,app,contact=contact or None)
          result=client.submit_version(record['id'],version_id)
          submission=result['submission']
          print('apple_review_submission='+str(submission['id']))
          print('apple_review_state='+str((submission.get('attributes') or {}).get('state') or ''))

          Submission.objects.update_or_create(
              app=app,
              release=r,
              platform='ios',
              defaults={
                  'state':'in_review',
                  'external_id':submission['id'],
                  'submitted_at':timezone.now(),
                  'raw':result,
              },
          )
          r.status='in_review'
          r.readiness_snapshot=evaluate_release(r)
          r.save(update_fields=['status','readiness_snapshot','updated_at'])

          latest=Job.objects.filter(release=r,type='submit_apple').order_by('-created_at').first()
          if latest and latest.status == 'failed':
              latest.status='succeeded'
              latest.error=''
              latest.result=result
              latest.progress=100
              latest.finished_at=timezone.now()
              latest.append_log('Recovered by safely replacing rejected build 11 with valid build 12 and submitting review.')
              latest.save(update_fields=['status','error','result','progress','finished_at','logs','updated_at'])

          print('FINAL_IOS_SUBMIT=success')
          PY
