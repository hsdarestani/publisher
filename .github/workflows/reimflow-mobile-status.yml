name: Reimflow mobile build status
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/reimflow-mobile-status.yml']
permissions: {contents: read}
jobs:
  status:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Query only Reimflow build and store state
        env:
          HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"; umask 077
          KEY="$RUNNER_TEMP/reimflow-read-key"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$KEY"; chmod 600 "$KEY"
          if [ -n "$SSH_KEY_PASSPHRASE" ]; then
            eval "$(ssh-agent -s)" >/dev/null
            ASKPASS="$RUNNER_TEMP/reimflow-askpass"
            printf '%s\n' '#!/bin/sh' 'printf "%s" "$SSH_KEY_PASSPHRASE"' > "$ASKPASS"
            chmod 700 "$ASKPASS"
            DISPLAY=:0 SSH_ASKPASS="$ASKPASS" SSH_ASKPASS_REQUIRE=force setsid ssh-add "$KEY" </dev/null
          fi
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -T 10 -p "$PORT" -H "$HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          if [ -n "$SSH_HOST_FINGERPRINT" ]; then
            ssh-keygen -lf "$HOME/.ssh/known_hosts" | grep -F -- "$SSH_HOST_FINGERPRINT" >/dev/null
          fi
          ssh -i "$KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$PORT" root@"$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplus-publisher
          docker compose exec -T web python manage.py shell <<'PY'
          import json
          from apps.publisher.models import MobileApp,Release,Build,Job,Submission
          from apps.integrations.apple_store import AppleStoreClient
          a=MobileApp.objects.get(slug="reimflow")
          r=Release.objects.filter(app=a).order_by('-id').first()
          print("REIMFLOW_APP",json.dumps({"id":a.id,"bundle":a.bundle_id,"google_linked":bool(a.google_account_id),"apple_linked":bool(a.apple_account_id),"version":r.version_name,"number":r.build_number,"release_status":r.status}))
          for b in Build.objects.filter(release=r):
            print("REIMFLOW_BUILD",json.dumps({"platform":b.platform,"status":b.status,"artifact":bool(b.artifact),"bytes":b.artifact_size,"sha256":b.artifact_checksum[:16],"external_build":bool(b.external_build_id)}))
            for j in Job.objects.filter(build=b,type__in=["build_android","build_ios"]).order_by('-id')[:3]:
              print("REIMFLOW_JOB",json.dumps({"id":j.id,"platform":b.platform,"status":j.status,"progress":j.progress,"error_tail":(j.error or "")[-650:]}))
          for platform in ("ios","android"):
            sub=Submission.objects.filter(release=r,platform=platform).first()
            print("REIMFLOW_STORE",platform,sub.state if sub else "not_submitted")
          try:
            record=AppleStoreClient(a.apple_account).find_app(a.bundle_id)
            print("REIMFLOW_APPLE_LISTING",bool(record))
          except Exception as exc:
            print("REIMFLOW_APPLE_LISTING",type(exc).__name__,str(exc)[:200])
          PY
          REMOTE
