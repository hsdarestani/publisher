name: A+ Esthetic Apple review recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/a-esthetic-submit-status.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Reuse Apple review draft and submit A+ Esthetic 1.0.2
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          PY_CODE=$(cat <<'PY'
          import json
          import time
          from apps.integrations.apple_store import AppleStoreClient
          from apps.publisher.models import MobileApp, Release, Submission
          from apps.publisher.tasks import enqueue_job

          SOURCE_COMMIT = 'd5ef2cd6bdf40d85c47aba8e73a99fd6bc0b5c4c'
          app = MobileApp.objects.get(slug='a-esthetic')
          release = Release.objects.filter(app=app, source_commit=SOURCE_COMMIT).order_by('-created_at').first()
          if not release:
              raise SystemExit('release_missing')
          ios = release.builds.get(platform='ios')
          if ios.status != 'succeeded' or not ios.external_build_id:
              raise SystemExit('ios_build_not_ready')

          client = AppleStoreClient(app.apple_account)
          app_record = client.find_app(app.bundle_id)
          app_id = app_record['id']
          target = next(
              (v for v in client.list_versions(app_id) if v.get('attributes',{}).get('versionString') == release.version_name),
              None,
          )
          if not target:
              raise SystemExit('apple_1_0_2_missing')
          target_id = target['id']
          target_state = target.get('attributes',{}).get('appStoreState') or ''
          print(f'APPLE_TARGET id={target_id} version={release.version_name} state={target_state} build={ios.external_build_id}')

          def reviews():
              return client.request('GET', f'/apps/{app_id}/reviewSubmissions?limit=200').get('data', [])

          def rstate(review):
              return review.get('attributes',{}).get('state') or ''

          def items(review):
              return client.list_review_submission_items(review['id'])

          def item_state(item):
              return item.get('attributes',{}).get('state') or ''

          def targets(item):
              return client._item_targets_version(item, target_id)

          def active_target_review():
              for review in reviews():
                  if rstate(review) not in {'WAITING_FOR_REVIEW','IN_REVIEW'}:
                      continue
                  for item in items(review):
                      if targets(item) and item_state(item) != 'REMOVED':
                          return review
              return None

          active = active_target_review()
          if active:
              Submission.objects.update_or_create(
                  app=app, release=release, platform='ios',
                  defaults={'state':'in_review','external_id':active['id']},
              )
              release.status = 'in_review'
              release.save(update_fields=['status','updated_at'])
              android = Submission.objects.filter(release=release, platform='android').first()
              print(f'FINAL android={android.state if android else "missing"} ios=in_review version={release.version_name} build={release.build_number}')
              raise SystemExit(0)

          # Apple keeps completed/canceled review history. A historical item may
          # still appear in the list with state REMOVED; that does not own the
          # version anymore and must not be deleted again.
          for review in reviews():
              for item in items(review):
                  if targets(item):
                      print(f'APPLE_HISTORY review={review["id"]} review_state={rstate(review)} item={item["id"]} item_state={item_state(item)}')

          ready = None
          for review in reviews():
              if rstate(review) != 'READY_FOR_REVIEW':
                  continue
              current_items = items(review)
              if any(targets(item) and item_state(item) != 'REMOVED' for item in current_items):
                  ready = review
                  print(f'APPLE_READY_HAS_TARGET id={review["id"]}')
                  break
              live_version_items = [
                  item for item in current_items
                  if item_state(item) != 'REMOVED'
                  and (item.get('relationships',{}).get('appStoreVersion',{}).get('data') or {}).get('id')
              ]
              if not live_version_items and ready is None:
                  ready = review

          if not ready:
              body = {'data': {'type':'reviewSubmissions','attributes':{},'relationships':{
                  'app': {'data': {'type':'apps','id':app_id}}
              }}}
              ready = client.request('POST','/reviewSubmissions',data=json.dumps(body))['data']
              print(f'APPLE_READY_CREATED id={ready["id"]}')

          current_items = items(ready)
          if not any(targets(item) and item_state(item) != 'REMOVED' for item in current_items):
              item_body = {'data': {'type':'reviewSubmissionItems','relationships':{
                  'reviewSubmission': {'data': {'type':'reviewSubmissions','id':ready['id']}},
                  'appStoreVersion': {'data': {'type':'appStoreVersions','id':target_id}},
              }}}
              last_error = None
              for attempt in range(1, 37):
                  try:
                      created = client.request('POST','/reviewSubmissionItems',data=json.dumps(item_body))['data']
                      print(f'APPLE_TARGET_ATTACHED review={ready["id"]} item={created["id"]} attempt={attempt}')
                      last_error = None
                      break
                  except Exception as exc:
                      message = str(exc)
                      last_error = message
                      if 'ITEM_PART_OF_ANOTHER_SUBMISSION' not in message:
                          raise
                      print(f'APPLE_TARGET_WAITING_FOR_OLD_REVIEW_RELEASE attempt={attempt}')
                      time.sleep(5)
              if last_error:
                  raise SystemExit('apple_old_review_still_owns_version: ' + last_error[:1200])

          # Queue one fresh submit attempt. Historical failures remain for audit.
          job = release.jobs.filter(type='submit_apple', status__in=['queued','running']).first()
          if not job:
              job = enqueue_job('submit_apple', app=app, release=release, build=ios)
              print(f'APPLE_SUBMIT_QUEUED id={job.id}')
          else:
              print(f'APPLE_SUBMIT_REUSED id={job.id} status={job.status}')

          deadline = time.time() + 900
          while time.time() < deadline:
              job.refresh_from_db()
              print(f'APPLE_SUBMIT_STATE id={job.id} status={job.status} progress={job.progress}')
              if job.status == 'succeeded':
                  break
              if job.status == 'failed':
                  raise SystemExit('apple_submit_failed: ' + (job.error or '')[:1800])
              time.sleep(10)
          if job.status != 'succeeded':
              raise SystemExit(f'apple_submit_timeout status={job.status}')

          # Verify both the Publisher record and Apple's live review state.
          apple_review = active_target_review()
          if not apple_review:
              raise SystemExit('apple_review_not_active_after_submit')
          sub = Submission.objects.filter(release=release, platform='ios').first()
          if not sub or sub.state != 'in_review':
              raise SystemExit(f'publisher_ios_state={sub.state if sub else "missing"}')
          android = Submission.objects.filter(release=release, platform='android').first()
          print(f'APPLE_ACTIVE_REVIEW id={apple_review["id"]} state={rstate(apple_review)}')
          print(f'FINAL android={android.state if android else "missing"} ios={sub.state} version={release.version_name} build={release.build_number}')
          PY
          )
          ENCODED=$(printf '%s' "$PY_CODE" | base64 -w0)
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && printf '%s' '$ENCODED' | base64 -d | docker compose exec -T web python manage.py shell"
