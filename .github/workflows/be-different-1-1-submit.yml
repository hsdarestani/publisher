name: Inspect BE DIFFERENT 1.1 build 9 store status
on:
  push:
    branches: [main]
    paths: ['.github/workflows/be-different-1-1-submit.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: be-different-1-1-submit
  cancel-in-progress: false
jobs:
  submit:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    steps:
      - name: Advance and inspect exact release
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" 'cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell' <<'PY'
          import json
          from apps.publisher.models import Release,Submission
          from apps.integrations.google_play import GooglePlayClient
          r=Release.objects.get(pk=131,app__slug="be-different")
          a=r.app
          notes={"de-DE":"Neue BE DIFFERENT Oberfläche mit klarer Trainingsübersicht, persönlichem Leistungswert und verbesserter Navigation. Optimierter Start und Anmeldung.","en-US":"New BE DIFFERENT brand experience with a clear training overview, personal performance score and improved navigation. Smoother startup and sign in."}
          for loc in a.localizations.all():
              if loc.locale in notes:
                  loc.release_notes=notes[loc.locale]
                  loc.save(update_fields=["release_notes"])
          c=GooglePlayClient(a.google_account)
          e=c._open_edit(a.package_name)
          try:
              t=c._edit_request(e,"GET",f"/applications/{c._q(a.package_name)}/edits/{e.edit_id}/tracks/production")
              assert t["releases"][0]["versionCodes"]==["9"] and t["releases"][0]["status"]=="draft"
              t["releases"][0]["releaseNotes"]=[{"language":k,"text":v} for k,v in notes.items()]
              c._edit_request(e,"PUT",f"/applications/{c._q(a.package_name)}/edits/{e.edit_id}/tracks/production",json_body=t)
              c._validate_edit(e)
              c._commit_edit(e)
              print("GOOGLE_PRODUCTION_TRACK="+json.dumps(t))
          finally:
              c._safe_delete_edit(e)
          print("BUILD9_STORE_STATUS="+json.dumps({"builds":list(r.builds.values("platform","status","external_build_id")),"submissions":list(Submission.objects.filter(release=r).values("platform","state","external_id"))}))
          print("STORE_SCREENSHOT_ASSETS="+json.dumps(list(a.assets.filter(kind="screenshot").values("platform","locale","device_type","width","height","file"))))
          PY
