name: Diagnose A+ build 12 submission

on:
  push:
    branches: ['diag/aplus-build12-submit']
    paths: ['.github/workflows/diag-aplus-build12-submit.yml']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
      - name: Compare Apple marketing versions
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell" <<'PY'
          from apps.integrations.apple_store import AppleStoreClient
          from apps.publisher.models import Release

          r=Release.objects.get(id=32)
          app=r.app
          client=AppleStoreClient(app.apple_account)
          record=client.find_app(app.bundle_id)
          version=client.find_editable_version(record['id'],r.version_name)
          print('release_version='+r.version_name)
          print('apple_version_state='+str((version.get('attributes') or {}).get('appStoreState') or ''))
          attached=client.request('GET',f"/appStoreVersions/{version['id']}/build").get('data')
          new_id=r.builds.get(platform='ios').external_build_id
          print('attached_build='+str((attached or {}).get('id') or ''))
          print('new_build='+str(new_id))

          for label,build_id in [('attached',(attached or {}).get('id')),('new',new_id)]:
              if not build_id:
                  continue
              build=client.request('GET',f'/builds/{build_id}').get('data') or {}
              attrs=build.get('attributes') or {}
              print(f'{label}_build_number='+str(attrs.get('version') or ''))
              print(f'{label}_processing='+str(attrs.get('processingState') or ''))
              pre=client.request('GET',f'/builds/{build_id}/preReleaseVersion').get('data') or {}
              pattrs=pre.get('attributes') or {}
              print(f'{label}_pre_release_id='+str(pre.get('id') or ''))
              print(f'{label}_marketing_version='+str(pattrs.get('version') or ''))
              print(f'{label}_platform='+str(pattrs.get('platform') or ''))
          PY
