name: Monitor A+ Solution staging store delivery

on:
  push:
    branches: [ops/aplussolution-staging]
    paths:
      - '.github/workflows/aplussolution-staging-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: ${{ secrets.HOST }}
      PASS: ${{ secrets.PASS }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
    steps:
      - name: Install SSH helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
      - name: Read release, build, job and submission state
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplus-publisher
          docker compose exec -T web python manage.py shell <<'PY'
          from apps.publisher.models import MobileApp, Release, Job, Submission
          import json
          app = MobileApp.objects.get(slug='a-plus-solution-staging')
          release = Release.objects.get(app=app, version_name='1.0.0', build_number=1)
          print('RELEASE=' + json.dumps({'id':release.id,'status':release.status,'source_commit':release.source_commit,'android_track':release.android_track,'auto_submit':release.auto_submit}, sort_keys=True))
          for build in release.builds.order_by('platform'):
              print('BUILD=' + json.dumps({'id':build.id,'platform':build.platform,'status':build.status,'artifact':build.artifact.name if build.artifact else '','artifact_size':build.artifact_size,'checksum':bool(build.artifact_checksum),'external_build_id':build.external_build_id}, sort_keys=True))
          for job in Job.objects.filter(release=release).order_by('id'):
              print('JOB=' + json.dumps({'id':job.id,'type':job.type,'status':job.status,'progress':job.progress,'build_id':job.build_id,'error':job.error[-800:] if job.error else '','result':job.result}, sort_keys=True, default=str))
          for submission in Submission.objects.filter(release=release).order_by('platform'):
              print('SUBMISSION=' + json.dumps({'platform':submission.platform,'state':submission.state,'external_id':submission.external_id,'last_error':submission.last_error,'raw':submission.raw}, sort_keys=True, default=str))
          PY
          REMOTE
