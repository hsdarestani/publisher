name: Verify the TaskService demo over its real HTTPS origin
on:
  push:
    branches: [codex/taskservice-readonly-capacity]
    paths: ['.github/workflows/taskservice-native-demo-origin.yml']
permissions: { contents: read }
concurrency:
  group: taskservice-demo-origin
  cancel-in-progress: true
jobs:
  origin:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hsdarestani/taskservice
          ref: f457d8a022e02afe1cccf8ebaf32a1658e928d5f
          persist-credentials: false
      - name: Prepare Chromium and origin CA trust
        run: |
          set -euo pipefail
          python -m pip install 'playwright==1.62.0'
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/demo-chromium"
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -qq libnss3-tools >/dev/null
      - name: Require the verified TaskService stage and backup restore
        run: |
          set -euo pipefail
          for attempt in {1..55}; do
            checks="$(curl -fsS --max-time 10 'https://api.github.com/repos/hsdarestani/publisher/actions/runs?head_sha=faf2351a933a6ba243ae75ad6f65eeded062e2ef&per_page=20')" || { sleep 8; continue; }
            state="$(jq -r '[.workflow_runs[] | select(.path==".github/workflows/taskservice-native-demo-stage.yml")] | first | .conclusion // ""' <<<"$checks")"
            if [[ "$state" == success ]]; then exit 0; fi
            if [[ "$state" == failure || "$state" == cancelled ]]; then exit 1; fi
            sleep 8
          done
          exit 1
      - name: Validate Caddy and verify the demo in Chromium through the origin
        shell: bash
        env:
          HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$KEY"
          port="$SSH_PORT"; if [ -z "$port" ]; then port=22; fi
          addr="$(getent ahostsv4 "$HOST" | awk '{print $1}' | sort -u)"
          expected="$(getent ahostsv4 reimflow.smarbiz.sbs | awk '{print $1}' | sort -u)"
          test -n "$addr" && test "$addr" = "$expected"
          curl --silent --show-error --fail --noproxy '*' --proto '=https' --connect-timeout 5 --max-time 12 --resolve "reimflow.smarbiz.sbs:443:$addr" -o /dev/null https://reimflow.smarbiz.sbs/
          umask 077
          tmp="$(mktemp -d "$RUNNER_TEMP/ts-resume.XXXXXXXX")"
          trap 'if [ -n "${SSH_AGENT_PID:-}" ]; then ssh-agent -k >/dev/null 2>&1 || true; fi; rm -rf "$tmp"' EXIT
          printf '%s\n' "$KEY" | tr -d '\r' > "$tmp/key"
          chmod 600 "$tmp/key"
          unset KEY
          if [ -n "$PASSPHRASE" ]; then
            eval "$(ssh-agent -s)" >/dev/null
            printf '%s\n' '#!/bin/sh' 'printf "%s\n" "$PASSPHRASE"' > "$tmp/askpass"
            chmod 700 "$tmp/askpass"
            SSH_ASKPASS="$tmp/askpass" SSH_ASKPASS_REQUIRE=force setsid ssh-add "$tmp/key" </dev/null
          fi
          unset PASSPHRASE
          ssh-keyscan -T 8 -t ed25519 -p "$port" "$addr" > "$tmp/scanned" 2>/dev/null
          while read -r _ keytype keydata; do
            [ "$keytype" = ssh-ed25519 ] || continue
            printf 'publisher-strato %s %s\n' "$keytype" "$keydata" > "$tmp/candidate"
            actual="$(ssh-keygen -E sha256 -lf "$tmp/candidate" | awk '{print $2}')"
            if [ "$actual" = 'SHA256:G5zZTiYxEm6Hm2v/CYFe/4e7K3YwRCbOkABFBBy93vg' ]; then
              mv "$tmp/candidate" "$tmp/known_hosts"; break
            fi
          done < "$tmp/scanned"
          test -s "$tmp/known_hosts"
          ssh_publisher=(ssh -i "$tmp/key" -o IdentitiesOnly=yes -o BatchMode=yes -o ForwardAgent=no
            -o StrictHostKeyChecking=yes -o HostKeyAlias=publisher-strato -o HostKeyAlgorithms=ssh-ed25519
            -o UserKnownHostsFile="$tmp/known_hosts" -o GlobalKnownHostsFile=/dev/null
            -o ConnectTimeout=10 -p "$port" root@"$addr")
          "${ssh_publisher[@]}" 'bash -se' <<'VERIFY_ORIGIN'
          set -euo pipefail
          cd /opt/aplus-publisher
          grep -q '^taskservice\.smarbiz\.sbs {' Caddyfile
          grep -q 'reverse_proxy taskservice-demo-api:8080' Caddyfile
          docker compose exec -T web curl -fsS --max-time 8 http://127.0.0.1:8000/healthz/ </dev/null >/dev/null
          VERIFY_ORIGIN
          curl -fsS --max-time 20 --proto '=https' 'https://developers.cloudflare.com/ssl/static/origin_ca_ecc_root.pem' -o "$tmp/origin-ca.pem"
          openssl x509 -in "$tmp/origin-ca.pem" -noout -checkend 0 >/dev/null
          curl -fsS --max-time 12 --noproxy '*' --cacert "$tmp/origin-ca.pem" \
            --resolve "taskservice.smarbiz.sbs:443:$addr" https://taskservice.smarbiz.sbs/health/ready
          mkdir -m 700 -p "$tmp/browser-home/.pki/nssdb" "$tmp/qa"
          certutil -N --empty-password -d "sql:$tmp/browser-home/.pki/nssdb"
          certutil -A -n 'Cloudflare Origin CA for staged TaskService' -t 'C,,' -i "$tmp/origin-ca.pem" -d "sql:$tmp/browser-home/.pki/nssdb"
          "${ssh_publisher[@]}" 'tar -C /opt/taskservice/demo-private -cf - platform.json company.json technician.json reviewer.json other.json' </dev/null |
            tar -C "$tmp/qa" -xf -
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/demo-chromium"
          export TASKSERVICE_DEMO_QA_CREDENTIALS="$tmp/qa" TASKSERVICE_DEMO_ORIGIN_IP="$addr"
          PYTHONPATH="$(python -m site --user-site)${PYTHONPATH:+:$PYTHONPATH}" HOME="$tmp/browser-home" python - <<'PY'
          import re
          import runpy
          import sys
          import traceback
          try:
              runpy.run_path('v2/tests/demo_live_browser.py', run_name='__main__')
          except Exception as failure:
              if isinstance(failure, AssertionError) and re.fullmatch(r'[A-Za-z0-9-]+ HTTP [0-9]{3}, expected [0-9]{3}', str(failure)):
                  print(str(failure), file=sys.stderr)
              for frame in traceback.extract_tb(failure.__traceback__):
                  if frame.filename.endswith("demo_live_browser.py"):
                      print("QA failure location:", frame.name, frame.lineno, type(failure).__name__, file=sys.stderr)
              sys.exit(1)
          PY
          printf 'REAL_ORIGIN_BROWSER=passed\n'
