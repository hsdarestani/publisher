name: A+ Studio App Review Status Watch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/a-studio-review-status-watch.yml'

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install SSH client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null

      - name: Read current App Review status
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/aplus-publisher && docker compose exec -T web python manage.py shell" <<'PY'
          import json
          from apps.integrations.apple_store import AppleStoreClient
          from apps.publisher.models import MobileApp, Build

          app = MobileApp.objects.get(slug='a-studio')
          build = Build.objects.filter(
              release__app=app,
              release__version_name='1.0.0',
              release__build_number=3,
              platform='ios',
          ).first()
          client = AppleStoreClient(app.apple_account)
          record = client.find_app(app.bundle_id)
          version = client.find_editable_version(record['id'], '1.0.0')
          if not version:
              version = next(
                  (v for v in client.list_versions(record['id']) if v.get('attributes', {}).get('versionString') == '1.0.0'),
                  None,
              )
          if not version:
              raise SystemExit('App Store version 1.0.0 not found')
          version_id = version['id']

          rows = []
          for state in ('WAITING_FOR_REVIEW','IN_REVIEW','UNRESOLVED_ISSUES','READY_FOR_REVIEW','COMPLETE'):
              try:
                  submissions = client.list_review_submissions(record['id'], state)
              except Exception:
                  continue
              for sub in submissions:
                  for item in client.list_review_submission_items(sub['id']):
                      rel = item.get('relationships', {}).get('appStoreVersion', {}).get('data') or {}
                      if str(rel.get('id')) == str(version_id):
                          rows.append({
                              'submission_id': sub['id'],
                              'submission_state': state,
                              'item_id': item['id'],
                              'item_state': item.get('attributes', {}).get('state'),
                          })

          priority = {
              'IN_REVIEW': 50,
              'WAITING_FOR_REVIEW': 40,
              'UNRESOLVED_ISSUES': 30,
              'READY_FOR_REVIEW': 20,
              'COMPLETE': 10,
          }
          current = max(rows, key=lambda r: priority.get(r['submission_state'], 0), default={})
          print('STATUS_JSON=' + json.dumps({
              'app': app.name,
              'version': '1.0.0',
              'build_number': 3,
              'external_build_id': build.external_build_id if build else '',
              'current': current,
              'all_matching': rows,
          }, sort_keys=True))
          PY
