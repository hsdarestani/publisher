name: Read-only A+ Solution Publisher and Apple iOS state (2026-10-16)
on:
  push:
    branches: [audit/aplus-ios-review-status-20261016]
    paths: ['.github/workflows/aplus-ios-readonly-review-status-20261016.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 9
    env:
      PUB_USER: ${{ secrets.ADMIN_EMAIL }}
      PUB_PASS: ${{ secrets.ADMIN_PASSWORD }}
      HOST: ${{ secrets.HOST }}
      PASS: ${{ secrets.PASS }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
    steps:
      - name: Inspect Publisher release 9 and latest A+ builds (GET only)
        shell: bash
        run: |
          pip -q install requests beautifulsoup4
          python3 - <<'PY'
          import requests,os,re
          from bs4 import BeautifulSoup
          s=requests.Session()
          host='https://publisher.smarbiz.sbs'
          login=s.get(host+'/accounts/login/',timeout=25)
          login.raise_for_status()
          token=BeautifulSoup(login.text,'html.parser').select_one('input[name=csrfmiddlewaretoken]')
          assert token is not None
          signin=s.post(host+'/accounts/login/',data={'username':os.environ['PUB_USER'],'password':os.environ['PUB_PASS'],'csrfmiddlewaretoken':token['value']},headers={'Referer':host+'/accounts/login/'},timeout=25)
          signin.raise_for_status()
          assert '/accounts/login/' not in signin.url, 'Not logged in'
          app=s.get(host+'/apps/2/',timeout=25)
          app.raise_for_status()
          soup=BeautifulSoup(app.text,'html.parser')
          print('PUBLISHER_RELEASE_SUMMARY_BEGIN')
          for node in soup.select('a[href]'):
              path=node.get('href','')
              if re.fullmatch(r'/apps/releases/\d+/',path):
                  title=node.get_text(' ',strip=True)
                  if any(x in title for x in ('1.0.28','1.0.29','1.0.30')):
                      print('RELEASE '+path+' '+re.sub(r'\s+',' ',title)[:160])
          print('PUBLISHER_RELEASE_SUMMARY_END')
          detail=s.get(host+'/apps/releases/9/',timeout=25)
          detail.raise_for_status()
          assert '1.0.29' in detail.text,'Release 9 version mismatch'
          doc=BeautifulSoup(detail.text,'html.parser')
          print('RELEASE_9_1_0_29_BEGIN')
          for node in doc.select('.build-card'):
              platform=node.select_one('strong');state=node.select_one('span.status')
              if platform and state: print('BUILD '+platform.get_text(' ',strip=True)+'='+state.get_text(' ',strip=True))
          for node in doc.select('a.compact-row'):
              name=node.select_one('strong');state=node.select_one('span.status')
              if name and state: print('JOB '+name.get_text(' ',strip=True)+'='+state.get_text(' ',strip=True))
          print('RELEASE_9_1_0_29_END')
          PY
      - name: Query Apple review state directly using Publisher's existing SSH key (read only)
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$SSH_PRIVATE_KEY"
          port="$SSH_PORT"; if [ -z "$port" ]; then port=22; fi
          umask 077
          key="$RUNNER_TEMP/aplus-review-status-key"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$key"
          chmod 600 "$key"
          if [ -n "$SSH_KEY_PASSPHRASE" ]; then
            eval "$(ssh-agent -s)" >/dev/null
            askpass="$RUNNER_TEMP/aplus-review-status-askpass"
            printf '%s\n' '#!/bin/sh' 'printf "%s" "$SSH_KEY_PASSPHRASE"' > "$askpass"
            chmod 700 "$askpass"
            DISPLAY=:0 SSH_ASKPASS="$askpass" SSH_ASKPASS_REQUIRE=force setsid ssh-add "$key" </dev/null
            rm -f "$askpass"
          fi
          mkdir -p "$HOME/.ssh"
          ssh-keyscan -T 10 -p "$port" -H "$HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          timeout 115 ssh -i "$key" -p "$port" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=9 -o ServerAliveCountMax=2 root@"$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplus-publisher
          timeout 95 docker compose exec -T web python manage.py shell <<'PY'
          from apps.publisher.models import MobileApp, Release, Job, Submission
          from apps.integrations.apple_store import AppleStoreClient
          app=MobileApp.objects.get(slug='a-plus-solution')
          c=AppleStoreClient(app.apple_account)
          a=c.find_app(app.bundle_id)
          print('APPLE_APP_ID_VERIFIED',a['id'])
          versions=c.list_versions(a['id'],limit=30)
          for v in versions:
              at=v.get('attributes',{})
              if str(at.get('versionString','')).startswith('1.0.'):
                  print('APPLE_VERSION',at.get('versionString'),'STATE',at.get('appStoreState') or at.get('appVersionState') or 'unknown')
          for state in ('WAITING_FOR_REVIEW','IN_REVIEW','UNRESOLVED_ISSUES','READY_FOR_REVIEW','COMPLETE'):
              try:
                  v=c.list_review_submissions(a['id'],state)
                  print('APPLE_REVIEW_SUBMISSIONS',state,'COUNT',len(v))
              except Exception as e:
                  print('APPLE_REVIEW_QUERY_ERROR',state,type(e).__name__)
          for r in Release.objects.filter(app=app).order_by('-build_number')[:4]:
              print('PUBLISHER_RELEASE',r.version_name,r.build_number,'STATE',r.status)
              for plat in ('ios','android'):
                  b=r.builds.filter(platform=plat).first()
                  if b: print('PUBLISHER_BUILD',r.version_name,plat,b.status,'HAS_ARTIFACT',bool(b.artifact))
              for plat in ('ios','android'):
                  sub=Submission.objects.filter(release=r,platform=plat).first()
                  if sub: print('PUBLISHER_SUBMISSION',r.version_name,plat,sub.state,bool(sub.submitted_at))
          print('APPLE_LIVE_READONLY_DONE')
          PY
          REMOTE
