name: Trigger A+ Solution current release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-aplus-solution-current-release.yml'

permissions:
  contents: write

jobs:
  patch-current-release:
    runs-on: ubuntu-latest
    steps:
      - name: Point store release at latest live A+ commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APLUS_COMMIT="$(curl -fsSL https://api.github.com/repos/hsdarestani/aplussolution/commits/main | jq -r '.sha')"
          test -n "$APLUS_COMMIT"

          JSON="$(gh api repos/hsdarestani/publisher/contents/.github/workflows/aplus-solution-current-release.yml?ref=main)"
          FILE_SHA="$(printf '%s' "$JSON" | jq -r '.sha')"
          printf '%s' "$JSON" | jq -r '.content' | tr -d '\n' | base64 -d > /tmp/release.yml

          python3 - "$APLUS_COMMIT" <<'PY'
          from pathlib import Path
          import re, sys
          path = Path('/tmp/release.yml')
          commit = sys.argv[1]
          text = path.read_text()
          updated, count = re.subn(r"APLUS_COMMIT: '[0-9a-f]+'", f"APLUS_COMMIT: '{commit}'", text, count=1)
          if count != 1:
              raise SystemExit('Could not update APLUS_COMMIT in current release workflow')
          if updated == text:
              raise SystemExit('Current release workflow already points at this commit; refusing duplicate submission')
          path.write_text(updated)
          PY

          CONTENT_B64="$(base64 -w0 /tmp/release.yml)"
          gh api --method PUT repos/hsdarestani/publisher/contents/.github/workflows/aplus-solution-current-release.yml \
            -f message="Release A+ Solution ${APLUS_COMMIT} to stores" \
            -f content="$CONTENT_B64" \
            -f sha="$FILE_SHA" \
            -f branch=main >/dev/null

          echo "A+ Solution store release triggered for $APLUS_COMMIT"
